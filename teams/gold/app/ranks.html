<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranks · Rush</title><meta name="theme-color" content="#0A0F15">
<style>.row.me{background:rgba(61,184,255,.1);border-radius:12px;padding-left:8px;padding-right:8px}.pod{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:14px;text-align:center}.pod div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style></head>
<body data-tab="home">
<div id="app"></div>
<script src="shared/state.js"></script><script src="week-games.js"></script><script src="shared/nav.js"></script><script src="g4.js"></script>
<script>
function render(){const f=G.field(),wk=Rush.week(),p=[f[1],f[0],f[2]].filter(Boolean);
let h=G.top('Ranks')+'<main class="wrap">';
h+=`<div class="pod">${p.map((r,i)=>`<div style="padding-top:${i===1?26:14}px;${i===1?'border-color:rgba(242,193,78,.5)':''}"><span class="num" style="color:${i===1?'var(--gold)':'var(--mute)'}">${r.rank}</span>${G.av(r,i===1?60:48)}<b>${G.esc(r.me?'You':r.name)}</b><span class="num">${G.fmt(r.stack)}</span></div>`).join('')}</div>`;
h+=`<div class="lbl">Week ${wk.n} · the Field by Stack</div><section class="card">${f.map(r=>`<div class="row${r.me?' me':''}"><span class="rk">${r.rank}</span>${G.av(r,38)}<div class="nm">${G.nameLink(r)}</div><span class="num">${G.fmt(r.stack)}</span></div>`).join('')}</section></main>`;
document.getElementById('app').innerHTML=h;}
G.render=render;render();if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});setInterval(render,30000);
</script></body></html>
