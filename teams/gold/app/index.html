<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush</title><meta name="theme-color" content="#0A0F15">
<style>
.hero{background:linear-gradient(160deg,#17324A 0%,#141C26 60%);border:1px solid rgba(61,184,255,.28)}
.hero .wk{display:flex;justify-content:space-between;align-items:center}
.hero .rkbig{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.hero .rkbig .big{font-size:64px}
.spread{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#FF6B6B33,#3DD68C33);margin:18px 0 6px}
.spread i{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid #0A0F15;transform:translateX(-50%)}
.spread em{position:absolute;top:1px;width:4px;height:8px;border-radius:2px;background:rgba(255,255,255,.35);transform:translateX(-50%)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.mu .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mu .side b{font-size:15px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu .vs{font:800 18px/1 "Barlow Condensed",sans-serif;color:var(--mute)}
.tug{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;background:var(--card2)}
.tug .a{background:var(--acc)}.tug .b{background:var(--vio)}
.rooms{display:flex;gap:10px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 4px;scroll-snap-type:x mandatory}
.room{flex:none;width:200px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.room .tm{display:flex;justify-content:space-between;font:800 22px/1.2 "Barlow Condensed",sans-serif}
.stackav{display:flex;margin-top:10px}.stackav .av{margin-right:-8px}
.cta{display:flex;gap:10px;margin-top:16px}
</style></head>
<body data-tab="home">
<div id="app"></div>
<script src="shared/state.js"></script><script src="week-games.js"></script><script src="shared/nav.js"></script><script src="g4.js"></script>
<script>
function render(){
  const f=G.field(),m=G.meRow(),wk=Rush.week(),op=G.opponent(),ch=G.chs();
  const lo=Math.min(...f.map(r=>r.stack)),hi=Math.max(...f.map(r=>r.stack)),pos=s=>hi===lo?50:((s-lo)/(hi-lo))*100;
  const d=m.stack-1000,lead=f[0];
  const pairT=G.pairingAt(),paired=Date.now()>=pairT,on=ch.filter(c=>c.state==='on'),sent=ch.filter(c=>c.state==='sent');
  const foe=paired?op:(on[0]?G.player(on[0].opp):null);
  const near=f.filter(r=>!r.me&&!ch.some(c=>c.opp===r.id)).sort((a,b)=>Math.abs(a.stack-m.stack)-Math.abs(b.stack-m.stack)).slice(0,3);
  const gs=G.games().filter(g=>!g.done).sort((a,b)=>(b.state==='in')-(a.state==='in')||a.date-b.date).slice(0,8);
  let h=G.top('Rush')+'<main class="wrap">';
  // 1. The weekly contest
  h+=`<section class="card hero"><div class="wk"><span class="chip" style="background:rgba(61,184,255,.16);color:var(--acc)">WEEK ${wk.n} CONTEST</span><span class="chip">Ends Mon night</span></div>
   <div class="rkbig"><span class="big">#${m.rank||'-'}</span><span style="color:var(--mute);font-weight:700">of ${f.length} in the Field</span></div>
   <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px"><div><div style="color:var(--mute);font-size:12px;font-weight:800;letter-spacing:1.2px">STACK</div><div class="big" style="font-size:38px">${G.fmt(m.stack)}</div></div>
   <div style="text-align:right"><div class="num ${d>=0?'up':'dn'}">${d>=0?'+':''}${G.fmt(d)}</div><small style="color:var(--mute)">since Tuesday</small></div></div>
   <div class="spread">${f.map(r=>r.me?'':`<em style="left:${pos(r.stack)}%"></em>`).join('')}<i style="left:${pos(m.stack)}%"></i></div>
   <div style="display:flex;justify-content:space-between;color:var(--mute);font-size:13px"><span>${G.fmt(lo)}</span><span>1st: ${G.esc(lead.me?'you':lead.name)} ${G.fmt(lead.stack)}</span></div>
   <div class="cta"><a class="btn" href="board.html">Make picks</a><a class="btn ghost" href="ranks.html">Ranks</a></div></section>`;
  // 2. The matchup
  if(foe){const a=Math.max(1,m.stack),b=Math.max(1,foe.stack),gap=m.stack-foe.stack;
   h+=`<div class="lbl">Your matchup <a href="matchup.html">Open</a></div><a class="card" style="display:block" href="matchup.html"><div class="mu"><div class="side">${G.av(m,56,1)}<b>You</b><span class="num">${G.fmt(m.stack)}</span></div><div class="vs">VS</div><div class="side">${G.av(foe,56,1)}<b>${G.esc(foe.name)}</b><span class="num">${G.fmt(foe.stack)}</span></div></div>
   <div class="tug"><div class="a" style="flex:${a}"></div><div class="b" style="flex:${b}"></div></div>
   <div style="text-align:center;margin-top:10px;font-weight:800;font-size:17px" class="${gap>=0?'up':'dn'}">${gap===0?'Dead even':gap>0?'You lead by '+G.fmt(gap):'You trail by '+G.fmt(-gap)}</div></a>`;}
  else{h+=`<div class="lbl">Your matchup</div><section class="card"><div style="display:flex;align-items:center;gap:14px"><div style="flex:1"><div style="font-weight:800;font-size:19px">Paired Thursday 7:00 PM</div><div style="color:var(--mute);margin-top:4px">Your 1v1 for Week ${wk.n} is set in <b style="color:var(--tx)">${G.until(pairT)}</b>. Challenge someone now.</div></div><div class="num" style="font-size:30px;color:var(--vio)">1v1</div></div>
   ${sent.map(c=>{const p=G.player(c.opp);return p?`<div class="row">${G.av(p,40)}<div class="nm">${G.esc(p.name)}<small>Challenge sent, waiting</small></div><span class="chip">SENT</span></div>`:''}).join('')}
   ${near.map(p=>`<div class="row">${G.av(p,40)}<div class="nm">${G.nameLink(p)}<small>#${p.rank} · ${G.fmt(p.stack)} Stack</small></div><button class="btn ghost" style="width:auto;min-height:40px;font-size:15px" data-ch="${p.id}">Challenge</button></div>`).join('')}</section>`;}
  // 3. Lounge rooms
  h+=`<div class="lbl">Lounge rooms <a href="lounge.html">All rooms</a></div>`;
  h+=gs.length?`<div class="rooms">${gs.map(g=>{const ppl=f.filter(r=>G.mix(g.id+':'+r.id)<.28).slice(0,4),live=g.state==='in';
   return `<a class="room" href="lounge.html?g=${encodeURIComponent(g.id)}"><div style="display:flex;justify-content:space-between;align-items:center"><span class="chip ${live?'live':''}">${live?'LIVE':G.esc((g.league||'').toUpperCase())}</span><small style="color:var(--mute)">${live?G.esc(g.detail):new Date(g.date).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})}</small></div>
   <div class="tm" style="margin-top:10px"><span>${G.esc(g.away.abbr)}</span><span>${live?G.esc(g.away.score||0):''}</span></div><div class="tm"><span>${G.esc(g.home.abbr)}</span><span>${live?G.esc(g.home.score||0):''}</span></div>
   <div class="stackav">${ppl.map(p=>G.av(p,26,1)).join('')}<span style="margin-left:16px;color:var(--mute);font-size:13px;align-self:center">${ppl.length+Math.floor(G.hash(g.id)*6)} in the room</span></div></a>`}).join('')}</div>`
   :`<a class="card" style="display:block" href="lounge.html"><b>The Week ${wk.n} room is open</b><div style="color:var(--mute);margin-top:4px">Game rooms open as this week's games load.</div></a>`;
  // 4. The Field
  const top5=f.slice(0,5);if(!top5.some(r=>r.me))top5.push(m);
  h+=`<div class="lbl">The Field <a href="ranks.html">Ranks</a></div><section class="card">${top5.map(r=>`<div class="row"><span class="rk">${r.rank}</span>${G.av(r,40)}<div class="nm">${G.nameLink(r)}${r.me?'<small>You</small>':''}</div><span class="num">${G.fmt(r.stack)}</span></div>`).join('')}</section>`;
  h+='</main>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{G.challenge(b.dataset.ch);render();});
}
G.render=render;render();
if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});
setInterval(render,30000);
</script></body></html>
