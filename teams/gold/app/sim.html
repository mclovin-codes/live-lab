<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squad Streak Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Gold Phase 3: the Squad Streak simulation, Weeks 9 to 13, against no mechanism. Data: sim-results.js from teams/gold/sim/sim.js. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:#22303D;--fg:#fff;--fg2:#C9D3DE;--mute:#8C9BAD;--acc:#00BFFF;
  --s-squad:#9085e9;--s-base:#d95926;--s-cohort:#199e70;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;--cond:"Barlow Condensed","Arial Narrow",var(--f)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 60px;display:flex;flex-direction:column;gap:14px}
a{color:var(--acc)}
.top{display:flex;align-items:center;gap:10px}.top a{text-decoration:none;font:600 14px var(--f);min-height:44px;display:flex;align-items:center}
h1{font:700 34px/1 var(--cond);text-transform:uppercase;letter-spacing:.01em;margin:0}
.sub{color:var(--fg2);margin:0}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:700 17px var(--f);margin:0;display:flex;align-items:baseline;gap:8px}.card h2 small{margin-left:auto;font:500 12.5px var(--f);color:var(--mute)}
.heros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.hero b{font:700 40px/1 var(--cond)}.hero small{color:var(--mute);font-size:12.5px}.hero span{font-size:13px;color:var(--fg2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--fg2)}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font:500 11px var(--f);fill:var(--mute)}.gl{stroke:#22303D;stroke-width:1}
.lab{font:600 11.5px var(--f);fill:var(--fg2)}
.tip{position:fixed;pointer-events:none;background:#0B1118;border:1px solid #2C3B4A;border-radius:10px;padding:8px 10px;font-size:12.5px;z-index:9;min-width:150px}
.tip b{display:block;margin-bottom:4px}.tip div{display:flex;gap:8px;align-items:center}.tip div span{margin-left:auto;font-weight:700;color:var(--fg)}.tip i{width:8px;height:8px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}th{color:var(--mute);font-weight:600;font-size:12px}
tr.hl td{color:var(--fg);font-weight:700}
.scroll{overflow-x:auto}
ol,ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--fg2)}li b{color:var(--fg)}
.note{font-size:12.5px;color:var(--mute)}
@media (max-width:640px){.grid{grid-template-columns:1fr}.heros{grid-template-columns:1fr 1fr 1fr;gap:8px}.hero b{font-size:30px}.hero{padding:12px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip" hidden></div>
<script src="sim-results.js"></script>
<script>
const S=window.SIM,V=S.variants,W=S.weeks,$=id=>document.getElementById(id);
const SER=[['squad','Squad Streak','var(--s-squad)','#9085e9'],['cohortOnly','Squad Streak, cohort rates only (dashed)','var(--s-cohort)','#199e70'],['base','No mechanism','var(--s-base)','#d95926']];
const get=k=>V[k==='base'?'baseline':k];
const last=k=>get(k).weeks[W.length-1];
const pct=v=>(v*100).toFixed(1)+'%',f1=v=>v.toFixed(1);
/* One line chart per measure, one axis each. Band = 10th to 90th percentile of the 1,000 runs. */
function chart(id,metric,fmt,opt={}){
  const series=(opt.series||SER).filter(s=>get(s[0])),w=400,h=220,L=40,R=opt.r||78,T=12,B=28,iw=w-L-R,ih=h-T-B;
  const vals=series.flatMap(s=>get(s[0]).weeks.flatMap(x=>opt.band?[x[metric].p10,x[metric].p90]:[x[metric].mean]));
  let lo=opt.min!=null?opt.min:Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.08||.01;lo=opt.min!=null?lo:lo-pad;hi+=pad;
  const xs=i=>L+i*iw/(W.length-1),ys=v=>T+ih-(v-lo)/(hi-lo)*ih;
  const ticks=[0,1,2,3,4].map(i=>lo+(hi-lo)*i/4);
  let g=ticks.map(t=>`<line class="gl" x1="${L}" x2="${L+iw}" y1="${ys(t)}" y2="${ys(t)}"/><text class="ax" x="${L-6}" y="${ys(t)+4}" text-anchor="end">${fmt(t,true)}</text>`).join('');
  g+=W.map((wk,i)=>`<text class="ax" x="${xs(i)}" y="${h-8}" text-anchor="middle">W${wk}</text>`).join('');
  if(opt.rung)g+=`<line x1="${L}" x2="${L+iw}" y1="${ys(40)}" y2="${ys(40)}" stroke="#C9D3DE" stroke-width="1" stroke-dasharray="4 4"/><text class="lab" x="${L+4}" y="${ys(40)-6}">40-in prize rung</text>`;
  for(const s of series){const d=get(s[0]).weeks;
    if(opt.band)g+=`<path d="M${d.map((x,i)=>xs(i)+' '+ys(x[metric].p90)).join(' L')} L${d.slice().reverse().map((x,i)=>xs(d.length-1-i)+' '+ys(x[metric].p10)).join(' L')} Z" fill="${s[3]}" opacity=".12"/>`;
    g+=`<path d="M${d.map((x,i)=>xs(i)+' '+ys(x[metric].mean)).join(' L')}" fill="none" stroke="${s[3]}" stroke-width="2" stroke-linejoin="round"${s[0]==='cohortOnly'?' stroke-dasharray="6 4"':''}/>`;
    g+=d.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(x[metric].mean)}" r="4" fill="${s[3]}" stroke="#121A23" stroke-width="2"/>`).join('')}
  /* Direct labels at the right edge, nudged apart so they never collide. */
  const labs=series.map(s=>({s,y:ys(last(s[0])[metric].mean)})).sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<14)labs[i].y=labs[i-1].y+14;
  g+=labs.map(o=>`<text class="lab" x="${L+iw+8}" y="${o.y+4}">${fmt(last(o.s[0])[metric].mean)}</text>`).join('');
  g+=W.map((wk,i)=>`<rect x="${xs(i)-iw/(W.length-1)/2}" y="${T}" width="${iw/(W.length-1)}" height="${ih}" fill="transparent" data-i="${i}" data-c="${id}"/>`).join('');
  $(id).innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${opt.aria||metric}">${g}</svg>`;
  $(id).querySelector('svg').addEventListener('mousemove',e=>{const r=e.target.closest('rect[data-i]');if(!r){$('tip').hidden=true;return}const i=+r.dataset.i;
    $('tip').innerHTML=`<b>Week ${W[i]}</b>`+series.map(s=>{const x=get(s[0]).weeks[i][metric];return`<div><i style="background:${s[3]}"></i>${s[1]}<span>${fmt(x.mean)}${opt.band?` <small style="color:var(--mute);font-weight:500">(${fmt(x.p10)} to ${fmt(x.p90)})</small>`:''}</span></div>`}).join('');
    const t=$('tip');t.hidden=false;t.style.left=Math.min(innerWidth-t.offsetWidth-8,e.clientX+12)+'px';t.style.top=(e.clientY+12)+'px'});
  $(id).querySelector('svg').addEventListener('mouseleave',()=>$('tip').hidden=true)}
const legend=(ser=SER)=>`<div class="legend">${ser.map(s=>`<span><i style="background:${s[3]}"></i>${s[1]}</span>`).join('')}</div>`;
const b=last('base'),q=last('squad'),c=last('cohortOnly');
const ASM=S.params.assumptions,C=S.params.cohort;
const order=['baseline','squad','noA1','noA2','noA3','noA4','noA5','lowA6','cohortOnly','baselineRecent','squadRecent'].filter(k=>V[k]);
$('app').innerHTML=`<div class="top"><a href="index.html">&#8249; Home</a><a href="squad.html" style="margin-left:auto">Open your Squad &#8250;</a></div>
<h1>Squad Streak: Weeks 9 to 13</h1>
<p class="sub">${S.runs.toLocaleString()} simulated seasons, player by player, from the Week 8 cohort's real rates. Seeds ${S.seed.split(';')[0]}, the same in every arm. The no-mechanism arm is Team Blue's baseline draw for draw, so the three teams compare against one baseline. The Field is that week's entrants. A referral or a Squad seat counts only when both sides confirm (A6).</p>
<div class="heros">
<div class="hero"><small>Field at Week 13</small><b>${f1(q.field.mean)}</b><span>vs ${f1(b.field.mean)} with no mechanism</span></div>
<div class="hero"><small>Retention, Week 13</small><b>${pct(q.retention.mean)}</b><span>vs ${pct(b.retention.mean)}</span></div>
<div class="hero"><small>Past 40 in by Week 13</small><b>${Math.round(q.rungShare[1]*100)}%</b><span>of runs, vs ${Math.round(b.rungShare[1]*100)}%</span></div></div>
<div class="card"><h2>Field per week<small>line = mean, band = 10th to 90th percentile</small></h2>${legend()}<div id="c-field"></div></div>
<div class="grid">
<div class="card"><h2>Retention<small>last week's Field picking again</small></h2>${legend()}<div id="c-ret"></div></div>
<div class="card"><h2>New players in the Field</h2>${legend()}<div id="c-new"></div></div>
<div class="card"><h2>Average Prize Multiplier<small>players in the Field</small></h2>${legend()}<div id="c-mult"></div></div>
<div class="card"><h2>Share touched<small>in a Squad of 2 or more with a boost</small></h2>${legend(SER.filter(s=>s[0]!=='base'))}<div id="c-touch"></div></div></div>
<div class="card"><h2>Week 13, every variant<small>mean of ${S.runs.toLocaleString()} runs</small></h2><div class="scroll"><table><thead><tr><th>Variant</th><th>Field</th><th>New in</th><th>Retention</th><th>Multiplier</th><th>Touched</th><th>40+ in</th><th>75+ in</th></tr></thead><tbody>
${order.map(k=>{const x=V[k].weeks[W.length-1];return`<tr class="${k==='squad'?'hl':''}"><td>${V[k].label}</td><td>${f1(x.field.mean)}</td><td>${f1(x.newIn.mean)}</td><td>${pct(x.retention.mean)}</td><td>${x.mult.mean.toFixed(3)}x</td><td>${Math.round(x.touched.mean*100)}%</td><td>${Math.round(x.rungShare[1]*100)}%</td><td>${Math.round(x.rungShare[2]*100)}%</td></tr>`}).join('')}
</tbody></table></div><p class="note">Each "without" row switches one assumption back to the cohort's own rate; "cohort rates only" switches all of them off. The last two rows rerun both arms with the Week 7 to Week 8 carryover (26 of 28 came back, 0.93), the pace behind the cohort file's +4 a week trend.</p></div>
<div class="card"><h2>Week by week<small>Squad Streak against no mechanism</small></h2><div class="scroll"><table><thead><tr><th>Week</th><th>Field</th><th>No mechanism</th><th>Retention</th><th>No mechanism</th><th>Multiplier</th><th>Touched</th></tr></thead><tbody>
${W.map((wk,i)=>{const x=V.squad.weeks[i],y=V.baseline.weeks[i];return`<tr><td>Week ${wk}</td><td>${f1(x.field.mean)}</td><td>${f1(y.field.mean)}</td><td>${pct(x.retention.mean)}</td><td>${pct(y.retention.mean)}</td><td>${x.mult.mean.toFixed(3)}x</td><td>${Math.round(x.touched.mean*100)}%</td></tr>`}).join('')}</tbody></table></div></div>
<div class="card"><h2>What the cohort file says, and what we added</h2>
<ul><li><b>From the Week 8 cohort:</b> ${C.pickers_w8} players in the Week 8 Field (${C.winners_w8} up or flat), ${C.recent_absent_w8+C.long_absent_w8} accounts outside it. Back the next week ${C.p_return_after_loss} after a loss and ${C.p_return_after_win} after a win. Reactivation ${C.p_reactivate}. ${C.signups_per_week} signups a week, ${C.p_first_pick_signup_week} pick in their first week. ${C.p_active_brings_signup} personal-code signups per active player a week, and all of them pick. ${C.p_finish_up} of players finish a week up. Prize rungs at 40, 75, 125 and 200 in.</li>
<li><b>Squad rules as built:</b> +${S.params.squad.per_active}x per squadmate with a pick, +${S.params.squad.per_streak}x per streak week up to ${S.params.squad.max_streak}, streak kept when ${S.params.squad.keep_share*100}% (at least ${S.params.squad.min_keep}) pick, a new member's first pick adds a streak week, +${S.params.squad.top_bonus}x for the top Squad, up to ${S.params.squad.max_size} seats. The referral multiplier keeps the engine rule. Cap 3x.</li></ul>
<ol>${Object.entries(ASM).map(([k,a])=>`<li><b>${k.replace(/_/g,' ')}:</b> ${a.what}</li>`).join('')}</ol>
<p class="note">Not modelled: Squads changing who wins, Reload, the Lounge, in-game picks (the cohort has none). Samples behind every rate are small (13 to 33 a week), so treat the bands as the floor of the uncertainty.</p></div>
<p class="note">Generated ${new Date(S.generated).toLocaleString()} by teams/gold/sim/sim.js. Run it again with <code>node teams/gold/sim/sim.js</code>.</p>`;
chart('c-field','field',(v,ax)=>ax?Math.round(v):v.toFixed(1),{band:true,rung:true,aria:'Field per week, Squad Streak against no mechanism'});
chart('c-ret','retention',(v)=>Math.round(v*1000)/10+'%',{aria:'Retention per week'});
chart('c-new','newIn',(v)=>v.toFixed(1),{min:0,aria:'New players in the Field per week'});
chart('c-mult','mult',(v)=>v.toFixed(2)+'x',{aria:'Average Prize Multiplier'});
chart('c-touch','touched',(v)=>Math.round(v*100)+'%',{min:0,series:SER.filter(s=>s[0]!=='base'),aria:'Share of the Field in a boosted Squad'});
</script>
</body>
</html>
