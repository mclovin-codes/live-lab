<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reads · Rush</title><meta name="theme-color" content="#0A0F15">
<style>
.rd-hero{background:linear-gradient(160deg,#2A2150 0%,#141C26 65%);border:1px solid rgba(155,140,255,.35)}
.rd-hero .rec{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.rd-hero .rec .big{font-size:56px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tri div{background:rgba(10,15,21,.5);border-radius:14px;padding:10px 6px;text-align:center}.tri small{display:block;color:var(--mute);font-size:11px;font-weight:800;letter-spacing:1px;margin-top:4px}
.seal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:10px;position:relative;overflow:hidden}
.seal.rival{border-color:rgba(155,140,255,.55);box-shadow:inset 0 0 0 1px rgba(155,140,255,.15)}
.seal .hd{display:flex;align-items:center;gap:10px}
.seal .hd .nm{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seal .hd .nm small{display:block;font-weight:600;color:var(--mute);font-size:13px}
.seal .gm{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.seal .gm b{font:800 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.3px}
.seal .gm span{color:var(--mute);font-size:13px;font-weight:700;text-align:right}
.face{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:repeating-linear-gradient(135deg,#1B2531 0 10px,#18212C 10px 20px);color:var(--mute);font-weight:700;font-size:14px}
.face svg{width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.2}
.face em{margin-left:auto;font-style:normal;color:var(--tx);font-weight:800}
.call{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.call button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:800 20px/1 "Barlow Condensed",sans-serif;letter-spacing:.4px;cursor:pointer}
.call button.on{background:var(--vio);border-color:var(--vio);color:#fff}
.call button.off{opacity:.45}
.res{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px;border-radius:12px;background:var(--card2);font-weight:800}
.res .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:16px}
.res.ok .ic{background:rgba(61,214,140,.2);color:var(--grn)}.res.no .ic{background:rgba(255,107,107,.18);color:var(--red)}.res.na .ic{background:rgba(255,255,255,.08);color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px}.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:800 13px -apple-system,sans-serif}.chips button.on{background:var(--tx);color:var(--bg)}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:4px;font-size:15px}
.how b{font:800 20px/1 "Barlow Condensed",sans-serif;color:var(--vio)}
</style></head>
<body data-tab="lounge">
<div id="app"></div>
<script src="shared/state.js"></script><script src="week-games.js"></script><script src="shared/nav.js"></script><script src="g4.js"></script>
<script>
const LOCK='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
let lg='all';
function when(t){return new Date(t).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})}
function card(x,rival){
  const p=x.pl,k=G.R.key(p.id,x),rd=G.R.get(k),g=x.g,open=!G.R.started(g),sides=G.R.sides(x),truth=G.R.side(x);
  let h=`<div class="seal${rival?' rival':''}"><div class="hd">${G.av(p,40)}<div class="nm">${G.nameLink(p)}<small>${rival?'Your matchup · ':''}#${p.rank} · ${G.fmt(p.stack)} Stack</small></div>${open?`<span class="chip">SEALED</span>`:`<span class="chip ${g.state==='in'?'live':''}">${g.state==='in'?'LIVE':g.done?'FINAL':'KICKED OFF'}</span>`}</div>
   <div class="gm"><b>${G.esc(g.away.abbr)} at ${G.esc(g.home.abbr)}</b><span>${G.esc(x.market||'Pick')}<br>${open?'kicks off in '+G.until(g.date):when(g.date)}</span></div>`;
  if(open){
    h+=`<div class="face">${LOCK}<span>Side sealed until kickoff</span><em>${G.fmt(x.stake)} staked</em></div>`;
    h+=`<div class="call">${sides.map(s=>`<button data-k="${G.esc(k)}" data-s="${s.v}" class="${rd?(rd.side===s.v?'on':'off'):''}">${G.esc(s.t)}</button>`).join('')}</div>`;
    h+=rd?`<div style="color:var(--mute);font-size:13px;margin-top:8px;text-align:center">Your read is locked. The seal breaks at kickoff.</div>`:'';
  }else{
    const ok=rd?rd.side===truth:null,lbl=sides.find(s=>s.v===truth);
    h+=`<div class="res ${ok===null?'na':ok?'ok':'no'}"><span class="ic">${ok===null?'·':ok?'✓':'✗'}</span><span style="flex:1">${G.esc(x.label)}<div style="color:var(--mute);font-weight:600;font-size:13px">${ok===null?'You did not read this one':ok?'You read it right':'You read '+G.esc((sides.find(s=>s.v===rd.side)||{}).t)+', they took '+G.esc(lbl?lbl.t:'')}</div></span><span>${x.status==='won'?'<span class="up">HIT</span>':x.status==='lost'?'<span class="dn">MISS</span>':''}</span></div>`;
  }
  return h+'</div>';
}
function render(){
  const f=G.field(),m=G.meRow(),op=G.opponent(),all=G.R.deck(),st=G.R.stats();
  const sealed=all.filter(x=>!G.R.started(x.g)),broken=all.filter(x=>G.R.started(x.g)&&G.R.get(G.R.key(x.pl.id,x))).slice(0,8);
  const leagues=[...new Set(sealed.map(x=>x.g.league))];
  const show=sealed.filter(x=>lg==='all'||x.g.league===lg);
  const riv=op?show.filter(x=>x.pl.id===op.id):[],rest=show.filter(x=>!op||x.pl.id!==op.id);
  const next=sealed.slice().sort((a,b)=>a.g.date-b.g.date)[0];
  const mine=G.R.mine();
  let h=G.top('Reads')+'<main class="wrap">';
  h+=`<section class="card rd-hero"><div style="display:flex;justify-content:space-between;align-items:center"><span class="chip" style="background:rgba(155,140,255,.2);color:#C9C0FF">THE READ</span><span class="chip">${sealed.length} sealed in the Field</span></div>
   <div class="rec"><span class="big">${st.right}<span style="color:var(--mute)">/${st.graded}</span></span><span style="color:var(--mute);font-weight:700">reads right this week</span></div>
   <div class="tri"><div><div class="num">${st.pending}</div><small>WAITING</small></div><div><div class="num">${next?G.until(next.g.date):'-'}</div><small>NEXT SEAL BREAKS</small></div><div><div class="num">${mine.length}</div><small>YOURS SEALED</small></div></div>
   <div class="how" style="margin-top:14px"><b>1</b><span>Every pick in the Field is sealed until its game kicks off.</span><b>2</b><span>Tap the side you think they took.</span><b>3</b><span>At kickoff the seal breaks and your read is graded.</span></div></section>`;
  if(leagues.length>1)h+=`<div class="chips"><button data-lg="all" class="${lg==='all'?'on':''}">All</button>${leagues.map(l=>`<button data-lg="${G.esc(l)}" class="${lg===l?'on':''}">${G.esc(String(l).toUpperCase())}</button>`).join('')}</div>`;
  if(riv.length)h+=`<div class="lbl">Read your matchup</div>`+riv.slice(0,4).map(x=>card(x,1)).join('');
  h+=`<div class="lbl">Sealed now <span style="color:var(--mute);text-transform:none;letter-spacing:0;font-size:13px">${rest.length}</span></div>`+(rest.slice(0,14).map(x=>card(x,0)).join('')||'<div class="empty">No sealed picks right now. New picks seal as players make them.</div>');
  if(broken.length)h+=`<div class="lbl">Seals broken</div>`+broken.map(x=>card(x,op&&x.pl.id===op.id)).join('');
  h+=`<div class="lbl">Your sealed picks</div><section class="card">${mine.length?mine.slice(0,6).map(p=>{const rs=G.R.onMe(p);return `<div class="row"><div class="nm">${G.esc(p.label||p.sel||'Pick')}<small>${G.esc(p.game||'')}${p.g?' · kicks off in '+G.until(p.g.date):''}</small></div>${rs.length?`<span style="display:flex">${rs.slice(0,3).map(r=>G.av(r,26)).join('')}</span><span class="chip">${rs.length} read</span>`:`<span class="chip">${G.honest()?'NO READS YET':'UNREAD'}</span>`}</div>`}).join(''):'<div class="empty">Make a pick and the Field can read it until kickoff. <a style="color:var(--acc)" href="board.html">Board</a></div>'}</section>`;
  h+='</main>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{G.R.set(b.dataset.k,b.dataset.s);render()});
  document.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{lg=b.dataset.lg;render()});
}
G.render=render;render();
if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});
setInterval(()=>{if(!document.querySelector(':focus'))render()},30000);
</script></body></html>
