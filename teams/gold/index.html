<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush Live</title>
<style>
/* Layout: scorebug card on top, markets as cards in one scroll, frosted iOS tab bar at the thumb. Rush theme tokens. */
:root{
  color-scheme:dark;
  --night:#0B1118; --deck:#121A23; --deck2:#1A2530; --line:#22303D; --line2:#2C3B4A;
  --fg:#FFFFFF; --mute:#8C9BAD; --mute2:#5E6E80;
  --acc:#00BFFF; --acc-hi:#33CCFF; --acc-lo:#0099CC; --acc-ink:#00131C; --grad:linear-gradient(135deg,#00C0FF,#0080FF);
  --win:#10B981; --loss:#D95151; --warn:#F59E0B;
  --sea:#69BE28; --chi:#E8713A; --turf:#123A27; --turf2:#154530;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--night);color:var(--fg);font:15px/1.35 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
img{display:block}
#app{height:100%;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;min-height:0}
.band{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
/* Scorebug */
#bug{flex:none;background:var(--night)}
#crumb{display:flex;align-items:center;gap:6px;padding-block:8px 2px;font:600 13px var(--body);color:var(--mute)}
#crumb b{color:var(--fg)}
#crumb .live{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--loss);font-weight:700;font-size:12px;letter-spacing:.04em}
#crumb .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--loss);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.card-bug{margin-block:4px 8px;background:var(--deck);border-radius:18px;padding:10px 12px 9px}
.bugrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm img{width:34px;height:34px}
.tm .nm{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.tm .nm span{font:600 13px var(--body);color:var(--mute)}
.tm b{font:700 30px/1 var(--disp);letter-spacing:-.02em}
.tm.home{flex-direction:row-reverse;text-align:right}
.tm .to{display:flex;gap:3px;margin-top:4px}.tm.home .to{justify-content:flex-end}
.tm .to i{width:10px;height:3px;border-radius:2px;background:var(--acc)}.tm .to i.u{background:var(--line2)}
.tm.pos .nm span::after{content:" ●";color:var(--acc);font-size:9px;vertical-align:2px}
.clk{text-align:center;min-width:86px}
.clk #clk{display:inline-block;font:700 15px var(--disp);background:var(--deck2);border-radius:999px;padding:4px 10px}
.clk small{display:block;margin-top:5px}
#stamp{display:inline-flex;gap:5px;align-items:center;color:var(--mute);font:600 11px var(--body);letter-spacing:.02em}
#stamp i{width:6px;height:6px;border-radius:50%;background:var(--win);display:inline-block}
#stamp.stale i{background:var(--loss)}
#stamp u{color:var(--acc);text-decoration:none;font-weight:700}
#field{position:relative;height:28px;margin-top:8px;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--turf) 0 9.0909%,var(--turf2) 9.0909% 18.1818%)}
#field .ez{position:absolute;top:0;bottom:0;width:8.33%;display:grid;place-items:center}
#field .ez img{width:20px;height:20px;opacity:.95}
#field .ez.l{left:0;background:var(--chi)}#field .ez.r{right:0;background:#002A5C}
#field .gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}
#fd{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);transition:left .5s var(--ease)}
#ball{position:absolute;top:50%;width:14px;height:9px;margin:-4.5px 0 0 -7px;border-radius:50%;background:#A65A2A;box-shadow:0 0 0 2px #fff,0 0 12px rgba(0,191,255,.6);transition:left .5s var(--ease)}
#tick{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tick.new{animation:tick 1.4s var(--ease)}
@keyframes tick{0%{color:var(--acc)}100%{color:var(--fg)}}
/* Ribbon */
#rib{display:flex;align-items:center;gap:10px;padding-block:7px;white-space:nowrap;width:100%;text-align:left;background:var(--deck);border-radius:14px;margin-bottom:8px}
#rib .eq{font:700 17px/1 var(--disp)}
#rib .eq small{font:600 12px var(--body);color:var(--mute)}
#rib .dl{font:600 14px var(--body)}
#rib .rv{margin-left:auto;font-size:12.5px;color:var(--mute);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
#rib .rv b{color:var(--fg);font:700 15px var(--disp)}
.up{color:var(--win)}.dn{color:var(--loss)}
/* Main */
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:4px 20px;display:flex;flex-direction:column;gap:12px;animation:fadein .22s var(--ease)}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--deck);border-radius:16px;padding:12px}
.sh{display:flex;align-items:center;gap:8px;font:700 16px/1.2 var(--disp);letter-spacing:-.01em}
.sh small{margin-left:auto;font:500 12px var(--body);color:var(--mute);text-align:right}
.cd{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:600 12px var(--body);color:var(--acc);background:rgba(0,191,255,.12);border-radius:999px;padding:3px 8px;white-space:nowrap}
.cd.warn{color:var(--warn);background:rgba(245,158,11,.14)}.cd.off{color:var(--mute);background:var(--deck2)}
.cd svg{width:12px;height:12px}
.row{display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:1fr}
.p{position:relative;min-height:54px;background:var(--deck2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;gap:2px;min-width:0;transition:transform .12s var(--ease),background .15s}
.p span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.p strong{font:600 17px/1 var(--disp)}
.p:active{transform:scale(.96)}
.p.sel{background:var(--grad)}.p.sel span{color:rgba(255,255,255,.85)}
.p[disabled]{background:#151F29}.p[disabled] strong{color:var(--mute2)}.p[disabled] span{color:var(--mute2)}
.p .lk{position:absolute;top:5px;right:6px;width:11px;height:11px;opacity:.7}
.p.f-up strong{animation:fu 1.6s var(--ease)}.p.f-dn strong{animation:fd 1.6s var(--ease)}
.p.f-up::after,.p.f-dn::after{content:"";position:absolute;right:7px;bottom:7px;border:4px solid transparent;animation:fade 1.6s forwards}
.p.f-up::after{border-bottom-color:var(--win);border-top:0}.p.f-dn::after{border-top-color:var(--loss);border-bottom:0}
@keyframes fu{0%,55%{color:var(--win)}}@keyframes fd{0%,55%{color:var(--loss)}}@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}
.grid{display:grid;grid-template-columns:minmax(64px,.8fr) 1fr 1fr 1fr;gap:8px;align-items:center}
.grid .h{font:600 11px var(--body);letter-spacing:.04em;color:var(--mute);text-align:center;text-transform:uppercase}
.grid .tn{display:flex;gap:7px;align-items:center;font:700 16px var(--disp)}
.grid .tn img{width:26px;height:26px}
.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;scroll-snap-type:x proximity;margin-inline:-2px}
.rail::-webkit-scrollbar{display:none}
.rail .p{flex:0 0 78px;scroll-snap-align:center}
.lab{font:600 13px var(--body);color:var(--mute)}
.note{font-size:12.5px;color:var(--mute);line-height:1.4}
.split{height:4px;border-radius:2px;overflow:hidden;display:flex;background:var(--deck2)}
.split i{display:block;background:var(--acc)}
.pl{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center}
.pl .nm{min-width:0;display:flex;align-items:center;gap:10px}
.pl .nm .hs{width:40px;height:40px;border-radius:50%;background:var(--deck2);object-fit:cover;object-position:50% 15%;flex:none}
.pl .nm div{min-width:0;display:flex;flex-direction:column}
.pl .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm small{color:var(--mute);font-size:12px}
.pl .p{min-height:48px}
.pill{display:inline-block;padding:2px 6px;border-radius:6px;font:700 10px var(--body);letter-spacing:.04em;background:var(--deck2);color:var(--mute);vertical-align:1px}
.pill.you{background:var(--acc);color:var(--acc-ink)}
.pill.real{background:rgba(16,185,129,.18);color:var(--win)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);color:#fff;flex:none}
/* Tickets */
.tk{background:var(--deck2);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.sec>.tk{background:var(--deck2)}
#main>.tk{background:var(--deck)}
.tk .a{display:flex;gap:8px;align-items:baseline}
.tk .a b{font:600 16px/1.2 var(--disp);min-width:0}
.tk .a em{margin-left:auto;font:700 16px var(--disp);font-style:normal;white-space:nowrap}
.tk .s{font-size:12.5px;color:var(--mute)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);transition:width .6s var(--ease)}
.tk .c{display:flex;gap:8px;align-items:center}
.btn{background:var(--deck2);border-radius:11px;padding:9px 13px;font:600 14px var(--body);white-space:nowrap}
.btn.g{background:var(--grad);color:#fff}
.btn[disabled]{opacity:.45}
.tk.win{box-shadow:inset 0 0 0 1.5px var(--win)}.tk.loss{opacity:.72}
/* Field table */
.fr{display:grid;grid-template-columns:24px 30px 1fr auto auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.fr:last-of-type{border-bottom:0}
.fr.me{background:rgba(0,191,255,.08);border-radius:12px;border-bottom-color:transparent;padding-inline:8px;margin-inline:-4px}
.fr .r{font:700 15px var(--disp);color:var(--mute);text-align:center}
.fr b{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .v{font:700 16px var(--disp)}
.fd{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fd:last-child{border-bottom:0}
.fd .t{min-width:0;flex:1;font-size:14px}
.fd .t small{display:block;color:var(--mute);font-size:12px}
/* Segmented control and Slip pill */
#nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--deck);border-radius:11px;padding:3px;margin-bottom:8px}
#nav button{padding:8px 0;border-radius:9px;font:600 14px var(--body);color:var(--mute);transition:background .18s var(--ease),color .18s}
#nav button.on{background:var(--deck2);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.35)}
#slipPill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--grad);color:#fff;font:700 15px var(--body);box-shadow:0 8px 24px rgba(0,128,255,.45);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
#slipPill svg{width:20px;height:20px}#slipPill em{font-style:normal;font-weight:600;opacity:.85;font-size:13px}
#slipPill sup{background:#fff;color:#0080FF;border-radius:9px;padding:0 6px;font:700 11px/17px var(--body)}
#slipPill.on{box-shadow:0 0 0 2px #fff,0 8px 24px rgba(0,128,255,.45)}
#main{padding-bottom:84px!important}
/* Old tab bar */
#oldnav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line2);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10.5px var(--body);color:var(--mute2);position:relative}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--acc)}
#nav sup{position:absolute;top:3px;left:calc(50% + 6px);background:var(--loss);color:#fff;border-radius:9px;padding:0 5px;font:700 10px/16px var(--body)}
#pbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding-block:11px;background:var(--grad);color:#fff;font:700 15px var(--body);width:100%}
/* Sheets */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;animation:fadein .2s}
#slip,#panel{position:fixed;left:0;right:0;bottom:0;background:var(--deck2);border-radius:20px 20px 0 0;z-index:21;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:86%;overflow-y:auto;animation:sheet .28s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
#slip::before,#panel::before{content:"";align-self:center;width:36px;height:5px;border-radius:3px;background:var(--line2);margin-bottom:4px;flex:none}
@keyframes sheet{from{transform:translateY(100%)}}
.sl-h{display:flex;align-items:center;gap:10px}
.sl-h b{font:700 20px/1.2 var(--disp);min-width:0}
.sl-h em{margin-left:auto;font:700 24px/1 var(--disp);font-style:normal;color:var(--acc)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chips button{padding:12px 0;background:var(--deck);border-radius:11px;font:600 15px var(--body)}
.chips button.on{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}
.sl-m{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);gap:8px}
.sl-m b{font:700 17px var(--disp);color:var(--fg)}
#lock{padding:16px;background:var(--grad);color:#fff;border-radius:14px;font:700 17px/1 var(--body)}
#lock[disabled]{background:var(--deck);color:var(--mute)}
#lock:active{transform:scale(.98)}
/* Toast */
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;min-width:240px;max-width:92%;border-radius:16px;padding:12px 16px;pointer-events:none;background:rgba(26,37,48,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:drop .3s var(--ease)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
#toast.win{background:rgba(16,185,129,.95);color:#fff}
#toast.loss{background:rgba(60,26,26,.95);box-shadow:inset 0 0 0 1px var(--loss)}
#toast b{display:block;font:700 22px/1.1 var(--disp)}
#toast span{display:block;margin-top:3px;font-size:13px}
#fwbar{height:4px}
.watch{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.watch a{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--deck2);border-radius:12px;padding:10px 12px;color:var(--fg);text-decoration:none;font:600 14px var(--body)}
.watch a i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bug" class="band">
    <div id="crumb">Board <span>›</span> <b>Bears at Seahawks</b><span class="live">LIVE</span></div>
    <div class="card-bug">
      <div class="bugrow">
        <div class="tm" id="tA"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/chi.png"><div class="nm"><span>CHI</span><b id="sA">–</b><div class="to" id="toA"></div></div></div>
        <div class="clk"><span id="clk">Loading</span><small id="dd">Connecting to ESPN</small></div>
        <div class="tm home" id="tH"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/sea.png"><div class="nm"><span>SEA</span><b id="sH">–</b><div class="to" id="toH"></div></div></div>
      </div>
      <div id="field"><div class="ez l"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/chi.png"></div><div class="ez r"><img alt="" src="https://a.espncdn.com/i/teamlogos/nfl/500/sea.png"></div><div class="gl" style="left:50%"></div><div id="fd" hidden></div><div id="ball" hidden></div></div>
      <div id="tick"></div>
    </div>
    <button id="rib" class="band" data-go="field"></button>
    <div id="nav"></div>
  </div>
  <div id="main" class="band"></div>
  <button id="pbar" class="band" hidden data-popen="1"></button>
  <button id="slipPill" data-tab="bets"></button>
</div>
<div id="scrim" hidden></div>
<div id="slip" class="band" hidden></div>
<div id="panel" class="band" hidden></div>
<div id="toast" hidden></div>

<script>
const VERSION='v14';
const BOOT=Date.now();
const CHANGES=[['v14','New look in Rush blue: iOS tab bar with icons, team logos, player headshots, a cleaner scorebug with timeouts, and sheets that slide up. Every live market shows a countdown chip, and locked lines stay visible with a lock. A Watch door links to ESPN, ABC and live TV apps.'],['v13','Player props and anytime touchdown now price like a book: each player\'s 2026 season average from ESPN is the pregame number, and an in-game model fit on 2023-2025 play-by-play turns it, the current stat and the clock into over and under prices.'],['v12','Timed markets now price from real NFL data. Next-snap pass or run, 5+ and 10+ yards, moves the chains, this drive and next score come from tables fit on every snap of the 2023-2025 seasons, about 115,000 plays, by down, distance, field position, clock and score. Each market carries a stated hold.'],['v11','No more voids after the fact. Every live pick is pending until the feed confirms the ball was dead when you tapped, the way books accept in-play picks. If it was not, the pick is never accepted and the stake stays in your Stack. Timed picks wait for the next play to post. Other picks wait 16 seconds for DraftKings and are declined if it suspended or moved toward the pick.'],['v10','Fair timed markets. Next snap, first down, this drive, next score and anytime touchdown open only in a short window after each play, with a countdown, and close before the next snap is likely. They also close the moment DraftKings suspends or jumps. A pick placed after the play it depends on started is void, stake back, and so is any prop picked after a play involving that player started. The panel shows how early or late the lock was on each play.'],['v9','Now the Live section of Bears at Seahawks inside Rush. Your weekly Stack of 1,000, your Slip, Units and the Field. Rush words everywhere. Early close-out is gone because Rush has none. A named head-to-head opponent on the Field tab, and a free Reload once your Stack runs low.'],['v8','Checks ESPN every second past the cache and uses whichever feed hears a play first.'],['v7','ESPN push feed, DraftKings live prices on the main lines, markets lock when DraftKings jumps, and your true lag in the header.'],['v6','One-tap picks, glowing open picks, beat-the-line readout, second-half markets, final recap.'],['v1-v5','Live Board, next-snap, drive and next-score markets, props, parlays, first-down market, SIM Field, rank alerts, self-update.']];
const E='401873036',HOME='26',AWAY='3',BUDGET=1000,MICROCAP=50,RIVAL='Da Bears Dee';
const CORE=`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/${E}/competitions/${E}`;
const SITE=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${E}`;
const $=id=>document.getElementById(id);
const LOGO=a=>'https://a.espncdn.com/i/teamlogos/nfl/500/'+a+'.png';
const HS=id=>'https://a.espncdn.com/i/headshots/nfl/players/full/'+encodeURIComponent(id)+'.png';
const AVC=['#0080FF','#10B981','#F59E0B','#D95151','#8B5CF6','#06B6D4','#EC4899','#64748B'];

function nflGameB(g) { return g > 2700 ? 0 : g > 1800 ? 1 : g > 900 ? 2 : g >= 300 ? 3 : g >= 120 ? 4 : 5; }
function nflR3(x) { return Math.round(x * 1000) / 1000; }

// P(next scrimmage play is a QB dropback). Base table by down/dist/field, then a game-script x time odds multiplier.
function nflPassRate(s) {
  var t = nflState(s);
  var p = NFLM.passRate.base[t.down - 1][nflDistB(t.dist)][nflYteB(t.yte)][0];
  var m = NFLM.passRate.adj[t.down <= 2 ? 0 : 1][nflScriptB(t.sd)][nflTimeB(t.g)][0];
  if (p < 0.001) p = 0.001; if (p > 0.999) p = 0.999;
  var o = p / (1 - p) * m;
  return nflR3(o / (1 + o));
}
// P(yards gained >= yards) on the next run or dropback; yards is 5 or 10 (anything above 7 uses the 10-yard table).
function nflGain(s, yards) {
  var t = nflState(s), tab = nflNum(yards, 10) > 7 ? NFLM.gain10 : NFLM.gain5;
  return tab[t.down - 1][nflDistB(t.dist)][nflYteB(t.yte)][0];
}
// P(offense earns a new first down or scores a TD before this series ends).
function nflSeriesConvert(s) {
  var t = nflState(s);
  return NFLM.seriesConvert[t.down - 1][nflDistB(t.dist)][nflYteB(t.yte)][0];
}
// Rest-of-drive result for the offense: {TD, FG, none}.
function nflDriveResult(s) {
  var t = nflState(s), c = NFLM.driveResult[t.down - 1][nflDistB(t.dist)][nflYteB(t.yte)][nflHalfB(t.h)];
  return { TD: c[0], FG: c[1], none: nflR3(Math.max(0, 1 - c[0] - c[1])) };
}
// Next score in the game: {off: team with the ball, def: other team, none: no more scoring}.
function nflNextScore(s) {
  var t = nflState(s), c = NFLM.nextScore[nflYteB(t.yte)][nflGameB(t.g)][t.down <= 2 ? 0 : 1];
  return { off: c[0], def: c[1], none: nflR3(Math.max(0, 1 - c[0] - c[1])) };
}

/* Sample calls and outputs:
 * nflPassRate({"down":3,"dist":8,"yte":50,"scoreDiffOff":0,"gameSecsLeft":2400,"halfSecsLeft":600}) => 0.962
 * nflGain({"down":1,"dist":10,"yte":75,"scoreDiffOff":0,"gameSecsLeft":3000,"halfSecsLeft":1200}, 10) => 0.207
 * nflDriveResult({"down":1,"dist":5,"yte":5,"scoreDiffOff":0,"gameSecsLeft":2400,"halfSecsLeft":600}) => {"TD":0.771,"FG":0.128,"none":0.101}
 * nflNextScore({"down":1,"dist":10,"yte":75,"scoreDiffOff":3,"gameSecsLeft":90,"halfSecsLeft":90}) => {"off":0.244,"def":0.082,"none":0.674}
 * nflSeriesConvert({"down":3,"dist":2,"yte":45,"scoreDiffOff":-4,"gameSecsLeft":1500,"halfSecsLeft":1500}) => 0.739

/* ESPN's yardLine counts from the home goal line, whoever has the ball. */
function yte(){const yl=G.sit&&G.sit.yardLine,off=offense();if(!(yl>0)||!off)return null;return off==='home'?100-yl:yl}
function mState(){const off=offense(),halfLeft=G.period<=2?(2-G.period)*900+G.clockVal:G.period<=4?(4-G.period)*900+G.clockVal:G.clockVal;return{down:G.sit&&G.sit.down>0?G.sit.down:1,dist:G.sit&&G.sit.distance||10,yte:yte()||75,scoreDiffOff:off==='home'?G.hs-G.as:off==='away'?G.as-G.hs:0,gameSecsLeft:remSecs(),halfSecsLeft:halfLeft}}
function driveProbs(){return nflDriveResult(mState())}
function setProb(){return nflSeriesConvert(mState())}
function playProbs(){const st=mState();return{pass:nflPassRate(st),y5:nflGain(st,5),y10:nflGain(st,10)}}

/* ---------- market definitions ---------- */
const HOLD=1.05,MICRO=1.07,SGP=.9;
const tName=s=>s==='home'?'SEA':'CHI';
function teamMean(side){const h=(M.mT+M.mu)/2,a=(M.mT-M.mu)/2;return side==='home'?Math.max(h,G.hs):Math.max(a,G.as)}
const qScore=(side,n)=>{const a=side==='home'?G.lines.h:G.lines.a;return a[n-1]||0};
function qModel(n){const qRem=n<G.period?0:n===G.period?G.clockVal:900,f=qRem/Math.max(remSecs(),1),rt=Math.max(M.mT-G.hs-G.as,0),extra=rt*f*(n===G.period?1:1),mu=M.mu-(G.hs-G.as),s=Math.max(1.2,7*Math.sqrt(qRem/900));return{meanT:qScore('home',n)+qScore('away',n)+extra,meanM:qScore('home',n)-qScore('away',n)+mu*f,s}}
function hModel(){const secs=G.period>=3?0:(2-G.period)*900+G.clockVal,f=secs/Math.max(remSecs(),1),h1=[0,1].map(i=>(G.lines.h[i]||0)),a1=[0,1].map(i=>(G.lines.a[i]||0)),cur=h1[0]+h1[1]+a1[0]+a1[1],rt=Math.max(M.mT-G.hs-G.as,0);return{meanT:cur+rt*f,s:Math.max(1.3,9.5*Math.sqrt(secs/1800)),cur}}
function h2Model(){const h=hModel(),curM=G.hs-G.as,secs=G.period>=3?0:(2-G.period)*900+G.clockVal,f=secs/Math.max(remSecs(),1),h1M=G.period>=3?h1Margin():h1Margin()+(M.mu-curM)*f,left=clamp(remSecs()/1800,0,1);return{meanT:M.mT-h.meanT,meanM:M.mu-h1M,s:Math.max(1.3,G.period>=3?M.sT:9.5*Math.sqrt(left))}}
const h1Pts=()=>qScore('home',1)+qScore('home',2)+qScore('away',1)+qScore('away',2);
const h1Margin=()=>qScore('home',1)+qScore('home',2)-qScore('away',1)-qScore('away',2);
/* Probabilities for a market definition: w is win, p is push. */
function probs(m){
  switch(m.k){
    case'ml':return m.side==='home'?{w:M.wp,p:M.tie}:{w:1-M.wp-M.tie,p:M.tie};
    case'spread':{const mu=m.side==='home'?M.mu:-M.mu;return gt(-m.line,mu,M.sM)}
    case'total':{const o=gt(m.line,M.mT,M.sT);return m.ou==='o'?o:flip(o)}
    case'tt':{const o=gt(m.line,teamMean(m.side),M.sT*.72);return m.ou==='o'?o:flip(o)}
    case'qt':{const q=qModel(m.n),o=gt(m.line,q.meanT,q.s);return m.ou==='o'?o:flip(o)}
    case'qml':{const q=qModel(m.n),z=gt(0,q.meanM,q.s);return m.side==='home'?z:flip(z)}
    case'ht':{const h=hModel(),o=gt(m.line,h.meanT,h.s);return m.ou==='o'?o:flip(o)}
    case'h2t':{const h=h2Model(),o=gt(m.line,h.meanT,h.s);return m.ou==='o'?o:flip(o)}
    case'h2s':{const h=h2Model();return gt(-m.line,m.side==='home'?h.meanM:-h.meanM,h.s)}
    case'prop':{const cur=boxStat(m.aid,m.stat)||0,sp=priorFor(m.aid,m.stat);if(sp!=null&&typeof nflPropOver==='function'){const o=nflPropOver(m.stat,PRIOR[m.aid].pos,sp,cur,fracLeft(),m.line),push=o.push||0;return m.ou==='o'?{w:o.over,p:push}:{w:Math.max(0,1-o.over-push),p:push}}const pr=propProj(cur,m.stat,m.prior),o=gt(m.line,pr.mean,pr.sd);return m.ou==='o'?o:flip(o)}
    case'atd':{const p=PRIOR[m.aid];if(p&&typeof nflAnytimeTD==='function')return{w:nflAnytimeTD(p.pos,p.td,fracLeft()),p:0};const f=remSecs()/3600,w=1-Math.exp(-(m.lam||.35)*f);return{w,p:0}}
    case'next':{const ns=nflNextScore(mState()),off=offense(),pH=off==='home'?ns.off:off==='away'?ns.def:(1-ns.none)/2,pA=off==='home'?ns.def:off==='away'?ns.off:(1-ns.none)/2;return{w:m.sel==='none'?ns.none:m.sel==='home'?pH:pA,p:0}}
    case'drive':{const d=driveProbs();return{w:d[m.sel],p:0}}
    case'playtype':{const q=playProbs();return{w:m.sel==='pass'?q.pass:1-q.pass,p:0}}
    case'yds':{const q=playProbs(),y=m.yd===5?q.y5:q.y10;return{w:m.sel==='yes'?y:1-y,p:0}}
    case'fd':{const y=setProb();return{w:m.sel==='yes'?y:1-y,p:0}}
    case'parlay':{let w=1;for(const l of m.legs){const g=grade(l);if(g==='loss')return{w:0,p:0};if(g)continue;const o=probs(l);w*=o.w/Math.max(1e-6,1-o.p)}return{w,p:0}}
  }return{w:.5,p:0}}
const isMicro=m=>m.k==='playtype'||m.k==='yds'||m.k==='drive'||m.k==='fd';
function dkPrice(m){if(!dkFresh())return null;const d=G.dk;if(m.k==='ml')return m.side==='home'?d.mlH:d.mlA;if(m.k==='spread'&&m.side==='home'&&m.line===d.spH)return d.spHo;if(m.k==='spread'&&m.side==='away'&&m.line===-d.spH)return d.spAo;if(m.k==='total'&&m.line===d.tot)return m.ou==='o'?d.oo:d.uo;return null}
function quote(m){const dp=dkPrice(m);if(dp!=null)return dp;const o=probs(m),q=o.w/Math.max(1e-6,1-o.p);if(isMicro(m)||m.k==='next')return american(q<.5?q*MICRO:q+.035);return american(q*HOLD)}
const mkKey=m=>[m.k,m.side,m.ou,m.sel,m.line,m.aid,m.stat,m.n,m.yd].filter(x=>x!=null).join('|');
function mkLabel(m){switch(m.k){
  case'ml':return tName(m.side)+' Moneyline';
  case'spread':return tName(m.side)+' '+lineFmt(m.line);
  case'total':return(m.ou==='o'?'Over ':'Under ')+m.line;
  case'tt':return tName(m.side)+(m.ou==='o'?' Over ':' Under ')+m.line;
  case'qt':return'Q'+m.n+(m.ou==='o'?' Over ':' Under ')+m.line;
  case'qml':return'Q'+m.n+' '+tName(m.side)+' Win';
  case'ht':return'1st Half'+(m.ou==='o'?' Over ':' Under ')+m.line;
  case'h2t':return'2nd Half'+(m.ou==='o'?' Over ':' Under ')+m.line;
  case'h2s':return'2nd Half '+tName(m.side)+' '+lineFmt(m.line);
  case'prop':return m.name+(m.ou==='o'?' Over ':' Under ')+m.line+' '+STATS[m.stat][2];
  case'atd':return m.name+' Anytime TD';
  case'next':return m.sel==='none'?'No more scoring':'Next score '+tName(m.sel);
  case'drive':return'This drive: '+({TD:'Touchdown',FG:'Field goal',none:'No score'}[m.sel]);
  case'playtype':return'Next snap: '+(m.sel==='pass'?'Pass':'Run');
  case'yds':return'Next snap '+m.yd+'+ yds: '+(m.sel==='yes'?'Yes':'No');
  case'fd':return'This set moves the chains: '+(m.sel==='yes'?'Yes':'No');
  case'parlay':return m.legs.length+'-leg parlay';

/* ---------- grading, the same way a book grades ---------- */
const CLOSED=()=>G.state==='post';
const late=(b,p)=>!!(p&&p.wallclock&&b.t>=Date.parse(p.wallclock)-2000);
const lastName=n=>{const parts=String(n||'').split(' ').filter(x=>!/^(jr|sr|ii|iii|iv|v)\.?$/i.test(x));return parts[parts.length-1]||''};
const touched=(b,p)=>{const ln=lastName(b.name);return ln&&new RegExp('\\b'+ln.replace(/[^A-Za-z'-]/g,'')+'\\b').test(p.text||'')};
const lateTouch=b=>playsAfter(b.anchor).some(p=>late(b,p)&&touched(b,p));
function playsAfter(a){return G.plays.filter(p=>seq(p)>a)}
const SKIP=/timeout|end |coin toss|two-minute|penalty|end of/i;
function cls(p){const t=p.type&&p.type.text||'';if(SKIP.test(t)||/no play/i.test(p.text||''))return null;if(/pass|sack|interception/i.test(t))return'pass';if(/rush/i.test(t))return'rush';if(/fumble/i.test(t))return p.text&&/pass/i.test(p.text)?'pass':'rush';return'other'}
function grade(b){const hs=G.hs,as=G.as,fin=CLOSED();
    switch(b.k){
    case'ml':if(!fin)return null;if(hs===as)return'push';return(hs>as)===(b.side==='home')?'win':'loss';
    case'spread':{if(!fin)return null;const x=(b.side==='home'?hs-as:as-hs)+b.line;return x>0?'win':x<0?'loss':'push'}
    case'total':{const t=hs+as;if(b.ou==='o'&&t>b.line)return'win';if(b.ou==='u'&&t>b.line)return'loss';if(!fin)return null;return t===b.line?'push':b.ou==='o'?'loss':'win'}
    case'tt':{const t=b.side==='home'?hs:as;if(b.ou==='o'&&t>b.line)return'win';if(b.ou==='u'&&t>b.line)return'loss';if(!fin)return null;return t===b.line?'push':b.ou==='o'?'loss':'win'}
    case'qt':{const t=qScore('home',b.n)+qScore('away',b.n);if(b.ou==='o'&&t>b.line)return'win';if(b.ou==='u'&&t>b.line)return'loss';if(!(fin||G.period>b.n))return null;return t===b.line?'push':b.ou==='o'?'loss':'win'}
    case'qml':{if(!(fin||G.period>b.n))return null;const x=qScore('home',b.n)-qScore('away',b.n);if(!x)return'push';return(x>0)===(b.side==='home')?'win':'loss'}
    case'ht':{const t=qScore('home',1)+qScore('home',2)+qScore('away',1)+qScore('away',2);if(b.ou==='o'&&t>b.line)return'win';if(b.ou==='u'&&t>b.line)return'loss';if(!(fin||G.period>2))return null;return t===b.line?'push':b.ou==='o'?'loss':'win'}
    case'h2t':{const t=hs+as-h1Pts();if(G.period>=3&&b.ou==='o'&&t>b.line)return'win';if(G.period>=3&&b.ou==='u'&&t>b.line)return'loss';if(!fin)return null;return t===b.line?'push':(t>b.line)===(b.ou==='o')?'win':'loss'}
    case'h2s':{if(!fin)return null;const x=(b.side==='home'?1:-1)*(hs-as-h1Margin())+b.line;return x>0?'win':x<0?'loss':'push'}
    case'prop':{if(b.t&&lateTouch(b))return'void';const v=boxStat(b.aid,b.stat);if(v!=null&&b.ou==='o'&&v>b.line)return'win';if(v!=null&&b.ou==='u'&&v>b.line)return'loss';if(!fin)return null;if(v==null)return'void';return v===b.line?'push':b.ou==='o'?'loss':'win'}
    case'atd':{if(b.t&&lateTouch(b))return'void';const v=boxTD(b.aid);if(v>0)return'win';return fin?(v==null?'void':'loss'):null}
    case'next':{let h=b.h0,a=b.a0;for(const p of playsAfter(b.anchor)){if(p.homeScore==null)continue;if((p.homeScore>h||p.awayScore>a)&&late(b,p))return'void';if(p.homeScore>h)return b.sel==='home'?'win':'loss';if(p.awayScore>a)return b.sel==='away'?'win':'loss'}if(hs>h)return b.sel==='home'?'win':'loss';if(as>a)return b.sel==='away'?'win':'loss';return fin?(b.sel==='none'?'win':'loss'):null}
    case'drive':{const dp=playsAfter(b.anchor).find(p=>p.scoringPlay||p.isTurnover||/punt|field goal|downs/i.test((p.type&&p.type.text)||''));if(dp&&late(b,dp))return'void';const d=[...G.prevDrives,G.drive].filter(Boolean).find(x=>x.id==b.driveId);if(!d){return fin?'void':null}if(!d.result)return fin?'void':null;const r=String(d.result).toUpperCase();if(r==='TD'||/^TOUCHDOWN/.test(r))return b.sel==='TD'?'win':'loss';if(r==='FG')return b.sel==='FG'?'win':'loss';return b.sel==='none'?'win':'loss'}
    case'playtype':case'yds':{for(const p of playsAfter(b.anchor)){const c=cls(p);if(!c)continue;if(late(b,p))return'void';if(c==='other')return'void';if(b.k==='playtype')return(c==='pass')===(b.sel==='pass')?'win':'loss';const hit=(p.statYardage||0)>=b.yd;return hit===(b.sel==='yes')?'win':'loss'}return fin?'void':null}
    case'fd':{let first=true;for(const p of playsAfter(b.anchor)){const c=cls(p);if(!c)continue;if(first&&late(b,p))return'void';first=false;const st=p.start&&p.start.team&&p.start.team.$ref||'',en=p.end&&p.end.team&&p.end.team.$ref||'',off=st.includes('teams/'+b.offId),same=en.includes('teams/'+b.offId);if(!off)return b.sel==='no'?'win':'loss';if(c==='other'||p.isTurnover)return b.sel==='no'?'win':'loss';if(p.scoringPlay||(same&&p.end&&p.end.down===1))return b.sel==='yes'?'win':'loss'}return fin?'void':null}
    case'parlay':{let pend=false,live=0;for(const l of b.legs){const g=grade(l);if(g==='loss')return'loss';if(!g)pend=true;else if(g==='win')live++}if(pend)return null;return live?'win':'push'}
  }return null}
const ST={k:'rush_live_v9'};
let S={stack:BUDGET,bets:[],seq:0,reloads:0};
try{const x=JSON.parse(localStorage.getItem(ST.k)||'null');if(x&&x.bets)S=x}catch(e){}
function save(){try{localStorage.setItem(ST.k,JSON.stringify(S))}catch(e){}}

function parlayDec(legs){const ds=legs.map(l=>dec(l.odds));return ds.reduce((a,x)=>a*x,1)*(legs.length>1?SGP:1)}
const liveSt=b=>b.st==='open'||b.st==='pending';
const doneSt=b=>!liveSt(b)&&b.st!=='rejected';
function payoutFor(b){if(b.k==='parlay'){const live=b.legs.filter(l=>grade(l)!=='push'&&grade(l)!=='void');return +(b.stake*(live.length?parlayDec(live):1)).toFixed(2)}return +(b.stake*dec(b.odds)).toFixed(2)}
/* Acceptance. ESPN and the DraftKings ticks it relays arrive after the field, so a live pick waits
   until the feed has caught up past the tap. A timed pick is accepted only if the next play the feed
   posts started after the tap. Other picks wait ACCEPT_MS for DraftKings ticks and are declined if
   the market suspended or moved, or if a big play or a play naming the player had already started. */
const ACCEPT_MS=16000;
/* A move toward the picked side means the market learned something the page had not shown yet. A move away from it only hurts the player, so it is accepted. */
function mvToward(b,ticks){const legs=b.k==='parlay'?b.legs:[b];for(const l of legs){const k=l.k,dir=(k==='ml'||k==='spread'||k==='h2s'||k==='qml')?(l.side==='home'?1:-1):(k==='total'||k==='tt'||k==='qt'||k==='ht'||k==='h2t')?(l.ou==='o'?1:-1):0;if(!dir)continue;const f=(k==='total'||k==='tt'||k==='qt'||k==='ht'||k==='h2t')?'over':k==='spread'||k==='h2s'?'cover':'wp',base=b[f+'0'];if(base==null)continue;if(ticks.some(x=>x[f]!=null&&(x[f]-base)*dir>=.02))return true}return false}
function acceptCheck(b){const legs=b.k==='parlay'?b.legs:[b],after=playsAfter(b.anchor).filter(p=>p.wallclock),fin=CLOSED();
  const stale=after.some(p=>late(b,p)&&(isTimed(b)||p.scoringPlay||p.isTurnover||Math.abs(p.statYardage||0)>=15||legs.some(l=>l.name&&touched(l,p))));
  if(stale)return{r:'reject',why:'a play had already started when you tapped'};
  if(isTimed(b))return after.length?{r:'accept'}:fin?{r:'reject',why:'no play followed'}:null;
  if(Date.now()-b.t<ACCEPT_MS&&!fin)return null;
  const ticks=G.dkLog.filter(x=>x.t>b.t&&x.t<=b.t+ACCEPT_MS);
  if(ticks.some(x=>!x.ok))return{r:'reject',why:'DraftKings suspended the market'};
  const toward=mvToward(b,ticks);if(toward)return{r:'reject',why:'the price moved toward your pick'};
  return{r:'accept'}}
function settleAll(){let anyWin=null;for(const b of S.bets){if(b.st==='pending'){const a=acceptCheck(b);if(!a)continue;if(a.r==='reject'){b.st='rejected';b.at=Date.now();S.stack=+(S.stack+b.stake).toFixed(2);toastQ.push({c:'loss',h:'Not accepted',s:b.label+': '+a.why+'. Stake stays in your Stack.'});pumpToast();continue}b.st='open';b.acceptedAt=Date.now();toastQ.push({c:'',h:'Accepted '+fmtOdds(b.odds),s:b.label});pumpToast()}if(b.st!=='open')continue;const r=grade(b);if(!r)continue;b.st=r;b.at=Date.now();b.pay=r==='win'?payoutFor(b):(r==='push'||r==='void')?b.stake:0;S.stack=+(S.stack+b.pay).toFixed(2);showToast(r,b)}save()}
function liveValue(b){const o=probs(b);return Math.max(0,+(b.stake*(o.w*dec(b.odds)+o.p)).toFixed(2))}
const myUnits=()=>(stackValue()-BUDGET*(1+(S.reloads||0)))/10;
function stackValue(){let e=S.stack;for(const b of S.bets)if(liveSt(b))e+=isMicro(b)||b.st==='pending'?b.stake:liveValue(b);return +e.toFixed(2)}

/* ---------- field of simulated players, replayed from ESPN's own probability feed ---------- */
const BOTS=[['Chalk Charlie','fav',.05],['Dog Walker','dog',.05],['Over Olivia','over',.06],['Under Ulysses','under',.06],['12th Man Mo','sea',.07],['Da Bears Dee','chi',.07],['Sharp Sal','mom',.05],['Fade Fay','anti',.05],['Random Ray','rand',.04],['Steady Ed','fav',.02],['Yolo Yara','rand',.14],['Late Lou','late',.09]];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967296}
let simCache={n:'',rows:[],feed:[],splits:{}};
function simField(){const pr=G.prob,ck=pr.length+'/'+G.plays.length+'/'+G.state;if(simCache.n===ck)return simCache;
  const snaps=G.plays.map(p=>({p,c:cls(p)})).filter(x=>x.c==='pass'||x.c==='rush');

    pr.forEach((x,i)=>{const prev=pr[i-1]||x,h=hash(name+x.sequenceNumber);const rate=per==='late'?(i>pr.length*.6?.22:.03):.16;if(h>rate)return;const mom=x.homeWinPercentage-prev.homeWinPercentage,r=hash(name+'k'+x.sequenceNumber);const type=per==='over'||per==='under'?'total':r<.4?'ml':r<.7?'spread':'total';let side;
      if(type==='total')side=per==='over'?'o':per==='under'?'u':hash(name+'o'+i)<.5?'o':'u';
      else if(per==='fav')side=x.homeWinPercentage>.5?'home':'away';else if(per==='dog')side=x.homeWinPercentage>.5?'away':'home';else if(per==='sea')side='home';else if(per==='chi')side='away';else if(per==='mom')side=mom>=0?'home':'away';else if(per==='anti')side=mom>=0?'away':'home';else side=hash(name+'s'+i)<.5?'home':'away';
      const ph=type==='ml'?x.homeWinPercentage:type==='spread'?x.spreadCoverProbHome/Math.max(.01,1-x.spreadPushProb):x.totalOverProb,p=(side==='home'||side==='o')?ph:1-ph;if(p<.06||p>.94)return;const odds=american(p*HOLD),stake=Math.round(cash*size/10)*10;if(stake<10)return;cash-=stake;

function cleanM(m){const{k,side,ou,sel,line,aid,stat,n,yd,name,prior,lam}=m;const o={k};for(const[a,v]of Object.entries({side,ou,sel,line,aid,stat,n,yd,name,prior,lam}))if(v!=null)o[a]=v;return o}
function lagHtml(){const s=lagStats(),feed=fcLive()?'Push feed connected':'Push feed down, polling ESPN';if(!s)return`<div><div class="sh">Real-time check</div><div class="note" style="color:var(--fg)">${feed}. Waiting for the next play to measure lag.</div></div>`;const tm=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'});return`<div><div class="sh">Real-time check</div><div class="note" style="color:var(--fg)">${feed}. Last play happened ${tm(s.l.wall)} by ESPN's stamp and reached this page ${tm(s.l.at)}: <b>${Math.round(s.last)}s behind</b>. Average ${Math.round(s.avg)}s, best ${Math.round(s.best)}s over the last ${Math.min(s.n,10)} plays.${s.espn!=null?` ESPN's push took ${s.espn.toFixed(1)}s to publish it and delivery to you took ${Math.max(0,s.net).toFixed(1)}s.`:` First heard on ESPN's core feed, ahead of its push.`} Almost all of the lag is before ESPN publishes, so this page cannot remove it. DraftKings prices often move first, and markets lock when they jump.</div></div>`}
function lockHtml(){const a=G.locks;if(!a.length)return`<div><div class="sh">Timed-market lock</div><div class="note" style="color:var(--fg)">Measured on each snap once a window has closed. Window right now: ${Math.max(12,snapGapP25()-2)}s after each play's stamp.</div></div>`;const f=x=>x<0?Math.abs(x).toFixed(0)+'s before the snap':x.toFixed(0)+'s after the snap',l=a[a.length-1],early=a.filter(x=>x.lag<=0).length;return`<div><div class="sh">Timed-market lock</div><div class="note" style="color:var(--fg)">Last lock came ${f(l.lag)}${l.dk?', from DraftKings':''}. Locked before the snap on ${early} of ${a.length} snaps. A pick tapped after its play started is never accepted, so a late lock cannot pay out.</div></div>`}
function showPanel(){const el=$('panel');el.innerHTML=`<div class="sl-h"><b>Rush Live ${VERSION}</b></div>${lagHtml()}${lockHtml()}${CHANGES.map(([v,t])=>`<div><div class="sh">${v}</div><div class="note" style="color:var(--fg)">${esc(t)}</div></div>`).join('')}<div class="note">Free to play. Stack and Units are virtual. This prototype starts you at a full ${fmtStack(BUDGET)} Stack and 0 Units for the week. Main lines are DraftKings' live prices, and picks grade from ESPN's box score, plays and final score. Pushes return your stake. 1 Unit is 10 Stack.</div><button class="btn" data-closepan="1">Close</button>`;el.hidden=false;$('scrim').hidden=false}
/* Loop */
let raf=null;
function tickAll(){settleAll();renderAll()}
function renderAll(){if(raf)return;raf=setTimeout(()=>{raf=null;renderBug();renderNav();renderPbar();if(!document.querySelector('.rail:active'))renderMain();if(SL.m||SL.par)renderSlip()},60)}
/* GitHub Pages caches the page for 10 minutes; check for a new version and hop to a fresh URL. */
async function checkUpdate(){if(SL.m||SL.par)return;try{const t=await(await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'})).text(),m=t.match(/VERSION='(v\d+)'/);if(m&&m[1]!==VERSION)location.replace(location.pathname+'?v='+m[1])}catch(e){}}
function start(){model();renderAll();connectFC();pollSummary();pollOdds();pollProb();pollPlays();pollSit();const every=(fn,fast,slow)=>{let last=0;setInterval(()=>{const gap=fcLive()?slow:fast;if(Date.now()-last>=gap){last=Date.now();fn()}},500)};setInterval(pollFast,1000);every(pollProb,3000,30000);every(pollSit,4000,60000);every(pollPlays,5000,20000);every(pollSummary,10000,20000);setInterval(pollOdds,137000);setInterval(()=>{if(FC.ws&&Date.now()-FC.last>25000&&FC.last)try{FC.ws.close()}catch(e){}},5000);setInterval(renderBug,1000);setInterval(checkUpdate,45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){connectFC();pollProb();pollSit();pollPlays();pollSummary();pollOdds()}})}
start();
</script>
