<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Contests sim · Rush</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Contests sim: Team Red growth simulation, Weeks 9 to 13. Data from sim-data.js (generated by teams/red/sim/sim.mjs). */
:root{--k-bg:#0B1118;--k-card:#121A23;--k-card2:#1A2530;--k-line:rgba(255,255,255,.07);--k-fg:#fff;--k-mut:#9AA8B6;--k-dim:#66768A;--k-acc:#00BFFF;--k-win:#10B981;--k-warn:#F59E0B;--k-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--k-bg);color:var(--k-fg);font:15px/1.38 var(--k-font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.k-wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.k-back{display:inline-block;color:var(--k-acc);text-decoration:none;font:600 15px var(--k-font);padding:6px 0 4px}
h1{margin:0;font:800 32px/1.1 var(--k-font);letter-spacing:-.02em}.k-sub{color:var(--k-mut);font-size:13px;margin:2px 0 14px}
.k-sec{background:var(--k-card);border-radius:16px;padding:14px;margin-bottom:14px;min-width:0}
.k-sec h2{margin:0 0 10px;font:700 18px/1.2 var(--k-font);display:flex;justify-content:space-between;align-items:baseline;gap:8px}.k-sec h2 span{font:500 13px var(--k-font);color:var(--k-mut);text-align:right}
.k-hint{font-size:12.5px;color:var(--k-dim);margin:8px 0 0}
.hl{display:grid;gap:8px}
.hl-r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;align-items:center;padding:12px;border-radius:12px;background:var(--k-card2)}
.hl-r .nm{font:600 14px var(--k-font);display:flex;align-items:center;gap:8px;min-width:0}.hl-r .nm small{display:block;color:var(--k-mut);font:500 12px var(--k-font)}
.hl-r .v{text-align:right;font:800 22px/1 var(--k-font);letter-spacing:-.02em}.hl-r .v i{display:block;font:500 11px var(--k-font);color:var(--k-mut);font-style:normal;margin-top:4px;letter-spacing:0}
.hl-r.c{box-shadow:inset 0 0 0 1px rgba(0,191,255,.45)}
.ksw{display:inline-block;width:14px;height:4px;border-radius:2px;flex:none;align-self:center}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px var(--k-font);color:var(--k-mut);margin-bottom:6px}.lg span{display:inline-flex;align-items:center;gap:6px}
.ch{margin-top:12px}.ch:first-of-type{margin-top:4px}.ch h3{margin:0 0 2px;font:600 14px var(--k-font)}.ch p{margin:0 0 4px;font-size:12px;color:var(--k-mut)}
svg.c{display:block;width:100%;height:auto;overflow:visible}
svg.c text{font:500 10px var(--k-font);fill:var(--k-dim)}
.tb{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}.tb th,.tb td{padding:7px 2px;text-align:center;border-top:1px solid var(--k-line)}
.tb th{font:600 11.5px var(--k-font);color:var(--k-mut)}.tb td:first-child,.tb th:first-child{text-align:left;width:31%}
.tb td b{display:block;font:700 12.5px var(--k-font)}.tb td small{color:var(--k-mut);font-size:10.5px}
.tb tr.on b{color:var(--k-acc)}
.as{display:grid;gap:8px}.as div{padding:12px;border-radius:12px;background:var(--k-card2)}
.as b{font:700 14px var(--k-font)}.as .val{float:right;font:700 14px var(--k-font);color:var(--k-acc)}.as small{display:block;color:var(--k-mut);font-size:12.5px;margin-top:4px}
.as em{display:block;font-style:normal;font-size:12px;color:var(--k-dim);margin-top:4px}
ul.k-l{margin:0;padding-left:18px;font-size:13.5px;color:var(--k-mut)}ul.k-l li{margin:4px 0}ul.k-l b{color:var(--k-fg);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:13px}.kv span{color:var(--k-mut)}.kv b{text-align:right;font-weight:600}
.k-empty{color:var(--k-mut);font-size:14px}
.k-wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))!important}
</style>
</head>
<body data-tab="ranks">
<div class="k-wrap">
 <a class="k-back" href="contests.html">&lsaquo; Contests</a>
 <h1>Contests sim</h1>
 <div class="k-sub" id="k-sub">Weeks 9 to 13 with and without Contests</div>
 <div id="k-main"><div class="k-sec"><div class="k-empty">Loading the sim results.</div></div></div>
</div>
<script src="shared/state.js"></script>
<script src="sim-data.js"></script>
<script src="shared/nav.js"></script>
<script>
'use strict';
(function(){
const D=window.RED_SIM,$=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!D){$('k-main').innerHTML='<div class="k-sec"><div class="k-empty">No sim results yet. Run node teams/red/sim/sim.mjs.</div></div>';return}
const ARMS=[{k:'baseline',n:'a',col:'#9AA8B6',dash:''},{k:'cohort',n:'b',col:'#F59E0B',dash:'5 4'},{k:'assumed',n:'c',col:'#00BFFF',dash:''}];
const A=D.arms,W=D.meta.weeks,pct=x=>(x*100).toFixed(1)+'%',n1=x=>x.toFixed(1),n0=x=>Math.round(x).toString();
const label=k=>A[k].label;
$('k-sub').textContent=`Weeks ${W[0]} to ${W[W.length-1]} · ${D.meta.runs.toLocaleString('en-US')} runs · Week 8 cohort`;
let h='';
/* Headline blocks: pooled return rates first, then the recent return rate. */
function headline(AA,DL,title,sub,note,suffix){return`<div class="k-sec"><h2>${title} <span>${sub}</span></h2>${note?`<p class="k-hint" style="margin:-4px 0 10px">${note}</p>`:''}<div class="hl">${ARMS.map(a=>{const x=AA[a.k].headline;return`<div class="hl-r${a.k==='assumed'?' c':''}"><div class="nm"><i class="ksw" style="background:${a.col}"></i><div>Arm ${a.n}${suffix}<small>${esc(label(a.k))}</small></div></div><div class="v">${n1(x.field13.mean)}<i>Field ${n0(x.field13.p10)} to ${n0(x.field13.p90)}</i></div><div class="v">${pct(x.retention13.mean)}<i>back from Wk 12</i></div></div>`}).join('')}</div>
<p class="k-hint">Share of seasons reaching the 40 rung by Week 13: ${ARMS.map(a=>`arm ${a.n} ${Math.round(AA[a.k].headline.reach40*100)}%`).join(', ')}.</p><p class="k-hint">Week 9 to 13 retention (share of the Week 9 Field still in at Week 13): ${ARMS.map(a=>`arm ${a.n} ${pct(AA[a.k].headline.retention9to13.mean)}`).join(', ')}. Arm c minus baseline at Week 13, same runs: ${n1(DL.assumed.mean)} players (${n0(DL.assumed.p10)} to ${n0(DL.assumed.p90)}).</p></div>`}
h+=headline(A,D.deltaField13,'Week 13','mean, 10th to 90th percentile','Pooled return rates: 0.92 after a week up, 0.77 after a losing week.','');
if(D.recent)h+=headline(D.recent.arms,D.recent.deltaField13,'If the recent return rate holds ('+D.recent.returnRate.toFixed(2)+')','Week 13','Every return after a pick at the Week 7 to Week 8 carryover, 26 of 28. The charts below use the pooled rates.',' recent');
/* Charts. */
const legend=`<div class="lg">${ARMS.map(a=>`<span><i class="ksw" style="background:${a.col}"></i>Arm ${a.n}</span>`).join('')}<span><i class="ksw" style="background:rgba(255,255,255,.18);height:10px"></i>10 to 90 band</span></div>`;
function chart(key,fmt,zero){const VW=343,VH=150,L=34,R=8,T=8,B=20,iw=VW-L-R,ih=VH-T-B;
 let lo=Infinity,hi=-Infinity;ARMS.forEach(a=>A[a.k].weeks.forEach(w=>{lo=Math.min(lo,w[key].p10);hi=Math.max(hi,w[key].p90)}));
 if(zero)lo=Math.min(lo,0);if(hi-lo<1e-6){hi=lo+1}const pad=(hi-lo)*.08;lo=zero?lo:lo-pad;hi=hi+pad;
 const x=i=>L+iw*i/(W.length-1),y=v=>T+ih*(1-(v-lo)/(hi-lo));
 let s=`<svg class="c" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${esc(key)} by week">`;
 for(let g=0;g<=3;g++){const v=lo+(hi-lo)*g/3,yy=y(v);s+=`<line x1="${L}" x2="${VW-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.07)"/><text x="${L-5}" y="${(yy+3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`}
 W.forEach((w,i)=>{s+=`<text x="${x(i).toFixed(1)}" y="${VH-5}" text-anchor="middle">Wk ${w}</text>`});
 ARMS.forEach(a=>{const ws=A[a.k].weeks;const up=ws.map((w,i)=>`${x(i).toFixed(1)},${y(w[key].p90).toFixed(1)}`),dn=ws.map((w,i)=>`${x(i).toFixed(1)},${y(w[key].p10).toFixed(1)}`).reverse();s+=`<polygon points="${up.concat(dn).join(' ')}" fill="${a.col}" fill-opacity="${a.k==='assumed'?.16:.09}"/>`});
 ARMS.forEach(a=>{const ws=A[a.k].weeks;s+=`<polyline points="${ws.map((w,i)=>`${x(i).toFixed(1)},${y(w[key].mean).toFixed(1)}`).join(' ')}" fill="none" stroke="${a.col}" stroke-width="${a.k==='assumed'?2.4:1.8}" ${a.dash?`stroke-dasharray="${a.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;ws.forEach((w,i)=>{s+=`<circle cx="${x(i).toFixed(1)}" cy="${y(w[key].mean).toFixed(1)}" r="2.4" fill="${a.col}"/>`})});
 return s+'</svg>'}
const last=k=>A[k].weeks[A[k].weeks.length-1];
const CH=[
 ['field','Field size','Players entered each week (about 97% make a pick). Rungs at 40, 75, 125, 200.',v=>n0(v),false,v=>n1(v)],
 ['newPlayers','New players','New signups and invitees entering the Field each week.',v=>n0(v),true,v=>n1(v)],
 ['retention','Retention','Share of last week’s Field back with a pick this week.',v=>Math.round(v*100)+'%',false,v=>pct(v)],
 ['multiplier','Average Prize Multiplier','Across the Field: referral multiplier plus Contest Boost, capped at 3x.',v=>v.toFixed(2)+'x',false,v=>v.toFixed(3)+'x'],
 ['touched','Share of the Field in a contest','Players in with a pick who are members of a contest that week.',v=>Math.round(v*100)+'%',true,v=>pct(v)],
 ['confirmedReferrals','Confirmed referrals','Referred signups entering the Field whose link both players confirmed. Arm a counts every referral link, as the shared baseline does.',v=>v.toFixed(1),true,v=>v.toFixed(2)],
];
h+=`<div class="k-sec"><h2>By week <span>mean line, 10 to 90 band</span></h2>${legend}${CH.map(([k,t,p,f,z,g])=>`<div class="ch"><h3>${esc(t)}</h3><p>${esc(p)} Week 13: ${ARMS.map(a=>`${a.n} ${g(last(a.k)[k].mean)}`).join(' · ')}</p>${chart(k,f,z)}</div>`).join('')}
<p class="k-hint"><b style="color:var(--k-fg)">A referral counts only when both players confirmed the link.</b> The same goes for joining a contest: the Contest Boost counts confirmed members only.</p><p class="k-hint">Arm b sits on the baseline line for Field, new players and retention: with cohort numbers only, contest invites are the invites the cohort already sends. It moves the Prize Multiplier and the share in a contest.</p></div>`;
/* Prize rung row per week. */
h+=`<div class="k-sec"><h2>Prize rung reached <span>median rung, mean index</span></h2><table class="tb"><thead><tr><th>Arm</th>${W.map(w=>`<th>Wk ${w}</th>`).join('')}</tr></thead><tbody>${ARMS.map(a=>`<tr class="${a.k==='assumed'?'on':''}"><td><b>Arm ${a.n}</b><small>${a.k==='baseline'?'No Contests':a.k==='cohort'?'Cohort only':'Assumptions'}</small></td>${A[a.k].weeks.map(w=>`<td><b>${esc(w.rung.median===0?'Under 40':w.rung.label)}</b><small>${w.rung.mean.toFixed(2)} · ${Math.round((1-w.rung.dist[0])*100)}% at 40+</small></td>`).join('')}</tr>`).join('')}</tbody></table>
<p class="k-hint">Rung index 0 is under 40 in the Field, 1 is 40 in, 2 is 75 in, 3 is 125 in, 4 is 200 in. "% at 40+" is the share of runs at the 40 rung or higher.</p></div>`;
/* Assumptions. */
const fv=(id,v)=>id==='A4'?'+'+v.toFixed(2):(id==='A1'||id==='A5')?pct(v):v.toFixed(2)+'x';
h+=`<div class="k-sec"><h2>Named assumptions <span>arm c value, arm b value</span></h2><div class="as">${D.assumptions.map(a=>`<div><span class="val">${fv(a.id,a.value)}</span><b>${esc(a.id)} ${esc(a.name)}</b><small>${esc(a.why)}</small><em>${esc(a.unit)}. Arm b: ${fv(a.id,a.armB)}.</em></div>`).join('')}</div>
<p class="k-hint">Each one switched off in arm c, Week 13 Field (gain over baseline): ${D.ablations.map(x=>`${esc(x.label.replace('Arm c without ','no '))} ${n1(x.field13.mean)} (+${n1(x.deltaField13.mean)})`).join(', ')}.</p>
<p class="k-hint">A5 at 1.0 and 0.75, Week 13 Field (gain over baseline), confirmed referrals a week: ${(D.a5Sensitivity||[]).map(x=>`${esc(x.label)}: ${n1(x.field13.mean)} (+${n1(x.deltaField13.mean)}), ${x.confirmedReferralsPerWeek}`).join('; ')}.</p></div>`;
/* Mechanism. */
h+=`<div class="k-sec"><h2>How Contests run in the sim</h2><ul class="k-l">${D.meta.mechanism.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`;
/* Cohort and method. */
const c=D.cohort,src=D.meta.cohortSource;
const s8=c.start||{};
const KV=[['Week 8 Field',(s8.won+s8.lost+s8.no_pick)+' ('+s8.won+' up, '+s8.lost+' down, '+s8.no_pick+' no pick)'],['Accounts outside the Field',s8.outside],['New signups a week',c.new_signups_per_week+' ('+D.meta.organicSignupsPerWeek+' without referrals)'],['Referral signups per entrant a week',c.referral_per_entrant_week],['New signups entering',pct(c.new_enters)],['First pick, new signups',pct(c.first_pick_rate)],['First pick, referred',pct(c.referral_first_pick_rate)],['Back after a week up',pct(c.return_after_win)],['Back after a losing week',pct(c.return_after_loss)],['Back after no pick',pct(c.return_after_no_pick)],['Reactivation, absent accounts',pct(c.reactivation)],['Weeks finished up',pct(c.win_share)],['Referral senders share',pct(c.referral_senders_share)],['Reload use, Week 8',pct(c.reload_use)],['Lounge posters',pct(c.lounge_active_share)],['Picks per entrant',c.picks_per_entrant]];
h+=`<div class="k-sec"><h2>Cohort and method</h2><div class="kv">${KV.map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join('')}</div>
<p class="k-hint"><b style="color:var(--k-fg)">Cohort source:</b> ${src==='placeholder'?'placeholder numbers, waiting on the Week 8 cohort file':esc(src)+(D.meta.cohortRead?' (read '+esc(D.meta.cohortRead)+')':'')}. Reload use, Lounge posters and picks per entrant are carried for reference and do not drive the model.</p>
<p class="k-hint"><b style="color:var(--k-fg)">Runs:</b> ${D.meta.runs.toLocaleString('en-US')} per arm, player by player, in ${(D.meta.runtimeMs/1000).toFixed(1)} s.</p>
<p class="k-hint"><b style="color:var(--k-fg)">Seed scheme:</b> ${esc(D.meta.seedScheme)}</p></div>`;
$('k-main').innerHTML=h;
})();
</script>
</body>
</html>
