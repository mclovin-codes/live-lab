<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush Profile</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Your profile: the top bar's avatar and Stack both land here. Stack first, then the week, the season, and your Slips. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:rgba(255,255,255,.08);--fg:#fff;--mut:#A9B6C3;--acc:#00BFFF;--win:#22C55E;--loss:#F05252;--warn:#F5A524;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 16px;border-radius:22px;background:radial-gradient(120% 90% at 50% 0%,#17324A,#121A23 70%);border:1px solid rgba(0,191,255,.25)}
.hero h1{margin:10px 0 2px;font:800 26px/1.1 var(--font)}.hero .sub2{color:var(--mut);font-size:14px}
.big{margin-top:14px;font:900 52px/1 var(--font);letter-spacing:-.03em}.big small{display:block;font:700 12px/1 var(--font);letter-spacing:.12em;color:#7FDBFF;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.chip{padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.07);font:700 13px var(--font)}.chip.g{background:rgba(34,197,94,.16);color:var(--win)}.chip.r{background:rgba(240,82,82,.16);color:var(--loss)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.tiles a,.tiles div{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;color:inherit;text-decoration:none}.tiles b{display:block;font:800 24px/1.1 var(--font)}.tiles small{color:var(--mut);font-size:12px}
.sec{margin-top:24px}.sec h2{margin:0 0 10px;font:800 20px/1.2 var(--font);display:flex;justify-content:space-between;align-items:baseline}.sec h2 span{font:600 13px var(--font);color:var(--mut)}
.weeks{display:flex;gap:6px;flex-wrap:wrap}.wk{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 13px var(--font);background:var(--card2);color:var(--mut)}.wk.W{background:var(--win);color:#04130A}.wk.L{background:rgba(240,82,82,.22);color:var(--loss)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;border-radius:12px;background:var(--card2);margin-bottom:10px}.seg button{border:0;background:none;color:var(--mut);font:700 14px var(--font);padding:9px;border-radius:9px;cursor:pointer}.seg button.on{background:#2A3644;color:var(--fg)}
.card{background:var(--card);border-radius:16px;padding:4px 14px}
.pk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.pk:first-child{border-top:0}
.pk b{display:block;font-size:15px}.pk small{color:var(--mut);font-size:13px}.pk .amt{text-align:right;font-weight:800}.pk .amt i{display:block;font-style:normal;font-size:12px;font-weight:700}
.won{color:var(--win)}.lost{color:var(--loss)}.empty{padding:16px 0;color:var(--mut);font-size:14px}
.btn{display:block;text-align:center;border-radius:14px;padding:13px;font:800 15px var(--font);background:var(--acc);color:#04121C;text-decoration:none;margin-top:12px;border:0;width:100%;cursor:pointer}.btn.ghost{background:var(--card2);color:var(--fg)}
</style>
</head>
<body data-tab="me">
<div class="wrap">
 <div class="hero" id="hero"></div>
 <div class="tiles" id="tiles"></div>
 <div class="sec"><h2>Season <span id="seasonSub"></span></h2><div class="weeks" id="weeks"></div></div>
 <div class="sec" id="slips"><h2>Slips <span id="slipSub"></span></h2>
  <div class="seg"><button class="on" data-s="open">Open</button><button data-s="done">Settled</button></div>
  <div class="card" id="pk"></div>
  <a class="btn" href="board.html">Make a pick on the Board</a>
 </div>
</div>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="contest-kit.js"></script>
<script src="shared/nav.js"></script>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');let tab='open';
function render(){
 const me=Rush.me(),w=Rush.week(),s=Rush.season(),op=Rush.rival(),f=Rush.field(),mine=f.find(r=>r.me);
 const total=1000+Math.round((me.units||0)*10),d=total-1000;
 $('hero').innerHTML=`${Rush.avatar?Rush.avatar(me.handle,84):''}<h1>${esc(me.handle)}</h1><div class="sub2">${w.label}, #${me.rank||'-'} of ${me.of||f.length} in the Field</div>
  <div class="big">${fmt(total)}<small>STACK</small></div>
  <div class="chips"><span class="chip ${d>=0?'g':'r'}">${d>=0?'+':'-'}${fmt(Math.abs(d))} this week</span><span class="chip">${fmt(me.stack)} free to pick</span><span class="chip">${me.reloaded?'Reload used':Rush.canReload&&Rush.canReload()?'Reload ready':'Reload after a bust'}</span></div>`;
 let mu='-';if(op&&mine){const dd=mine.units-op.units;mu=dd>0?'Up':dd<0?'Down':'Even'}
 $('tiles').innerHTML=`<div><b>${s.w}-${s.l}</b><small>Season</small></div><a href="matchup.html"><b>${mu}</b><small>${op?'vs '+esc(op.name):'Matchup'}</small></a><a href="ranks.html"><b>#${me.rank||'-'}</b><small>Ranks</small></a>`;
 $('seasonSub').textContent='green weeks count as wins';
 $('weeks').innerHTML=(s.weeks.length?s.weeks:[{n:w.n,result:'-'}]).map(x=>`<span class="wk ${x.result}" title="Week ${x.n}">${x.result==='-'?x.n:x.result}</span>`).join('');
 const all=Rush.picks({week:w.id}),open=all.filter(p=>p.status==='open'),done=all.filter(p=>p.status!=='open');
 $('slipSub').textContent=open.length+' open, '+done.length+' settled';
 const L=tab==='open'?open:done;
 $('pk').innerHTML=L.length?L.map(p=>{const res=p.status==='won'?'won':p.status==='lost'?'lost':'';return `<div class="pk"><div><b>${esc(p.label)}</b><small>${esc(p.game||(p.legs?p.legs.length+'-leg parlay':''))}</small></div><span class="amt ${res}">${fmt(p.stake)}<i>${p.status==='open'?'to return '+fmt(p.stake+p.win):p.status==='won'?'+'+fmt(p.win):p.status==='lost'?'-'+fmt(p.stake):esc(p.status)}</i></span></div>`}).join(''):`<div class="empty">${tab==='open'?'No open picks yet this week.':'Nothing settled yet this week.'}</div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;tab=b.dataset.s;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));render()});
render();if(Rush.on)Rush.on(render);
</script>
</body>
</html>
