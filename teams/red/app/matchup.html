<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush Matchup</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Matchup: your week as a 1v1. Two Stacks, one bar, their Slip sealed until kickoff, your challenges and record. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:rgba(255,255,255,.08);--fg:#fff;--mut:#A9B6C3;--acc:#00BFFF;--win:#22C55E;--loss:#F05252;--warn:#F5A524;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{margin:4px 0 2px;font:800 30px/1.1 var(--font);letter-spacing:-.02em}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.vs{position:relative;background:linear-gradient(160deg,#16283A,#121A23 60%);border-radius:20px;padding:18px 16px 16px;border:1px solid rgba(0,191,255,.25);overflow:hidden}
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-decoration:none;color:inherit}
.side b{font-size:15px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .stk{font:800 30px/1 var(--font);letter-spacing:-.02em}.side small{color:var(--mut);font-size:12px}
.vsx{font:900 18px/1 var(--font);color:var(--mut);padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.06)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:16px 0 10px;background:var(--card2)}.bar i{display:block;height:100%;transition:width .6s}
.verdict{text-align:center;font:800 18px/1.2 var(--font)}.verdict.up{color:var(--win)}.verdict.down{color:var(--loss)}.verdict.even{color:var(--mut)}
.clock{display:flex;justify-content:center;gap:8px;margin-top:12px;color:var(--mut);font-size:13px}.clock b{color:var(--fg)}
.sec{margin-top:22px}.sec h2{margin:0 0 10px;font:800 20px/1.2 var(--font);display:flex;justify-content:space-between;align-items:baseline}.sec h2 span{font:600 13px var(--font);color:var(--mut)}
.card{background:var(--card);border-radius:16px;padding:6px 14px}
.pk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.pk:first-child{border-top:0}
.pk b{display:block;font-size:15px}.pk small{color:var(--mut);font-size:13px}.pk .amt{font-weight:800;text-align:right}
.lock{display:flex;align-items:center;gap:10px}.lock svg{width:22px;height:22px;stroke:var(--warn);fill:none;stroke-width:2;flex:none}
.empty{padding:16px 0;color:var(--mut);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font:700 14px var(--font);background:var(--acc);color:#04121C;cursor:pointer;text-decoration:none}
.btn.ghost{background:var(--card2);color:var(--fg)}.btn.sent{background:rgba(34,197,94,.16);color:var(--win)}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.pl:first-child{border-top:0}
.pl a{color:inherit;text-decoration:none;min-width:0}.pl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl small{color:var(--mut);font-size:13px}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rec div{background:var(--card);border-radius:14px;padding:12px;text-align:center}.rec b{display:block;font:800 24px/1.1 var(--font)}.rec small{color:var(--mut);font-size:12px}
.cta{display:block;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
 <h1 id="t">Matchup</h1>
 <p class="sub" id="st"></p>
 <div class="vs" id="vs"></div>
 <div class="sec"><h2>Their Slip <span id="theirN"></span></h2><div class="card" id="theirs"></div></div>
 <div class="sec"><h2>Your Slip <span id="mineN"></span></h2><div class="card" id="mine"></div><a class="btn cta" href="board.html">Add a pick on the Board</a></div>
 <div class="sec"><h2>Season record <span>matchups and green weeks</span></h2><div class="rec" id="rec"></div></div>
 <div class="sec"><h2>Challenge a player <span>keeps its own record</span></h2><div class="card" id="ch"></div></div>
</div>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="contest-kit.js"></script>
<script src="shared/nav.js"></script>
<script>
const $=id=>document.getElementById(id),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US'),stackOf=r=>1000+Math.round((r&&r.units||0)*10);
const av=(n,s)=>Rush.avatar?Rush.avatar(n,s):'';
const CK='rush-challenges-v1',chs=()=>{try{return JSON.parse(localStorage.getItem(CK))||{}}catch(e){return{}}},saveCh=o=>{try{localStorage.setItem(CK,JSON.stringify(o))}catch(e){}};
const h32=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
/* Thursday 7:00 PM ET auto pairing for the week */
function pairAt(){const w=Rush.week(),o=new Date(w.opens);return w.opens+2*864e5+19*36e5}
function render(){
 const w=Rush.week(),me=Rush.me(),f=Rush.field(),mine=f.find(r=>r.me)||{units:0,name:me.handle},op=Rush.rival();
 $('t').textContent=w.label+' matchup';
 const paired=Date.now()>=pairAt();
 $('st').textContent=paired?'Higher Stack on Monday night takes it.':'Pairs Thursday 7:00 PM. Your likely opponent is below.';
 const a=stackOf(mine),b=op?stackOf(op):1000,tot=Math.max(1,a+b),d=a-b;
 const cls=d>0?'up':d<0?'down':'even',txt=d>0?'You lead by '+fmt(d):d<0?'Down '+fmt(-d):'All square';
 $('vs').innerHTML=`<div class="vs-row"><a class="side" href="me.html">${av(me.handle,64)}<b>${esc(me.handle)}</b><span class="stk">${fmt(a)}</span><small>#${me.rank||'-'} in the Field</small></a><span class="vsx">VS</span>${op?`<a class="side" href="player.html?u=${encodeURIComponent(op.id)}">${av(op.name,64)}<b>${esc(op.name)}</b><span class="stk">${fmt(b)}</span><small>#${op.rank} in the Field</small></a>`:`<div class="side"><b>Need one more person in this week.</b><a class="btn" href="#ch">Challenge a player</a></div>`}</div>
 <div class="bar"><i style="width:${a/tot*100}%;background:var(--acc)"></i><i style="width:${b/tot*100}%;background:#E879F9"></i></div>
 <div class="verdict ${cls}">${txt}</div>
 <div class="clock">${paired?`Week ends <b>${Rush.clock(w.settles-Date.now())}</b>`:`Pairing in <b>${Rush.clock(pairAt()-Date.now())}</b>`}</div>`;
 /* their Slip: sealed until each game kicks off (stand-in picks for the simulated Field) */
 const games=(window.RW&&RW.cached&&RW.cached())||[],up=games.filter(g=>g.state!=='post').sort((x,y)=>new Date(x.date)-new Date(y.date));
 const n=op?2+h32(op.id+w.id)%3:0;
 $('theirN').textContent=n?n+' picks':'';
 $('theirs').innerHTML=!op?'<div class="empty">No opponent yet.</div>':Array.from({length:n},(_,i)=>{const g=up[(h32(op.id+i)%Math.max(1,up.length))];const k=g?new Date(g.date):null,live=g&&g.state==='in';return `<div class="pk"><div class="lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><div><b>${g?esc(g.shortName||g.name||'Game'):'A game this week'}</b><small>${live?'Revealed at kickoff: open the game':k?'Hidden until kickoff, '+Rush.clock(k-Date.now()):'Hidden until kickoff'}</small></div></div><span class="amt">${fmt(50+h32(op.id+'s'+i)%4*50)}</span></div>`}).join('');
 const mp=Rush.picks({status:'open',week:w.id});
 $('mineN').textContent=mp.length?mp.length+' open':'';
 $('mine').innerHTML=mp.length?mp.slice(0,6).map(p=>`<div class="pk"><div><b>${esc(p.label)}</b><small>${esc(p.game||'Parlay')}</small></div><span class="amt">${fmt(p.stake)}</span></div>`).join(''):'<div class="empty">No open picks. Your opponent sees your Slip only after kickoff too.</div>';
 const s=Rush.season(),c=chs(),cw=Object.values(c).filter(x=>x.r==='W').length,cl=Object.values(c).filter(x=>x.r==='L').length;
 $('rec').innerHTML=`<div><b>${s.w}-${s.l}</b><small>Season</small></div><div><b>${s.weeks.filter(x=>x.result==='W').length}</b><small>Green weeks</small></div><div><b>${cw}-${cl}</b><small>Challenges</small></div>`;
 const others=f.filter(r=>!r.me&&(!op||r.id!==op.id)).slice(0,8);
 $('ch').id='ch';$('ch').innerHTML=others.map(r=>{const sent=c[r.id];return `<div class="pl">${av(r.name,40)}<a href="player.html?u=${encodeURIComponent(r.id)}"><b>${esc(r.name)}</b><small>${fmt(stackOf(r))} Stack, #${r.rank}</small></a>${sent?'<span class="btn sent">Sent</span>':`<button class="btn ghost" data-ch="${esc(r.id)}">Challenge</button>`}</div>`}).join('');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ch]');if(!b)return;const c=chs();c[b.dataset.ch]={at:Date.now(),week:Rush.week().id,r:'-'};saveCh(c);render()});
render();setInterval(render,30000);
if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});
</script>
</body>
</html>
