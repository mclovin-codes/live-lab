<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush · Reads</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Reads: one space for the whole Field. Every sealed pick is a question: which side did they take? You answer in one tap
   before kickoff, the kickoff reveal scores you, the final settles the pick. Your Read record and how readable you are
   sit on your profile. ?field=7 shows exactly 7 players and nothing generated. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:rgba(255,255,255,.08);--fg:#fff;--mut:#A9B6C3;--dim:#6F7F90;--acc:#00BFFF;--win:#22C55E;--loss:#F05252;--warn:#F5A524;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:620px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{margin:2px 0 2px;font:900 32px/1.05 var(--f);letter-spacing:-.02em}
.lede{color:var(--mut);font-size:15px;margin:0 0 14px}
.rec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.rec a,.rec div{background:var(--card);border-radius:16px;padding:12px 8px;text-align:center}
.rec b{display:block;font:900 28px/1.05 var(--f)}.rec small{color:var(--mut);font-size:12px;font-weight:600}
.rec .hot{background:linear-gradient(160deg,#13314A,#121A23 70%);box-shadow:inset 0 0 0 1px rgba(0,191,255,.45)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}.sh h2{margin:0;font:900 20px var(--f)}.sh span{color:var(--mut);font:700 13px var(--f)}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;border:1px solid transparent}
.card.rival{border-color:rgba(232,121,249,.55);background:linear-gradient(160deg,#2A1838,#121A23 60%)}
.who{display:flex;align-items:center;gap:10px}.who .av{flex:none}.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;color:var(--mut);font-size:13px}
.who .meta{min-width:0;flex:1}.who .stk{flex:none;text-align:right}.who .stk b{font:900 18px var(--f)}.who .stk small{font-size:11px}
.game{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 10px;padding:10px 12px;border-radius:14px;background:var(--card2)}
.game b{display:block;font:800 17px var(--f)}.game small{display:block;color:var(--mut);font:700 12px var(--f)}.game .lock{font-size:15px}.game .t{text-align:right}
.q{font:800 15px var(--f);margin:0 0 8px}.q i{font-style:normal;color:var(--warn)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{min-height:56px;border-radius:14px;background:#22303E;font:900 20px var(--f);letter-spacing:.01em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);transition:transform .12s}
.opt:active{transform:scale(.96)}.opt.on{background:var(--acc);color:#04121C;box-shadow:none}.opt.off{opacity:.45}
.note{margin-top:10px;color:var(--mut);font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lock{display:inline-flex;align-items:center;gap:6px;color:var(--warn);font-weight:800}.lock svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.tally{display:flex;align-items:center;gap:6px}.tally .av{width:22px!important;height:22px!important;font-size:9px!important;margin-left:-7px;box-shadow:0 0 0 2px var(--card)}.tally .av:first-child{margin-left:0}
.rev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.flip{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;background:var(--card2);font:900 18px var(--f)}.flip small{font:800 10px var(--f);color:var(--mut);letter-spacing:.08em}
.verd{font:900 15px var(--f);padding:6px 10px;border-radius:10px;white-space:nowrap}.verd.r{background:rgba(34,197,94,.16);color:var(--win)}.verd.m{background:rgba(240,82,82,.16);color:var(--loss)}.verd.n{background:var(--card2);color:var(--mut)}
.rev .meta b{display:block;font-size:15px}.rev .meta small{color:var(--mut);font-size:13px}
.mine{background:var(--card);border-radius:20px;padding:14px}
.mine .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.mine .row:first-child{border-top:0}.mine .row b{font-size:15px}.mine .row small{display:block;color:var(--mut);font-size:13px}
.empty{color:var(--mut);font-size:14px;padding:6px 2px}
.cta{display:block;text-align:center;margin-top:10px;padding:13px;border-radius:14px;background:var(--acc);color:#04121C;font:900 15px var(--f)}
.foot{margin-top:26px;padding:14px;border-radius:16px;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px}
.foot b{display:block;font-size:14px}.foot small{color:var(--mut);font-size:12px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#2A3644;flex:none}.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--win)}.sw.on i{left:23px}
.pop{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:none}}
.ro{margin:14px 0 4px;padding:14px;border-radius:20px;background:linear-gradient(160deg,#2A1838,#13202C 70%);border:1px solid rgba(232,121,249,.5)}.ro-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.ro-h span{font:900 13px var(--f);letter-spacing:.1em;color:#E879F9}.ro-h small{color:var(--mut);font-size:12px}.ro-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.ro-row a{display:flex;flex-direction:column;align-items:center;gap:2px}.ro-row b{font:900 34px/1 var(--f)}.ro-row small{color:var(--mut);font-size:12px}.ro-vs{font:900 14px var(--f);color:var(--mut)}.ro-f{margin-top:10px;text-align:center;font-size:14px;color:#D7DEE6}
</style>
</head>
<body data-tab="lounge">
<div class="wrap" id="main"></div>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="shared/nav.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US'),av=(n,s)=>Rush.avatar?Rush.avatar(n,s):'';
const h01=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};
const KEY='rush-reads-v1',load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}},save=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
/* the honest view: ?field=7 (or the footer switch) loads exactly 7 players and nothing generated */
const Q=new URLSearchParams(location.search);
let honest=Q.get('field')==='7'||(Q.get('field')==null&&(()=>{try{return localStorage.getItem('rush-field7')==='1'}catch(e){return false}})());
const START={nfl:'kickoff',nba:'tip-off',nhl:'puck drop'};
const LOCK='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const when=ms=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date(ms));
let games=RW.cached()||[];

/* who is in the space: the whole Field, or exactly 7 (you, your matchup opponent and five more) */
function players(){const f=Rush.field(),me=f.find(r=>r.me),riv=Rush.rival&&Rush.rival(),others=f.filter(r=>!r.me);
 if(!honest)return{me,riv,list:others};
 const pick=[riv,...others.filter(r=>!riv||r.id!==riv.id).sort((a,b)=>a.name.localeCompare(b.name))].filter(Boolean).slice(0,6);
 return{me,riv,list:pick}}
/* a sealed pick becomes a two-sided question; props and anything without two clear sides are skipped */
function sides(p){const g=p.g;if(!g||!g.away||!g.home)return null;const L=String(p.label||''),a=g.away.abbr,h=g.home.abbr;
 if(/^over\b/i.test(L))return{opts:['Over','Under'],truth:'Over',ask:'Over or under?'};if(/^under\b/i.test(L))return{opts:['Over','Under'],truth:'Under',ask:'Over or under?'};
 if(L.startsWith(a+' '))return{opts:[a,h],truth:a,ask:'Which side?'};if(L.startsWith(h+' '))return{opts:[a,h],truth:h,ask:'Which side?'};return null}
const pkey=(pid,p)=>pid+':'+p.gameId+':'+p.market;
function cards(){const{me,riv,list}=players(),R=load(),out=[];
 list.forEach(r=>{(RW.playerPicks(r.id,games)||[]).forEach(p=>{const s=sides(p);if(!s)return;out.push({r,p,s,k:pkey(r.id,p),kick:p.g?+new Date(p.g.date):0,started:p.g&&p.g.state!=='pre',rival:riv&&r.id===riv.id,mine:R[pkey(r.id,p)]})})});
 return out}
/* stand-in reads from the rest of the Field: only in the busy view, never in ?field=7 */
function crowd(c){if(honest)return[];const{list}=players(),n=Math.floor(h01(c.k+'n')*6);return list.filter(r=>r.id!==c.r.id).sort((a,b)=>h01(c.k+a.id)-h01(c.k+b.id)).slice(0,n).map(r=>({r,side:h01(c.k+r.id+'s')<.6?c.s.truth:c.s.opts.find(o=>o!==c.s.truth)}))}

function sealedCard(c){const g=c.p.g,cw=crowd(c),side=c.mine&&c.mine.side;
 const tally=cw.length?`<span class="tally">${cw.slice(0,4).map(x=>av(x.r.name,22)).join('')} ${cw.length} read it</span>`:`<span>${honest?'No reads yet':'Be the first to read it'}</span>`;
 return`<div class="card${c.rival?' rival':''}" id="c-${esc(c.k).replace(/[^a-z0-9]/gi,'')}"><a class="who" href="player.html?u=${encodeURIComponent(c.r.id)}">${av(c.r.name,40)}<span class="meta"><b>${esc(c.r.name)}</b><small>${c.rival?'<span style="color:#E879F9;font-weight:800">Your matchup</span> &middot; ':''}#${c.r.rank} in the Field</small></span><span class="stk"><b>${fmt(c.p.stake)}</b><small>Stack sealed</small></span></a>
 <div class="game"><div><b>${esc(g.away.abbr)} at ${esc(g.home.abbr)}</b><small>${esc((c.p.league||'').toUpperCase())} &middot; ${esc(c.p.market)}</small></div><div class="t"><span class="lock">${LOCK}${Rush.clock(c.kick-Date.now())}</span><small>until ${START[c.p.league]||'kickoff'}</small></div></div>
 <div class="q">${esc(c.s.ask)} <i>${side?'Your read is in':'Tap to read'}</i></div>
 <div class="opts">${c.s.opts.map(o=>`<button class="opt${side?side===o?' on':' off':''}" data-read="${esc(c.k)}" data-side="${esc(o)}">${esc(o)}</button>`).join('')}</div>
 <div class="note">${tally}<span>${side?'Change until '+(START[c.p.league]||'kickoff'):'Reveals at '+(START[c.p.league]||'kickoff')}</span></div></div>`}
function revealCard(c){const side=c.mine&&c.mine.side,res=c.p.status==='won'?'Hit':c.p.status==='lost'?'Missed':c.p.status==='push'?'Push':'Live';
 const v=!side?'<span class="verd n">Not read</span>':side===c.s.truth?'<span class="verd r">You read it</span>':'<span class="verd m">Misread</span>';
 return`<div class="card${c.rival?' rival':''}"><div class="rev"><a href="player.html?u=${encodeURIComponent(c.r.id)}">${av(c.r.name,44)}</a><div class="meta"><b>${esc(c.r.name)} took ${esc(c.s.truth)}</b><small>${esc(c.p.g.away.abbr)} at ${esc(c.p.g.home.abbr)} &middot; ${esc(c.p.label)} &middot; pick ${res}</small></div>${v}</div></div>`}

function render(){const all=cards(),{me,riv}=players(),now=Date.now();
 const sealed=all.filter(c=>!c.started&&c.kick>now).sort((a,b)=>(b.rival-a.rival)||(a.kick-b.kick)),revealed=all.filter(c=>c.started&&(now-c.kick)<36*36e5).sort((a,b)=>b.kick-a.kick);
 /* keep the stream short: a few per player, soonest first */
 const per={},shown=sealed.filter(c=>{per[c.r.id]=(per[c.r.id]||0)+1;return per[c.r.id]<=(c.rival?4:2)}).slice(0,honest?14:16);
 const R=load(),mineR=Object.values(R),done=mineR.filter(x=>x.kick<=now),right=done.filter(x=>x.side===x.truth).length;
 const myPicks=Rush.picks({status:'open',week:Rush.week().id}).filter(p=>p.gameId);
 let h=`<h1>Reads</h1><p class="lede">Every pick is sealed until kickoff. Read the side. Kickoff scores you.</p>`;
 h+=`<div class="rec"><a class="hot" href="me.html#reads"><b>${done.length?right+'/'+done.length:'0'}</b><small>${done.length?'Read right':'Reads scored'}</small></a><div><b>${mineR.length-done.length}</b><small>Waiting on kickoff</small></div><div><b>${sealed.length}</b><small>Sealed to read</small></div></div>`;
 if(riv){const rc=all.filter(c=>c.rival),rs=rc.filter(c=>!c.started&&c.kick>now),myOn=mineR.filter(x=>x.pid===riv.id&&x.kick<=now),meR=myOn.filter(x=>x.side===x.truth).length;
  const mine2=Rush.picks({week:Rush.week().id}).filter(p=>p.gameId),theirOn=honest?[]:mine2.filter(p=>h01('rv'+p.id)<.5),theirR=theirOn.filter(p=>h01('rr'+p.id)<.5).length;
  h+=`<div class="ro"><div class="ro-h"><span>READ-OFF</span><small>Who reads the other better this week</small></div><div class="ro-row"><a href="me.html">${av(me?me.name:'You',48)}<b>${meR}</b><small>you read right</small></a><span class="ro-vs">vs</span><a href="player.html?u=${encodeURIComponent(riv.id)}">${av(riv.name,48)}<b>${theirR}</b><small>${esc(riv.name.split(' ')[0])} read right</small></a></div><div class="ro-f">${rs.length?`${esc(riv.name.split(' ')[0])} has <b>${rs.length}</b> sealed ${rs.length===1?'pick':'picks'} you can read now`:`${esc(riv.name.split(' ')[0])} has nothing sealed right now`}${honest?` &middot; ${esc(riv.name.split(' ')[0])} has not read you yet`:''}</div></div>`}
 if(revealed.some(c=>c.mine))h+=`<div class="sh"><h2>Just revealed</h2><span>your reads, scored</span></div>`+revealed.filter(c=>c.mine).slice(0,6).map(revealCard).join('');
 h+=`<div class="sh"><h2>Sealed now</h2><span>${honest?'7 players':'the Field'}</span></div>`;
 h+=shown.length?shown.map(sealedCard).join(''):`<div class="empty">No sealed picks right now. New ones land as the Field picks.</div>`;
 /* your own sealed picks: who is reading you */
 h+=`<div class="sh"><h2>Reading you</h2><span>${myPicks.length} sealed</span></div><div class="mine">${myPicks.length?myPicks.slice(0,6).map(p=>{const n=honest?0:Math.floor(h01('me'+p.id)*5);return`<div class="row"><div><b>${esc(p.label)}</b><small>${esc(p.game||'')}</small></div><span>${n?n+' read you':'No reads yet'}</span></div>`}).join(''):`<div class="empty">Make a pick and the Field gets something of yours to read before kickoff.</div><a class="cta" href="board.html">Make a pick on the Board</a>`}</div>`;
 if(revealed.some(c=>!c.mine))h+=`<div class="sh"><h2>Revealed</h2><span>picks you did not read</span></div>`+revealed.filter(c=>!c.mine).slice(0,4).map(revealCard).join('');
 h+=`<div class="foot"><div><b>Honest view: 7 players</b><small>${honest?'Exactly 7 players. Nothing generated.':'Off: the full stand-in Field with stand-in reads.'}</small></div><button class="sw${honest?' on':''}" id="hv" aria-label="Honest view"><i></i></button></div>`;
 $('main').innerHTML=h}

document.addEventListener('click',e=>{const b=e.target.closest('[data-read]');
 if(b){const k=b.dataset.read,side=b.dataset.side,c=cards().find(x=>x.k===k);if(!c||c.started||c.kick<=Date.now())return;const R=load();
  if(R[k]&&R[k].side===side)delete R[k];else R[k]={side,truth:c.s.truth,kick:c.kick,who:c.r.name,pid:c.r.id,game:c.p.g.away.abbr+' at '+c.p.g.home.abbr,label:c.p.label,at:Date.now()};
  save(R);render();const el=document.getElementById('c-'+k.replace(/[^a-z0-9]/gi,''));if(el)el.classList.add('pop');return}
 if(e.target.closest('#hv')){honest=!honest;try{localStorage.setItem('rush-field7',honest?'1':'0')}catch(x){}history.replaceState(null,'',honest?'?field=7':'?field=all');render();scrollTo(0,0)}});
render();RW.load().then(g=>{games=g||[];render()}).catch(()=>{});setInterval(()=>{games=RW.cached()||games;render()},30000);
</script>
</body>
</html>
