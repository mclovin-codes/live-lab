<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush · Lounge</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Lounge: the Field talking across the week. A week thread and one thread per game. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:#22303D;--fg:#fff;--mute:#8C9BAD;--acc:#00BFFF;--grad:linear-gradient(135deg,#00C0FF,#0080FF);--win:#10B981;--loss:#D95151;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.g-wrap{padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 170px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.g-top{display:flex;align-items:center;gap:10px}.g-top h1{font:800 26px/1 var(--f);letter-spacing:-.03em;margin:0}.g-top small{margin-left:auto;color:var(--mute);font-size:13px}
.threads{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.threads::-webkit-scrollbar{display:none}
.th{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:9px 13px;font:600 14px var(--f);color:var(--mute);min-height:40px;white-space:nowrap}
.th.on{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--acc)}
.th img{width:18px;height:18px}.th i{width:7px;height:7px;border-radius:50%;background:var(--loss);display:inline-block}
.g-card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.g-h{display:flex;align-items:center;gap:8px;font:700 17px var(--f);margin-bottom:6px}.g-h a{margin-left:auto;font:600 13px var(--f);color:var(--acc);text-decoration:none;padding:8px 0}
.msg{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.msg:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f);color:#fff;flex:none}
.msg .t{min-width:0;flex:1}.msg .t b{font-weight:600}.msg .t small{color:var(--mute);font-size:12px;margin-left:6px}
.msg .t p{margin:2px 0 0}
.pill{display:inline-block;padding:1px 6px;border-radius:6px;font:700 10px var(--f);background:var(--card2);color:var(--mute);margin-left:4px}.pill.you{background:var(--acc);color:#00131C}
.compose{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(11,17,24,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:9}
.compose input{flex:1;min-width:0;background:var(--card2);border:0;border-radius:12px;padding:13px;color:var(--fg);font:15px var(--f)}
.compose button{background:var(--grad);color:#fff;border-radius:12px;padding:0 18px;font-weight:700;min-height:46px}
.g-note{font-size:12.5px;color:var(--mute)}
.g-plink{color:inherit;text-decoration:none;font-weight:600}
#g-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid #2C3B4A;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#g-nav a{padding:9px 0 8px;text-align:center;font:600 11px var(--f);color:#5E6E80;text-decoration:none;min-height:44px}
#g-nav a.on{color:var(--acc)}#g-nav svg{display:block;width:24px;height:24px;margin:0 auto 2px}

.sh{font:800 13px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 2px 0}
.room{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:14px;border:1px solid transparent}.room.on{border-color:rgba(240,82,82,.55);background:linear-gradient(160deg,#2A1820,#121A23 55%)}.room.mu{border-color:rgba(0,191,255,.45);background:linear-gradient(160deg,#13314A,#121A23 60%)}
.rm-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.lv{flex:none;display:inline-block;font:800 11px var(--f);letter-spacing:.08em;padding:4px 8px;border-radius:6px;background:#F05252;color:#fff}.lv.pre{background:var(--card2);color:var(--fg);letter-spacing:0}.lv.fin{background:#2A3644;color:var(--mute)}.lv.mu{background:var(--acc);color:#04121C}
.rm-n{display:flex;align-items:center;gap:6px;color:var(--mute);font:600 13px var(--f)}.rm-n .av{width:22px;height:22px;font-size:9px;margin-left:-8px;box-shadow:0 0 0 2px var(--card)}.rm-n .av:first-child{margin-left:0}
.rm-sc{display:flex;align-items:center;gap:8px}.rm-sc img{width:28px;height:28px}.rm-sc span{font:800 18px var(--f)}.rm-sc b{font:900 26px var(--f);min-width:0}.rm-sc em{flex:1;text-align:center;font:600 13px var(--f);color:var(--mute);font-style:normal}
.room.mu .rm-sc span{font:700 15px var(--f);max-width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-last{margin-top:10px;color:#C9D3DD;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm-last b{color:var(--fg)}
.back{align-self:flex-start;color:var(--acc);font:700 15px var(--f);padding:6px 0}
.board{background:linear-gradient(160deg,#16283A,#121A23 60%);border-radius:20px;padding:16px;border:1px solid rgba(0,191,255,.25)}
.bt{color:var(--mute);font:700 13px var(--f);margin-bottom:10px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bs>div{display:flex;flex-direction:column;align-items:center;gap:4px}.bs img{width:44px;height:44px}.bs span{font:700 16px var(--f)}.bs b{font:900 40px/1 var(--f)}.bs.mu .av{width:56px;height:56px;font-size:20px}.bs.mu b{font-size:30px}
.who{margin-top:14px}.wl{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.wl span{font:800 15px var(--f)}.wl small{color:var(--mute);font-size:12px}
.split{display:flex;height:30px;border-radius:10px;overflow:hidden;background:var(--card2)}.split i{display:flex;align-items:center;padding:0 10px;font:800 13px var(--f);font-style:normal;white-space:nowrap}.split i:first-child{background:#0E5E85}.split i:last-child{background:#6B2A7A;justify-content:flex-end}.split.sealed i{background:repeating-linear-gradient(135deg,#1A2530 0 8px,#202D3A 8px 16px);justify-content:center;color:var(--mute)}
.og{display:block;margin-top:14px;text-align:center;padding:12px;border-radius:12px;background:var(--card2);color:var(--acc);font:800 15px var(--f);text-decoration:none}
.rx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rxb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--card);font:700 12px var(--f);color:var(--mute)}.rxb b{font:900 20px var(--f);color:var(--fg)}.rxb.on{background:rgba(0,191,255,.16);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}.rxb:active{transform:scale(.94)}
body:not(.in-room) .compose{display:none}
.msg .t p{font-size:16px}.av{width:36px;height:36px;font-size:13px}
.rm-mine{margin-top:10px;display:inline-block;padding:6px 10px;border-radius:10px;background:rgba(0,191,255,.14);color:#7FDBFF;font:800 13px var(--f)}.rm-mine.big{display:block;margin-top:14px;font-size:15px;text-align:center}
.who{display:block!important}.who .split{width:100%}
</style>
</head>
<body>
<div class="g-wrap" id="lounge"></div>
<form class="compose" id="cf"><input id="ci" maxlength="160" placeholder="Say something to the Field" autocomplete="off"><button type="submit">Post</button></form>
<nav id="g-nav"></nav>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="contest-kit.js"></script>
<script src="shared/nav.js"></script>
<script src="gold-store.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PATHS={nfl:'football/nfl',nba:'basketball/nba',nhl:'hockey/nhl'},KEY='rush-lounge-v1';
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};
const AVC=['#0080FF','#10B981','#F59E0B','#D95151','#8B5CF6','#06B6D4','#EC4899','#64748B'];
const avatar=n=>{const ini=String(n).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return`<span class="av" style="background:${AVC[Math.floor(hash(n)*AVC.length)]}">${esc(ini)}</span>`};
let GAMES=[],thread=new URLSearchParams(location.search).get('t')||'lobby';
const mine=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const saveMine=m=>{try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){}};
const names=()=>{const n=Rush.field().filter(r=>!r.me).map(r=>r.name);return n.length?n:GS.field().filter(r=>r.sim).map(r=>r.name)};
function pickName(seed){const n=names();return n.length?n[Math.floor(hash(seed)*n.length)]:'Field player'}
const TEMPL={pre:['Who is on {fav} tonight? {line}.','{fav} feels too easy. Fading.','Locked in {dog} before the line moves.','Parlaying this with two others. Wish me luck.'],live:['{a} {as}, {h} {hs}. {det}. My Slip is sweating.','Live line on {h} looks soft right now.','Tailing whoever said under in this one.','This is why you watch every play.'],post:['{win} closes it out. My Slip says thanks.','{lose} cost me Units tonight. Next game.','Final in {a} at {h}. Called it in here first.']};
function fill(t,g){const fav=g.line?String(g.line).split(' ')[0]:g.h.ab,dog=fav===g.h.ab?g.a.ab:g.h.ab,win=+g.h.s>+g.a.s?g.h.ab:g.a.ab,lose=win===g.h.ab?g.a.ab:g.h.ab;return t.replace('{fav}',fav).replace('{dog}',dog).replace('{line}',g.line||'line posted').replace('{a}',g.a.ab).replace('{h}',g.h.ab).replace('{as}',g.a.s).replace('{hs}',g.h.s).replace('{det}',g.detail).replace('{win}',win).replace('{lose}',lose)}
function gameMsgs(g){const out=[],ts=TEMPL[g.state]||TEMPL.pre,n=g.state==='live'||g.state==='in'?5:3;for(let i=0;i<n;i++){const seed=g.id+g.state+i+(g.state==='in'?g.detail:'');out.push({who:(()=>{const N=names();return N.length?N[(Math.floor(hash(g.id+'w')*N.length)+i*5)%N.length]:'Field player'})(),txt:fill(ts[(Math.floor(hash(g.id+'t0')*ts.length)+i)%ts.length],g),at:g.state==='pre'?g.date-3600e3*(n-i):Date.now()-60e3*(n-i)})}return out}
function weekMsgs(){const f=GS.field(),top=f[0],me=f.find(r=>r.you),riv=Rush.rival&&Rush.rival(),out=[];if(top)out.push({who:top.you?'You':top.name,txt:`Top of the Field at ${Math.round(1000+top.units*10).toLocaleString('en-US')} Stack. Come get me.`,at:Date.now()-5400e3});if(riv&&me)out.push({who:riv.name,txt:me.units>=riv.units?`You are up on me this week. Monday night decides it.`:`Up ${Math.round((riv.units-me.units)*10).toLocaleString('en-US')} Stack on you this week. Your move.`,at:Date.now()-3600e3});const live=GAMES.filter(g=>g.state==='in');if(live.length)out.push({who:pickName('wk'+live[0].id),txt:`${live.length} game${live.length>1?'s':''} live right now. Board is wide open.`,at:Date.now()-600e3});out.push({who:pickName('mnf'),txt:'Entry closes at Monday night kickoff. Reload is free once a week if you run dry.',at:Date.now()-7200e3});return out}
/* One thread per contest the player is in, linking to that contest's page. */
function contestMsgs(c){const nm=GS.contests.name(c),n=GS.contests.count(c),T=[`Who else is in ${nm}? ${n?n+' in so far.':'Field is filling up.'}`,`Commissioner, are live picks on in ${nm}?`,`Top of ${nm} by Monday night. Calling it.`,`Just joined ${nm}. Taking the underdogs.`];return T.map((t,i)=>({who:pickName(c.id+'c'+i),txt:t,at:Date.now()-(4-i)*1800e3}))}
/* Phase 4: the Lounge is a set of rooms, one per game plus your matchup room. A room shows the score, who is on
   what (sealed until kickoff), one-tap reactions and the talk. Every name and avatar opens that player's profile. */
const RX=[['lock','Lock it'],['fade','Fade'],['sweat','Sweating'],['called','Called it']],RK='rush-lounge-rx-v1';
const rxMine=()=>{try{return JSON.parse(localStorage.getItem(RK))||{}}catch(e){return{}}};
const inRoom=id=>3+Math.floor(hash('room'+id+Math.floor(Date.now()/6e5))*14);
const faces=(id,n)=>{const N=names();return Array.from({length:Math.min(3,n)},(_,i)=>N.length?N[Math.floor(hash(id+'f'+i)*N.length)]:'Field').map(x=>avatar(x)).join('')};
const kick=g=>new Date(g.date).toLocaleTimeString([],{weekday:'short',hour:'numeric',minute:'2-digit'});
const myPick=g=>{try{return Rush.picks({status:'open',gameId:g.id})[0]||null}catch(e){return null}};
const plink=(name,inner)=>{const id=name==='You'?'me':GS.idOf(name);return id?`<a class="g-plink" href="player.html?u=${encodeURIComponent(id)}">${inner}</a>`:inner};
function lobby(){const me=GS.me(),riv=Rush.rival&&Rush.rival(),f=GS.field(),mr=f.find(r=>r.you);
 const live=GAMES.filter(x=>x.state==='in'),pre=GAMES.filter(x=>x.state==='pre').slice(0,10),post=GAMES.filter(x=>x.state==='post').slice(-3);
 let h=`<div class="g-top"><h1>Lounge</h1><small>${live.length?live.length+' rooms live':'Rooms open before kickoff'}</small></div>`;
 if(riv&&mr){const a=Math.round(1000+mr.units*10),b=Math.round(1000+riv.units*10);h+=`<button class="room mu" data-t="week"><div class="rm-h"><span class="lv mu">YOUR MATCHUP</span><span class="rm-n">${faces('mu',2)} 2 in the room</span></div><div class="rm-sc"><span>${esc(me.name||'You')}</span><b>${a.toLocaleString('en-US')}</b><em>vs</em><b>${b.toLocaleString('en-US')}</b><span>${esc(riv.name)}</span></div><div class="rm-last">Talk to ${esc(riv.name)} before Monday night</div></button>`}
 const card=x=>{const n=inRoom(x.id),last=gameMsgs(x).slice(-1)[0];return`<button class="room${x.state==='in'?' on':''}" data-t="${x.lg}:${esc(x.id)}"><div class="rm-h">${x.state==='in'?'<span class="lv">LIVE</span>':x.state==='post'?'<span class="lv fin">FINAL</span>':`<span class="lv pre">${esc(kick(x))}</span>`}<span class="rm-n">${faces(x.id,n)} ${n} in the room</span></div><div class="rm-sc"><img alt="" src="${esc(x.a.logo)}"><span>${esc(x.a.ab)}</span><b>${x.state==='pre'?'':esc(x.a.s)}</b><em>${x.state==='in'?esc(x.detail||''):'at'}</em><b>${x.state==='pre'?'':esc(x.h.s)}</b><span>${esc(x.h.ab)}</span><img alt="" src="${esc(x.h.logo)}"></div>${myPick(x)?`<div class="rm-mine">Your pick: ${esc(myPick(x).label)}</div>`:''}${last?`<div class="rm-last"><b>${esc(last.who)}:</b> ${esc(last.txt)}</div>`:''}</button>`};
 if(live.length)h+=`<div class="sh">Live now</div>`+live.map(card).join('');
 if(pre.length)h+=`<div class="sh">Up next</div>`+pre.map(card).join('');
 if(post.length)h+=`<div class="sh">Just finished</div>`+post.map(card).join('');
 if(!GAMES.length)h+=`<div class="g-note">Loading tonight's games.</div>`;
 return h}
function room(){const m=mine(),me=GS.me(),g=GAMES.find(x=>x.lg+':'+x.id===thread),isMu=thread==='week';
 let msgs=isMu?weekMsgs():g?gameMsgs(g):[];msgs=msgs.concat((m[thread]||[]).map(x=>({...x,you:1})));msgs.sort((a,b)=>a.at-b.at);
 let h=`<button class="back" data-t="lobby">&#8249; All rooms</button>`;
 if(g){const started=g.state!=='pre',p=Math.round(35+hash('split'+g.id)*30);
  h+=`<div class="board"><div class="bt">${g.state==='in'?'<span class="lv">LIVE</span> '+esc(g.detail||''):g.state==='post'?'<span class="lv fin">FINAL</span>':esc(kick(g))}</div><div class="bs"><div><img alt="" src="${esc(g.a.logo)}"><span>${esc(g.a.ab)}</span><b>${started?esc(g.a.s):''}</b></div><div><img alt="" src="${esc(g.h.logo)}"><span>${esc(g.h.ab)}</span><b>${started?esc(g.h.s):''}</b></div></div>
  <div class="who"><div class="wl"><span>Who is on what</span><small>${started?'Picks revealed at kickoff':'Sealed until kickoff'}</small></div>${started?`<div class="split"><i style="width:${p}%">${esc(g.a.ab)} ${p}%</i><i style="width:${100-p}%">${esc(g.h.ab)} ${100-p}%</i></div>`:`<div class="split sealed"><i style="width:100%">${inRoom(g.id)} picks sealed</i></div>`}</div>
  ${myPick(g)?`<div class="rm-mine big">Your pick: ${esc(myPick(g).label)}, ${Math.round(myPick(g).stake).toLocaleString('en-US')} Stack</div>`:''}<a class="og" href="game.html?league=${g.lg}&id=${encodeURIComponent(g.id)}">${myPick(g)?'Open the game':'Make a pick on this game'}</a></div>`}
 else if(isMu){const riv=Rush.rival&&Rush.rival(),f=GS.field(),mr=f.find(r=>r.you);if(riv&&mr){const a=Math.round(1000+mr.units*10),b=Math.round(1000+riv.units*10);h+=`<div class="board"><div class="bt">Your matchup room</div><div class="bs mu"><div>${plink('You',avatar(me.name||'You'))}<span>${esc(me.name||'You')}</span><b>${a.toLocaleString('en-US')}</b></div><div>${plink(riv.name,avatar(riv.name))}<span>${esc(riv.name)}</span><b>${b.toLocaleString('en-US')}</b></div></div><a class="og" href="matchup.html">Open the matchup</a></div>`}}
 const rx=rxMine()[thread]||{};
 h+=`<div class="rx">${RX.map(([k,l])=>{const n=Math.floor(hash(thread+k)*12)+(rx[k]?1:0);return`<button class="rxb${rx[k]?' on':''}" data-rx="${k}"><b>${n}</b>${l}</button>`}).join('')}</div>`;
 h+=`<div class="g-card">${msgs.slice(-40).map(x=>{const nm=x.you?(me.name||'You'):x.who;return`<div class="msg">${plink(x.you?'You':x.who,avatar(nm))}<div class="t"><b>${plink(x.you?'You':x.who,esc(nm))}</b>${x.you?'<span class="pill you">YOU</span>':''}<small>${new Date(x.at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><p>${esc(x.txt)}</p></div></div>`}).join('')||'<div class="g-note">Quiet so far. Say something.</div>'}</div><div class="g-note">Stand-in players fill the rooms in this prototype. Your posts stay on this phone.</div>`;
 return h}
function render(){const inR=thread!=='lobby';document.body.classList.toggle('in-room',inR);$('lounge').innerHTML=inR?room():lobby();const ci=$('ci'),riv=Rush.rival&&Rush.rival();if(ci)ci.placeholder=thread==='week'&&riv?'Talk to '+riv.name.split(' ')[0]:'Say something about this game'}
window.render=render;
document.addEventListener('click',e=>{const r=e.target.closest('[data-rx]');if(r){const o=rxMine(),t=o[thread]=o[thread]||{};t[r.dataset.rx]=!t[r.dataset.rx];try{localStorage.setItem(RK,JSON.stringify(o))}catch(x){}render();return}const t=e.target.closest('[data-t]');if(!t)return;thread=t.dataset.t;history.replaceState(null,'','?t='+encodeURIComponent(thread));render();scrollTo(0,0)});
$('cf').addEventListener('submit',e=>{e.preventDefault();const i=$('ci'),txt=(i.value||'').trim();if(!txt)return;const m=mine();(m[thread]=m[thread]||[]).push({who:'You',txt,at:Date.now()});const reply=['Bold. Show me the Slip.','Respect.','We will see at the final.','Tailing that.','No chance. Fading you.'];(m[thread]).push({who:pickName(txt),txt:reply[Math.floor(hash(txt)*reply.length)],at:Date.now()+1500,sim:1});saveMine(m);i.value='';render();setTimeout(()=>scrollTo(0,document.body.scrollHeight),30)});
const etDay=off=>new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'America/New_York'}).replace(/-/g,'');
async function loadGames(){const days=[etDay(-1),etDay(0),etDay(1)];const urls=[['nfl','https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard']];for(const lg of['nba','nhl'])for(const d of days)urls.push([lg,`https://site.api.espn.com/apis/site/v2/sports/${PATHS[lg]}/scoreboard?dates=${d}`]);const out=[];await Promise.all(urls.map(async([lg,u])=>{try{const d=await(await fetch(u)).json();for(const e of d.events||[]){const c=e.competitions[0],h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');out.push({lg,id:e.id,date:Date.parse(e.date),state:c.status.type.state,detail:c.status.type.shortDetail,h:{ab:h.team.abbreviation,s:h.score,logo:h.team.logo},a:{ab:a.team.abbreviation,s:a.score,logo:a.team.logo},line:(c.odds||[])[0]&&c.odds[0].details})}}catch(e){}}));const seen={};GAMES=out.filter(g=>!seen[g.lg+g.id]&&(seen[g.lg+g.id]=1)).sort((x,y)=>x.date-y.date);render()}
GS.nav('lounge');render();loadGames();setInterval(loadGames,60000);
</script>
