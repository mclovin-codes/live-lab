function grade(b){const final=G.state==='post';let r=null;
 const cmp=(v,line)=>v>line?1:v<line?-1:0;
 if(b.t==='ml'){if(final){const m=G.score.H-G.score.A;r=m===0?'push':((b.side==='H')===(m>0)?'won':'lost')}}
 else if(b.t==='spread'){if(final){const m=b.side==='H'?G.score.H-G.score.A:G.score.A-G.score.H,c=m+b.line;r=c===0?'push':c>0?'won':'lost'}}
 else if(b.t==='total'||b.t==='tt'||b.t==='per'){const v=b.t==='total'?G.score.H+G.score.A:b.t==='tt'?G.score[b.team]:b.periods.reduce((a,n)=>a+(G.lines.H[n-1]||0)+(G.lines.A[n-1]||0),0);const done=b.t==='per'?(final||G.period>Math.max(...b.periods)):final;
  if(v>b.line)r=b.side==='o'?'won':'lost';else if(done){const c=cmp(v,b.line);r=c===0?'push':(b.side==='o')===(c>0)?'won':'lost'}}
 else if(b.t==='ot'){if(G.period>4)r=b.side==='y'?'won':'lost';else if(final)r=b.side==='n'?'won':'lost'}
 else if(b.t==='margin'){if(final){const m=b.side==='H'?G.score.H-G.score.A:G.score.A-G.score.H;r=m>=b.lo&&(!b.hi||m<=b.hi)?'won':'lost'}}
 else if(b.t==='perml'){if(final||G.period>b.period){const m=(G.lines.H[b.period-1]||0)-(G.lines.A[b.period-1]||0);r=m===0?'push':(b.side==='H')===(m>0)?'won':'lost'}}
 else if(b.t==='prop'){const p=G.box[b.pid],v=p?(p[b.field]||0):null;if(b.cnt&&v!=null&&v>b.line)r=b.side==='o'?'won':'lost';else if(final&&G.boxFinal){if(v==null)r='void';else{const c=cmp(v,b.line);r=c===0?'push':(b.side==='o')===(c>0)?'won':'lost'}}}
 else if(b.t==='td'){const p=G.box[b.pid];const v=p?(p['rushing:rushingTouchdowns']||0)+(p['receiving:receivingTouchdowns']||0):0;if(v>=1)r='won';else if(final&&G.boxFinal)r='lost'}
 else if(b.t==='drive'){const x=driveRes(b.drive);if(x)r=x===b.side?'won':'lost';else if(final)r=b.side==='none'?'won':'lost'}
 else if(b.t==='next'){const hit=nextScore(b.seq);if(hit)r=hit===b.side?'won':'lost';else if(final)r=b.side==='none'?'won':'lost'}
 else if(b.t==='play'){const pl=nextSnap(b.seq);if(pl){b.res=(pl.shortText||pl.text||'').slice(0,90);if(SPECIAL.test(pl.type.text))r='void';else if(b.side==='pass'||b.side==='run'){if(!isPass(pl)&&!isRush(pl))r='void';else r=(b.side==='pass')===isPass(pl)?'won':'lost'}else if(b.side==='fdY'||b.side==='fdN'){const got=(pl.statYardage||0)>=(pl.start&&pl.start.distance||99)&&!isTO(pl);r=(b.side==='fdY')===got?'won':'lost'}else{const got=(pl.statYardage||0)>=10&&!isTO(pl);r=(b.side==='bigY')===got?'won':'lost'}}else if(final)r='void'}
 return r}
/* Parlay: a lost leg kills it now; pushed and voided legs drop out and the price recalculates, as a book does. */
function gradeParlay(b){let ch=false;for(const l of b.legs){if(l.status!=='open')continue;const r=grade(l);if(r){l.status=r;ch=true}}
 if(b.legs.some(l=>l.status==='lost'))return'lost';if(b.legs.some(l=>l.status==='open')){if(ch)save();return null}

function parlayOdds(legs){let d=1;for(const l of legs)d*=1+toWin(100,l.odds)/100;if(legs.length>1)d=1+(d-1)*Math.pow(.93,legs.length-1);return Math.round(d>=2?(d-1)*100:-100/(d-1))}

function winChance(b){const c=M[b.k]||(b.t==='next'||b.t==='drive'?Mg[b.g+'|'+b.sid]:null);if(c&&c.p!=null)return c.p;const L=live();if(!L)return null;
 if(b.t==='prop'){const j=G.proj[b.pid+'|'+b.field];if(!j)return null;const q=ou(j.mu,j.s,b.line);return b.side==='o'?q.o:q.u}
 if(b.t==='per'){const j=G.proj['per'+b.periods.join()];if(!j)return null;const q=ou(j.mu,j.s,b.line);return b.side==='o'?q.o:q.u}

function nextSnap(seq){for(const p of G.list){if(Number(p.sequenceNumber)>seq&&isSnap(p))return p}return null}
function nextScore(seq){let prev=null;for(const p of G.list){const q=Number(p.sequenceNumber);if(q<=seq){prev=p;continue}const ph=prev?prev.homeScore||0:0,pa=prev?prev.awayScore||0:0,dh=(p.homeScore||0)-ph,da=(p.awayScore||0)-pa;prev=p;if(dh<=0&&da<=0)continue;const pts=dh>0?dh:da,K=dh>0?'H':'A';if(pts<2)continue;if(/two.?point/i.test(p.type.text))continue;if(pts>=6)return K+'T';if(pts===3)return K+'F';return'safety'}return null}
function sweat(b){const H=G.score.H,A=G.score.A;switch(b.t){

 case'total':case'tt':case'per':{const v=b.t==='total'?H+A:b.t==='tt'?G.score[b.team]:b.periods.reduce((a,n)=>a+(G.lines.H[n-1]||0)+(G.lines.A[n-1]||0),0);const need=Math.ceil(b.line+.01-v);return{a:b.side==='u',bh:false,x:`At ${v}, ${need} more goes over`}}
