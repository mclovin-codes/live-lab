<style>
/* Layout: sticky scoreboard on top, one scrolling market column, thumb tabs and bet slip anchored to the bottom. */
:root{color-scheme:dark;

--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:Barlow,system-ui,sans-serif}
[hidden]{display:none!important}
html,body{margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:var(--bg);color:var(--fg);font:15px/1.35 var(--body);padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}

.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:7px 3px;gap:8px}

.tm.pos small::after{content:" \25C0"}.tm.r.pos small::after{content:""}.tm.r.pos small::before{content:"\25B6 "}
.ck{text-align:center;font:700 16px/1.1 var(--disp);letter-spacing:.03em}

.fld{position:relative;height:9px;background:#18361f;overflow:hidden}

.me{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:6px;background:var(--s2)}
.me .bk{font:800 24px/1 var(--disp)}.me .rk{font:700 15px/1.1 var(--disp);color:var(--amber);text-align:right;white-space:nowrap}
.me .gp{font-size:12px;color:var(--mut);line-height:1.2;min-width:0}.me .gp b{color:var(--fg);font-weight:600}
main{display:flex;flex-direction:column;gap:14px;padding-block:12px}

h2 span{font:500 11.5px var(--body);letter-spacing:0;text-transform:none;color:var(--dim);text-align:right}
.lp{background:var(--s1);padding:9px 11px;border-radius:6px;border:1px solid var(--line)}
.lp .a{display:flex;justify-content:space-between;gap:8px;font:700 13px var(--disp);color:var(--amber);letter-spacing:.05em}
.lp p{margin:2px 0 0;font-size:13.5px}.lp.score{border-color:var(--amber);background:#33230f}
.row{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}

.o.up{animation:fu 2.2s}.o.dn{animation:fd 2.2s}
@keyframes fu{0%,40%{background:#123f30;border-color:var(--win)}}@keyframes fd{0%,40%{background:#4a1a17;border-color:var(--lose)}}
.o.lk{opacity:.42;pointer-events:none}.o.lk b{color:var(--dim);font-size:15px}
.sh{height:3px;border-radius:2px;background:var(--s3);overflow:hidden;display:flex;margin-top:4px}.sh i{display:block;background:var(--red)}
.pc{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:2px}
.note{font-size:12.5px;color:var(--mut);padding:10px;background:var(--s1);border-radius:6px;border:1px dashed var(--line)}
.q{font:600 12.5px var(--body);color:var(--fg);margin:2px 0}
.tb{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}

.alt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.pr .w{min-width:0}.pr .w b{display:block;font:600 14px/1.15 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr .w i{font-style:normal;font-size:12px;color:var(--mut)}
.pr .o{min-height:46px}
.tk{background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:9px 11px;display:grid;gap:2px}
.tk.ahead{border-left:3px solid var(--win)}.tk.behind{border-left:3px solid var(--lose)}
.tk .a{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font:700 17px/1.15 var(--disp)}
.tk .a span{color:var(--amber);white-space:nowrap}
.tk small{color:var(--mut);font-size:12px}
.tk .sw{font-size:13px}.ahead .sw{color:var(--win)}.behind .sw{color:var(--lose)}
.res{font:800 14px var(--disp);letter-spacing:.05em}.won{color:var(--win)}.lost{color:var(--dim)}.push{color:var(--mut)}
.lb{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;padding:7px 9px;align-items:center;border-bottom:1px solid var(--line)}
.lb.mine{background:#3a1b13;border-radius:6px;border-bottom:0}
.lb .pos{font:700 16px var(--disp);color:var(--dim)}.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .amt{font:700 17px var(--disp)}.chip{font:700 10px var(--disp);letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:var(--s3);color:var(--mut)}.chip.re{background:var(--red);color:#fff}
.fd1{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--mut)}.fd1 b{color:var(--fg);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{padding:11px 0 13px;font:700 15px var(--disp);letter-spacing:.06em;color:var(--mut);position:relative}
nav button.on{color:var(--fg);box-shadow:inset 0 3px 0 var(--red)}
nav em{font-style:normal;background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 5px;margin-left:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s2);border-top:2px solid var(--red);padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0;display:grid;gap:10px;box-shadow:0 -14px 40px rgba(0,0,0,.6)}
.sheet .tt{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.sheet .tt b{font:800 23px/1.1 var(--disp)}.sheet .tt span{font:800 26px var(--disp);color:var(--amber);white-space:nowrap}
.sheet small{color:var(--mut)}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chips button{padding:12px 0;background:var(--s3);border-radius:6px;font:700 16px var(--disp)}.chips button.on{background:var(--fg);color:var(--bg)}
.place{padding:15px;border-radius:8px;background:var(--red);color:#fff;font:800 20px var(--disp);letter-spacing:.03em}
.place[disabled]{background:var(--s3);color:var(--mut)}.place.mv{background:var(--amber);color:#21130a}
.x{position:absolute;right:14px;top:-34px}
.co{margin-top:6px;padding:9px;border-radius:6px;background:var(--s3);font:700 15px var(--disp);letter-spacing:.03em}.co.arm{background:var(--amber);color:#21130a}
.sx{display:flex;gap:6px;flex-wrap:wrap}.sx button{flex:1 1 40%;padding:10px 6px;border-radius:6px;background:var(--s1);border:1px solid var(--line);font:600 14px var(--disp)}.sx button.on{background:var(--win);color:#06281b;border-color:var(--win)}
.lg{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;font-size:14px}.lg b{font:700 17px var(--disp);color:var(--amber)}.lg button{padding:4px;background:var(--s3);border-radius:4px;font-size:12px}
.parbar{display:block;width:100%;padding-block:6px;background:var(--amber);color:#21130a;font:700 15px var(--disp);letter-spacing:.03em;text-align:left}
.qk{font:700 12px var(--disp);letter-spacing:.04em;padding:2px 8px;border-radius:4px;background:var(--s3);color:var(--mut);text-transform:none}.qk.on{background:var(--win);color:#06281b}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(10,4,8,.45)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:10px;right:10px;z-index:30;display:grid;gap:6px;pointer-events:none}
.t{padding:10px 13px;border-radius:8px;background:var(--s3);border:1px solid var(--line);font:700 17px/1.15 var(--disp);animation:ti .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.t.w{background:#0d4a34;border-color:var(--win);font-size:23px}.t.l{background:#3a1f26}.t i{display:block;font:500 12.5px var(--body);color:var(--mut)}
@keyframes ti{from{transform:translateY(-14px);opacity:0}}
.banner{background:var(--red);color:#fff;font-weight:600;font-size:13px;padding-block:7px}
.vbtn{font:700 12px var(--disp);padding:1px 6px;border-radius:4px;background:var(--red);color:#fff;letter-spacing:.04em}
input.hn{width:100%;padding:10px;background:var(--s2);border:1px solid var(--line);border-radius:6px;color:var(--fg);font:600 16px var(--body)}
.cl h3{margin:8px 0 2px;font:700 17px var(--disp)}.cl p{margin:0;font-size:13.5px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="toast" aria-live="polite"></div>
<header>
 <div id="banner" class="banner g" hidden></div>
 <div class="sb g">
  <div class="tm" id="tA"><small>CHI</small><span id="sA">-</span></div>
  <div class="ck"><span id="clk">Loading</span><i><span id="age" class="live">connecting</span> &middot; <button class="vbtn" id="vb">v2</button></i></div>
  <div class="tm r" id="tH"><span id="sH">-</span><small>SEA</small></div>
 </div>
 <div class="dd g"><b id="dn">Waiting for the feed</b><span id="rz"></span></div>
 <div class="fld" id="fld" aria-hidden="true"></div>
 <div id="parbar"></div>
 <div class="me g"><div class="bk" id="bk">$1,000</div><div class="gp" id="gp">Fake money. $1,000 for the whole game.</div><div class="rk" id="rk"></div></div>
</header>
<main class="g" id="main"></main>
<nav id="nav"></nav>
<div id="slip"></div>
<script>
'use strict';
const VER='v2',E='401873036',HID='26',AID='3';
const CHANGES=[['v2','Cash out on game lines, props and drive picks. Same game parlays from any non-snap market. Three straight wins earns a +25% profit boost. One-tap betting on next snap markets. Your rank move shows when a pick lands. Now runs as a plain web page.'],['v1','First live build. Next snap, this drive and next score markets, full game board with alts, team totals, quarter lines, player props, anytime TD. Every line reprices off ESPN after each play, with the DraftKings number shown beside it. You race a field of 24 simulated players.']];
const CORE=`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/${E}/competitions/${E}`;
const SUM=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${E}`;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(Math.round(n*100)/100)?0:2,maximumFractionDigits:2});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ---------- math and pricing ---------- */
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const cdf=z=>.5*(1+erf(z/Math.SQRT2));
function inv(p){p=clamp(p,.001,.999);const a=[-39.6968302866538,220.946098424521,-275.928510446969,138.357751867269,-30.6647980661472,2.50662827745924],b=[-54.4760987982241,161.585836858041,-155.698979859887,66.8013118877197,-13.2806815528857],c=[-.00778489400243029,-.322396458041136,-2.40075827716184,-2.54973253934373,4.37466414146497,2.93816398269878],d=[.00778469570904146,.32246712907004,2.445134137143,3.75440866190742];
 if(p<.02425){const q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
 if(p>.97575)return-inv(1-p);
 const q=p-.5,r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
function am(p,hold=1.0476){const i=clamp(p*hold,.012,.985);let o=i>=.5?-100*i/(1-i):100*(1-i)/i;const a=Math.abs(o),st=a<200?5:a<500?10:a<1000?25:50;o=Math.round(o/st)*st;if(Math.abs(o)<100)o=o<0?-100:100;if(o===-100)o=100;return o}
const fo=o=>(o>0?'+':'')+o;
const toWin=(st,o)=>o>0?st*o/100:st*100/Math.abs(o);
const impl=o=>o<0?-o/(100-o):100/(o+100);
function ou(mu,s,L){const hi=Number.isInteger(L)?L+.5:L,lo=Number.isInteger(L)?L-.5:L,o=1-cdf((hi-mu)/s),u=cdf((lo-mu)/s),n=Math.max(o+u,.001);return{o:o/n,u:u/n,push:1-o-u}}
const half=x=>Math.round(x*2)/2;
const fl=L=>(L>0?'+':'')+L;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,1597334677);return((h^(h>>>16))>>>0)/4294967296}

/* ---------- game state from ESPN ---------- */
const G={state:'pre',period:1,clock:900,detail:'',score:{H:0,A:0},lines:{H:[],A:[]},plays:new Map,list:[],sit:null,prob:null,dk:null,box:{},drives:{prev:[],cur:null},lastOk:0,fails:0,sumAt:0,seq:0};
let anchor=null;
const secLeft=()=>G.state==='post'?0:G.period>4?G.clock:(4-G.period)*900+G.clock;
const num=x=>x==null||x===''?null:Number(x);
const lastId=r=>{const m=/\/(\d+)(?:\?|$)/.exec(r||'');return m?m[1]:null};
async function J(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

function ingestPlays(items){let ch=false;for(const p of items){const old=G.plays.get(p.id);if(!old||old.modified!==p.modified||old.text!==p.text){G.plays.set(p.id,p);ch=true}}
 if(ch){G.list=[...G.plays.values()].sort((a,b)=>Number(a.sequenceNumber)-Number(b.sequenceNumber));const l=G.list[G.list.length-1];if(l){const ns=Number(l.sequenceNumber);if(ns!==G.seq){G.seq=ns;G.snapAt=Date.now()}G.score.H=l.homeScore??G.score.H;G.score.A=l.awayScore??G.score.A}}return ch}
let playPage=1,playsLoaded=false,probPage=1;
async function pollPlays(){
 if(!playsLoaded){let d=await J(`${CORE}/plays?limit=400`);ingestPlays(d.items||[]);for(let i=2;i<=d.pageCount;i++){d=await J(`${CORE}/plays?limit=400&page=${i}`);ingestPlays(d.items||[])}playsLoaded=true;const n=d.count||G.list.length;playPage=Math.max(1,Math.ceil(n/25));sim();return true}
 let d=await J(`${CORE}/plays?limit=25&page=${playPage}`);
 if(d.pageCount>playPage){playPage=d.pageCount;d=await J(`${CORE}/plays?limit=25&page=${playPage}`)}
 let ch=ingestPlays(d.items||[]);
 if((d.items||[]).length<4&&playPage>1){const e=await J(`${CORE}/plays?limit=25&page=${playPage-1}`);ch=ingestPlays(e.items||[])||ch}
 if(ch)sim();return ch}
async function pollProb(){let d=await J(`${CORE}/probabilities?limit=5&page=${probPage}`);if(d.pageCount>probPage){probPage=d.pageCount;d=await J(`${CORE}/probabilities?limit=5&page=${probPage}`)}
 const it=(d.items||[])[(d.items||[]).length-1];if(!it)return false;const ch=!G.prob||G.prob.sequenceNumber!==it.sequenceNumber;G.prob=it;return ch}
async function pollSit(){const s=await J(`${CORE}/situation`);const ch=JSON.stringify(G.sit)!==JSON.stringify(s);G.sit=s;return ch}
async function pollStatus(){const s=await J(`${CORE}/status`);const ch=s.clock!==G.clock||s.period!==G.period||s.type.state!==G.state;G.clock=s.clock||0;G.period=s.period||1;G.state=s.type.state;G.detail=s.type.shortDetail||s.type.detail;return ch}
async function pollOdds(){const d=await J(`${CORE}/odds`);const it=(d.items||[]).find(x=>String(x.provider&&x.provider.id)==='100')||(d.items||[])[0];if(!it)return false;const v={sp:it.spread,ou:it.overUnder,ov:it.overOdds,un:it.underOdds,hml:it.homeTeamOdds&&it.homeTeamOdds.moneyLine,aml:it.awayTeamOdds&&it.awayTeamOdds.moneyLine,hs:it.homeTeamOdds&&it.homeTeamOdds.spreadOdds,as:it.awayTeamOdds&&it.awayTeamOdds.spreadOdds};const ch=JSON.stringify(v)!==JSON.stringify(G.dk),had=!!G.dk;G.dk=v;if(ch&&had)reanchor();return ch}
function parseBox(b){const P={};for(const t of (b&&b.players)||[]){const abbr=t.team.abbreviation;for(const g of t.statistics||[]){for(const a of g.athletes||[]){const id=a.athlete.id,p=P[id]||(P[id]={id,name:a.athlete.displayName,short:a.athlete.shortName||a.athlete.displayName,team:abbr});g.keys.forEach((k,i)=>{const v=a.stats[i];if(k==='completions/passingAttempts'){const[c,at]=String(v).split('/');p.comp=+c||0;p.att=+at||0}else p[g.name+':'+k]=parseFloat(v)||0})}}}return P}
async function pollSummary(){const s=await J(SUM);const c=s.header.competitions[0];const st=c.status;G.state=st.type.state;G.period=st.period||G.period;if(st.type.detail)G.detail=st.type.shortDetail||st.type.detail;
 for(const x of c.competitors){const K=x.homeAway==='home'?'H':'A';G.lines[K]=(x.linescores||[]).map(l=>parseFloat(l.displayValue)||0);if(!G.list.length||G.state==='post')G.score[K]=parseInt(x.score)||0}
