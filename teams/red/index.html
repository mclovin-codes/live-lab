 const moved=cur&&cur.odds!==slip.odds;const canLeg=cur&&cur.t!=='play';let btn;if(placing)btn=`<button class="place" disabled>Placing pick…</button>`;else if(!cur)btn=`<button class="place" disabled>Locked: pick not available</button>`;else if(ST.cash<1)btn=`<button class="place" disabled>No Stack left</button>`;else if(moved)btn=`<button class="place mv" data-go="1">Price moved: <s>${fo(slip.odds)}</s> ${fo(cur.odds)}. Accept new price</button>`;else btn=`<button class="place" data-go="1">Lock pick: ${money(slip.stake)} Stack for ${U(toWin(slip.stake,slip.odds)/10)} Units</button>`;
 const html=`<div class="scrim" data-x="1"></div><div class="sheet g"><div class="tt"><b>${esc(slip.lbl)}</b><span>${fo(cur?cur.odds:slip.odds)}</span></div><small>${esc(slip.mkt)} &middot; ${money(ST.cash)} Stack left &middot; limit ${money(slip.stakeMax||250)}</small><div class="chips">${chips}</div>${btn}<div class="sx">${canLeg?`<button data-leg="1">Add to parlay${ST.par&&ST.par.length?` (${ST.par.length})`:''}</button>`:''}</div></div>`;if(el._h!==html){el.innerHTML=html;el._h=html}}
function stakeChips(max){const set=ST.cash>=200?[10,25,50,100]:ST.cash>=40?[5,10,20,30]:[1,2,5,10];return set.map(c=>`<button data-st="${c}" class="${slip.stake===c?'on':''}"${c>max?' disabled':''}>${c}</button>`).join('')+`<button data-st="half">½</button><button data-st="max" class="${slip.stake===max?'on':''}">ALL</button>`}
function parLegs(){return(ST.par||[]).map(l=>{const c=M[l.k];return c?Object.assign({},c,{was:l.odds}):null})}
function renderParlay(){const el=$('slip'),legs=parLegs(),good=legs.filter(Boolean),odds=good.length>1?parlayOdds(good):null,max=Math.min(ST.cash,100),st=Math.min(slip.stake,max);slip.stake=st;
 const rows=(ST.par||[]).map((l,i)=>{const c=legs[i];return`<div class="lg"><span>${esc(l.lbl)}</span><b>${c?fo(c.odds):'off board'}</b><button data-rm="${i}" aria-label="Remove ${esc(l.lbl)}">X</button></div>`}).join('');
 const chips=stakeChips(max);
 const html=`<div class="scrim" data-x="1"></div><div class="sheet g"><div class="tt"><b>Parlay, ${(ST.par||[]).length} legs</b><span>${odds!=null?fo(odds):'Add legs'}</span></div><small>Same game price. Every leg must hit. Pushes drop out. Limit $100.</small>${rows}<div class="chips">${chips}</div>${placing?`<button class="place" disabled>Locking parlay…</button>`:odds!=null&&good.length===legs.length&&max>=1?`<button class="place" data-gop="1">Lock parlay: ${money(slip.stake)} Stack for ${U(toWin(slip.stake,odds)/10)} Units</button>`:`<button class="place" disabled>${good.length!==legs.length?'Remove the leg that moved':'Needs 2 or more legs'}</button>`}</div>`;if(el._h!==html){el.innerHTML=html;el._h=html}}
function placeParlay(){const legs=parLegs();if(legs.some(l=>!l)||legs.length<2||placing)return;if(Rm.mv){toast('Locked: parlay not placed','The price is updating after a play.');return}const odds=parlayOdds(legs),stake=Math.min(slip.stake,ST.cash,100);if(stake<1)return;placing=true;renderSlip();
 setTimeout(()=>{placing=false;Rm=build();const now=parLegs();if(!slip)return;if(now.some(l=>!l)||parlayOdds(now)!==odds){toast('A leg moved during the delay','Check the new price.');renderSlip();return}
  const b={t:'parlay',id:Date.now().toString(36),lbl:`${now.length}-leg parlay`,mkt:'Same game parlay',odds,stake:round2(stake),status:'open',at:Date.now(),pay:0,g:'parlay',sid:'p',legs:now.map(l=>{const x=Object.assign({},l,{status:'open'});delete x.was;delete x.p;if(x.t==='next')x.seq=G.seq;return x})};
  ST.cash=round2(ST.cash-b.stake);ST.bets.push(b);ST.par=[];slip=null;save();toast(`Locked ${b.lbl} ${fo(odds)}`,`${money(b.stake)} Stack for ${U(toWin(b.stake,odds)/10)} Units`);render()},1500)}
function render(){if(touching){pending=true;return}Rm=build();settleMaybe();renderHead();renderMain();renderSlip()}
function settleMaybe(){G.boxFinal=G.state==='post'&&G.sumAt>0;const before=myRank();if(settle()){const after=myRank();if(after<before)toast(`Up to #${after}`,`Passed ${before-after} player${before-after>1?'s':''}`);renderHead()}}
function toast(t,sub,c){const d=document.createElement('div');d.className='t '+(c||'');d.innerHTML=esc(t)+(sub?`<i>${esc(sub)}</i>`:'');const tb=$('toast');tb.appendChild(d);while(tb.children.length>2)tb.firstChild.remove();setTimeout(()=>d.remove(),c==='w'?4200:3000)}
let ac=null;function beep(w){if(ST.mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext);const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='triangle';o.frequency.value=w?660:180;if(w)o.frequency.exponentialRampToValueAtTime(1180,ac.currentTime+.16);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.28);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
function place(){const cur=M[slip.k];if(!cur||placing)return;if(Rm.mv){toast('Locked: pick not placed','The price is updating after a play. Try again once it reopens.');return}slip.odds=cur.odds;const max=Math.min(ST.cash,cur.stakeMax||250);if(slip.stake>max)slip.stake=max;if(slip.stake<1)return;placing=true;renderSlip();const k=slip.k,odds=slip.odds,stake=slip.stake;
 setTimeout(()=>{placing=false;Rm=build();const now=M[k];if(!slip)return;if(Rm.mv){toast('Locked: pick not placed','The price changed while placing. Check the new price.');renderSlip();return}if(!now||now.odds!==odds){if(now)toast('Price moved',`${fo(odds)} is now ${fo(now.odds)}. Pick not placed.`);else toast('Locked: pick not placed','This market closed while placing.');renderSlip();renderMain();return}
  const b=Object.assign({},now,{id:Date.now().toString(36),stake:round2(stake),status:'open',at:Date.now(),res:null,pay:0});b.seq=now.t==='play'||now.t==='next'?G.seq:b.seq;delete b.p;const opp=BOTS.find(x=>x.id===oppId());b.vs={id:opp.id,name:opp.name};ST.cash=round2(ST.cash-b.stake);ST.bets.push(b);ST.last=b.stake;slip=null;save();toast(`Pick placed: ${b.lbl} ${fo(b.odds)}`,`${money(b.stake)} Stack, returns ${U(payOf(b)/10)} Units if it hits`);render()},1500)}
let wl=null;async function wake(){try{if(navigator.wakeLock&&!wl&&!document.hidden){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
let cmpOn=false;addEventListener('scroll',()=>{const c=scrollY>60;if(c!==cmpOn){cmpOn=c;document.querySelector('header').classList.toggle('cmp',c)}},{passive:true});

const rel=()=>{touching=false;if(pending){pending=false;setTimeout(render,60)}};document.addEventListener('pointerup',rel);document.addEventListener('pointercancel',rel);

 const tb=t.closest('[data-tab]');if(tb){tab=tb.dataset.tab;try{localStorage.setItem(LS+'.tab',tab)}catch(e){}window.scrollTo(0,0);render();return}

 const c=t.closest('[data-st]');if(c&&slip){const max=Math.min(ST.cash,slip.stakeMax||250);const v=c.dataset.st;slip.stake=v==='max'?max:v==='half'?Math.max(1,Math.floor(max/2)):Math.min(+v,max);renderSlip();return}

function loop(fn,ms){let busy=false;const run=async()=>{if(busy||FC.up)return;busy=true;try{const ch=await fn();G.lastOk=Date.now();G.fails=0;if(ch)render()}catch(e){G.fails++;renderHead()}busy=false};run();setInterval(run,ms);return run}
