<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush · Reads</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Reads (Blue, Phase 4 round two): the Field's social space. Every pick is sealed until kickoff. Before kickoff you
   read another player's sealed pick with one tap (call the side they took). At kickoff the pick flips for everyone and
   every read on it scores right or wrong; at the final the pick itself grades. Your own sealed picks are read by the Field.
   ?field=7 is the honest view: exactly 7 players, nothing generated (no crowd reads, no counts). */
:root{--bg:#0A0F15;--card:#111A24;--card2:#18242F;--line:#23313F;--fg:#F4F7FA;--mute:#93A3B5;--acc:#3CC8FF;--gold:#FFB020;--win:#3DDC84;--loss:#FF6B6B;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.rd-wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
h1{font:800 30px/1 var(--f);letter-spacing:-.03em;margin:0}
.rd-sub{margin:6px 0 0;color:var(--mute);font:600 15px/20px var(--f)}
.rd-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rd-tile{background:var(--card);border-radius:16px;padding:12px}.rd-tile b{display:block;font:800 26px/30px var(--f);font-variant-numeric:tabular-nums}.rd-tile span{display:block;color:var(--mute);font:700 12px/15px var(--f)}
.rd-lbl{display:flex;justify-content:space-between;align-items:baseline;font:800 12px/16px var(--f);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:6px 0 -4px}.rd-lbl small{letter-spacing:0;text-transform:none;font-weight:700}
.rd-card{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent}
.rd-card.rd-mu{border-color:rgba(60,200,255,.45);background:linear-gradient(160deg,#0F2232,#111A24 60%)}
.rd-who{display:flex;align-items:center;gap:10px;min-width:0}.rd-who a{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;flex:1}
.rd-who b{display:block;font:800 17px/21px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rd-who small{display:block;color:var(--mute);font:600 13px/16px var(--f)}
.rd-clock{flex:none;text-align:right;font:800 15px/18px var(--f);font-variant-numeric:tabular-nums}.rd-clock small{display:block;color:var(--mute);font:700 11px/14px var(--f);letter-spacing:.08em}
.rd-game{display:flex;align-items:center;gap:10px}.rd-stake{flex:none;text-align:right;font:800 14px/18px var(--f);color:var(--gold);max-width:72px}
.rd-tl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}.rd-tl::-webkit-scrollbar{display:none}.rd-tl div{flex:none;min-width:96px;background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}.rd-tl b{display:block;font:800 17px/20px var(--f)}.rd-tl span{display:block;color:var(--mute);font:700 12px/16px var(--f)}.rd-tl div.rd-nx{border-color:var(--gold)}
.rd-quick{display:flex;flex-wrap:wrap;gap:8px}.rd-quick button{min-height:38px;padding:6px 12px;border-radius:19px;background:var(--card2);font:800 14px/18px var(--f)}.rd-quick button:last-child{background:transparent;border:1px solid var(--line);color:var(--mute)}
.rd-line{display:flex;align-items:center;gap:8px;font:600 15px/20px var(--f)}.rd-line b{font-weight:800}
.rd-type{display:flex;gap:8px}.rd-type input{flex:1;min-width:0;background:var(--card2);border:0;border-radius:12px;padding:12px;color:var(--fg);font:16px var(--f)}.rd-type button{border-radius:12px;padding:0 14px;background:var(--acc);color:#06121C;font-weight:800}
.rd-duel{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;font:800 15px/20px var(--f)}.rd-duel span{color:var(--mute);font:700 13px/16px var(--f)}
.rd-sealed{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:repeating-linear-gradient(135deg,#17222D 0 10px,#1B2734 10px 20px);border:1px dashed #3A4B5C;border-radius:14px;padding:12px 14px;min-height:56px}
.rd-sealed b{font:800 16px/20px var(--f)}.rd-sealed span{color:var(--mute);font:800 12px/16px var(--f);letter-spacing:.12em;text-align:right}
.rd-open{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card2);border-radius:14px;padding:12px 14px;min-height:56px}
.rd-open b{font:800 18px/22px var(--f)}.rd-open em{font-style:normal;font:800 13px/16px var(--f);padding:4px 10px;border-radius:10px;background:#22303D}
.rd-open em.rd-won{background:rgba(61,220,132,.16);color:var(--win)}.rd-open em.rd-lost{background:rgba(255,107,107,.14);color:var(--loss)}
.rd-calls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rd-calls button{min-height:52px;border-radius:14px;background:#0A0F15;border:2px solid #2A3A4A;font:800 17px/20px var(--f)}
.rd-calls button.rd-on{background:var(--acc);border-color:var(--acc);color:#06121C}
.rd-calls button:active{transform:scale(.97)}
.rd-res{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font:800 15px/20px var(--f)}
.rd-res.rd-right{background:rgba(61,220,132,.14);color:var(--win)}.rd-res.rd-wrong{background:rgba(255,107,107,.12);color:var(--loss)}.rd-res.rd-none{background:var(--card2);color:var(--mute)}
.rd-side{display:inline-block;padding:3px 9px;border-radius:9px;font:800 12px/16px var(--f);background:#22303D;color:var(--fg)}
.rd-side.rd-same{background:rgba(61,220,132,.16);color:var(--win)}.rd-side.rd-opp{background:rgba(255,176,32,.16);color:var(--gold)}
.rd-mine{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px}.rd-mine b{flex:1;font:800 16px/20px var(--f)}.rd-mine small{color:var(--mute);font:700 13px/16px var(--f);text-align:right}
.rd-empty{background:var(--card);border-radius:16px;padding:16px;color:var(--mute);font:600 15px/21px var(--f)}
.rd-empty a{color:var(--acc);font-weight:800;text-decoration:none}
.rd-foot{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:8px;color:var(--mute);font:600 13px/18px var(--f);text-align:center}
.rd-foot a{display:inline-block;padding:10px 16px;border-radius:14px;background:var(--card2);color:var(--fg);font:800 14px var(--f);text-decoration:none}
.rd-hon{display:inline-block;vertical-align:middle;padding:3px 9px;border-radius:9px;font:800 11px/16px var(--f);letter-spacing:.08em;background:rgba(255,176,32,.16);color:var(--gold)}
</style>
</head>
<body>
<div class="rd-wrap" id="reads"><div class="rd-empty">Loading the Field's sealed picks...</div></div>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="shared/nav.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Q=new URLSearchParams(location.search),HONEST=Q.get('field')==='7',KEY='rush-reads-v1';
const AV=(n,sm)=>Rush.nav&&Rush.nav.avatar?Rush.nav.avatar(n,sm):'';
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};
const reads=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const saveReads=r=>{try{localStorage.setItem(KEY,JSON.stringify(r))}catch(e){}};
const etTime=ms=>new Date(ms).toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});
const left=ms=>{ms=Math.max(0,ms);const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);return h>23?Math.floor(h/24)+'d '+(h%24)+'h':h?h+'h '+m+'m':m+'m'};
let GAMES=[];
/* the Field this page shows: everyone, or (honest view) exactly 7: you, your opponent and the next five by the Field's own order */
function people(){let f=[];try{f=RW.field(GAMES)}catch(e){}const me=f.find(r=>r.me);let others=f.filter(r=>!r.me);let riv=null;try{riv=Rush.rival()}catch(e){}
  const rv=riv&&others.find(r=>String(r.id)===String(riv.id)||r.name===riv.name);
  if(HONEST){const rest=others.filter(r=>r!==rv).sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));others=(rv?[rv]:[]).concat(rest).slice(0,6)}
  return{me,others,rv}}
/* the side a pick took, from its label: home, away, over or under */
function sideOf(p){const g=p.g,l=String(p.label||'');if(/^over/i.test(l))return'over';if(/^under/i.test(l))return'under';if(g&&l.startsWith(g.home.abbr))return'home';if(g&&l.startsWith(g.away.abbr))return'away';return null}
function optsOf(p){return/^(over|under)/i.test(String(p.label||''))?[['over','Over'],['under','Under']]:[['away',p.g.away.abbr],['home',p.g.home.abbr]]}
const LINES='rush-reads-lines-v1';const lines=()=>{try{return JSON.parse(localStorage.getItem(LINES))||{}}catch(e){return{}}};function say(k,t){t=String(t||'').trim().slice(0,80);if(!t)return;const L=lines();(L[k]=L[k]||[]).push({t,at:Date.now()});try{localStorage.setItem(LINES,JSON.stringify(L))}catch(e){}render()}
const keyOf=(id,p)=>id+'|'+p.league+'|'+p.gameId+'|'+(p.t||'');
const started=g=>g.state!=='pre'||Date.now()>=g.date;
/* one card per player per game, soonest kickoff first. Sealed cards come from the Field's picks; once a game starts its
   card is kept from the last time it was seen sealed (rush-reads-cards-v1) and flips, graded from the final score. */
const SNAP='rush-reads-cards-v1';
const snap=()=>{try{return JSON.parse(localStorage.getItem(SNAP))||{}}catch(e){return{}}};
function gradeOf(p){const g=p.g;if(!g||g.state!=='post')return'open';const H=+g.home.score,A=+g.away.score;if(isNaN(H)||isNaN(A))return'open';const s=sideOf(p),n=parseFloat((String(p.label).match(/[-+]?d+(.d+)?/)||[])[0]);
  if(s==='over'||s==='under'){if(isNaN(n))return'open';const t=H+A;return t===n?'push':(t>n)===(s==='over')?'won':'lost'}
  const mine=s==='home'?H:A,theirs=s==='home'?A:H;if(p.t==='spread'&&!isNaN(n)){const d=mine+n-theirs;return d===0?'push':d>0?'won':'lost'}return mine===theirs?'push':mine>theirs?'won':'lost'}
function cardsFor(r){let ps=[];try{ps=RW.playerPicks(r.id,GAMES)||[]}catch(e){}const horizon=Date.now()+36*36e5,seen=new Set,S=snap();
  const sealed=ps.filter(p=>p.g&&p.g.state==='pre'&&p.g.date>Date.now()&&p.g.date<horizon&&sideOf(p)).sort((a,b)=>a.g.date-b.g.date).filter(p=>{const k=p.league+p.gameId;if(seen.has(k))return false;seen.add(k);return true}).slice(0,HONEST?4:3);
  sealed.forEach(p=>{S[keyOf(r.id,p)]={id:r.id,league:p.league,gameId:String(p.gameId),t:p.t,label:p.label,market:p.market,date:p.g.date}});
  const flipped=Object.entries(S).filter(([k,c])=>c.id===r.id&&c.date<=Date.now()&&c.date>Date.now()-12*36e5).map(([k,c])=>{const g=GAMES.find(x=>x.league===c.league&&String(x.id)===c.gameId);if(!g)return null;const p={league:c.league,gameId:c.gameId,t:c.t,label:c.label,market:c.market,g};p.status=gradeOf(p);return p}).filter(Boolean);
  for(const k in S)if(S[k].date<Date.now()-48*36e5)delete S[k];try{localStorage.setItem(SNAP,JSON.stringify(S))}catch(e){}
  return sealed.concat(flipped)}
function myPickOn(g){try{const p=Rush.picks({week:Rush.week().id}).find(q=>String(q.gameId)===String(g.id)&&!q.legs);if(!p)return null;const l=String(p.label||'');return /^over/i.test(l)?'over':/^under/i.test(l)?'under':l.startsWith(g.home.abbr)?'home':l.startsWith(g.away.abbr)?'away':null}catch(e){return null}}
function sideName(p,s){return s==='over'?'Over':s==='under'?'Under':s==='home'?p.g.home.abbr:p.g.away.abbr}
function card(r,p,isMu){const R=reads(),k=keyOf(r.id,p),mine=R[k],truth=sideOf(p),g=p.g,flip=started(g),mySide=myPickOn(g);
  const crowd=HONEST?0:Math.floor(hash(k+'c')*5);const stack=1000+Math.round((r.units||0)*10);
  let h=`<div class="rd-card${isMu?' rd-mu':''}"><div class="rd-who"><a href="player.html?u=${encodeURIComponent(r.id)}">${AV(r.name)}<span style="min-width:0"><b>${esc(r.name)}</b><small>${isMu?'Your matchup · ':''}#${r.rank} · ${fmt(stack)} Stack</small></span></a><div class="rd-clock">${flip?(g.state==='post'?'Final':'Flipped'):left(g.date-Date.now())}<small>${flip?esc(g.away.abbr+' '+(g.away.score??'')+' '+g.home.abbr+' '+(g.home.score??'')):'FLIPS '+etTime(g.date)}</small></div></div>`;
  if(!flip){h+=`<div class="rd-game"><div class="rd-sealed"><b>${esc(g.away.abbr)} at ${esc(g.home.abbr)}</b><span>${esc(String(p.market||'Pick').toUpperCase())}<br>SEALED</span></div><div class="rd-stake">${p.stake?fmt(p.stake)+' Stack riding':''}</div></div><div class="rd-calls">${optsOf(p).map(([v,t])=>`<button type="button" data-k="${esc(k)}" data-v="${v}" class="${mine===v?'rd-on':''}" aria-pressed="${mine===v}">${esc(t)}</button>`).join('')}</div>`;
    const bits=[];if(mine)bits.push(`Your read: <b style="color:var(--fg)">${esc(sideName(p,mine))}</b>. It scores at ${etTime(g.date)}.`);else bits.push(`Which side did ${esc(r.name.split(' ')[0])} take?`);if(mySide)bits.push(`You are on <span class="rd-side">${esc(sideName(p,mySide))}</span>.`);if(crowd)bits.push(`${crowd} other${crowd>1?'s':''} read this.`);h+=`<div class="rd-sub" style="margin:0;font-size:14px">${bits.join(' ')}</div>`}
  else{const st=p.status==='rd-won'?'rd-won':p.status==='rd-lost'?'rd-lost':'';h+=`<div class="rd-game"><div class="rd-open"><b>${esc(p.label)}</b><em class="rd-${st}">${st==='rd-won'?'Hit':st==='rd-lost'?'Missed':'Live'}</em></div></div>`;
    h+=mine?`<div class="rd-res ${mine===truth?'rd-right':'rd-wrong'}">${mine===truth?'Read right':'Misread'}: you called ${esc(sideName(p,mine))}</div>`:`<div class="rd-res rd-none">You did not read this one</div>`;
    if(mySide&&(['over','under'].includes(mySide)===['over','under'].includes(truth)))h+=`<div><span class="rd-side ${mySide===truth?'rd-same':'rd-opp'}">${mySide===truth?'Same side as you':'Against you'}</span></div>`;
    const L=lines()[k]||[];h+=L.map(x=>`<div class="rd-line">${AV(Rush.me().handle||'You',1)}<span><b>You</b> ${esc(x.t)}</span></div>`).join('');
    if(!L.length&&mine)h+=`<div class="rd-quick">${(mine===truth?['Called it','Too easy','Read you like a book']:['You got me','Next time','Bold pick']).map(q=>`<button type="button" data-say="${esc(k)}" data-t="${esc(q)}">${esc(q)}</button>`).join('')}<button type="button" data-type="${esc(k)}">Type</button></div>`}
  return h+'</div>'}
function render(){if(!GAMES.length)return;const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('.rd-type'))return;const {others,rv}=people();
  const R=reads();let right=0,pending=0,nextFlip=Infinity;const all=[];
  others.forEach(r=>cardsFor(r).forEach(p=>{all.push({r,p});const v=R[keyOf(r.id,p)];if(!started(p.g))nextFlip=Math.min(nextFlip,p.g.date);if(v){if(started(p.g)){if(v===sideOf(p))right++}else pending++}}));
  const scored=all.filter(x=>R[keyOf(x.r.id,x.p)]&&started(x.p.g)).length;
  let h=`<div><h1>Reads ${HONEST?'<span class="rd-hon">7 PLAYERS</span>':''}</h1><p class="rd-sub">Every pick is sealed until kickoff. Call which side a player took. At kickoff it flips for everyone.</p></div>`;
  h+=`<div class="rd-tiles"><div class="rd-tile"><b>${scored?right+'/'+scored:'-'}</b><span>Read right</span></div><div class="rd-tile"><b>${pending}</b><span>Waiting to flip</span></div><div class="rd-tile"><b>${nextFlip<Infinity?etTime(nextFlip).replace(' ',''):'-'}</b><span>Next flip</span></div></div>`;
  const sealed0=all.filter(x=>!started(x.p.g));const TL={};sealed0.forEach(x=>{const t=x.p.g.date;(TL[t]=TL[t]||{n:0,r:0}).n++;if(R[keyOf(x.r.id,x.p)])TL[t].r++});const tk=Object.keys(TL).map(Number).sort((a,b)=>a-b).slice(0,8);
  if(tk.length)h+=`<div class="rd-tl" aria-label="Tonight's flips">${tk.map((t,i)=>`<div class="${i===0?'rd-nx':''}"><b>${etTime(t)}</b><span>${TL[t].n} sealed · ${TL[t].r} read</span></div>`).join('')}</div>`;
  const sealed=all.filter(x=>!started(x.p.g)),flipped=all.filter(x=>started(x.p.g)).sort((a,b)=>b.p.g.date-a.p.g.date);
  const muCards=rv?sealed.filter(x=>x.r===rv):[],rest=sealed.filter(x=>x.r!==rv);
  if(rv){const mr=all.filter(x=>x.r===rv&&started(x.p.g)&&R[keyOf(x.r.id,x.p)]),mrr=mr.filter(x=>R[keyOf(x.r.id,x.p)]===sideOf(x.p)).length;h+=`<div class="rd-lbl"><span>Your matchup</span><small>${esc(rv.name)}</small></div><div class="rd-duel">Read duel<span>You read ${esc(rv.name.split(' ')[0])}: ${mr.length?mrr+' of '+mr.length:'none scored yet'} · ${HONEST?esc(rv.name.split(' ')[0])+' has not read you':esc(rv.name.split(' ')[0])+' read you: '+Math.floor(hash(rv.id+'duel')*3)+' right'}</span></div>`;h+=muCards.length?muCards.map(x=>card(x.r,x.p,true)).join(''):`<div class="rd-empty">${esc(rv.name)} has no sealed pick in the next day. When they pick, it shows here first.</div>`}
  h+=`<div class="rd-lbl"><span>Sealed now</span><small>${rest.length} to read</small></div>`;
  h+=rest.length?rest.map(x=>card(x.r,x.p,false)).join(''):`<div class="rd-empty">No sealed picks to read right now. They appear as soon as anyone in the Field picks a game.</div>`;
  let mine=[];try{mine=Rush.picks({status:'open'}).filter(p=>p.start>Date.now())}catch(e){}
  h+=`<div class="rd-lbl"><span>Your sealed picks</span><small>${mine.length}</small></div>`;
  h+=mine.length?mine.map(p=>{const n=HONEST?0:Math.floor(hash(p.id+'r')*5);return`<div class="rd-mine"><b>${esc(p.game)}</b><small>${n?n+' read you':'Nobody has read you yet'}<br>flips ${etTime(p.start)}</small></div>`}).join(''):`<div class="rd-empty">You have no sealed pick, so the Field has nothing to read on you. <a href="board.html">Make a pick</a> and it seals until kickoff.</div>`;
  if(flipped.length){h+=`<div class="rd-lbl"><span>Flipped</span><small>${right} right of ${scored}</small></div>`+flipped.slice(0,12).map(x=>card(x.r,x.p,x.r===rv)).join('')}
  h+=`<div class="rd-foot">${HONEST?'Honest view: exactly 7 players, nothing generated. Every card is a pick in the Field.':'Full Field view. Counts of other readers are simulated in the prototype.'}<a href="lounge.html${HONEST?'':'?field=7'}">${HONEST?'Show the full Field':'Honest view: 7 players'}</a></div>`;
  const el=$('reads');if(el._h!==h){el.innerHTML=h;el._h=h}}
document.addEventListener('click',e=>{const sy=e.target.closest('[data-say]');if(sy){say(sy.dataset.say,sy.dataset.t);return}const ty=e.target.closest('[data-type]');if(ty){const box=document.createElement('form');box.className='rd-type';box.innerHTML='<input maxlength="80" placeholder="One line about this flip" autocomplete="off"><button type="submit">Say it</button>';ty.parentElement.replaceWith(box);const inp=box.querySelector('input');inp.focus();box.addEventListener('submit',ev=>{ev.preventDefault();say(ty.dataset.type,inp.value)});return}const b=e.target.closest('[data-k]');if(!b)return;const R=reads(),k=b.dataset.k;if(R[k]===b.dataset.v)delete R[k];else R[k]=b.dataset.v;saveReads(R);render()});
async function load(){try{GAMES=await RW.load()}catch(e){GAMES=RW.cached()||[]}render()}
GAMES=(window.RW&&RW.cached&&RW.cached())||[];render();load();setInterval(load,60000);setInterval(render,30000);
</script>
</body>
</html>
