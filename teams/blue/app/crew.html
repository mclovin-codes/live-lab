<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush Crew</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Crew: the countdown that keeps everyone's boost alive, the boost meter, the invite, the members and what happened. */
:root{--cw-bg:#0B1118;--cw-card:#121A23;--cw-card2:#1A2530;--cw-line:rgba(255,255,255,.07);--cw-fg:#fff;--cw-mut:#9AA8B6;--cw-dim:#66768A;--cw-acc:#00BFFF;--cw-win:#10B981;--cw-warn:#F59E0B;--cw-hot:#FF5A5F;--cw-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{background:var(--cw-bg);color:var(--cw-fg);font:15px/1.4 var(--cw-font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.cw{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.cw-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cw-top h1{margin:0;font:800 32px/1.1 var(--cw-font);letter-spacing:-.02em;flex:1}
.card{background:var(--cw-card);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.eyebrow{font:700 11px var(--cw-font);letter-spacing:.08em;text-transform:uppercase;color:var(--cw-mut)}
h2{margin:0;font:700 20px/1.2 var(--cw-font);letter-spacing:-.01em;text-wrap:balance}
p{margin:0;color:var(--cw-mut);font-size:14px;line-height:1.45}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:700 16px var(--cw-font);background:var(--cw-acc);color:#00131C;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--cw-card2);color:var(--cw-fg)}.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input.in{width:100%;border:0;border-radius:12px;padding:13px 14px;background:var(--cw-card2);color:var(--cw-fg);font:600 16px var(--cw-font);outline:none}input.in:focus{box-shadow:0 0 0 2px var(--cw-acc)}
/* the countdown */
.clock{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:118px;height:118px}.ring svg{width:118px;height:118px;transform:rotate(-90deg)}.ring .bg{fill:none;stroke:var(--cw-card2);stroke-width:10}.ring .fg{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 21px/1 var(--cw-font);letter-spacing:-.01em}.ring .t small{font:600 10px var(--cw-font);color:var(--cw-mut);letter-spacing:.08em;margin-top:5px;text-transform:uppercase}
.clock b.st{display:block;font:800 26px/1.1 var(--cw-font);letter-spacing:-.02em}
.alive .fg{stroke:var(--cw-win)}.alive b.st{color:var(--cw-win)}.warn .fg{stroke:var(--cw-warn)}.warn b.st{color:var(--cw-warn)}.hot .fg{stroke:var(--cw-hot)}.hot b.st{color:var(--cw-hot)}.cold .fg,.small .fg{stroke:var(--cw-dim)}.cold b.st,.small b.st{color:var(--cw-mut)}
@media (prefers-reduced-motion:no-preference){.hot .ring{animation:beat 1.2s ease-in-out infinite}}@keyframes beat{50%{transform:scale(1.04)}}
.settle{font-size:13px;color:var(--cw-mut);border-top:.5px solid var(--cw-line);padding-top:10px}.settle b{color:var(--cw-fg)}
/* the boost meter */
.meter{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}.meter i{height:22px;border-radius:5px;background:var(--cw-card2)}.meter i.on{background:var(--cw-acc)}.meter i.next{background:transparent;box-shadow:inset 0 0 0 2px var(--cw-acc)}.meter.off i.on{background:#3A4A5A}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mrow b{font:800 30px/1 var(--cw-font);letter-spacing:-.02em;white-space:nowrap}.mrow b small{font-size:15px;color:var(--cw-mut);font-weight:700}.mrow span{font-size:13px;color:var(--cw-mut);text-align:right}
/* members */
.mem{display:grid;gap:2px}.mem>div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:.5px solid var(--cw-line)}.mem>div:first-child{border-top:0}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 13px var(--cw-font);color:#00131C}
.mem b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mem small{display:block;color:var(--cw-mut);font-size:12px}.tag{font:700 10px var(--cw-font);letter-spacing:.06em;color:var(--cw-mut);border:1px solid #3A4A5A;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:1px}.tag.new{color:var(--cw-win);border-color:rgba(16,185,129,.5)}
.log{display:grid;gap:8px;font-size:13px;color:var(--cw-mut)}.log div{display:grid;grid-template-columns:62px 1fr;gap:8px}.log time{color:var(--cw-dim)}
.rules{display:grid;gap:8px;font-size:14px;color:var(--cw-mut);padding-left:18px;margin:0}.rules b{color:var(--cw-fg)}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}details summary::after{content:"›";color:var(--cw-mut)}details[open] summary::after{content:"⌄"}
.inv{font-size:13px;color:var(--cw-mut);background:var(--cw-card2);border-radius:12px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.req{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:.5px solid var(--cw-line)}.req:first-of-type{border-top:0}.req b{display:block;font-weight:600}.req small{display:block;color:var(--cw-mut);font-size:12px}
.mini{border:0;border-radius:10px;padding:8px 12px;font:700 13px var(--cw-font);background:var(--cw-acc);color:#00131C;cursor:pointer;white-space:nowrap}.mini.ghost{background:var(--cw-card2);color:var(--cw-fg)}.two{display:flex;gap:6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}.pick button{border:0;border-radius:18px;padding:7px 12px;background:var(--cw-card2);color:var(--cw-fg);font:600 13px var(--cw-font);cursor:pointer}.pick button.on{background:var(--cw-acc);color:#00131C}
.flash{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#0B1118;font-weight:700;padding:10px 16px;border-radius:22px;z-index:90;max-width:calc(100% - 32px)}
.curve{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:64px}.curve i{background:var(--cw-acc);border-radius:4px 4px 0 0;opacity:.85}.curve i.z{background:#3A4A5A}
.ax{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10px;color:var(--cw-dim);text-align:center}
</style>
</head>
<body data-tab="crew">
<div class="cw" id="cw"></div>
<div class="flash" id="flash" hidden></div>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="contest-kit.js"></script>
<script src="shared/crew.js"></script>
<script src="shared/nav.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=Rush.crew,R=C.RULES,HR=36e5;
const AVC=['#00BFFF','#10B981','#F59E0B','#A78BFA','#F472B6','#34D399','#60A5FA','#FBBF24','#FB7185','#22D3EE','#C084FC','#4ADE80'];
const ini=n=>String(n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const when=t=>new Date(t).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'});
const x1=v=>'+'+v.toFixed(1)+'x';
function flash(t){const f=$('flash');f.textContent=t;f.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>f.hidden=true,2400)}
async function share(c){const text=C.invite(c),url=C.link(c);try{if(navigator.share){await navigator.share({title:'Join '+c.name+' on Rush',text,url});return flash('Invite sent')}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+' '+url);flash('Invite copied')}catch(e){const el=$('invtxt');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}flash('Copy the invite below')}}

/* the curve: what a crew of n pays everyone */
function curve(n){return`<div class="curve" aria-hidden="true">${Array.from({length:R.max},(_,i)=>{const b=Math.min(R.cap,R.per*i);return`<i class="${i<1?'z':''}" style="height:${Math.max(4,b/R.cap*100)}%;${n&&i+1===n?'outline:2px solid #fff;outline-offset:1px':''}"></i>`}).join('')}</div><div class="ax">${Array.from({length:R.max},(_,i)=>`<span>${i+1}</span>`).join('')}</div>`}
function rules(){return`<details class="card"><summary>How a crew works</summary><ul class="rules">
<li><b>+0.1x for every crewmate</b> on everyone's Prize Multiplier, up to <b>+1.0x</b> with 11 crewmates. A crew holds 12.</li>
<li><b>Alive</b> means 3 or more members and the timer running. Below that, the boost is off.</li>
<li><b>Someone new to Rush</b> joining resets the timer to <b>7 days</b>. A player already in the Field moving in adds <b>48 hours</b>.</li>
<li>At zero the crew goes <b>cold</b>: everyone keeps their place, the boost is off until someone new joins. Then it is back in full.</li>
<li>Your prize counts the boost you hold <b>when the week settles</b>, Tuesday 4 AM ET.</li>
<li>One crew a week. Leave and you wait for next week to join another.</li></ul></details>`}

function noCrew(){const p=C.pending(),me=Rush.me();let h='';
  if(p){const cn=p.name||'a crew';if(inviter==null)inviter=p.by||'';let names=[];try{names=Rush.field().filter(r=>!r.me).map(r=>r.name)}catch(e){}if(p.by&&!names.includes(p.by))names.unshift(p.by);const shown=names.filter(n=>!pickQ||n.toLowerCase().includes(pickQ.toLowerCase())).slice(0,8);
    h+=`<div class="card"><div class="eyebrow">You are invited</div><h2>Join ${esc(cn)}</h2><p>Your join lifts everyone's Prize Multiplier, yours included, and restarts the crew's timer${me.entered?' by 48 hours':' to 7 days, because you are new to Rush'}.</p><div class="eyebrow">Who invited you?</div><div class="pick" id="pick">${shown.map(n=>`<button data-a="who" data-n="${esc(n)}" class="${n===inviter?'on':''}">${esc(n)}</button>`).join('')}</div><input class="in" id="pickq" placeholder="Not them? Search the Field" value="${esc(pickQ)}" autocomplete="off"><button class="btn" data-a="join"${inviter?'':' disabled style="opacity:.5"'}>${inviter?'Ask '+esc(inviter)+' to confirm you':'Pick who invited you'}</button><p style="font-size:12px">They confirm with one tap and you are in. The link only fills this in; nothing counts until you both say yes.</p></div>`}
  h+=`<div class="card"><div class="eyebrow">Crews</div><h2>Bring your people. Everyone's multiplier goes up.</h2><p>Every crewmate adds +0.1x to every member's Prize Multiplier, up to +1.0x. The boost stays alive while new people keep joining, so the whole crew recruits.</p>${curve(0)}<p style="font-size:12px">Crew size and the boost each member gets.</p></div>
  <div class="card"><div class="eyebrow">Start a crew</div><input class="in" id="cname" maxlength="24" placeholder="Crew name" value="${esc(me.handle&&me.handle!=='You'?me.handle+"'s crew":'')}"><button class="btn" data-a="create">Start a crew</button><p style="font-size:12px">Prototype: SIM crewmates join on their own schedule so you can watch the timer. Your invite link works on a friend's phone.</p></div>`+rules();
  return h}

function inCrew(c){const now=Date.now(),frac=c.left/R.winNew,Cc=2*Math.PI*52,off=Cc*(1-Math.min(1,frac));
  const st={alive:'Boost alive',warn:'Under 48 hours',hot:'Hurry',cold:'Cold',small:'Not on yet'}[c.stage];
  const line=c.stage==='small'?`${R.minAlive-c.size} more ${R.minAlive-c.size>1?'members switch':'member switches'} the boost on.`:c.stage==='cold'?`Your crew's ${x1(c.full)} is off for all ${c.size}. One new member brings it all back.`:`Someone new by <b>${esc(when(c.until))}</b> keeps ${x1(c.boost)} for all ${c.size}.`;
  const holds=c.settles?(c.stage==='cold'||c.stage==='small'?`The week settles <b>${esc(when(c.settles))}</b>. Get the boost back on before then or it does not count this week.`:c.until>=c.settles?`The week settles <b>${esc(when(c.settles))}</b>. Your boost holds through it as things stand.`:`The week settles <b>${esc(when(c.settles))}</b>. The timer runs out <b>${Math.round((c.settles-c.until)/HR)} h</b> before that. ${Math.ceil((c.settles-c.until)/R.winNew)>1?"Keep new people coming to cover it.":"One more new member covers it."}`):'';
  const mates=Math.max(0,c.size-1),on=Math.min(11,mates);
  let h='';
  if(c.mine==='pending')h+=`<div class="card"><div class="eyebrow">Almost in</div><h2>Waiting for ${esc(c.by)} to confirm you</h2><p>One tap on their phone and you are in ${esc(c.name)}. The crew boost counts for you from then.</p></div>`;
  if(c.reqsIn.length)h+=`<div class="card"><div class="eyebrow">Confirm your people · ${c.reqsIn.length}</div>${c.reqsIn.map(r=>`<div class="req"><span class="av" style="background:#3A4A5A;color:#fff">${esc(ini(r.name))}</span><span><b>${esc(r.name)}${r.isNew?'<span class="tag new">NEW TO RUSH</span>':''}${r.sim?'<span class="tag">SIM</span>':''}</b><small>says you invited them · ${r.isNew?'confirming resets the timer to 7 days':'confirming adds 48 h'}</small></span><span class="two"><button class="mini" data-a="ok" data-id="${esc(r.id)}">Confirm</button><button class="mini ghost" data-a="no" data-id="${esc(r.id)}" aria-label="Not now">&#215;</button></span></div>`).join('')}</div>`;
  h+=`<div class="card ${c.stage}"><div class="clock"><div class="ring"><svg viewBox="0 0 118 118"><circle class="bg" cx="59" cy="59" r="52"/><circle class="fg" cx="59" cy="59" r="52" stroke-dasharray="${Cc.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="t"><span data-left>${c.stage==='small'?'--':C.clock(c.left)}</span><small>${c.stage==='cold'?'cold':'left'}</small></div></div><div><div class="eyebrow">${esc(c.name)}</div><b class="st">${st}</b><p>${line}</p></div></div><div class="settle">${holds}</div></div>`;
  h+=`<div class="card"><div class="mrow"><b>${x1(c.boost)}<small> ${c.boost?'on':'off'}</small></b><span>${c.size} in the crew${c.room?` · next member makes it ${x1(c.next)}`:' · full'}</span></div><div class="meter${c.boost?'':' off'}">${Array.from({length:11},(_,i)=>`<i class="${i<on?'on':i===on&&c.room?'next':''}"></i>`).join('')}</div><p style="font-size:12px">On top of your own referral boost. Your Prize Multiplier tops out at 3x.</p></div>`;
  h+=`<div class="card"><div class="eyebrow">Keep it alive</div><h2>${c.stage==='cold'?'Bring someone new in':'Who is next?'}</h2><p>Someone new to Rush resets the timer to 7 days for everyone. A player from the Field adds 48 hours.</p><div class="row2"><button class="btn" data-a="share">Invite</button><button class="btn ghost" data-a="copy">Copy link</button></div><div class="inv" id="invtxt">${esc(C.invite(c))} ${esc(C.link(c))}</div></div>`;
  const rec=C.recent().filter(x=>!addQ||x.name.toLowerCase().includes(addQ.toLowerCase())).slice(0,6);
  h+=`<div class="card"><div class="eyebrow">Already on Rush?</div><h2>Add a friend who joined lately</h2><p>Players who joined in the last 14 days. They confirm with one tap; nothing counts until they do.</p><input class="in" id="addq" placeholder="Search the Field" value="${esc(addQ)}" autocomplete="off">${c.reqsOut.map(r=>`<div class="req"><span class="av" style="background:#3A4A5A;color:#fff">${esc(ini(r.name))}</span><span><b>${esc(r.name)}</b><small>waiting for them to confirm</small></span><button class="mini ghost" data-a="no" data-id="${esc(r.id)}">Cancel</button></div>`).join('')}${rec.map(x=>`<div class="req"><span class="av" style="background:#1A2530;color:#fff">${esc(ini(x.name))}</span><span><b>${esc(x.name)}${x.isNew?'<span class="tag new">NEW</span>':''}</b><small>joined ${x.days} day${x.days>1?'s':''} ago</small></span><button class="mini" data-a="add" data-n="${esc(x.name)}">Add</button></div>`).join('')}</div>`;
  h+=`<div class="card"><div class="eyebrow">The crew · ${c.size} of ${R.max}</div><div class="mem">${c.members.slice().sort((a,b)=>b.joined-a.joined).map((m,i)=>`<div><span class="av" style="background:${AVC[i%AVC.length]}">${esc(ini(m.name))}</span><span><b>${esc(m.me?'You':m.name)}${m.isNew?'<span class="tag new">NEW TO RUSH</span>':''}${m.sim?'<span class="tag">SIM</span>':''}</b><small>joined ${esc(ago(m.joined))}</small></span><small>${m.isNew?'+7 days':'+48 h'}</small></div>`).join('')}</div></div>`;
  if(c.log&&c.log.length)h+=`<div class="card"><div class="eyebrow">What happened</div><div class="log">${c.log.slice(0,8).map(l=>`<div><time>${esc(ago(l.t).replace(' ago',''))}</time><span>${esc(l.text)}</span></div>`).join('')}</div></div>`;
  h+=`<div class="card"><div class="eyebrow">The curve</div>${curve(c.size)}<p style="font-size:12px">Crew size and the boost each member gets. Yours is outlined.</p></div>`+rules()+`<button class="btn ghost" data-a="leave" style="color:var(--cw-mut)">Leave the crew</button>`;
  return h}

let confirmLeave=false,inviter=null,pickQ='',addQ='';
function render(){const c=C.get();$('cw').innerHTML=`<div class="cw-top"><h1>Crew</h1><span data-rush-pill></span></div>`+(c?inCrew(c):noCrew());const bd=document.getElementById('rpill-band');if(bd)bd.remove();try{Rush.nav.refresh()}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,c=C.get();
  if(a==='create'){const r=C.create(($('cname')||{}).value);if(!r)return flash('You left a crew this week. Start a new one next week.');flash('Crew started');render()}
  else if(a==='who'){inviter=b.dataset.n;render()}
  else if(a==='ok'){if(!C.confirm(b.dataset.id))flash('The crew is full');else flash('Confirmed');render()}
  else if(a==='no'){C.decline(b.dataset.id);render()}
  else if(a==='add'){const r=C.add(b.dataset.n);flash(r.ok?'Added. Waiting for them to confirm':r.why);render()}
  else if(a==='join'){const p=C.pending();if(!inviter)return flash('Pick who invited you');const r=C.join(p.code,p.name,inviter);if(!r.ok)return flash(r.why);history.replaceState(null,'',location.pathname);flash('You are in');render()}
  else if(a==='share'&&c)share(c);
  else if(a==='copy'&&c){navigator.clipboard.writeText(C.invite(c)+' '+C.link(c)).then(()=>flash('Invite copied'),()=>flash('Copy the invite below'))}
  else if(a==='leave'){if(!confirmLeave){confirmLeave=true;b.textContent='Tap again to leave. You cannot join another crew this week.';setTimeout(()=>{confirmLeave=false;render()},4000);return}C.leave();confirmLeave=false;render()}});
document.addEventListener('input',e=>{if(e.target.id==='pickq'){pickQ=e.target.value;render();const n=$('pickq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}else if(e.target.id==='addq'){addQ=e.target.value;render();const n=$('addq');n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
render();C.on(()=>{const ae=document.activeElement;if(ae&&(ae.id==='pickq'||ae.id==='addq'))return;render()});
/* the clock ticks every second; a stage change redraws the page */
let lastStage=null;setInterval(()=>{const c=C.get();if(!c){return}const sig=c.stage+'|'+c.size+'|'+c.reqsIn.length+'|'+c.reqsOut.length+'|'+c.mine;if(sig!==render.sig){const ae=document.activeElement;if(!(ae&&(ae.id==='pickq'||ae.id==='addq'))){render.sig=sig;render();return}}const el=document.querySelector('[data-left]');if(el&&c.stage!=='small')el.textContent=C.clock(c.left)},1000);
</script>
</body>
</html>
