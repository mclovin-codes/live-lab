<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Contests · Rush</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Contests: large title, join by code, your contests, create form (inset grouped settings), public contests. */
:root{--k-bg:#0B1118;--k-card:#121A23;--k-card2:#1A2530;--k-line:rgba(255,255,255,.07);--k-fg:#fff;--k-mut:#9AA8B6;--k-dim:#66768A;--k-acc:#00BFFF;--k-win:#10B981;--k-loss:#D95151;--k-warn:#F59E0B;--k-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{background:var(--k-bg);color:var(--k-fg);font:15px/1.38 var(--k-font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.k-wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.k-back{display:inline-block;color:var(--k-acc);text-decoration:none;font:600 15px var(--k-font);padding:6px 0 4px}
h1{margin:0;font:800 32px/1.1 var(--k-font);letter-spacing:-.02em}.k-sub{color:var(--k-mut);font-size:13px;margin:2px 0 14px}
.k-sec{background:var(--k-card);border-radius:16px;padding:14px;margin-bottom:14px}
.k-sec h2{margin:0 0 10px;font:700 18px/1.2 var(--k-font);display:flex;justify-content:space-between;align-items:baseline;gap:8px}.k-sec h2 span{font:500 13px var(--k-font);color:var(--k-mut)}
.k-row{display:flex;gap:8px;min-width:0}.k-row>.k-in{width:0}
input.k-in,select.k-in{flex:1;min-width:0;padding:12px;border-radius:11px;border:0;background:var(--k-card2);color:var(--k-fg);font:500 16px var(--k-font)}
input.k-code{text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.k-btn{padding:12px 16px;border-radius:12px;border:0;background:linear-gradient(135deg,#00C0FF,#0080FF);color:#fff;font:700 15px var(--k-font);cursor:pointer;white-space:nowrap;text-decoration:none;text-align:center}
.k-btn.ghost{background:var(--k-card2);color:var(--k-fg)}.k-btn.block{display:block;width:100%}
.k-msg{font-size:13px;margin-top:8px;color:var(--k-mut)}.k-msg.err{color:#FF8A8A}
.k-c{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px;border-radius:12px;background:var(--k-card2);margin-top:8px;text-decoration:none;color:inherit}
.k-c:first-of-type{margin-top:0}.k-c b{font:600 16px var(--k-font)}.k-c small{color:var(--k-mut);font-size:12.5px;grid-column:1}
.k-c .rt{text-align:right;font:700 15px var(--k-font)}.k-c .rt i{display:block;font:500 11.5px var(--k-font);color:var(--k-mut);font-style:normal}
.k-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;grid-column:1/-1}
.k-chip{font:600 11px var(--k-font);padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--k-mut)}.k-chip.acc{background:rgba(0,191,255,.16);color:var(--k-acc)}.k-chip.win{background:rgba(16,185,129,.16);color:var(--k-win)}.k-chip.warn{background:rgba(245,158,11,.16);color:var(--k-warn)}
.k-empty{color:var(--k-mut);font-size:14px}
.k-f{display:grid;gap:14px}
.k-fl{display:grid;gap:6px}.k-fl>label,.k-fl>span{font:600 13px var(--k-font);color:var(--k-mut)}
.k-seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:10px;background:var(--k-card2)}.k-seg button{font:600 13px var(--k-font);color:var(--k-mut);background:none;border:0;padding:9px 0;border-radius:8px;cursor:pointer}.k-seg button.on{background:#2A3644;color:var(--k-fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.k-tg{display:flex;flex-wrap:wrap;gap:6px}.k-tg button{font:600 13px var(--k-font);padding:8px 12px;border-radius:99px;border:0;background:var(--k-card2);color:var(--k-mut);cursor:pointer}.k-tg button.on{background:rgba(0,191,255,.18);color:var(--k-acc);box-shadow:inset 0 0 0 1px rgba(0,191,255,.5)}
.k-sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--k-card2)}.k-sw span{font-size:14px}.k-sw small{display:block;color:var(--k-mut);font-size:12px}
.k-sw button{width:50px;height:30px;border-radius:99px;border:0;background:#3A4A5A;position:relative;cursor:pointer;flex:none}.k-sw button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .18s}.k-sw button.on{background:var(--k-win)}.k-sw button.on::after{left:23px}
.k-hint{font-size:12.5px;color:var(--k-dim)}
details.k-arch summary{cursor:pointer;color:var(--k-mut);font:600 14px var(--k-font)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.k-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
</style>
</head>
<body data-tab="ranks">
<div class="k-wrap">
 <a class="k-back" href="ranks.html">&lsaquo; Ranks</a>
 <h1>Contests</h1>
 <div class="k-sub" id="k-sub">Run your own or join one</div>
 <div id="k-main"></div>
</div>
<script src="shared/state.js"></script>
<script src="week-games.js"></script>
<script src="contest-kit.js"></script>
<script src="shared/crew.js"></script>
<script src="shared/nav.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=n=>(n<0?'-':'+')+(Math.round(Math.abs(n)*10)/10).toFixed(1);
const LGN={nfl:'NFL',nba:'NBA',nhl:'NHL'};
let games=RW.cached()||[],showCreate=new URLSearchParams(location.search).get('new')==='1',msg='';
const dayName=d=>{const t=Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),17);return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'numeric',day:'numeric'}).format(new Date(t))};
const F={name:'',visibility:'private',leagues:['nfl','nba','nhl'],days:RW.days(RW.week()),close:'first',size:12,stack:1000,markets:{lines:true,props:true,parlays:true,live:true},reload:true,scoring:'units',ties:'split',stakeMin:0,stakeMax:'',lineMin:'',lineMax:'',slipMin:'',slipMax:'',injury:'none',fields:[],showFields:'commish'};
const INJ_TXT={none:'No protection: player props stand even if the player leaves injured.',h1:'1st half: a player who leaves injured before halftime and does not return voids the prop, stake back.',full:'Full game: any injury exit without a return voids the prop, stake back.'};
const JFN={note:'Ask joiners for a note'};
function grab(){const v=id=>{const e=$(id);return e?e.value:null};const n=v('k-name');if(n!=null)F.name=n;const sz=v('k-size');if(sz!=null&&sz!=='')F.size=Math.max(2,Math.min(500,Math.round(+sz)||F.size));const st=v('k-stack');if(st!=null&&st!=='')F.stack=Math.max(100,Math.min(100000,Math.round(+st)||F.stack));for(const k of ['stakeMin','stakeMax','lineMin','lineMax','slipMin','slipMax']){const x=v('k-'+k);if(x!=null)F[k]=x.trim()}}
function entryClose(f){const gs=(games||[]).filter(g=>f.leagues.includes(g.league)&&f.days.includes(RW.etDay(g.date)));if(f.close==='first')return gs.length?Math.min(...gs.map(g=>g.date)):null;if(f.close==='last')return gs.length?Math.max(...gs.map(g=>g.date)):null;return null}
function summary(c){const m=c.rules.markets,mk=[m.lines&&'game lines',m.props&&'props',m.parlays&&'parlays',m.live&&'live'].filter(Boolean).join(', ');return`${esc(c.schedule.leagues.map(k=>LGN[k]).join(' + '))} &middot; ${esc(c.schedule.days.length)} day${c.schedule.days.length>1?'s':''} &middot; ${c.rules.scoring==='record'?'scored on record':'scored on Units'} &middot; ${esc(mk)}`}
function myRow(c){try{const st=RC.standings(c,games),r=st.find(x=>x.me);return r?{r,of:st.length}:null}catch(e){return null}}
function card(c,joinable){const mr=!joinable&&myRow(c);const status=c.status==='closed'?'<span class="k-chip win">Final</span>':c.status==='archived'?'<span class="k-chip">Archived</span>':(c.schedule.entryClose&&Date.now()>c.schedule.entryClose)?'<span class="k-chip warn">Entry closed</span>':'<span class="k-chip acc">Open</span>';
 const col=!joinable&&RC.dot(c.id);return`<a class="k-c" href="contest.html?c=${encodeURIComponent(c.id)}"><b>${col?`<i class="k-dot" style="background:${col}"></i>`:''}${esc(c.name)}</b><span class="rt">${mr?`#${esc(mr.r.finish)}<i>of ${esc(mr.of)}</i>`:joinable?`${esc(c.size||'?')}<i>in the Field</i>`:''}</span><small>${summary(c)}</small><div class="k-chips">${status}<span class="k-chip">${c.visibility==='public'?'Public':'Private'}</span>${c.owner?'<span class="k-chip acc">You run it</span>':c.host?`<span class="k-chip">Run by ${esc(c.host)}</span>`:''}${mr?`<span class="k-chip">${esc(c.rules.scoring==='record'?`${mr.r.w}-${mr.r.l}`:U(mr.r.units)+' U')}</span>`:''}</div></a>`}
function tg(name,opts,vals){return`<div class="k-tg">${opts.map(([k,l])=>`<button type="button" data-tg="${name}:${k}" class="${vals.includes(k)?'on':''}">${l}</button>`).join('')}</div>`}
function seg(name,opts,val){return`<div class="k-seg">${opts.map(([k,l])=>`<button type="button" data-sg="${name}:${k}" class="${String(val)===String(k)?'on':''}">${l}</button>`).join('')}</div>`}
function sw(name,label,sub,on){return`<div class="k-sw"><span>${label}<small>${sub}</small></span><button type="button" role="switch" aria-checked="${on}" aria-label="${label}" data-sw="${name}" class="${on?'on':''}"></button></div>`}
function createForm(){const ec=entryClose(F);return`<div class="k-sec"><h2>New contest <span>You are the commissioner</span></h2><form class="k-f" id="k-form">
 <div class="k-fl"><label for="k-name">Name</label><input class="k-in" id="k-name" maxlength="40" placeholder="Monday Night Crew" value="${esc(F.name)}" required></div>
 <div class="k-fl"><span>Who can join</span>${seg('visibility',[['private','Private: code or link'],['public','Public: listed']],F.visibility)}</div>
 <div class="k-fl"><span>Sports</span>${tg('leagues',[['nfl','NFL'],['nba','NBA'],['nhl','NHL']],F.leagues)}</div>
 <div class="k-fl"><span>Days this week</span>${tg('days',RW.days(RW.week()).map(d=>[d,dayName(d)]),F.days)}</div>
 <div class="k-fl"><span>Entry closes</span>${seg('close',[['first','First game'],['last','Last game'],['none','Never']],F.close)}<span class="k-hint">${ec?'Closes '+new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date(ec))+' ET':F.close==='none'?'Friends can join any time this week':'No games match yet'}</span></div>
 <div class="k-fl"><span>Field size (simulated players fill open spots, up to 30)</span>${seg('size',[[6,'6'],[12,'12'],[20,'20'],[30,'30']],F.size)}<input class="k-in" id="k-size" type="number" inputmode="numeric" min="2" max="500" placeholder="Or type a number" value="${[6,12,20,30].includes(+F.size)?'':esc(F.size)}" aria-label="Field size"></div>
 <div class="k-fl"><span>Stack per entry</span>${seg('stack',[[500,'500'],[1000,'1,000'],[2000,'2,000']],F.stack)}<input class="k-in" id="k-stack" type="number" inputmode="numeric" min="100" max="100000" placeholder="Or type an amount" value="${[500,1000,2000].includes(+F.stack)?'':esc(F.stack)}" aria-label="Stack per entry"></div>
 <div class="k-fl"><span>Stake limits per pick</span><div class="k-row"><input class="k-in" id="k-stakeMin" type="number" inputmode="numeric" min="0" placeholder="Min" value="${esc(F.stakeMin)}" aria-label="Minimum stake"><input class="k-in" id="k-stakeMax" type="number" inputmode="numeric" min="1" placeholder="No max" value="${esc(F.stakeMax)}" aria-label="Maximum stake"></div><span class="k-hint">Leave Min at 0 for none and Max empty for no max.</span></div>
 <div class="k-fl"><span>Odds limits per line</span><div class="k-row"><input class="k-in" id="k-lineMin" inputmode="numeric" placeholder="Min, e.g. -500" value="${esc(F.lineMin)}" aria-label="Minimum odds per line"><input class="k-in" id="k-lineMax" inputmode="numeric" placeholder="No max" value="${esc(F.lineMax)}" aria-label="Maximum odds per line"></div></div>
 <div class="k-fl"><span>Odds limits per slip (parlays)</span><div class="k-row"><input class="k-in" id="k-slipMin" inputmode="numeric" placeholder="Min" value="${esc(F.slipMin)}" aria-label="Minimum slip odds"><input class="k-in" id="k-slipMax" inputmode="numeric" placeholder="No max, e.g. +2000" value="${esc(F.slipMax)}" aria-label="Maximum slip odds"></div><span class="k-hint">American odds. Empty means no limit. Picks outside the limits do not count in this contest.</span></div>
 <div class="k-fl"><span>Markets that count</span>${sw('lines','Game lines','Spread, moneyline, total and alternates',F.markets.lines)}${sw('props','Player props','Yards, catches, points and anytime scorers',F.markets.props)}${sw('parlays','Parlays','Multi-leg picks',F.markets.parlays)}${sw('live','Live picks','Picks placed during the game',F.markets.live)}</div>
 <div class="k-fl">${sw('reload','Reload allowed','One free Reload of the Stack',F.reload)}</div>
 <div class="k-fl"><span>Scoring</span>${seg('scoring',[['units','Units'],['record','Record (W-L)']],F.scoring)}</div>
 <div class="k-fl"><span>Ties</span>${seg('ties',[['split','Share the place'],['units','Break on Units']],F.ties)}</div>
 <div class="k-fl"><span>Injury protection for player props</span>${seg('injury',[['none','None'],['h1','1st half'],['full','Full game']],F.injury)}<span class="k-hint">${esc(INJ_TXT[F.injury])}</span></div>
 <div class="k-fl"><span>Joiner note (optional)</span>${tg('fields',Object.entries(JFN),F.fields)}<span class="k-hint">Joiners can leave you a short note when they enter.</span>${F.fields.length?seg('showFields',[['commish','Only you see them'],['contest','Everyone in the contest']],F.showFields):''}</div>
 <button class="k-btn block" type="submit">Create contest</button><button class="k-btn ghost block" type="button" data-cancel="1">Cancel</button></form></div>`}
function render(){const w=RW.week();$('k-sub').textContent=`Week ${w.n} · run your own or join one`;const list=RC.list(),mine=list.filter(c=>c.status!=='archived'),arch=list.filter(c=>c.status==='archived'),pub=RC.publicList().filter(p=>!list.some(c=>c.id===p.id));
 let h=`<div class="k-sec"><h2>Join with a code</h2><div class="k-row"><input class="k-in k-code" id="k-code" maxlength="6" placeholder="ABC123" aria-label="Contest code" autocomplete="off"><button class="k-btn" data-join="1">Join</button></div><div class="k-msg${msg&&/not|closed/i.test(msg)?' err':''}" id="k-msg">${esc(msg||'Got an invite link? Open it to see the contest and join.')}</div></div>`;
 h+=showCreate?createForm():`<button class="k-btn block" data-create="1" style="margin-bottom:14px">Create a contest</button>`;
 h+=`<div class="k-sec"><h2>Your contests <span>${mine.length||''}</span></h2>${mine.length?mine.map(c=>card(c,false)).join(''):'<div class="k-empty">None yet. Create one for your friends or join a public one below.</div>'}</div>`;
 h+=`<div class="k-sec"><h2>Public contests <span>Open to everyone</span></h2>${pub.map(c=>card(c,true)).join('')}</div>`;
 if(arch.length)h+=`<div class="k-sec"><details class="k-arch"><summary>Archived (${arch.length})</summary>${arch.map(c=>card(c,false)).join('')}</details></div>`;
 const m=$('k-main'),focus=document.activeElement&&document.activeElement.id;if(focus&&/^k-/.test(focus)&&document.activeElement.tagName==='INPUT')return;if(m._h!==h){m.innerHTML=h;m._h=h}}
document.addEventListener('click',e=>{const t=e.target;
 if(t.closest('[data-create]')){showCreate=true;render();setTimeout(()=>$('k-name')&&$('k-name').focus(),50);return}
 if(t.closest('[data-cancel]')){showCreate=false;render();return}
 const g=t.closest('[data-tg]');if(g){grab();const[n,k]=g.dataset.tg.split(':');const a=F[n];const i=a.indexOf(k);if(i>=0){if(a.length>1||n==='fields')a.splice(i,1)}else a.push(k);$('k-main')._h='';render();return}
 const s=t.closest('[data-sg]');if(s){grab();const[n,k]=s.dataset.sg.split(':');F[n]=isNaN(+k)?k:+k;if(n==='size'&&$('k-size'))$('k-size').value='';if(n==='stack'&&$('k-stack'))$('k-stack').value='';$('k-main')._h='';render();return}
 const w=t.closest('[data-sw]');if(w){grab();const n=w.dataset.sw;if(n==='reload')F.reload=!F.reload;else F.markets[n]=!F.markets[n];$('k-main')._h='';render();return}
 if(t.closest('[data-join]')){const code=($('k-code').value||'').trim().toUpperCase();if(code.length<4){msg='Type the 6-letter code from your friend.';$('k-main')._h='';render();return}const c=RC.join(code);if(c){location.href='contest.html?c='+encodeURIComponent(c.id)}else{msg='That code is not on this phone. Ask for the invite link: it carries the contest so you can join without an account.';$('k-main')._h='';render()}return}});
document.addEventListener('submit',e=>{if(e.target.id!=='k-form')return;e.preventDefault();grab();F.name=(F.name||'').trim()||'My contest';if(!F.markets.lines&&!F.markets.props&&!F.markets.parlays&&!F.markets.live){F.markets.lines=true}const c=RC.create({name:F.name,visibility:F.visibility,size:F.size,schedule:{leagues:F.leagues.slice(),days:F.days.slice().sort(),entryClose:entryClose(F)},rules:{stack:F.stack,markets:Object.assign({},F.markets),reload:F.reload,scoring:F.scoring,ties:F.ties,stakeMin:F.stakeMin||0,stakeMax:F.stakeMax===''?null:F.stakeMax,lineMin:F.lineMin||null,lineMax:F.lineMax||null,slipMin:F.slipMin||null,slipMax:F.slipMax||null,injury:F.injury,fields:F.fields.slice(),showFields:F.showFields}});if(c)location.href='contest.html?c='+encodeURIComponent(c.id)+'&new=1'});
RC.on(()=>{$('k-main')._h='';render()});
const JQ=new URLSearchParams(location.search).get('join');if(JQ){const raw=JQ.trim();let target=null;if(/contest\.html\?i=/.test(raw))location.replace('contest.html?i='+raw.split('i=')[1]);else if(raw.length>12){const d=RC.decode(raw);if(d)location.replace('contest.html?i='+raw)}else{target=RC.join(raw.toUpperCase());if(target)location.replace('contest.html?c='+encodeURIComponent(target.id));else msg='Code '+raw.toUpperCase()+' is not on this phone. Ask for the invite link: it carries the contest so you can join without an account.'}}
render();RW.load().then(g=>{games=g;$('k-main')._h='';render()}).catch(()=>{});
</script>
</body>
</html>
