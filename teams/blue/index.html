<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1b2c">
<title>Rush Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: stadium scoreboard pinned on top, one thumb column, tab bar at the bottom. Single dark look for a dark room. */
:root{
  --turf:#07101c; --panel:#0e1b2c; --panel2:#142438; --line:#20344d;
  --ink:#e8f1fb; --dim:#8ea6c0; --blue:#4aa3ff; --blue2:#1c5fb0;
  --win:#39e39a; --loss:#ff6168; --sweat:#ffc646;
  --num:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--turf);color:var(--ink);font:15px/1.35 var(--body);overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm.r{justify-content:flex-end}
.tm b{font:800 34px/1 var(--num);font-variant-numeric:tabular-nums}
.tm span{font:600 16px/1 var(--num);color:var(--dim);letter-spacing:.04em}
.tm.pos span{color:var(--sweat)}
.clk{text-align:center;font:700 19px/1 var(--num);font-variant-numeric:tabular-nums}
.clk small{display:block;font:500 11px/1.3 var(--body);color:var(--dim);white-space:nowrap}
.field{position:relative;height:9px;margin-block:7px 5px;border-radius:2px;background:repeating-linear-gradient(90deg,#123a2a 0 9.8%,#0f3224 9.8% 10%);overflow:hidden}
.field i{position:absolute;top:0;bottom:0}
.field .fd{width:2px;background:var(--sweat)}
.field .ball{width:9px;height:9px;border-radius:50%;background:#fff;transform:translateX(-50%);transition:left .5s}
.field .ez{right:0;width:9%;background:rgba(74,163,255,.3)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim)}
.hrow .dd{color:var(--ink);font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--win)}
.dot.bad{background:var(--loss)}
button.live{min-height:28px;color:var(--dim);font-size:12px}
.stamp{border:1px solid var(--line);border-radius:4px;padding:2px 6px;font:700 12px/1.3 var(--num);color:var(--blue);min-height:22px}
.bank{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.bank .v{font:800 26px/1 var(--num);font-variant-numeric:tabular-nums}
.bank .d{font:700 15px/1 var(--num)}
.up{color:var(--win)}.dn{color:var(--loss)}
.rk{font:700 15px/1 var(--num);color:var(--blue);text-align:right;min-width:0}
.rk small{font:500 11px var(--body);color:var(--dim);margin-left:4px}
#view{padding-block:12px calc(84px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:560px;margin-inline:auto}
h2{margin:0;font:700 14px/1.2 var(--num);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>header small{color:var(--dim);font-size:12px}
.last{font-size:14px;color:var(--ink);border-left:3px solid var(--blue);padding-left:10px}
.last small{display:block;color:var(--dim);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);font:700 16px/1 var(--num);color:var(--dim);font-variant-numeric:tabular-nums}
.chip.on{background:var(--blue);border-color:var(--blue);color:#04121f}
.snap{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.snap .q{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:14px}
.snap .q small{color:var(--dim);font-weight:400;font-size:12px;white-space:nowrap}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.opts.w{grid-auto-flow:row;grid-template-columns:repeat(2,1fr)}
.o{min-height:52px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 4px;min-width:0}
.o small{font-size:12px;color:var(--dim);line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o b{font:700 19px/1 var(--num);color:var(--blue);font-variant-numeric:tabular-nums}
.o.off{opacity:.42}
.o.off b{color:var(--dim);font-size:13px;letter-spacing:.05em}
.o.flash-up{animation:fu .9s}
.o.flash-dn{animation:fd .9s}
.o.mine{border-color:var(--sweat)}
@keyframes fu{0%{background:rgba(57,227,154,.35)}100%{background:var(--panel2)}}
@keyframes fd{0%{background:rgba(255,97,104,.35)}100%{background:var(--panel2)}}
.tbl{display:grid;gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.tbl.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tbl .h{font-size:11px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;text-align:center}
.tl{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;background:var(--blue)}
.fieldline{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);gap:8px}
.rival{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:4px;font-size:13px}
.rival b{font:700 20px/1 var(--num);font-variant-numeric:tabular-nums}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px}
.bet.won{border-color:var(--win)}.bet.lost{border-color:rgba(255,97,104,.5)}
.bet .t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.bet .t .od{font:700 16px/1.1 var(--num);color:var(--blue);white-space:nowrap}
.bet .s{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sweat);transition:width .5s}
.prog i.g{background:var(--win)}.prog i.r{background:var(--loss)}
.co{justify-self:end;min-height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--blue2);color:var(--blue);font:700 15px/1 var(--num)}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line)}
.row.me{background:rgba(74,163,255,.12);margin-inline:-8px;padding-inline:8px;border-radius:4px}
.row .rn{font:700 17px/1 var(--num);color:var(--dim);text-align:right}
.row .nm{font-weight:600;min-width:0}
.row .nm small{display:block;font-weight:400;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font:700 19px/1 var(--num);text-align:right;font-variant-numeric:tabular-nums}
.tag{font:600 10px/1 var(--body);letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 3px;margin-left:4px;vertical-align:1px}
.tk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;padding-block:6px;border-bottom:1px solid var(--line)}
.tk small{color:var(--dim);display:block;font-size:12px}
.tail{min-height:34px;padding:0 10px;border-radius:5px;border:1px solid var(--line);font:700 14px/1 var(--num);color:var(--blue)}
.empty{color:var(--dim);font-size:13px;padding-block:6px}
.pl{display:grid;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.pl .pn{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.pl .pn small{color:var(--dim);font-weight:400}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs button{min-height:56px;font:700 15px/1 var(--num);letter-spacing:.07em;color:var(--dim);border-top:2px solid transparent}
#tabs button.on{color:var(--ink);border-top-color:var(--blue)}
#tabs small{display:block;font:500 11px/1.3 var(--body);letter-spacing:0;color:var(--dim)}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sw{min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;display:grid;gap:1px;text-align:left;min-width:0}
.sw span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw b{font:700 17px/1.1 var(--num);font-variant-numeric:tabular-nums}
.sw.g{border-color:rgba(57,227,154,.55)}.sw.r{border-color:rgba(255,97,104,.5)}
#plbar{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:7;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(transparent,var(--turf) 30%)}
#plbar button{width:100%;min-height:46px;border-radius:8px;background:var(--blue2);color:var(--ink);font:700 17px/1 var(--num);display:flex;justify-content:space-between;align-items:center;padding-inline:14px}
.legs{display:grid;gap:4px;font-size:13px}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;min-height:30px}
.leg .x{min-width:40px;min-height:36px;border:1px solid var(--line);border-radius:5px;color:var(--dim)}
.leg.won{color:var(--win)}.leg.lost{color:var(--loss);text-decoration:line-through}.leg.push{color:var(--dim)}
.snap.hot{border-color:var(--sweat);background:linear-gradient(180deg,rgba(255,198,70,.1),var(--panel) 60%)}
.mo{font:700 12px/1 var(--num);letter-spacing:.09em;color:var(--sweat)}
.races{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rk{min-height:30px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;display:grid;gap:2px;min-width:0}
.rc small{font-size:11px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.rc b{font:800 24px/1 var(--num);font-variant-numeric:tabular-nums}
.rc span{font:700 14px/1 var(--num);font-variant-numeric:tabular-nums}
.wp{display:grid;gap:3px}
.wp svg{display:block;width:100%;height:auto}
.wp .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wp .mid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.wp .qt{stroke:var(--line);stroke-width:1}
.wp .end{fill:var(--blue);stroke:var(--turf);stroke-width:2}
.final{background:var(--panel2);border:1px solid var(--blue);border-radius:8px;padding:14px;display:grid;gap:6px;text-align:center}
.final b{font:800 54px/1 var(--num)}
.final span{color:var(--dim);font-size:13px}
.crumb{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin-bottom:4px}
.crumb .lv{font:700 12px/1 var(--num);letter-spacing:.09em;color:var(--loss)}
.bank .lb{font-size:11px;letter-spacing:.05em;color:var(--dim);text-transform:uppercase}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.mu small{display:block;font-size:12px;color:var(--dim)}
.mu .mid{font-size:12px;color:var(--ink);text-align:center}
.mu .rt{text-align:right}
.two{display:flex;gap:6px}
.starts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.row.cutoff{border-bottom:2px solid var(--sweat)}
.hrow .dd.mv{color:var(--sweat)}
.imp{display:flex;align-items:baseline;gap:8px;margin-top:3px;font-size:12px;color:var(--dim)}
.imp b{font:700 16px/1 var(--num);font-variant-numeric:tabular-nums}
.sw em{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr.crunch{border-bottom:2px solid var(--sweat);box-shadow:0 2px 16px rgba(255,198,70,.25)}
#scrim{position:fixed;inset:0;background:rgba(2,7,14,.7);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-top:2px solid var(--blue);border-radius:12px 12px 0 0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-height:80%;overflow:auto}
#sheet h3{margin:0;font:700 20px/1.15 var(--num)}
#sheet p{margin:0;color:var(--dim);font-size:14px}
.slipodds{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slipodds b{font:800 30px/1 var(--num);color:var(--blue);font-variant-numeric:tabular-nums}
.stake{font:800 32px/1 var(--num);font-variant-numeric:tabular-nums}
.go{min-height:56px;border-radius:8px;background:var(--blue);color:#04121f;font:800 20px/1 var(--num);letter-spacing:.02em}
.go[disabled]{background:var(--line);color:var(--dim)}
.ghost{min-height:44px;border-radius:8px;border:1px solid var(--line);color:var(--dim);font-weight:600}
input[type=text]{width:100%;min-height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);font:600 17px var(--body);padding:0 12px}
#toast{position:fixed;left:0;right:0;bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:6px;padding-inline:16px;pointer-events:none}
.ts{background:var(--panel2);border:1px solid var(--blue2);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px;animation:tin .22s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#burst{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none;text-align:center}
#burst div{font:800 56px/1 var(--num);animation:bu 1.7s forwards;padding:16px}
#burst small{display:block;font:600 15px/1.3 var(--body);color:var(--ink);margin-top:8px}
@keyframes bu{0%{transform:scale(.6);opacity:0}12%{transform:scale(1.08);opacity:1}24%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.notice{font-size:13px;color:var(--sweat);border:1px solid rgba(255,198,70,.4);border-radius:6px;padding:8px 10px}
ul.cl{margin:0;padding-left:18px;color:var(--ink);font-size:14px;display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="view"></main>
<div id="plbar" hidden></div>
<nav id="tabs"></nav>
<div id="scrim" hidden></div>
<div id="sheet" hidden></div>
<div id="toast"></div>
<div id="burst" hidden></div>

<script>
const VERSION='v8';
const CHANGES=[['v8',['Line moved alert in the header, often ahead of the play text','This play: how the last snap moved your Units and rank','Open picks show covering or needed points at a glance','Late game lines fixed: a big lead no longer shows a wrong spread, lines close at 0:00, overtime handled','Crunch time header in the last 5 minutes of a one-score game']],['v7',['Now the Live section of Bears at Seahawks inside Rush: your Stack, your Slip, the Field, ranked on Units','Your matchup: a named opponent, their picks on this game, tail or fade them','Beat the line shows on every open pick','Free weekly Reload replaces rebuy. Path to the top 3','Real time: the whole game state now arrives by push, and book prices are current instead of up to 40 cents stale']],['v6',['ESPN push feed connected: real DraftKings live lines land on your board within a second','Spread, total and moneyline now show the actual DraftKings live price; every other market reprices from it','Plays arrive about 10 seconds sooner by skipping the CDN cache','Your true lag to the real play is on the header. Tap it for detail','Snap clock on Next play, and snap bets lock for a moment when the line jumps']],['v5',['Moment cards jump to the top: 3rd down, 4th down go or kick, red zone, crunch time','Three races at once: game, this quarter, this drive. Every quarter is a fresh shot','Path to #1 shows exactly what stake and price catches the leader','Win probability chart with the swing of the last play','Coming back to the page refreshes every feed at once','Final card with your rank and best hit at the whistle']],['v4',['The page updates itself within a minute of a new version, your picks stay']],['v3',['Same-game parlays from any game line or prop, with leg tracking and cash out','Your open picks now sit on top of the Live tab','Touchdown and field goal alerts fill the screen','Last play skips timeouts and quarter breaks']],['v2',['Runs as a plain page on any host','Plays arrive up to a minute sooner: fixed a stale browser cache and now read the newest play directly','Field grew to 30 simulated players','Drive Duel: beat the field on every drive','Rank alerts name who you passed','One rebuy per quarter if you bust, charged against your score']],['v1',['Live pick board fed by ESPN every 3 to 10 seconds','Next-snap markets: next play, move the chains, drive result, next score','Game lines, alts, team totals, quarter lines, player props anchored on real DraftKings targets','Cash out, live sweats, ladder with labelled bots and any real players']]];
/* Lift points for the Rush event page. Feeds: FastCast doc plus polls fill S. Player: me (Stack, Slip, Units). Field: ladder(). Pick entry: place() and placeParlay(). Grading: settle() and gradeBet(). Pricing: quote(). */
const E='401873036',HOME='26',AWAY='3',WEEK=1000;
const CORE=`https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/${E}/competitions/${E}`;
const SITE='https://site.api.espn.com/apis/site/v2/sports/football/nfl';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const money=v=>Math.round(v).toLocaleString('en-US')+' Stack';
const stk=v=>Math.round(v).toLocaleString('en-US');
const fmtU=s=>(s>=0?'+':'-')+Math.abs(s/10).toFixed(1)+' U';
const uu=u=>(u>=0?'+':'-')+Math.abs(u).toFixed(1)+' U';
const fo=o=>o==null?'OTB':(o>0?'+':'')+o;
const teamAb=id=>id==HOME?'SEA':'CHI';

/* ---------- math ---------- */
function Phi(x){const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function inv(p){p=clamp(p,1e-4,1-1e-4);const a=[-39.6968,220.9461,-275.9285,138.3577,-30.6648,2.5066],b=[-54.4761,161.5858,-155.699,66.8013,-13.2806],c=[-.00778,-.3224,-2.4008,-2.5497,4.3747,2.9382],d=[.00778,.3225,2.4451,3.7544],pl=.02425;let q,r;if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}q=p-.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}

const HOLD={ml:.045,spread:.045,total:.045,tt:.05,qt:.05,qs:.05,prop:.05,td:.09,next:.05,go:.06,fd:.06,drive:.07,ns:.1};
function labelOf(sp){const ln=l=>l===0?'PK':(l>0?'+':'')+l;switch(sp.k){

const spanName=sp=>sp.from===1&&sp.to===2?'1st half':'Q'+sp.from;

function dkPrice(sp,M){const d=M.dk;if(!d)return undefined;if(sp.k==='ml')return sp.side===HOME?d.mlH:d.mlA;if(sp.k==='spread'){if(sp.side===HOME&&sp.line===d.spH)return d.spHo;if(sp.side===AWAY&&sp.line===d.spA)return d.spAo;return undefined}if(sp.k==='total'&&sp.line===d.tot)return sp.side==='o'?d.ovO:d.unO;return undefined}
function quote(sp,M){M=M||model();const label=labelOf(sp);const sus=suspended(M);if(sus)return{ok:false,why:sus,label};if(MICRO.includes(sp.k)&&S.dkMoveAt&&Date.now()-S.dkMoveAt<4000)return{ok:false,why:'Line moving',label};const dp=dkPrice(sp,M);if(dp===null)return{ok:false,why:'Suspended',label};if(dp!==undefined&&Math.abs(dp)<3000){return{ok:true,odds:dp,label,fr:fair(sp,M),dk:true}}const fr=fair(sp,M);if(!fr)return{ok:false,why:'Off the board',label};const pn=fr.w/Math.max(.02,1-fr.pu),o=price(pn,HOLD[sp.k]||.05);if(o==null)return{ok:false,why:'Off the board',label};return{ok:true,odds:o,label,fr}}

/* ---------- parlays ---------- */
const MICRO=['next','go','fd','drive','ns'];const dec=o=>o>0?1+o/100:1+100/-o;let pl=[];
function decToAm(d){let a=d>=2?(d-1)*100:-100/(d-1);const s=Math.abs(a)<500?5:Math.abs(a)<2000?10:50;a=Math.round(a/s)*s;return a}

function plConflict(sp){return pl.some(x=>{if(x.k!==sp.k)return false;if(sp.k==='ml')return true;if(sp.k==='spread')return true;if(sp.k==='total')return true;if(sp.k==='tt')return x.team===sp.team;if(sp.k==='prop')return x.aid===sp.aid&&x.t===sp.t;if(sp.k==='td')return x.aid===sp.aid;if(sp.k==='qt'||sp.k==='qs')return x.from===sp.from&&x.to===sp.to;return false})}
function placeParlay(stake){const M=model(),q=plQuote(M);if(!q.ok){toast('A leg moved off the board. Remove it to continue.');return false}if(stake>me.cash||stake<=0)return false;const legs=pl.map((sp,i)=>({spec:sp,odds:q.qs[i].odds,label:q.qs[i].label,st:'open'}));const label=legs.length+'-leg parlay';const b={id:Date.now().toString(36)+'p',spec:{k:'parlay',legs},label,odds:q.odds,stake,win:toWin(stake,q.odds),at:Date.now(),seq:S.lastSeq,status:'open',clock:game().detail};me.cash-=stake;me.bets.unshift(b);pl=[];save();blip(620,.06);buzz(15);toast(label+' '+fo(q.odds)+' locked for '+money(stake));render();return true}
function gradeParlay(b,M){const legs=b.spec.legs;let ch=false;legs.forEach(l=>{if(l.st!=='open')return;const r=gradeBet({spec:l.spec},M);if(r&&r.r){l.st=r.r;ch=true}});if(ch)save();if(legs.some(l=>l.st==='lost'))return{r:'lost'};if(legs.some(l=>l.st==='open'))return null;const won=legs.filter(l=>l.st==='won');if(!won.length)return{r:'push',note:'All legs pushed'};if(won.length===1){b.odds=won[0].odds}else b.odds=plOdds(won.map(l=>l.odds));b.win=toWin(b.stake,b.odds);return{r:'won',note:won.length<legs.length?'Pushed legs removed':''}}

/* ---------- player state ---------- */
let me={handle:'',cash:WEEK,s0:WEEK,u0:0,bets:[],w:0,l:0,streak:0,best:0,rev:0};
const LS='rush-live-'+E;
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)me=Object.assign(me,JSON.parse(r))}catch(e){}}
function save(){me.rev=(me.rev||0)+1;try{localStorage.setItem(LS,JSON.stringify(me))}catch(e){}}
let defaultStake=25;
function betVal(b,M){if(b.status!=='open')return 0;if(MICRO.includes(b.spec.k))return b.stake;const fr=fair(b.spec,M);if(!fr)return b.stake;return(b.stake+b.win)*fr.w+b.stake*fr.pu}
function myUnits(M){return(me.u0||0)+(myValue(M)-(me.s0||WEEK))/10}
function myValue(M){return -(me.debt||0)+me.cash+me.bets.reduce((a,b)=>a+betVal(b,M),0)}
function place(sp,stake){const q=quote(sp);if(!q.ok){toast(q.why);return false}if(stake>me.cash||stake<=0){toast('Stack left: '+money(me.cash));return false}const mm=micro();const b={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),spec:sp,label:q.label,odds:q.odds,stake,win:toWin(stake,q.odds),at:Date.now(),seq:S.lastSeq,status:'open',off:mm&&mm.off,drive:mm&&mm.driveId,clock:game().detail};
  if(sp.k==='drive')b.team=mm&&mm.off;me.cash-=stake;me.bets.unshift(b);save();blip(620,.06);buzz(15);toast(`${q.label} ${fo(q.odds)} locked for ${money(stake)}`);render();return true}
function cashOut(id){const b=me.bets.find(x=>x.id===id);if(!b||b.status!=='open')return;const v=Math.round(betVal(b,model())*.96);me.cash+=v;b.status='cashed';b.pay=v;b.settled=Date.now();save();toast(`Closed ${b.label} for ${money(v)}`);render()}

/* ---------- grading ---------- */
function gradeFinal(sp,hs,as){const mg=hs-as,sum=hs+as;const cmp=(x,L,s)=>x===L?'push':(s==='o'?x>L:x<L)?'won':'lost';
  if(sp.k==='ml'){if(mg===0)return'push';return(sp.side===HOME?mg>0:mg<0)?'won':'lost'}
  if(sp.k==='spread'){const x=(sp.side===HOME?mg:-mg)+sp.line;return x===0?'push':x>0?'won':'lost'}
  if(sp.k==='total')return cmp(sum,sp.line,sp.side);
  if(sp.k==='tt')return cmp(sp.team===HOME?hs:as,sp.line,sp.side);
  return null}
function gradeBet(b,M){const sp=b.spec,g=M.g,k=sp.k;
  if(k==='parlay')return gradeParlay(b,M);
  if(k==='ml'||k==='spread'||k==='total'||k==='tt'){if(g.done)return{r:gradeFinal(sp,g.hs,g.as)};if(k==='total'&&M.sum>sp.line)return{r:sp.side==='o'?'won':'lost'};if(k==='tt'){const c=sp.team===HOME?M.hs:M.as;if(c>sp.line)return{r:sp.side==='o'?'won':'lost'}}return null}
  if(k==='qt'||k==='qs'){const closed=g.done||hdrComp()&&hdrComp().status.period>sp.to;const q=qStats(M,sp.from,sp.to);if(k==='qt'&&q.pts>sp.line)return{r:sp.side==='o'?'won':'lost'};if(!closed)return null;if(k==='qt')return{r:q.pts===sp.line?'push':(sp.side==='o'?q.pts>sp.line:q.pts<sp.line)?'won':'lost'};const x=(sp.side===HOME?q.mg:-q.mg)+sp.line;return{r:x===0?'push':x>0?'won':'lost'}}
  if(k==='prop'){const c=propCur(sp.aid,sp.t);if(c>sp.line)return{r:sp.side==='o'?'won':'lost'};if(!g.done)return null;if(!S.box[sp.aid])return{r:'void',note:'Did not play'};return{r:c===sp.line?'push':(sp.side==='o'?c>sp.line:c<sp.line)?'won':'lost'}}
  if(k==='td'){if(tdCount(sp.aid)>0)return{r:'won'};if(!g.done)return null;if(!S.box[sp.aid])return{r:'void',note:'Did not play'};return{r:'lost'}}

  return null}
function cls(p){const t=(p.type&&p.type.text)||'';if(/timeout|two-minute|end |coin|official/i.test(t))return'skip';if(/penalty/i.test(t))return'skip';if(/kickoff|punt|field goal|extra point|blocked|two.?point|safety|on-?side/i.test(t))return'kick';if(/pass|sack|interception/i.test(t))return'pass';if(/rush/i.test(t))return'run';return'other'}
const teamOf=r=>r&&r.$ref?(r.$ref.match(/teams\/(\d+)/)||[])[1]:r&&r.id;
function after(b){return S.plays.filter(p=>seqOf(p)>b.seq)}
function gradeSnap(b,g){const sp=b.spec;for(const p of after(b)){const c=cls(p);if(c==='skip')continue;if(p.wallclock&&Date.parse(p.wallclock)<b.at-5000)return{r:'void',note:'Play was already underway'};
    if(sp.k==='go'){if(c==='pass'||c==='run')return{r:sp.c==='go'?'won':'lost',note:p.shortText||''};if(c==='kick')return{r:sp.c==='kick'?'won':'lost',note:p.shortText||''};return{r:'void',note:'No clear play'}}
    if(sp.k==='next'){if(c==='pass'||c==='run')return{r:c===sp.c?'won':'lost',note:p.shortText||''};return{r:'void',note:'No run or pass snap'}}
    const ty=(p.type&&p.type.text)||'',offense=b.off;
    if(p.scoringPlay&&/touchdown/i.test(ty)&&teamOf(p.team)==offense)return{r:sp.c==='yes'?'won':'lost',note:p.shortText||''};
    if(c==='kick'||p.isTurnover||teamOf(p.end&&p.end.team)!=offense)return{r:sp.c==='yes'?'lost':'won',note:p.shortText||ty};
    if(p.end&&p.end.down===1){if(p.start&&p.start.down===1&&p.end.distance===p.start.distance&&p.end.yardLine===p.start.yardLine)continue;return{r:sp.c==='yes'?'won':'lost',note:p.shortText||''}}

function gradeDrive(b,g){const d=S.sum&&S.sum.drives;if(!d)return null;const dr=[...(d.previous||[]),d.current].find(x=>x&&x.id===b.drive);if(!dr||!dr.result){if(g.done)return{r:'void',note:'Game ended'};return null}const res=String(dr.displayResult||dr.result);const out=dr.isScore?(/touchdown|TD/i.test(res)?'td':/field|FG/i.test(res)?'fg':'none'):'none';return{r:out===b.spec.c?'won':'lost',note:res}}

function settle(M){let changed=false;me.bets.forEach(b=>{if(b.status!=='open')return;const res=gradeBet(b,M);if(!res||!res.r)return;b.status=res.r;b.note=res.note||'';b.settled=Date.now();let pay=0;if(res.r==='won'){pay=b.stake+b.win;me.w++;me.streak=(me.streak||0)+1;me.best=Math.max(me.best||0,me.streak);burst(fmtU(b.win),b.label,'var(--win)');blip(880,.1);blip(1320,.14,.09);buzz([30,40,60])}else if(res.r==='lost'){me.l++;me.streak=0;burst(fmtU(-b.stake),b.label,'var(--loss)');blip(190,.2);buzz(80)}else{pay=b.stake;toast(`${b.label}: ${res.r==='push'?'push':'void'}. ${money(b.stake)} returned.`+(res.note?' '+res.note+'.':''))}me.cash+=pay;b.pay=pay;changed=true});if(changed)save();return changed}

/* ---------- field of bots ---------- */
const PERSONA=[{p:'fav',r:.09,pct:.12},{p:'dog',r:.08,pct:.06},{p:'over',r:.07,pct:.1},{p:'under',r:.07,pct:.1},{p:'fade',r:.09,pct:.09},{p:'steam',r:.1,pct:.09},{p:'pass',r:.4,pct:.035},{p:'run',r:.28,pct:.035},{p:'alt',r:.06,pct:.05},{p:'late',r:.24,pct:.14},{p:'yolo',r:.05,pct:.24}];
const BOTNAMES=['Chalk Charlie','Dog Walker','Over Ollie','Under Ursula','Fade Frankie','Steam Stevie','Snap Sally','Ground Game Gus','Alt Line Al','Late Larry','Yolo Yuri','Heavy Favorite Hal','Plus Money Pam','Points Paulie','Dead Number Dee','Reverse Line Rex','Air Raid Ana','Goal Line Gil','Ladder Lou','Fourth Quarter Fay','All In Otis','Laying It Lena','Road Dog Ray','Rain Over Rita','Backdoor Bo','Middle Mike','Shotgun Sam','Dive Right Dot','Long Shot Lex','Closer Cass'];
const BOTS=BOTNAMES.map((n,i)=>{const pp=PERSONA[i%PERSONA.length],a=.7+.6*hash('r'+n),b=.7+.6*hash('p'+n);return{id:'b'+i,n,p:pp.p,r:pp.r*a,pct:pp.pct*b,s0:Math.round((150+850*hash('s'+n))/10)*10,u0:Math.round((-28+80*hash('u'+n))*2)/2}});
let botMemo={key:'',res:[]};
function runBots(M){const key=S.plays.length+'|'+S.probs.length+'|'+(M.g.done?1:0);if(botMemo.key!==key){botMemo={key,res:replay(M)}}return botMemo.res.map(b=>{let v=b.cash;b.open.forEach(o=>{if(M.g.done){const r=gradeFinal(o.spec,M.hs,M.as);v+=r==='won'?o.stake+o.win:r==='push'?o.stake:0}else{const fr=fair(o.spec,M);v+=fr?(o.stake+o.win)*fr.w+o.stake*fr.pu:o.stake}});return{...b,value:v}})}
function replay(M){const T=(S.odds&&S.odds.overUnder)||46.5;const prob=new Map();S.probs.forEach(p=>{const m=p.play&&p.play.$ref&&p.play.$ref.match(/plays\/(\d+)/);if(m)prob.set(m[1],p)});const scrim=S.plays.filter(p=>prob.has(p.id)&&p.period);
  return BOTS.map(bot=>{let cash=bot.s0;const open=[],feed=[];let wins=0;
    scrim.forEach((p,i)=>{if(cash<5)return;const pr=prob.get(p.id),secs=secsOf(p.period.number,(p.clock&&p.clock.value)||0),m=modelAt(pr,secs,p.homeScore||0,p.awayScore||0,T);
      if(bot.p==='late'&&m.f>.3)return;if(hash(bot.id+p.sequenceNumber)>bot.r)return;let st=Math.max(5,Math.round(cash*bot.pct/5)*5);st=Math.min(st,cash);
      if(bot.p==='pass'||bot.p==='run'){const nx=scrim.slice(i+1).find(x=>['pass','run'].includes(cls(x)));const d=p.end&&p.end.down;if(!nx||!(d>=1))return;const mm={down:d,dist:p.end.distance||10,ytg:p.end.yardsToEndzone||50,off:teamOf(p.end.team)};const pp=pPass(mm,m),o=price(bot.p==='pass'?pp:1-pp,.05);if(o==null)return;const w=cls(nx)===bot.p;cash+=w?toWin(st,o):-st;if(w)wins++;feed.push({t:Date.parse(p.wallclock)||0,label:'Next play: '+(bot.p==='pass'?'Pass':'Run'),odds:o,stake:st,spec:{k:'next',c:bot.p}});return}
      const hw=m.hw,favSide=hw>=.5?HOME:AWAY,dogSide=hw>=.5?AWAY:HOME;let sp=null;const main=-half(m.mu);
      if(bot.p==='fav')sp={k:'ml',side:favSide};else if(bot.p==='dog'){const a=price(Math.min(hw,1-hw),.045);if(a&&a>=130&&a<=500)sp={k:'ml',side:dogSide}}else if(bot.p==='over')sp={k:'total',side:'o',line:half(m.tm)};else if(bot.p==='under')sp={k:'total',side:'u',line:half(m.tm)};
      else if(bot.p==='fade'||bot.p==='steam'){const q=prob.get((scrim[Math.max(0,i-3)]||p).id),mv=hw-(q?q.homeWinPercentage:hw),s=(mv>=0)===(bot.p==='steam')?HOME:AWAY;sp={k:'spread',side:s,line:s===HOME?main:-main}}
      else if(bot.p==='alt'){const s=hash('s'+p.sequenceNumber)>.5?HOME:AWAY;const l=(s===HOME?main:-main)-7;sp={k:'spread',side:s,line:l}}
      else if(bot.p==='late')sp=hash('l'+p.sequenceNumber)>.5?{k:'total',side:hash('t'+p.sequenceNumber)>.5?'o':'u',line:half(m.tm)}:{k:'ml',side:favSide};
      else if(bot.p==='yolo')sp={k:'ml',side:dogSide};
      if(!sp)return;const fr=fair(sp,m);if(!fr)return;const o=price(fr.w/Math.max(.02,1-fr.pu),HOLD[sp.k]);if(o==null)return;cash-=st;open.push({spec:sp,stake:st,win:toWin(st,o),odds:o});feed.push({t:Date.parse(p.wallclock)||0,label:labelOf(sp),odds:o,stake:st,spec:sp})});
    return{id:bot.id,name:bot.n,bot:true,cash,open,feed,wins,s0:bot.s0,u0:bot.u0}})}
function ladder(M){const rows=runBots(M).map(b=>({id:b.id,name:b.name,bot:true,value:b.value,units:b.u0+(b.value-b.s0)/10,open:b.open.length,picks:b.open,last:b.feed[b.feed.length-1],feed:b.feed}));
  rows.push({id:'me',name:me.handle||'You',me:true,value:myValue(M),units:myUnits(M),open:me.bets.filter(b=>b.status==='open').length});
  rows.sort((a,b)=>b.units-a.units);rows.forEach((r,i)=>r.rank=i+1);return rows}

function betCard(b,M){const s=sweat(b,M),v=betVal(b,M),noCo=MICRO.includes(b.spec.k),co=Math.round(v*.96);let beat='';if(b.spec.k!=='parlay'&&!noCo){const q=quote(b.spec,M);if(q.ok&&q.odds!==b.odds)beat=toProb(q.odds)>toProb(b.odds)?`<span class="up">Beat the line: now ${fo(q.odds)}</span>`:`<span>Line now ${fo(q.odds)}</span>`}
  return`<div class="bet"><div class="t"><span>${esc(b.label)}</span><span class="od">${fo(b.odds)}</span></div>${s.pct!=null?`<div class="prog"><i class="${s.c}" style="width:${s.pct}%"></i></div>`:''}${b.spec.k==='parlay'?`<div class="legs">${b.spec.legs.map(l=>`<div class="leg ${l.st}"><span>${esc(l.label)}</span><span class="n">${fo(l.odds)}</span><span></span></div>`).join('')}</div>`:''}<div class="s"><span>${esc(s.txt)}</span><span>stake ${stk(b.stake)} · wins ${fmtU(b.win)}</span></div>${beat?`<div class="s">${beat}</div>`:''}${noCo?'':`<button class="co" data-a="cash" data-id="${b.id}">Close pick for ${stk(co)} <span class="${co>=b.stake?'up':'dn'}">${fmtU(co-b.stake)}</span></button>`}</div>`}
function vBoard(M){const tabs=[['game','Game'],['alts','Alts'],['team','Team'],['q','Quarter'],['props','Props']];let h=`<div class="chips">${tabs.map(t=>`<button class="chip${boardTab===t[0]?' on':''}" data-a="board" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>`;

  if(boardTab==='alts'){h+=`<section class="sec"><header><h2>Alt spreads</h2></header><div class="tbl two">`;[-14,-10.5,-7,-3.5,3.5,7,10.5,14].forEach(d=>{const l=main+d;h+=oBtn({k:'spread',side:AWAY,line:-l},'CHI '+ln(-l),M)+oBtn({k:'spread',side:HOME,line:l},'SEA '+ln(l),M)});h+=`</div></section><section class="sec"><header><h2>Alt totals</h2></header><div class="tbl two">`;[-14,-10,-7,-3,3,7,10,14].forEach(d=>{const l=mt+d;if(l<=M.sum)return;h+=oBtn({k:'total',side:'o',line:l},'O '+l,M)+oBtn({k:'total',side:'u',line:l},'U '+l,M)});h+='</div></section>'}
  if(boardTab==='team'){[[AWAY,M.am],[HOME,M.hm]].forEach(([t,a])=>{const m=half(a);h+=`<section class="sec"><header><h2>${teamAb(t)} team total</h2><small>projected ${a.toFixed(1)}</small></header><div class="tbl two">`;[-7,-3,0,3,7].forEach(d=>{const l=m+d;if(l<(t===HOME?M.hs:M.as)||l<0)return;h+=oBtn({k:'tt',team:t,side:'o',line:l},'O '+l,M)+oBtn({k:'tt',team:t,side:'u',line:l},'U '+l,M)});h+='</div></section>'})}
  if(boardTab==='q'&&M.g.period>4)h+='<div class="empty">Quarter lines are closed in overtime.</div>';
  if(boardTab==='q'&&M.g.period<=4){const p=Math.min(M.g.period,4);const spans=[{from:p,to:p}];if(p<=1)spans.unshift({from:p+1,to:p+1});if(p<=2)spans.push({from:1,to:2});if(p<4)spans.push({from:p+1,to:p+1});const seen=new Set();spans.forEach(s=>{const key=s.from+'-'+s.to;if(seen.has(key))return;seen.add(key);const q=qStats(M,s.from,s.to);if(q.left<=0)return;const rem=M.secs>0?(M.tm-M.sum)*q.left/M.secs:0,tl=half(q.pts+rem),qmean=q.mg+(M.secs>0?(M.mu-M.cur)*q.left/M.secs:0);let sl=-half(qmean);if(sl===0)sl=-.5;if(!Number.isInteger(sl*2))sl=-.5;const nm=spanName(s);h+=`<section class="sec"><header><h2>${nm}</h2><small>${q.pts} pts so far</small></header><div class="tbl two">${oBtn({k:'qs',from:s.from,to:s.to,side:AWAY,line:-sl},'CHI '+ln(-sl),M)}${oBtn({k:'qs',from:s.from,to:s.to,side:HOME,line:sl},'SEA '+ln(sl),M)}${oBtn({k:'qt',from:s.from,to:s.to,side:'o',line:tl},'O '+tl,M)}${oBtn({k:'qt',from:s.from,to:s.to,side:'u',line:tl},'U '+tl,M)}</div></section>`})}
  if(boardTab==='props')h+=vProps(M);

function vProps(M){const gs=[['pass','Passing'],['rush','Rushing'],['rec','Receiving'],['td','TD scorer'],['kick','Kicking'],['def','Defense']];let h=`<div class="chips">${gs.map(g=>`<button class="chip${propTab===g[0]?' on':''}" data-a="prop" data-v="${g[0]}">${g[1]}</button>`).join('')}</div>`;
  if(!S.props.length)return h+'<div class="empty">Loading DraftKings prop lines.</div>';
  if(propTab==='td'){const ids=[...new Set(S.props.filter(p=>p.t===13||p.t===12).map(p=>p.aid))].sort((a,b)=>tdLambda(b)-tdLambda(a)).slice(0,24);h+='<div class="tbl two">'+ids.map(a=>oBtn({k:'td',aid:a},pname(a),M)).join('')+'</div>';return h}
  const types=Object.keys(PT).map(Number).filter(t=>PT[t].g===propTab);

  const score=p=>propLine(p.aid,PT[p.t].g==='pass'?8:PT[p.t].g==='rush'?12:PT[p.t].g==='rec'?13:p.t)||0;list.sort((a,b)=>score(b)-score(a)||types.indexOf(a.t)-types.indexOf(b.t));
  list.slice(0,40).forEach(p=>{const pm=propModel(p.aid,p.t,M);if(!pm)return;const pt=PT[p.t],L=pm.L;h+=`<div class="pl"><div class="pn"><span>${esc(pname(p.aid))} · ${pt.n}</span><small>now ${pm.cur} · pregame ${p.line}</small></div><div class="tbl two">${oBtn({k:'prop',aid:p.aid,t:p.t,side:'o',line:L},'O '+L,M)}${oBtn({k:'prop',aid:p.aid,t:p.t,side:'u',line:L},'U '+L,M)}</div>`;
    if(pt.step){const c=Math.ceil(pm.mean/pt.step)*pt.step;const ms=[c+pt.step,c+2*pt.step,c+4*pt.step].filter(x=>x>pm.cur);h+=`<div class="tbl">${ms.map(x=>oBtn({k:'prop',aid:p.aid,t:p.t,side:'o',line:x-.5},x+'+',M)).join('')}</div>`}
    h+='</div>'});
  return h}
function vPicks(M){const open=me.bets.filter(b=>b.status==='open'),done=me.bets.filter(b=>b.status!=='open');let h=`<section class="sec"><header><h2>Your Slip: open on this game</h2><small>${open.length}</small></header>${open.length?open.map(b=>betCard(b,M)).join(''):'<div class="empty">No open picks on this game. Tap any price on Live or Board.</div>'}</section>`;
  h+=`<section class="sec"><header><h2>Graded</h2><small>${me.w}-${me.l} · best streak ${me.best||0}</small></header>${done.length?done.map(b=>{const net=(b.pay||0)-b.stake,tag={won:'WON',lost:'LOST',push:'PUSH',void:'VOID',cashed:'CLOSED'}[b.status];return`<div class="bet ${b.status==='won'?'won':b.status==='lost'?'lost':''}"><div class="t"><span>${esc(b.label)}</span><span class="od">${fo(b.odds)}</span></div><div class="s"><span>${tag}${b.note?' · '+esc(b.note):''}</span><span class="${net>=0?'up':'dn'}">${fmtU(net)}</span></div></div>`}).join(''):'<div class="empty">Graded picks land here, the moment they settle.</div>'}</section>`;
  return h}
function vLadder(M){const rows=ladder(M),opp=oppOf().id;return`<section class="sec"><header><h2>Ranks: this week's Field</h2><small>ranked on Units · top 3 take prizes</small></header><div>${rows.map(r=>{return`<div class="row${r.me?' me':''}${r.rank===3?' cutoff':''}"><div class="rn">${r.rank}</div><div class="nm">${esc(r.name)}${r.bot?'<span class="tag">SIM</span>':r.me?'<span class="tag">YOU</span>':''}${r.id===opp?'<span class="tag">MATCHUP</span>':''}<small>${r.last?esc(r.last.label)+' '+fo(r.last.odds):(r.open?r.open+' open':'no picks on this game yet')}</small></div><div class="val ${r.units>=0?'up':'dn'}">${uu(r.units)}</div></div>`}).join('')}</div><div class="empty">The Field is simulated for tonight: same prices and same grading, replayed from the real plays, so every phone sees the same Ranks. In Rush this is the real Field.</div></section>`}
function vPlBar(M){if(!pl.length)return'';const q=plQuote(M);return`<button data-a="plopen"><span>Parlay · ${pl.length} leg${pl.length>1?'s':''}</span><span>${q.ok?fo(q.odds):pl.length<2?'add 1 more':'locked'}</span></button>`}
function vTabs(M){const rows=ladder(M),r=rows.find(x=>x.me),o=me.bets.filter(b=>b.status==='open').length;return[['live','LIVE',''],['board','BOARD',''],['picks','SLIP',o?o+' open':''],['ladder','RANKS','#'+r.rank]].map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}${t[2]?`<small>${t[2]}</small>`:''}</button>`).join('')}
function vSheet(M){if(sheetMode==='name')return`<h3>Bears at Seahawks is live</h3><p>This is the Live section of this game in Rush. Your picks use your Stack for the week and count toward your Units in the Field. Stack and Units are virtual. For tonight's demo, choose how you arrive.</p><input type="text" id="hn" maxlength="18" placeholder="Your name in the Field" autocomplete="off"><div class="starts">${[[1000,0],[640,6],[250,-14.5],[40,22]].map(a=>`<button class="o" data-a="start" data-v="${a[0]}|${a[1]}"><small>${uu(a[1])}</small><b>${stk(a[0])} Stack</b></button>`).join('')}</div><p>Tap your Stack to start.</p>`;
  if(sheetMode==='lag'){const lm=lagMedian(),lastP=Math.round((Date.now()-(S.pcAt||0))/1000);return`<h3>How live is this</h3><p><b class="n" style="font-size:28px;color:var(--ink)">${lm!=null?Math.round(lm)+'s':'measuring'}</b> median time from the real play to this screen, last ${(S.lags||[]).length} plays. Latest play: ${S.lag!=null?Math.round(S.lag)+'s':'waiting for the next snap'}.</p>${(S.leads||[]).length?`<p>Line jumps reach you about ${Math.round(S.leads.slice().sort((a,b)=>a-b)[Math.floor(S.leads.length/2)])}s before the play text, last ${S.leads.length} checked.</p>`:''}<p>ESPN stamps each play and publishes it about 20 seconds later. We read that feed every 1.5 seconds, past the CDN cache, so nearly all of the lag is on ESPN's side.</p><p>Book prices arrive by push: ${S.fcOn?'connected, last update '+lastP+'s ago, '+(S.pushN||0)+' updates so far':'reconnecting, using polling for now'}. Prices often move before the play text shows up.</p><p>Your TV or stream has its own delay, so you may see plays before or after this page.</p><button class="ghost" data-a="close">Close</button>`}

  if(sheetMode==='slip'&&slip){const q=quote(slip.sp,M),st=slip.stake,win=q.ok?toWin(st,q.odds):0,moved=q.ok&&slip.o0!=null&&q.odds!==slip.o0;return`<div class="slipodds"><h3>${esc(q.label)}</h3><b>${q.ok?fo(q.odds):'LOCK'}</b></div>${moved?`<p class="up">Price moved from ${fo(slip.o0)}. You lock what you see.</p>`:''}<div class="slipodds"><span class="stake">${money(st)}</span><span>wins <b class="n up" style="color:var(--win);font-size:22px">${fmtU(win)}</b></span></div><div class="chips">${[10,25,50,100,250].map(v=>`<button class="chip" data-a="add" data-v="${v}">+${v}</button>`).join('')}<button class="chip" data-a="max">MAX</button><button class="chip" data-a="clr">CLR</button></div><button class="go" data-a="confirm"${q.ok&&st>0&&st<=me.cash?'':' disabled'}>${q.ok?(st>me.cash?'Only '+money(me.cash)+' left':'Lock at '+fo(q.odds)):esc(q.why)}</button>${MICRO.includes(slip.sp.k)?'':`<button class="ghost" data-a="addleg">Add to parlay${pl.length?' ('+pl.length+' so far)':''}</button>`}<button class="ghost" data-a="close">Cancel</button>`}
  if(sheetMode==='parlay'){slip=slip||{stake:Math.min(defaultStake,me.cash)};const q=plQuote(M),st=slip.stake,win=q.ok?toWin(st,q.odds):0;return`<div class="slipodds"><h3>${pl.length}-leg parlay</h3><b>${q.ok?fo(q.odds):'--'}</b></div><div class="legs">${pl.map((sp,i)=>{const lq=q.qs[i];return`<div class="leg"><span>${esc(lq.label)}</span><span class="n">${lq.ok?fo(lq.odds):'LOCK'}</span><button class="x" data-a="rmleg" data-v="${i}">X</button></div>`}).join('')}</div><p>Same-game price: legs are related, so the return is trimmed 8% from straight multiplication. Any losing leg loses the parlay. A pushed leg drops out.</p><div class="slipodds"><span class="stake">${money(st)}</span><span>wins <b class="n" style="color:var(--win);font-size:22px">${fmtU(win)}</b></span></div><div class="chips">${[10,25,50,100].map(v=>`<button class="chip" data-a="add" data-v="${v}">+${v}</button>`).join('')}<button class="chip" data-a="max">MAX</button><button class="chip" data-a="clr">CLR</button></div><button class="go" data-a="plgo"${q.ok&&st>0&&st<=me.cash?'':' disabled'}>${pl.length<2?'Add at least 2 legs':q.ok?'Lock parlay at '+fo(q.odds):'A leg is locked'}</button><button class="ghost" data-a="close">Keep building</button>`}

/* ---------- render ---------- */
let html={},rankToast=0;const BOOT=Date.now();
function put(id,h){if(html[id]!==h){html[id]=h;$(id).innerHTML=h}}
function render(){const M=model();$('hdr').classList.toggle('crunch',M.g.live&&M.f<.0834&&Math.abs(M.cur)<=8);put('hdr',vHdr(M));put('view',tab==='live'?vLive(M):tab==='board'?vBoard(M):tab==='picks'?vPicks(M):vLadder(M));put('tabs',vTabs(M));const open=!!sheetMode;$('scrim').hidden=!open;$('sheet').hidden=!open;if(open&&(sheetMode==='slip'||sheetMode==='parlay'))put('sheet',vSheet(M));put('plbar',vPlBar(M));$('plbar').hidden=!pl.length;
  const r=ladder(M).find(x=>x.me).rank;if(lastRank&&r!==lastRank&&me.handle&&Date.now()-BOOT>20000&&Date.now()-rankToast>9000){rankToast=Date.now();const rs=ladder(M);if(r<lastRank){const u=rs[r];toast(`Up to #${r}. You passed ${u?u.name:'the field'}.`)}else{const u=rs[r-2];toast(`Down to #${r}. ${u?u.name:'Someone'} passed you.`)}}lastRank=r}
function openSheet(m){sheetMode=m;html.sheet=null;$('sheet').innerHTML=vSheet(model());html.sheet=$('sheet').innerHTML;$('scrim').hidden=false;$('sheet').hidden=false}
function closeSheet(){sheetMode=null;slip=null;$('scrim').hidden=true;$('sheet').hidden=true}
let tickT=0;function tick(){if(tickT)return;tickT=setTimeout(()=>{tickT=0;const M=model();for(const step of [()=>settle(M),()=>scoreAlert(M),()=>duel(M),()=>render()]){try{step()}catch(e){console.error(e)}}},60)}

/* tap handling survives re-renders: act on the element under pointerdown */
let dn=null;
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-a]');dn=t?{a:t.dataset.a,k:t.dataset.k,v:t.dataset.v,id:t.dataset.id,x:e.clientX,y:e.clientY,el:t}:null;if(!audioCtx)blip(1,.001)});
document.addEventListener('pointerup',e=>{if(!dn)return;const d=dn;dn=null;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>12)return;act(d)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a){e.preventDefault();const t=e.target;act({a:t.dataset.a,k:t.dataset.k,v:t.dataset.v,id:t.dataset.id})}});
$('scrim').addEventListener('click',()=>{if(sheetMode!=='name')closeSheet()});
function act(d){switch(d.a){
  case'tab':tab=d.v;window.scrollTo(0,0);render();break;
  case'board':boardTab=d.v;render();break;
  case'prop':propTab=d.v;render();break;
  case'stake':defaultStake=+d.v;render();break;
  case'snap':place(REG[d.k],Math.min(defaultStake,me.cash));break;
  case'slip':{const sp=REG[d.k];if(!sp)break;const q=quote(sp);slip={sp,stake:Math.min(defaultStake,me.cash),o0:q.ok?q.odds:null};openSheet('slip');break}
  case'add':slip.stake=Math.min(me.cash,slip.stake+ +d.v);render();break;
  case'max':slip.stake=Math.floor(me.cash);render();break;
  case'clr':slip.stake=0;render();break;
  case'goPicks':tab='picks';window.scrollTo(0,0);render();break;
  case'confirm':if(place(slip.sp,slip.stake))closeSheet();break;
  case'cash':cashOut(d.id);break;
  case'cashall':me.bets.filter(b=>b.status==='open'&&!MICRO.includes(b.spec.k)).map(b=>b.id).forEach(cashOut);break;
  case'pathslip':{const sp=REG[d.k];if(!sp)break;const q=quote(sp);slip={sp,stake:Math.min(+d.v,Math.floor(me.cash)),o0:q.ok?q.odds:null};openSheet('slip');break}
  case'addleg':{if(plConflict(slip.sp)){toast('That market is already in your parlay.');break}pl.push(slip.sp);closeSheet();render();break}
  case'rmleg':pl.splice(+d.v,1);if(!pl.length)closeSheet();render();break;
  case'plopen':slip={stake:Math.min(defaultStake,me.cash)};openSheet('parlay');break;
  case'plgo':if(placeParlay(slip.stake))closeSheet();break;
  case'reload':if(me.reloaded)break;me.reloaded=true;me.debt=(me.debt||0)+1000;me.cash+=1000;save();toast('Reload: 1,000 Stack back in play. Your Units keep counting.');render();break;
  case'start':{const [a,b]=String(d.v).split('|');me.handle=(($('hn')&&$('hn').value)||'').trim()||'Rookie';me.cash=+a;me.s0=+a;me.u0=+b;save();closeSheet();render();wake();break}
  case'changes':openSheet('changes');break;
  case'lag':openSheet('lag');break;
  case'close':closeSheet();break;
  }}
function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}

/* hosts cache this page for minutes: check for a newer version and reload at a quiet moment */
async function checkVersion(){if(document.hidden)return;try{const r=await fetch(location.pathname+'?t='+Date.now(),{cache:'no-store'}),t=await r.text(),m=t.match(/const VERSION='(vd+)'/);if(m&&m[1]!==VERSION){if(sheetMode){toast('New version '+m[1]+' loads when you close this.');return}location.replace(location.pathname+'?v='+m[1])}}catch(e){}}
