<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Lab Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
  /* Layout: one column of team cards under a live scoreline strip; built for a phone held in a dark room during the game. */
  :root {
    --bg: #0e1116; --panel: #171c24; --line: #26303d; --fg: #e8ecf1; --muted: #8a97a8;
    --accent: #f2b63d; --red: #e5533d; --blue: #3d8ef0; --gold: #f2b63d; --live: #3ddc84;
    --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(12px, env(safe-area-inset-top, 0px)) 32px; max-width: 640px; margin: 0 auto; box-sizing: border-box;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
  .score { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .95rem; color: var(--muted); }
  .score b { color: var(--fg); }
  .score .live { color: var(--live); font-weight: 600; }
  .teams { display: grid; gap: 14px; margin-top: 16px; }
  .team { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
  .team-head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .team h2 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .03em; flex: 1; }
  .ver { font-family: var(--font-mono); font-size: .85rem; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .ver.has { color: var(--fg); border-color: var(--accent); }
  .open { display: block; text-align: center; padding: 12px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; color: #0e1116; background: var(--accent); }
  .open.wait { background: var(--line); color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; }
  dt { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
  dd { margin: 0; min-width: 0; }
  details summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  details ul { margin: 8px 0 0; padding-left: 18px; font-size: .9rem; display: grid; gap: 4px; }
  .foot { margin-top: 20px; color: var(--muted); font-size: .8rem; line-height: 1.5; }
  .updated { font-family: var(--font-mono); }
</style>
</head>
<body>
<header>
  <h1>Live Lab</h1>
  <div class="score" id="score">CHI at SEA <span class="live">LIVE</span></div>
</header>

<div class="teams" id="teams"></div>

<p class="foot">Three teams, one game, one brief. Each card shows the version that team last shipped and what it is testing now. Tap Open to play that team's page (reload it to get the newest version). Hub updated <span class="updated" id="updated"></span> ET.</p>

<script>
  const TEAMS = [
    { key: "red",  name: "Team Red (Redline MNF)",  version: "v5", url: "https://mclovin-codes.github.io/live-lab/teams/red/",  changed: "ESPN push feed (FastCast websocket) replaces polling, real DraftKings live prices on main lines, measured lag shown in the header (PUSH about 0.3 s server to page; PLAY from ESPN wallclock being measured), pick delay 1.5 s, snap lock 0.7 s. v4 added big play takeovers, Q4 bar, finish markets, results card.", testing: "v6: play lag over push through several real plays, a bonus stake each quarter so a busted player stays in, fourth quarter pricing check.", log: ["v1 first live page", "v2 cash out, parlays, boost, one-tap", "v3 duels, quarter sprints, milestones", "v4 big play takeovers, Q4 bar, finish markets, results card", "v5 ESPN push feed, DraftKings live prices, measured lag"] },
    { key: "blue", name: "Team Blue (Blue 42)", version: "v6", url: "https://mclovin-codes.github.io/live-lab/teams/blue/", changed: "ESPN FastCast push connected: DraftKings live prices tick about every 2 s and every other market reprices from them. All feeds cache-busted, situation polled every 1.5 s, push triggers instant reads. True lag on the header (median of last 8 plays): plays land 20 to 28 s after wallclock, which is ESPN's publish time. Snap picks lock 4 s after a sharp line jump. v5 added moment cards, three races, path to #1, win chart, final card.", testing: "v7: Rush words, event-page framing, live settle through a full drive.", log: ["v1 first live page", "v2 Drive Duel, rank alerts, rebuy, feed fix", "v3 parlays, open picks strip, scoring alerts", "v4 self-update", "v5 moment cards, three races, path to #1, win chart, final card", "v6 FastCast push, DraftKings live prices, cache bust, true lag"] },
    { key: "gold", name: "Team Gold (Hashmark Live)", version: "v6", url: "https://mclovin-codes.github.io/live-lab/teams/gold/", changed: "One-tap picks on Next snap and This drive, open picks glow on the board, tickets show current price and whether you beat the line, second-half spread and total, final recap card. Self-update confirmed live; a first-down ticket settled correctly on a real play. Still on polling (3 to 10 s).", testing: "v7: real-time priority, Rush words, live settlement of drive and one-tap tickets.", log: ["v1 first live page", "v2 standalone", "v3 parlays, first-down market, every-snap sim field", "v4 field position fix, 4th-down pricing", "v5 self-update, snap streak, head-to-head", "v6 one-tap picks, beat-the-line, second-half markets, recap"] },
  ];
  const UPDATED = "9:27 PM";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("updated").textContent = UPDATED;
  document.getElementById("teams").innerHTML = TEAMS.map(t => `
    <section class="team" id="${t.key}">
      <div class="team-head">
        <span class="dot" style="background: var(--${t.key})"></span>
        <h2>${esc(t.name)}</h2>
        <span class="ver ${t.version ? "has" : ""}">${t.version ? esc(t.version) : "building"}</span>
      </div>
      <a class="open ${t.version ? "" : "wait"}" href="${esc(t.url)}">${t.version ? "Open " + esc(t.name) : "Open (placeholder until first ship)"}</a>
      <dl>
        <dt>Changed</dt><dd>${esc(t.changed)}</dd>
        <dt>Testing</dt><dd>${esc(t.testing)}</dd>
      </dl>
      ${t.log.length ? `<details><summary>${t.log.length} version${t.log.length > 1 ? "s" : ""}</summary><ul>${t.log.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>` : ""}
    </section>`).join("");

  async function score() {
    try {
      const r = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=401873036");
      const j = await r.json();
      const c = j.header.competitions[0];
      const home = c.competitors.find(x => x.homeAway === "home"), away = c.competitors.find(x => x.homeAway === "away");
      const st = c.status.type;
      const state = st.state === "in" ? `<span class="live">${esc(st.shortDetail)}</span>` : esc(st.shortDetail);
      document.getElementById("score").innerHTML = `${esc(away.team.abbreviation)} <b>${esc(away.score)}</b> at ${esc(home.team.abbreviation)} <b>${esc(home.score)}</b> ${state}`;
    } catch (e) { /* keep the last line */ }
  }
  score(); setInterval(score, 10000);
</script>
</body>
</html>
