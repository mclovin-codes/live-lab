<script>
/* Rush game page: pregame full book and live mode for NFL, NBA and NHL (owner: Team Blue).
   Data: ESPN site summary (score, box, plays, book lines, win probability), core probabilities, core plays.
   Picks go through Rush.place() into the weekly Slip; finals graded by Rush.grade.sync().
   Fairness: pregame lines are open until the start. Live, every market opens only during a stoppage

function propsView(M){const L=propList(M);if(!L.length)return`<div class="empty">${S.props.length?'No player lines posted for this game yet.':'Loading player lines.'}</div>`;const td=L.filter(x=>x.k==='td'),pr=L.filter(x=>x.k==='prop');let h='';const groups={};pr.forEach(p=>(groups[p.stat]=groups[p.stat]||[]).push(p));Object.entries(groups).forEach(([st,arr])=>{h+=`<section class="mk"><div class="mkh"><h2>${esc(st)}</h2><small>${game().live?'now · line':'season line'}</small></div>${arr.slice(0,14).map(p=>{const base={k:'prop',aid:p.aid,name:p.name,t:p.t,key:p.key,stat:p.stat,prior:p.prior,a:p.a,b:p.b,line:p.line};const v=glVals(p.aid,p.key),avg=v&&v.length?(v.reduce((a,b)=>a+b,0)/v.length):null,open=pexp===p.aid+'|'+p.key;let ex='';if(open){if(!v)ex='<div class="empty">Loading recent games.</div>';else{const l5=v.slice(0,5),mx=Math.max(p.line*1.3,...l5,1);const step=p.key.includes('Yards')?(p.key==='passingYards'?25:10):p.key==='points'?5:1;const lad=[p.line-step,p.line,p.line+step,p.line+2*step].filter(x=>x>Number(p.cur));ex=`<div class="box"><div class="dim" style="font-size:13px;margin-bottom:6px">Last ${l5.length} games against ${p.line}</div><div class="ou5">${l5.slice().reverse().map(x=>`<div class="b" style="height:${x/mx*100}%;background:${x>p.line?'var(--win)':'var(--loss)'}"><span>${x}</span></div>`).join('')}<div class="ln" style="bottom:${p.line/mx*100}%"></div></div><div class="tbl" style="margin-top:8px">${lad.map(x=>oBtn(Object.assign({},base,{side:'o',line:Math.round(x*2)/2}),(Math.round(x*2)/2+.5)+'+',M)).join('')}</div></div>`}}return`<div class="prow"><button class="who" data-a="pexp" data-v="${esc(p.aid+'|'+p.key)}" style="text-align:left">${head(p.aid)}${esc(p.name)}${injTag(p.aid)}<small>${avg!=null?'avg '+avg.toFixed(1)+' · ':''}${game().live?Number(p.cur)+' now · ':''}${Number(p.prior)} line${open?' · hide':' · tap for last 5'}</small></button>${oBtn(Object.assign({},base,{side:'o'}),'O '+p.line,M)}${oBtn(Object.assign({},base,{side:'u'}),'U /* ---------- feeds ---------- */
/* push book: ESPN fastcast topic gp-<sport>-<league>-<id> sends JSON patches of the game doc; the /pickcenter ones are applied to
   S.sum as they land. The REST summary lags the push by minutes in hockey (MTL -410 on REST ten minutes after the push moved it
   to -345), so every path the push has set stays authoritative: FC.pc keeps the latest op per path and each REST poll reapplies them.
   fcLive() is true while the socket is up and a message arrived in the last 60 s. FC.priceAt is when the book last posted a moneyline. */
const FC={ws:null,on:false,mid:0,last:0,backoff:1000,posted:false,priceAt:0,pc:new Map(),q:Promise.resolve()};
const FCT=`gp-${SPORT?SPORT.path.replace('/','-'):''}-${ID}`;
const fcLive=()=>FC.on&&Date.now()-FC.last<60000;
async function inflate64(b){const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'))).text()}

  if(o.op==='remove'){if(Array.isArray(n))n.splice(+l,1);else delete n[l]}else if(Array.isArray(n)&&l==='-')n.push(o.value);else if(Array.isArray(n)&&o.op==='add')n.splice(+l,0,o.value);else n[l]=o.value}
function fcSeen(ts,ml){const pc=S.sum&&S.sum.pickcenter&&S.sum.pickcenter[0],v=pc&&pc.moneyline&&pc.moneyline.home&&pc.moneyline.home.live,p=!!v&&numO(v.odds)!=null;if(p&&ml)FC.priceAt=ts||Date.now();FC.posted=p}
function fcReapply(){if(S.sum)FC.pc.forEach(x=>jpatch(S.sum,x))}
/* checkpoint: the H reply after subscribing names a full snapshot of the game doc at that message id. Its pickcenter is current
   (MTL -920 there while REST still read -950), so it seeds the push copy and counts as a fresh book price. */
async function fcCheckpoint(url,mid){if(FC.cpMid>=mid)return;FC.cpMid=mid;const d=await (await fetch(url)).json();if(!d||!Array.isArray(d.pickcenter)||!S.sum||mid<=FC.mid)return;
  const x={op:'replace',path:'/pickcenter',value:d.pickcenter};FC.pc.clear();FC.pc.set('/pickcenter',x);jpatch(S.sum,x);FC.mid=mid;fcSeen(Date.now(),true);render()}
function fcMsg(m){FC.last=Date.now();if(m.op==='H'&&/^https:\/\/fcast\.espncdn\.com\//.test(m.pl||'')&&!FC.cpMid){FC.q=FC.q.then(()=>fcCheckpoint(m.pl,m.mid)).catch(()=>{});return}if(m.op!=='P'&&m.op!=='R')return;FC.q=FC.q.then(async()=>{let o,list;try{o=JSON.parse(m.pl);list=o['~c']?JSON.parse(await inflate64(o.pl)):o.pl}catch(e){return}if(!Array.isArray(list)||m.mid<=FC.mid||!S.sum)return;FC.mid=m.mid;let pc=false,ml=false;
  list.forEach(x=>{const p=String(x.path||'');if(!/^\/pickcenter/.test(p))return;pc=true;jpatch(S.sum,x);FC.pc.delete(p);FC.pc.set(p,x);if(/^\/pickcenter(\/0(\/moneyline(\/home(\/live(\/odds)?)?)?)?)?$/.test(p))ml=true});if(pc){fcSeen(o.ts,ml);render()}})}
async function fcConnect(){if(!SPORT||(FC.ws&&FC.ws.readyState<2))return;try{const h=await j('https://fastcast.semfs.engsvc.go.com/public/websockethost');const ws=new WebSocket(`wss://${h.ip}:${h.securePort}/FastcastService/pubsub/profiles/12000?TrafficManager-Token=${encodeURIComponent(h.token)}`);FC.ws=ws;let hb;
  ws.onopen=()=>ws.send(JSON.stringify({op:'C'}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.op==='C'){ws.send(JSON.stringify({op:'S',sid:m.sid,tc:FCT}));hb=setInterval(()=>{try{ws.send(JSON.stringify({op:'H',sid:m.sid,tc:FCT}))}catch(x){}},Math.max(10,(m.hbi||30)-5)*1000)}else if(m.op==='S'){FC.on=true;FC.backoff=1000;FC.last=Date.now()}else fcMsg(m)};
  ws.onclose=()=>{FC.on=false;FC.mid=0;FC.cpMid=0;FC.pc.clear();clearInterval(hb);setTimeout(fcConnect,FC.backoff);FC.backoff=Math.min(30000,FC.backoff*2);render()};ws.onerror=()=>{try{ws.close()}catch(x){}}}
  catch(e){setTimeout(fcConnect,FC.backoff);FC.backoff=Math.min(30000,FC.backoff*2)}}
async function pollSum(){const firstSum=!S.sum,t0=Date.now();S.sum=await j(`${SITE}/summary?event=${ID}`);fcReapply();S.ok.sum=Date.now();

  if(LG==='nhl'&&(S.sum.plays||[]).length){const m=new Map(S.plays.map(p=>[String(p.id),p]));S.sum.plays.slice(-80).forEach(p=>m.set(String(p.id),p));S.plays=[...m.values()].sort((x,y)=>(+x.sequenceNumber)-(+y.sequenceNumber)).slice(-80)}if(firstSum)pollRoster();const g=game();if(g.live)fcConnect();if(g.done)Rush.grade.sync().then(n=>{if(n)toast(n+' pick'+(n>1?'s':'')+' graded on the final.')}).catch(()=>{});render()}
/* an endpoint that answers 400 is unsupported for this league (ESPN core probabilities and plays for NHL): stop polling it */
const DEAD={};const once=async(k,u)=>{try{return await j(u)}catch(e){if(e.message==='400')DEAD[k]=true;throw e}};

async function pollRoster(){const c=comp();if(!c)return;for(const t of c.competitors){try{const r=await j(`${SITE}/teams/${t.team.id}/roster`);const add=a=>{if(a&&a.id)roster[a.id]=a.shortName||a.displayName};(r.athletes||[]).forEach(x=>x.items?x.items.forEach(add):add(x))}catch(e){}}render()}
async function pollProps(){try{const r=await j(`${CORE}/odds/100/propBets?limit=1000`);S.props=r.items||[]}catch(e){S.props=[]}render()}
function loop(fn,msLive,msPre){let on=false,first=true;const run=async()=>{if((first||!document.hidden)&&!on){first=false;on=true;try{await fn();S.err=null}catch(e){S.err=e.message}on=false}setTimeout(run,game().live?msLive:msPre)};run()}
try{if(window.RW&&RW.mountStrip)RW.mountStrip($('rw-strip'),LG,ID)}catch(e){}
if(SPORT){render();loop(pollSum,4000,30000);loop(pollProbs,3000,30000);loop(pollPlays,2000,30000);pollProps();setInterval(pollProps,300000);setInterval(render,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){pollSum().catch(()=>{});pollPlays().catch(()=>{})}})}else render();
</script>
