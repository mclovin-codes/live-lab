<script>
/* Rush game page: pregame full book and live mode for NFL, NBA and NHL (owner: Team Blue).
   Data: ESPN site summary (score, box, plays, book lines, win probability), core probabilities, core plays.

const Q=new URLSearchParams(location.search),LG=(Q.get('league')||'nfl').toLowerCase(),ID=Q.get('id')||'401873051';
const SPORT={nfl:{path:'football/nfl',core:'football/leagues/nfl',total:3600,per:4,len:900,sdM:13.4,sdT:13.2,pn:'Q',unit:'points',court:'nfl'},nba:{path:'basketball/nba',core:'basketball/leagues/nba',total:2880,per:4,len:720,sdM:12.5,sdT:17.5,pn:'Q',unit:'points',court:'nba'},nhl:{path:'hockey/nhl',core:'hockey/leagues/nhl',total:3600,per:3,len:1200,sdM:2.3,sdT:2.25,pn:'P',unit:'goals',court:'nhl'}}[LG]||null;
const SITE=`https://site.api.espn.com/apis/site/v2/sports/${SPORT.path}`,CORE=`https://sports.core.api.espn.com/v2/sports/${SPORT.core}/events/${ID}/competitions/${ID}`;
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S={sum:null,probs:[],plays:[],props:[],ok:{},err:null};

/* ---------- math and pricing ---------- */
function Phi(x){const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}

const half=x=>Math.round(x*2)/2,toProb=o=>o<0?-o/(100-o):100/(100+o);
function amer(p){let a=p>=.5?-100*p/(1-p):100*(1-p)/p,s=Math.abs(a)<500?5:Math.abs(a)<1000?10:Math.abs(a)<2000?25:50;a=Math.round(a/s)*s;if(a>-100&&a<100)a=a<0?-100:100;return a}

/* NFL key numbers (Red, fitted on 855 games); other sports use the plain curve with half-point continuity */
const KW=[1.739,0.908,1.025,2.051,0.992,0.97,0.951,1.544,0.878,0.41,0.94,0.396,0.583,0.661,1.254,0.506,0.712,1.507,0.933,0.708,0.905,1.023,0.887,1.074,1.212,1.024,0.892,0.918,1.137,0.873,0.895,1.261,1.062,0.922,1.253,1.009,0.885,1.049,1.119,0.924,0.99];
function ou(m,sd,L,key){if(key){sd=Math.max(.8,sd);const k=Math.min(1,sd/8);let o=0,u=0,p=0,t=0;for(let x=Math.floor(m-6*sd);x<=Math.ceil(m+6*sd);x++){const q=Math.exp(-(((x-m)/sd)**2)/2)*Math.pow(KW[Math.min(40,Math.abs(x))],k);t+=q;if(x>L)o+=q;else if(x<L)u+=q;else p+=q}return{o:o/t,u:u/t,p:p/t}}if(Number.isInteger(L)){const hi=Phi((L+.5-m)/sd),lo=Phi((L-.5-m)/sd);return{o:1-hi,u:lo,p:hi-lo}}const c=Phi((L-m)/sd);return{o:1-c,u:c,p:0}}

/* ---------- game state ---------- */
const comp=()=>S.sum&&S.sum.header&&S.sum.header.competitions[0];
function team(side){const c=comp();const t=c&&c.competitors.find(x=>x.homeAway===side);if(!t)return{abbr:side==='home'?'HOME':'AWAY',score:0};const rec=(t.record||[])[0];return{id:t.team.id,abbr:t.team.abbreviation,name:t.team.displayName,short:t.team.shortDisplayName||t.team.name,logo:(t.team.logos&&t.team.logos[0]&&t.team.logos[0].href)||t.team.logo||`https://a.espncdn.com/i/teamlogos/${LG}/500/${(t.team.abbreviation||'').toLowerCase()}.png`,score:+t.score||0,rec:rec&&(rec.summary||rec.displayValue),color:t.team.color,ls:(t.linescores||[]).map(l=>+(l.displayValue||l.value||0))}}
function game(){const c=comp();if(!c)return{state:'pre',period:0,clk:0,secs:SPORT.total,detail:'',live:false,done:false};const st=c.status,m=/(\d+):(\d+)/.exec(st.displayClock||''),clk=m?+m[1]*60+ +m[2]:0,p=st.period||0,secs=st.type.state==='pre'?SPORT.total:p<=SPORT.per?(SPORT.per-p)*SPORT.len+clk:clk;return{state:st.type.state,period:p,clk,secs,detail:st.type.shortDetail||st.type.detail||'',live:st.type.state==='in',done:!!st.type.completed,name:st.type.name,start:Date.parse(c.date)}}
function numO(x){if(x==null)return null;const s=String(x).toUpperCase();if(s.startsWith('EV'))return 100;const v=parseInt(s.replace('+',''),10);return Number.isFinite(v)&&Math.abs(v)>=100?v:null}
function numL(x){if(x==null)return null;const s=String(x).toLowerCase();if(s==='pk'||s==='ev')return 0;const v=parseFloat(s.replace(/^[ou]/,''));return Number.isFinite(v)?v:null}
function book(){const pc=S.sum&&(S.sum.pickcenter||[])[0];if(!pc||!pc.moneyline)return null;const g=game(),when=g.live?'live':'close',pick=(o,...k)=>{let n=o;for(const x of k){if(n==null)return null;n=n[x]}return n};const s=(o,a)=>pick(o,a,when)||(!g.live?pick(o,a,'open'):null);const mlH=numO(pick(s(pc.moneyline,'home'),'odds')),mlA=numO(pick(s(pc.moneyline,'away'),'odds')),spH=numL(pick(s(pc.pointSpread,'home'),'line')),spHo=numO(pick(s(pc.pointSpread,'home'),'odds')),spAo=numO(pick(s(pc.pointSpread,'away'),'odds')),tot=numL(pick(s(pc.total,'over'),'line')),ovO=numO(pick(s(pc.total,'over'),'odds')),unO=numO(pick(s(pc.total,'under'),'odds'));
  const nv=(a,b)=>a!=null&&b!=null?toProb(a)/(toProb(a)+toProb(b)):null;return{mlH,mlA,spH,spHo,spAo,tot,ovO,unO,hw:nv(mlH,mlA),cov:nv(spHo,spAo),ov:nv(ovO,unO),live:g.live}}
function model(){const g=game(),b=book(),h=team('home'),a=team('away'),f=clamp(g.secs/SPORT.total,0,1),cur=h.score-a.score,sum=h.score+a.score,fl=g.secs>=90?.28*SPORT.sdM:.1*SPORT.sdM;const sm=Math.max(fl,SPORT.sdM*Math.sqrt(f)),st=Math.max(fl,SPORT.sdT*Math.sqrt(f));
  const pr=S.probs[S.probs.length-1];let hw=g.live&&pr?pr.homeWinPercentage:b&&b.hw!=null?b.hw:.5;let mu=b&&b.spH!=null&&b.cov!=null?-b.spH+sm*inv(clamp(b.cov,.02,.98)):sm*inv(clamp(hw,.01,.99));const bd=(18*f+1.5)*SPORT.sdM/13.4;mu=clamp(mu,cur-bd,cur+bd);
  let tm=b&&b.tot!=null?b.tot+st*inv(clamp(b.ov==null?.5:b.ov,.02,.98)):sum+(SPORT.unit==='goals'?6*f:SPORT.sdT*3*f);tm=Math.max(tm,sum+.1);const hm=Math.max(h.score,(tm+mu)/2),am=Math.max(a.score,(tm-mu)/2);
  return{g,b,h,a,f,cur,sum,sm,st,mu,tm,hm,am,sdT:Math.max(fl*.7,SPORT.sdT*.7*Math.sqrt(f)),hw,main:b&&b.spH!=null?b.spH:-half(mu),mt:b&&b.tot!=null?b.tot:half(tm)}}

/* ---------- fair window: pregame open until the start; live only in stoppages ---------- */
function stopInfo(){const L=S.plays,last=L[L.length-1];if(!last)return null;const t=((last.type&&last.type.text)||'')+' '+(last.text||''),w=Date.parse(last.wallclock||'');if(!w)return null;

function propsView(M){const L=propList(M);if(!L.length)return`<div class="empty">${S.props.length?'No player lines posted for this game yet.':'Loading player lines.'}</div>`;const td=L.filter(x=>x.k==='td'),pr=L.filter(x=>x.k==='prop');let h='';const groups={};pr.forEach(p=>(groups[p.stat]=groups[p.stat]||[]).push(p));Object.entries(groups).forEach(([st,arr])=>{h+=`<section class="mk"><div class="mkh"><h2>${esc(st)}</h2><small>${game().live?'now · line':'season line'}</small></div>${arr.slice(0,14).map(p=>{const base={k:'prop',aid:p.aid,name:p.name,t:p.t,key:p.key,stat:p.stat,prior:p.prior,a:p.a,b:p.b,line:p.line};return`<div class="prow"><span class="who">${head(p.aid)}${esc(p.name)}<small>${game().live?p.cur+' now · ':''}${p.prior} pregame</small></span>${oBtn(Object.assign({},base,{side:'o'}),'O '+p.line,M)}${oBtn(Object.assign({},base,{side:'u'}),'U '+p.line,M)}</div>`}).join('')}</section>`});if(td.length)h+=`<section class="mk"><div class="mkh"><h2>Anytime touchdown</h2></div><div class="tbl two">${td.slice(0,12).map(x=>oBtn({k:'td',aid:x.aid,name:x.name,lam:x.lam},x.name,M)).join('')}</div></section>`;return h}
function periodView(M,halves){const out=[];if(halves&&SPORT.per===4){out.push({from:1,to:2});out.push({from:3,to:9})}else for(let i=1;i<=SPORT.per;i++)out.push({from:i,to:i});return out.map(s=>{const q=qstat(M,s.from,s.to);if(q.left<=0)return'';const rf=M.g.secs>0?q.left/M.g.secs:q.left/SPORT.total,tl=LG==='nhl'?Math.floor(q.pts+(M.tm-M.sum)*rf)+.5:half(q.pts+(M.tm-M.sum)*rf),mm=q.mg+(M.mu-M.cur)*rf;let sl=-half(mm);if(sl===0)sl=-.5;return`<section class="mk"><div class="mkh"><h2>${pspan(s)}</h2><small>${q.pts} so far</small></div><div class="tbl two">${oBtn({k:'qs',from:s.from,to:s.to,side:'away',line:-sl},M.a.abbr+' '+ln(-sl),M)}${oBtn({k:'qs',from:s.from,to:s.to,side:'home',line:sl},M.h.abbr+' '+ln(sl),M)}${oBtn({k:'qt',from:s.from,to:s.to,side:'o',line:tl},'O '+tl,M)}${oBtn({k:'qt',from:s.from,to:s.to,side:'u',line:tl},'U '+tl,M)}</div></section>`}).join('')||'<div class="empty">These periods are done.</div>'}
function vOdds(M){let h=vEntry()+vGate(M);if(subTab==='popular')h+=mainRows(M)+featured(M)+`<section class="mk"><div class="mkh"><h2>Alt spread</h2></div>${stepper('sp',M)}</section>`;
  if(subTab==='lines')h+=mainRows(M);if(subTab==='alts')h+=`<section class="mk"><div class="mkh"><h2>Alt spread</h2></div>${stepper('sp',M)}</section><section class="mk"><div class="mkh"><h2>Alt total</h2></div>${stepper('tot',M)}</section>`;
  if(subTab==='team')h+=`<section class="mk">${stepper('ttA',M)}</section><section class="mk">${stepper('ttH',M)}</section>`;if(subTab==='halves')h+=periodView(M,true);if(subTab==='qtr')h+=periodView(M,false);if(subTab==='props')h+=propsView(M);return h}
function vBox(M){const s=S.sum;const tp=(s&&s.boxscore&&s.boxscore.players||[]).find(t=>t.team.id==(boxSide==='home'?M.h.id:M.a.id));let h=`<div class="seg"><button class="${boxSide==='away'?'on':''}" data-a="boxside" data-v="away">${esc(M.a.abbr)}</button><button class="${boxSide==='home'?'on':''}" data-a="boxside" data-v="home">${esc(M.h.abbr)}</button></div>`;if(!tp)return h+'<div class="empty">The box score fills in once the game starts.</div>';
  (tp.statistics||[]).forEach(g=>{const lab=(g.labels||g.names||[]).slice(0,LG==='nba'?6:7),ath=(g.athletes||[]);if(!ath.length)return;const groups=LG==='nba'?[['Starters',ath.filter(a=>a.starter)],['Bench',ath.filter(a=>!a.starter)]]:[[g.text||g.name||'',ath]];groups.forEach(([gt,arr])=>{if(!arr.length)return;h+=`<section class="sec"><header><h2>${esc(gt||'')}</h2></header><div class="box scroll-x"><table class="boxt"><thead><tr><th>${LG==='nba'?'Player':''}</th>${lab.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${arr.map(a=>`<tr><td><span class="oc${a.active?'':' no'}"></span>${head(a.athlete.id)}<span>${esc(a.athlete.shortName||a.athlete.displayName)}${a.athlete.position?` <small class="dim">${esc(a.athlete.position.abbreviation||'')}</small>`:''}</span></td>${a.didNotPlay?`<td colspan="${lab.length}" style="text-align:left;color:var(--dim)">Has not entered game</td>`:lab.map((_,i)=>`<td>${esc((a.stats||[])[i]==null?'':a.stats[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`})});return h}
function vStats(M){const s=S.sum||{};let h=`<div class="seg">${[['game','Game'],['teams','Teams'],['players','Players']].map(x=>`<button class="${statsTab===x[0]?'on':''}" data-a="stats" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  if(statsTab==='game'){const gi=s.gameInfo||{},venue=gi.venue||{},br=(s.broadcasts||[]).map(b=>b.media&&b.media.shortName||b.station||b.name).filter(Boolean);const l5=last5(M);h+=l5;h+=`<section class="sec"><header><h2>Game information</h2></header><div class="box gi"><div>${esc(new Date(M.g.start).toLocaleString([],{weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</div>${venue.fullName?`<div>${esc(venue.fullName)}${venue.address?' · '+esc([venue.address.city,venue.address.state].filter(Boolean).join(', ')):''}</div>`:''}${br.length?`<div><span class="dim">Where to watch</span><div class="chipsr">${[...new Set(br)].map(b=>`<span>${esc(b)}</span>`).join('')}</div></div>`:''}${(gi.officials||[]).length?`<div class="dim">Officials: ${esc(gi.officials.map(o=>o.displayName||o.fullName).slice(0,4).join(', '))}</div>`:''}</div></section>`;return h}
  if(statsTab==='teams'){const T=id=>(s.boxscore&&s.boxscore.teams||[]).find(t=>t.team.id==id),a=T(M.a.id),b=T(M.h.id);if(!a||!b||!(a.statistics||[]).length)return h+'<div class="empty">Team stats fill in once the game starts.</div>';const hc='#'+(M.h.color||'00BFFF'),ac='#'+(M.a.color||'D95151');h+=`<section class="sec"><div class="box cmp"><div class="cmpr"><div class="t"><b>${esc(M.a.abbr)}</b><span></span><b>${esc(M.h.abbr)}</b></div></div>${(a.statistics||[]).slice(0,14).map((x,i)=>{const y=(b.statistics||[]).find(z=>z.name===x.name)||{};const va=parseFloat(x.displayValue)||0,vb=parseFloat(y.displayValue)||0,t=Math.max(va+vb,1e-9);return`<div class="cmpr"><div class="t"><span>${esc(x.displayValue)}</span><span>${esc(x.label||x.name)}</span><span>${esc(y.displayValue||'')}</span></div><div class="bars"><i class="a" style="width:${va/t*100}%;background:${ac}"></i><i style="width:${vb/t*100}%;background:${hc}"></i></div></div>`}).join('')}</div></section>`;return h}
  const L=s.leaders||[];h+=`<section class="sec"><header><h2>Game leaders</h2></header><div class="box">${(L[0]&&L[0].leaders||[]).map((cat,ci)=>{const x=cat.leaders&&cat.leaders[0],other=L[1]&&L[1].leaders&&L[1].leaders[ci]&&L[1].leaders[ci].leaders&&L[1].leaders[ci].leaders[0];if(!x)return'';const side=(p,r)=>p?`<div class="p${r?' r':''}">${head(p.athlete.id)}<div><span>${esc(p.athlete.shortName||p.athlete.displayName)}</span><small>${esc(p.displayValue||'')}</small></div></div>`:'<div></div>';return`<div class="ldr">${side(x)}<div class="c">${esc(cat.displayName||cat.name)}</div>${side(other,1)}</div>`}).join('')||'<div class="empty">Leaders appear once the game starts.</div>'}</div></section>`;return h}
function last5(M){const L=(S.sum&&S.sum.lastFiveGames)||[];if(!L.length)return'';return L.map(t=>{const ev=(t.events||[]).slice(0,5);if(!ev.length)return'';const tot=ev.map(e=>{const s=String(e.score||'').split('-').map(Number);return s.length===2?s[0]+s[1]:null});const mx=Math.max(M.mt||0,...tot.filter(x=>x!=null),1);return`<section class="sec"><header><h2>${esc(t.team&&t.team.abbreviation||'')} last 5</h2></header><div class="box">${ev.map(e=>`<div class="l5"><span class="dim">${esc(new Date(e.gameDate).toLocaleDateString([],{month:'numeric',day:'numeric'}))}</span><span>${esc(e.atVs||'')} ${esc(e.opponent&&e.opponent.abbreviation||'')}</span><span>${esc(e.score||'')}</span><span class="ch ${e.gameResult==='W'?'w':'l'}">${esc(e.gameResult||'')}</span></div>`).join('')}</div>${M.mt?`<div class="box"><div class="dim" style="font-size:13px;margin-bottom:6px">Total ${SPORT.unit} last 5, against tonight's ${M.mt}</div><div class="ou5">${tot.map(v=>v==null?'':`<div class="b" style="height:${v/mx*100}%;background:${v>M.mt?'var(--win)':'var(--loss)'}"><span>${v}</span></div>`).join('')}<div class="ln" style="bottom:${M.mt/mx*100}%"></div></div></div>`:''}</section>`}).join('')}
function vPlays(M){const P=(S.sum&&S.sum.plays)||[],wp={};((S.sum&&S.sum.winprobability)||[]).forEach(w=>wp[w.playId]=w.homeWinPercentage);const list=P.length?P.slice(-40).reverse():[];if(!list.length)return'<div class="empty">Plays appear once the game starts.</div>';return`<section class="sec"><div class="box">${list.map(p=>{const tid=p.team&&p.team.id,t=tid==M.h.id?M.h:tid==M.a.id?M.a:null,w=wp[p.id];return`<div class="pf">${t?`<img src="${t.logo}" alt="">`:'<span></span>'}<div><b>${esc(p.type&&p.type.text||'')}</b><small>${esc(p.clock&&p.clock.displayValue||'')} · ${SPORT.pn}${p.period&&p.period.number||''}</small><div style="font-size:14px">${esc(p.text||'')}</div></div><div class="s">${p.awayScore}-${p.homeScore}${w!=null?`<small>Win %: ${esc(w>=.5?M.h.abbr:M.a.abbr)} ${(Math.max(w,1-w)*100).toFixed(1)}</small>`:''}</div></div>`}).join('')}</div></section>`}
function vSheet(M){if(sheet==='enter'){const wk=Rush.week();return`<div class="grab"></div><h3>Enter ${esc(wk.label)}</h3><p>Get 1,000 Stack for the week. Every pick on any game counts toward your Units. Entry closes at Monday night kickoff, ${esc(Rush.clock(wk.entryCloses-Date.now()))} from now.</p><input type="text" id="hn" maxlength="18" placeholder="Your name in the Field" value="${esc(Rush.settings().handle||'')}" autocomplete="off"><button class="go" data-a="doenter">Enter with 1,000 Stack</button><button class="ghost" data-a="close">Not now</button>`}
  if(sheet==='slip'&&slip){const q=quote(slip.sp,M),win=q.ok?F.toWin(slip.stake,q.odds):0;return`<div class="grab"></div><div class="slipodds"><h3>${esc(q.label)}</h3><b>${q.ok?fo(q.odds):'&#128274;'}</b></div><div class="slipodds"><span class="stake">${F.stack(slip.stake)} Stack</span><span>wins <b class="n" style="color:var(--win)">${F.units(win/10)}</b></span></div><div class="chips">${[10,25,50,100,250].map(v=>`<button class="chip" data-a="add" data-v="${v}">+${v}</button>`).join('')}<button class="chip" data-a="max">MAX</button><button class="chip" data-a="clr">CLR</button></div><button class="go" data-a="confirm"${q.ok&&slip.stake>0?'':' disabled'}>${q.ok?'Lock at '+fo(q.odds):esc(q.why)}</button><button class="ghost" data-a="addleg">Add to parlay${pl.length?' ('+pl.length+' so far)':''}</button><button class="ghost" data-a="close">Cancel</button>`}
  if(sheet==='parlay'){const qs=pl.map(sp=>quote(sp,M)),ok=pl.length>1&&qs.every(q=>q.ok),odds=ok?plOdds(qs.map(q=>q.odds)):null;slip=slip||{stake:25};return`<div class="grab"></div><div class="slipodds"><h3>${pl.length}-leg parlay</h3><b>${ok?fo(odds):'-'}</b></div><div class="legs">${pl.map((sp,i)=>`<div class="leg"><span>${esc(qs[i].label)}</span><span class="n">${qs[i].ok?fo(qs[i].odds):'&#128274;'}</span><button class="x" data-a="rmleg" data-v="${i}">X</button></div>`).join('')}</div><p>Legs in the same game are related, so the return is trimmed 8% from straight multiplication.</p><div class="slipodds"><span class="stake">${F.stack(slip.stake)} Stack</span><span>wins <b class="n" style="color:var(--win)">${ok?F.units(F.toWin(slip.stake,odds)/10):'-'}</b></span></div><div class="chips">${[10,25,50,100].map(v=>`<button class="chip" data-a="add" data-v="${v}">+${v}</button>`).join('')}<button class="chip" data-a="clr">CLR</button></div><button class="go" data-a="plgo"${ok?'':' disabled'}>${pl.length<2?'Add at least 2 legs':ok?'Lock parlay at '+fo(odds):'A leg is locked'}</button><button class="ghost" data-a="close">Keep building</button>`}
  return''}

/* ---------- render ---------- */
let sheet=null;const html={};function put(id,h){if(html[id]!==h){html[id]=h;$(id).innerHTML=h}}
function render(){if(!SPORT){$('gview').innerHTML='<div class="empty">Unknown league.</div>';return}const M=model();put('ghdr',vHdr(M));put('pills',vPills());put('subs',vSubs());$('subs').hidden=pillTab!=='odds';put('gview',pillTab==='odds'?vOdds(M):pillTab==='box'?vBox(M):pillTab==='stats'?vStats(M):vPlays(M));if(sheet==='slip'||sheet==='parlay')put('gsheet',vSheet(M));$('slipbar').hidden=!pl.length;if(pl.length)put('slipbar',`<button data-a="plopen"><span>Parlay · ${pl.length} leg${pl.length>1?'s':''}</span><span>${(()=>{const qs=pl.map(sp=>quote(sp,M));return pl.length>1&&qs.every(q=>q.ok)?fo(plOdds(qs.map(q=>q.odds))):'add more'})()}</span></button>`);document.title=(M.a.abbr||'')+' at '+(M.h.abbr||'')+' · Rush'}
function openSheet(m){sheet=m;html.gsheet=null;$('gsheet').innerHTML=vSheet(model());$('gscrim').classList.add('open');$('gsheet').classList.add('open')}
function closeSheet(){sheet=null;slip=null;$('gscrim').classList.remove('open');$('gsheet').classList.remove('open')}
let dn=null;document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-a]');dn=t?{a:t.dataset.a,k:t.dataset.k,v:t.dataset.v,x:e.clientX,y:e.clientY}:null});
document.addEventListener('pointerup',e=>{if(!dn)return;const d=dn;dn=null;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>12)return;act(d)});
$('gscrim').addEventListener('click',closeSheet);
function act(d){const M=model();switch(d.a){
  case'pill':pillTab=d.v;window.scrollTo(0,0);render();break;case'sub':subTab=d.v;render();break;case'boxside':boxSide=d.v;render();break;case'stats':statsTab=d.v;render();break;
  case'slip':{const sp=REG[d.k];if(!sp)break;if(!Rush.me().entered){openSheet('enter');break}slip={sp,stake:Math.min(25,Math.floor(Rush.stack()))};openSheet('slip');break}
  case'add':slip.stake=Math.min(Math.floor(Rush.stack()),slip.stake+ +d.v);render();break;case'max':slip.stake=Math.floor(Rush.stack());render();break;case'clr':slip.stake=0;render();break;
  case'confirm':confirm(slip.sp,slip.stake);break;
  case'addleg':if(pl.some(x=>x.k===slip.sp.k&&x.side!==slip.sp.side&&JSON.stringify(Object.assign({},x,{side:0}))===JSON.stringify(Object.assign({},slip.sp,{side:0})))){toast('The other side is already in your parlay.');break}pl.push(slip.sp);closeSheet();render();break;
  case'feat':{const legs=REG[d.k];if(!legs)break;if(!Rush.me().entered){openSheet('enter');break}pl=legs.slice();slip={stake:25};openSheet('parlay');break}
  case'plopen':if(!Rush.me().entered){openSheet('enter');break}slip={stake:25};openSheet('parlay');break;case'rmleg':pl.splice(+d.v,1);if(!pl.length)closeSheet();render();break;case'plgo':placeParlay(slip.stake);break;
  case'step':{const [k,dd]=d.v.split('|');const base=k==='sp'?M.main:k==='tot'?M.mt:half(k==='ttH'?M.hm:M.am),st=k==='sp'?stepOf.sp():stepOf.tot();alt[k]=(alt[k]==null?base:alt[k])+(+dd)*st;if(k==='tot'||k==='ttH'||k==='ttA')alt[k]=Math.max(alt[k],.5);render();break}
  case'stepreset':delete alt[d.v];render();break;
  case'enter':openSheet('enter');break;case'doenter':{const n=($('hn')&&$('hn').value||'').trim();if(Rush.enter(n||'Rookie')){toast('You are in. 1,000 Stack for '+Rush.week().label+'.');closeSheet();render()}else toast('Entry for this week is closed.');break}
  case'close':closeSheet();break}}
document.addEventListener('scroll',()=>{},{passive:true});
$('ghdr').addEventListener('scroll',e=>{if(e.target.id!=='car')return},true);
document.addEventListener('scroll',e=>{const c=$('car');if(e.target!==c)return;const i=Math.round(c.scrollLeft/c.clientWidth);document.querySelectorAll('.dots i').forEach((d,n)=>d.classList.toggle('on',n===i))},true);

/* ---------- feeds ---------- */
async function pollSum(){S.sum=await j(`${SITE}/summary?event=${ID}`);S.ok.sum=Date.now();const g=game();if(g.done)Rush.grade.sync().then(n=>{if(n)toast(n+' pick'+(n>1?'s':'')+' graded on the final.')}).catch(()=>{});render()}
async function pollProbs(){if(!game().live)return;const r0=await j(`${CORE}/probabilities?limit=1`);const r=await j(`${CORE}/probabilities?limit=25&page=${Math.max(1,Math.ceil(r0.count/25))}`);S.probs=r.items||[];render()}
async function pollPlays(){if(!game().live)return;const r0=await j(`${CORE}/plays?limit=1`);const r=await j(`${CORE}/plays?limit=25&page=${Math.max(1,Math.ceil(r0.count/25))}`);const m=new Map(S.plays.map(p=>[p.id,p]));(r.items||[]).forEach(p=>m.set(p.id,p));S.plays=[...m.values()].sort((a,b)=>(+a.sequenceNumber)-(+b.sequenceNumber)).slice(-80);render()}
async function pollRoster(){const c=comp();if(!c)return;for(const t of c.competitors){try{const r=await j(`${SITE}/teams/${t.team.id}/roster`);const add=a=>{if(a&&a.id)roster[a.id]=a.shortName||a.displayName};(r.athletes||[]).forEach(x=>x.items?x.items.forEach(add):add(x))}catch(e){}}render()}
async function pollProps(){try{const r=await j(`${CORE}/odds/100/propBets?limit=1000`);S.props=r.items||[]}catch(e){S.props=[]}render()}
function loop(fn,msLive,msPre){let on=false;const run=async()=>{if(!document.hidden&&!on){on=true;try{await fn();S.err=null}catch(e){S.err=e.message}on=false}setTimeout(run,game().live?msLive:msPre)};run()}
if(SPORT){render();loop(pollSum,4000,30000);setTimeout(()=>pollRoster(),1500);loop(pollProbs,3000,30000);loop(pollPlays,2000,30000);pollProps();setInterval(pollProps,300000);setInterval(render,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){pollSum().catch(()=>{});pollPlays().catch(()=>{})}})}else render();
</script>
