<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush · Slips</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Slips: every pick this week across games, open and settled, plus a parlay across games. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:#22303D;--fg:#fff;--mute:#8C9BAD;--acc:#00BFFF;--grad:linear-gradient(135deg,#00C0FF,#0080FF);--win:#10B981;--loss:#D95151;--warn:#F59E0B;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.g-wrap{padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.g-top{display:flex;align-items:center;gap:10px}.g-top h1{font:800 26px/1 var(--f);letter-spacing:-.03em;margin:0}
.g-top small{margin-left:auto;color:var(--mute);font-size:13px}
.g-top [data-rush-pill]{margin-left:auto;min-width:0;max-width:70%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--card);border-radius:11px;padding:3px}
.seg button{padding:9px 0;border-radius:9px;font:600 14px var(--f);color:var(--mute);min-height:40px}
.seg button.on{background:var(--card2);color:var(--fg)}
.g-card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.g-h{display:flex;align-items:baseline;gap:8px;font:700 17px var(--f)}.g-h small{margin-left:auto;font:500 12.5px var(--f);color:var(--mute)}
.rows{display:flex;flex-direction:column;gap:4px}
.rw{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-radius:12px}
.rw:nth-child(odd){background:var(--card2)}
.rw .d{color:var(--mute);font-size:13px}
.rw .l{min-width:0}.rw .l b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw .l small{color:var(--mute);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 12px;font:700 15px var(--f);min-width:96px;justify-content:center}
.chip.w{background:rgba(16,185,129,.18);color:var(--win)}.chip.l{background:rgba(217,81,81,.18);color:var(--loss)}.chip.p{background:var(--card2);color:var(--mute)}
.chip i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#0B1118}
.chip.w i{background:var(--win)}.chip.l i{background:var(--loss)}.chip.p i{background:var(--mute)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--mute)}.key span{display:flex;align-items:center;gap:5px}
.pk{background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px}
.pk .a{display:flex;gap:8px;align-items:baseline}.pk .a b{font:600 16px/1.25 var(--f);min-width:0}.pk .a em{margin-left:auto;font:700 16px var(--f);font-style:normal;white-space:nowrap}
.pk .s{font-size:12.5px;color:var(--mute)}
.pk.won{box-shadow:inset 0 0 0 1.5px var(--win)}.pk.lost{opacity:.7}
.lg{display:inline-block;font:700 10px var(--f);letter-spacing:.05em;background:rgba(0,191,255,.14);color:var(--acc);border-radius:6px;padding:2px 6px;margin-right:6px}
.st{font:700 11px var(--f);letter-spacing:.04em}
.st.lv{color:var(--loss)}.st.lv i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--loss);margin-right:5px;vertical-align:1px;animation:gbeat 1.6s infinite}
@keyframes gbeat{0%{box-shadow:0 0 0 0 rgba(217,81,81,.7)}70%{box-shadow:0 0 0 7px rgba(217,81,81,0)}100%{box-shadow:0 0 0 0 rgba(217,81,81,0)}}
.pk.lv{box-shadow:inset 0 0 0 1.5px rgba(217,81,81,.55)}
.sc{display:inline-flex;gap:6px;align-items:center;color:var(--ink,#fff);font:600 13px var(--f);text-decoration:none}.sc small{color:var(--mute);font-weight:500}
.up{color:var(--win)}.dn{color:var(--loss)}
.g-note{font-size:12.5px;color:var(--mute)}
.gm{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.gm:last-child{border-bottom:0}
.gm .t{min-width:0;font-size:14px}.gm .t small{display:block;color:var(--mute);font-size:12px}
.p{min-height:48px;background:var(--card2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.p span{font-size:12px;color:var(--mute)}.p strong{font:600 16px var(--f)}
.p.sel{background:var(--grad)}.p.sel span{color:#fff}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chips button{padding:11px 0;background:var(--card2);border-radius:11px;font:600 15px var(--f);min-height:44px}
.chips button.on{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acc)}
.cta{width:100%;padding:16px;border-radius:14px;background:var(--grad);color:#fff;font:700 17px var(--f);min-height:52px}
.cta[disabled]{background:var(--card2);color:var(--mute)}
#g-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid #2C3B4A;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#g-nav a{padding:9px 0 8px;text-align:center;font:600 11px var(--f);color:#5E6E80;text-decoration:none;min-height:44px}
#g-nav a.on{color:var(--acc)}#g-nav svg{display:block;width:24px;height:24px;margin:0 auto 2px}
#g-toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(26,37,48,.96);border-radius:14px;padding:12px 16px;font-weight:600;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.45)}
</style>
<style>/* Gold contrast and size pass: the same palette and type scale as Home and profile. */:root{--bg:#0A0F15;--card:#141C26;--card2:#1B2531;--line:rgba(255,255,255,.09);--fg:#F4F7FA;--mute:#A3AFBD;--acc:#3DB8FF;--win:#3DD68C;--loss:#FF6B6B}body{background:#0A0F15;font-size:16px}.g-top h1{font:800 30px/1 "Barlow Condensed",-apple-system,sans-serif!important;text-transform:uppercase;letter-spacing:.3px}.pk b{font-size:16px}.pk .a em{font-size:15px}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap"></head>
<body>
<div class="g-wrap" id="slips"></div>
<nav id="g-nav"></nav>
<div id="g-toast" hidden></div>
<script src="team-mark.js?v=m3"></script><script src="shared/state.js?v=f1108"></script>
<script src="week-games.js?v=f1108"></script>
<script src="shared/nav.js?v=f1111"></script><script src="slip-card.js?v=s7"></script>
<script src="gold-store.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=Rush.fmt,PATHS={nfl:'football/nfl',nba:'basketball/nba',nhl:'hockey/nhl'};
const odds=o=>F&&F.odds?F.odds(o):(o>0?'+':'')+o,dec=o=>F&&F.dec?F.dec(o):(o>0?1+o/100:1+100/Math.abs(o));
const ST={open:['Open',''],won:['Hit','up'],lost:['Miss','dn'],push:['Push',''],void:['No action',''],cashed:['Closed','']};
let tab='open',PAR=[],stake=25,UP=[];
function toast(t){const el=$('g-toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,1800)}
/* Live scores for open picks: LV is keyed league|gameId from ESPN's public scoreboard. */
let LV={};
const lvOf=(lg,id)=>LV[lg+'|'+id];
const score=(g,lg,id)=>`<a class="sc" href="game.html?league=${esc(lg)}&id=${esc(id)}">${esc(g.a.ab)} ${esc(g.a.s)} · ${esc(g.h.ab)} ${esc(g.h.s)} <small>${esc(g.state==='post'?'Final':g.detail)}</small></a>`;
function pickCard(p){let[w,c]=ST[p.status]||[p.status,''];const pnl=p.status==='won'?(p.pay||p.stake+p.win)-p.stake:p.status==='lost'?-p.stake:p.status==='cashed'?(p.pay||0)-p.stake:0;
  const gs=p.legs&&p.legs.length?p.legs.map(l=>lvOf(l.league,l.gameId)):[lvOf(p.league,p.gameId)],live=p.status==='open'&&gs.some(g=>g&&g.state==='in'),fin=p.status==='open'&&gs.length&&gs.every(g=>g&&g.state==='post');
  if(live){w='<i></i>Live';c='lv'}else if(fin){w='Final · grading';c=''}
  const legs=p.legs&&p.legs.length?`<div class="s">${p.legs.map((l,i)=>`${esc(l.label)} ${odds(l.odds)}${l.st&&l.st!=='open'?' · '+esc((ST[l.st]||[l.st])[0]):gs[i]&&gs[i].state!=='pre'?'<br>'+score(gs[i],l.league,l.gameId):''}`).join('<br>')}</div>`:'';
  const one=!legs&&gs[0]&&gs[0].state!=='pre'&&p.status==='open'?`<div>${score(gs[0],p.league,p.gameId)}</div>`:'';
  return`<div class="pk ${p.status}${live?' lv':''}"><div class="a"><b><span class="lg">${esc((p.league||'multi').toUpperCase())}</span>${esc(p.label)}</b><em>${odds(p.odds)}</em></div><div class="s">${esc(p.game||'')}</div>${one}${legs}<div class="s"><span class="st ${c}">${c==='lv'?w.replace('Live','LIVE'):w.toUpperCase()}</span> · Stake ${GS.fmt(p.stake)}${p.status==='open'?' · Returns '+GS.fmt(p.stake+p.win)+' if it hits':' · Returned '+GS.fmt(p.status==='lost'?0:(p.pay!=null?p.pay:p.stake))+(pnl?' · '+(pnl>0?'+':'')+GS.fmt(pnl):'')}</div></div>`}
function settledRow(p){const pnl=p.status==='won'?(p.pay||p.stake+p.win)-p.stake:p.status==='lost'?-p.stake:p.status==='cashed'?(p.pay||0)-p.stake:0,u=(pnl/10),cls=p.status==='won'||(p.status==='cashed'&&pnl>0)?'w':p.status==='lost'||(p.status==='cashed'&&pnl<0)?'l':'p',glyph=cls==='w'?'&#10003;':cls==='l'?'&#10005;':'P';const d=new Date(p.settled||p.at);return`<div class="rw"><div class="d">${d.getMonth()+1}/${d.getDate()}</div><div class="l"><b>${esc(p.label)} ${odds(p.odds)}</b><small>${esc((p.league||'multi').toUpperCase())} · ${esc(p.game||'')} · Stake ${GS.fmt(p.stake)} · Returned ${GS.fmt(p.status==='lost'?0:(p.pay!=null?p.pay:p.stake))}</small></div><span class="chip ${cls}"><i>${glyph}</i>${cls==='p'?(p.status==='void'?'No action':'Push'):(u>0?'+':'')+GS.fmt(u*10)}</span></div>`}
function parlayView(){const legs=PAR,ok=legs.length>=2,d=legs.reduce((a,l)=>a*dec(l.odds),1),am=ok?Math.round(d>=2?(d-1)*100:-100/(d-1)):null,cur=curWallet(),max=cur.stack,st=Math.min(stake,max);
  let h=`<div class="g-card"><div class="g-h">Parlay across games<small>${dot(cur.color)}Into ${esc(cur.name)}</small></div>`;
  if(!UP.length)h+='<div class="g-note">Loading games that have not started.</div>';
  for(const g of UP.slice(0,14)){const sel=s=>PAR.some(l=>l.gameId===g.id&&l.spec.side===s);h+=`<div class="gm"><div class="t">${esc(g.a.ab)} at ${esc(g.h.ab)}<small>${g.lg.toUpperCase()} · ${new Date(g.date).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}</small></div><button class="p${sel('away')?' sel':''}" data-leg="${g.lg}|${g.id}|away"><span>${esc(g.a.ab)}</span><strong>${odds(g.mlA)}</strong></button><button class="p${sel('home')?' sel':''}" data-leg="${g.lg}|${g.id}|home"><span>${esc(g.h.ab)}</span><strong>${odds(g.mlH)}</strong></button></div>`}
  h+=`<div class="g-note">${legs.length} leg${legs.length===1?'':'s'}${ok?' · '+odds(am)+' · different games multiply at full price':''}. One leg per game.</div><div class="chips">${[10,25,50,100].map(c=>`<button class="${stake===c?'on':''}" data-stake="${c}">${c}</button>`).join('')}<button data-stake="max">MAX</button></div><button class="cta" id="lockpar"${!ok||!cur.entered||st<=0?' disabled':''}>${!cur.entered?'Enter the week on Home first':ok?`Lock ${GS.fmt(st)} at ${odds(am)}`:'Pick at least two games'}</button></div>`;return h}
/* Every pick belongs to one contest; each contest keeps its own Stack. Group by contest with its colour dot. */
const WAL=()=>window.Rush&&Rush.wallet?Rush.wallet:null;
function wallets(){const w=WAL();if(w)try{return w.list()}catch(e){}const me=GS.me();return[{id:'rush',name:'The Rush',color:'#00BFFF',stack:me.stack,units:GS.units(),weekly:true}]}
function curWallet(){const ws=wallets(),a=WAL()?WAL().active():'rush';return ws.find(x=>x.id===a)||ws[0]}
function allPicks(){try{return Rush.picks({contest:'*'}).map(p=>({...p,st:p.status}))}catch(e){return GS.picks()}}
const dot=c=>`<i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#00BFFF'};margin-right:6px;vertical-align:1px"></i>`;
function render(){const ws=wallets(),act=WAL()?WAL().active():'rush',cur=ws.find(x=>x.id===act)||ws[0],all=allPicks(),open=all.filter(p=>p.status==='open'),done=all.filter(p=>p.status!=='open'&&p.status!=='rejected');
  let h=`<div class="g-top"><h1>Slips</h1><span data-rush-pill></span></div><div class="seg">${[['open','Open ('+open.length+')'],['done','Settled ('+done.length+')'],['parlay','Parlay']].map(([k,t])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${t}</button>`).join('')}</div>`;
  if(tab==='parlay')h+=(window.Rush&&Rush.slip&&Rush.slip.open)?'<div class="g-card" style="padding:18px;text-align:center"><div style="font-weight:800;font-size:18px">Build a parlay in your Slip</div><div style="color:var(--mute);margin-top:6px">Tap prices on the Board or any game. Your Slip collects them across games, then you place it as a parlay or as straights.</div><button id="gslip" style="margin-top:14px;min-height:48px;width:100%;border:0;border-radius:14px;background:var(--acc);color:#04121C;font:800 16px -apple-system,sans-serif;cursor:pointer">Open your Slip</button><a href="board.html" style="display:block;margin-top:10px;color:var(--acc);font-weight:700">Go to the Board</a></div>':parlayView();
  else{const list=tab==='open'?open:done;const groups=ws.map(w=>({w,ps:list.filter(p=>(p.contest||'rush')===w.id)})).filter(g=>g.ps.length);
    const stray=list.filter(p=>!ws.some(w=>w.id===(p.contest||'rush')));groups.sort((x,y)=>(y.w.id===act)-(x.w.id===act));if(stray.length)groups.push({w:{id:'x',name:'Other contests',color:'#5E6E80',stack:0,units:0},ps:stray});
    if(!groups.length)h+=`<div class="g-card"><div class="g-note">${tab==='open'?'No open picks. Pick from the Board or build a parlay across games.':'Settled picks land here. Games grade from ESPN about a minute after they end.'}</div></div>`;
    for(const{w,ps}of groups){const u=w.units||0;const head='';
      if(tab==='done'){const wn=ps.filter(p=>p.status==='won').length,l=ps.filter(p=>p.status==='lost').length;h+=`<div class="g-card">${head}<div class="g-note">W/L ${wn}-${l}</div><div class="rows">${ps.map(p=>window.SlipCard?SlipCard.html(p):settledRow(p)).join('')}</div></div>`}
      else h+=`<div class="g-card">${head}${ps.map(p=>window.SlipCard?SlipCard.html(p):pickCard(p)).join('')}</div>`}
    if(tab==='done'&&groups.length)h+=`<div class="key" style="padding:0 4px"><span><span class="chip w" style="min-width:0;padding:2px"><i>&#10003;</i></span>Hit</span><span><span class="chip l" style="min-width:0;padding:2px"><i>&#10005;</i></span>Miss</span><span><span class="chip p" style="min-width:0;padding:2px"><i>P</i></span>Push or no action</span></div>`}
  $('slips').innerHTML=h;const bd=document.getElementById('rpill-band');if(bd)bd.remove();if(Rush.nav)try{Rush.nav.refresh()}catch(e){}}
window.render=render;
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#gslip')){try{Rush.slip.open()}catch(x){}return}const t=e.target.closest('[data-tab],[data-leg],[data-stake],#lockpar');if(!t)return;const d=t.dataset;
  if(d.tab){tab=d.tab;render()}
  else if(d.leg){const[lg,id,side]=d.leg.split('|'),g=UP.find(x=>x.id===id&&x.lg===lg);const i=PAR.findIndex(l=>l.gameId===id);if(i>=0&&PAR[i].spec.side===side)PAR.splice(i,1);else{if(i>=0)PAR.splice(i,1);PAR.push({league:lg,gameId:id,game:`${g.a.ab} at ${g.h.ab}`,spec:{k:'ml',side},label:`${side==='home'?g.h.ab:g.a.ab} moneyline`,odds:side==='home'?g.mlH:g.mlA,st:'open',starts:g.date})}render()}
  else if(d.stake){stake=d.stake==='max'?Math.floor(curWallet().stack):+d.stake;render()}
  else if(t.id==='lockpar'){if(PAR.length<2)return;if(PAR.some(l=>l.starts<=Date.now())){toast('A game has started. Remove that leg.');return}const dd=PAR.reduce((a,l)=>a*dec(l.odds),1),am=Math.round(dd>=2?(dd-1)*100:-100/(dd-1)),cur=curWallet(),st=Math.min(stake,cur.stack);
    // The store checks each leg's {league, start} against the contest's sports and days and names the leg it refuses.
    const W=WAL(),act=W?W.active():'rush';
    const pick={league:'multi',gameId:'parlay',game:PAR.length+'-leg parlay',spec:{k:'parlay'},label:PAR.length+'-leg parlay',odds:am,stake:st,start:Math.min(...PAR.map(l=>l.starts)),legs:PAR.map(({starts,...l})=>({...l,start:starts}))};
    const r=W?W.place(act,pick):(Rush.place(Object.assign(pick,{league:'multi'}))?{ok:true}:{ok:false,why:'Check your Stack and entry.'});if(r.ok){toast('Locked '+odds(am)+' in '+cur.name);PAR=[];tab='open'}else toast('Not placed. '+(r.why||''));render()}});
const etDay=off=>new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'America/New_York'}).replace(/-/g,'');
async function loadUpcoming(){const days=[etDay(-1),etDay(0),etDay(1),etDay(2)];const urls=[['nfl','https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard']];for(const lg of['nba','nhl'])for(const d of days)urls.push([lg,`https://site.api.espn.com/apis/site/v2/sports/${PATHS[lg]}/scoreboard?dates=${d}`]);const out=[],lv={};await Promise.all(urls.map(async([lg,u])=>{try{const d=await(await fetch(u,{cache:'no-store'})).json();for(const e of d.events||[]){const c=e.competitions[0],st=c.status.type.state;{const h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');lv[lg+'|'+e.id]={state:st,detail:c.status.type.shortDetail,h:{ab:h.team.abbreviation,s:h.score},a:{ab:a.team.abbreviation,s:a.score}}}if(st!=='pre')continue;const o=(c.odds||[])[0],ml=o&&o.moneyline,n=v=>{const x=parseInt(String(v||'').replace('+',''),10);return Number.isFinite(x)?x:null};const mlH=ml&&n((ml.home.current||ml.home.close||{}).odds),mlA=ml&&n((ml.away.current||ml.away.close||{}).odds);if(mlH==null||mlA==null)continue;const h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');out.push({lg,id:e.id,date:Date.parse(e.date),h:{ab:h.team.abbreviation},a:{ab:a.team.abbreviation},mlH,mlA})}}catch(e){}}));const seen={};UP=out.filter(g=>!seen[g.lg+g.id]&&(seen[g.lg+g.id]=1)).sort((x,y)=>x.date-y.date);LV=lv;render()}
GS.nav('slips');render();loadUpcoming();setInterval(()=>{if(tab!=='parlay')loadUpcoming()},30000);
(async()=>{try{await Rush.grade.sync();render()}catch(e){}})();setInterval(async()=>{try{await Rush.grade.sync()}catch(e){}render()},60000);
</script>
