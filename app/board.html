<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush Board</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Board: large title, league segmented control, grouped game cards (Live, Today, Later this week, Final). Rush tokens as fallback if shared/rush.css is missing. */
:root{--rb-bg:#0A0F15;--rb-card:#141C26;--rb-card2:#1B2531;--rb-line:rgba(255,255,255,.07);--rb-fg:#F4F7FA;--rb-mut:#A3AFBD;--rb-dim:#66768A;--rb-acc:#3DB8FF;--rb-win:#3DD68C;--rb-loss:#FF6B6B;--rb-warn:#F59E0B;--rb-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{background:var(--rb-bg);color:var(--rb-fg);font:15px/1.38 var(--rb-font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.rb-wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.rb-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.rb-top h1{margin:0;font:800 32px/1.1 var(--rb-font);letter-spacing:-.02em}
.rb-top small{display:block;color:var(--rb-mut);font-size:13px;margin-top:2px}
.rb-upd{color:var(--rb-dim);font-size:12px;white-space:nowrap}
.rb-seg{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:10px;background:var(--rb-card2);margin-bottom:14px;box-shadow:0 6px 16px rgba(11,17,24,.8)}
.rb-seg button{font:600 13px var(--rb-font);color:var(--rb-mut);background:none;border:0;padding:8px 0;border-radius:8px;cursor:pointer}
.rb-seg button.on{background:#2A3644;color:var(--rb-fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rb-grp{margin-bottom:20px}
.rb-grp h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 20px/1.2 var(--rb-font);letter-spacing:-.01em}
.rb-grp h2 span{font:500 13px var(--rb-font);color:var(--rb-mut)}
.rb-grp h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--rb-loss);animation:rbp 1.6s infinite}
@keyframes rbp{50%{opacity:.35}}
.rb-list{background:var(--rb-card);border-radius:14px;overflow:hidden}
.rb-g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;text-decoration:none;color:inherit;border-top:.5px solid var(--rb-line);position:relative}
.rb-g:first-child{border-top:0}
.rb-g:active{background:var(--rb-card2)}
.rb-teams{display:grid;gap:6px;min-width:0}
.rb-t{display:flex;align-items:center;gap:9px;min-width:0}
.rb-t img{width:26px;height:26px;object-fit:contain;flex:none}
.rb-t .ab{font:600 15px var(--rb-font)}.rb-t .nm{color:var(--rb-mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-t .sc{margin-left:auto;font:700 18px var(--rb-font)}
.rb-t.lose .sc,.rb-t.lose .ab{color:var(--rb-dim)}
.rb-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px;text-align:right;min-width:92px}
.rb-st{font:600 13px var(--rb-font);color:var(--rb-mut)}.rb-st.live{color:var(--rb-loss)}
.rb-ln{font:600 12.5px var(--rb-font);color:var(--rb-fg);background:var(--rb-card2);border-radius:8px;padding:4px 8px;white-space:nowrap}
.rb-ln i{font-style:normal;color:var(--rb-mut)}
.rb-meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--rb-dim)}
.rb-lg{font:700 10.5px var(--rb-font);letter-spacing:.06em;padding:2px 6px;border-radius:99px;background:rgba(0,191,255,.14);color:var(--rb-acc)}
.rb-lp{font:600 11.5px var(--rb-font);padding:2px 8px;border-radius:99px;background:rgba(217,81,81,.16);color:#FF8A8A}
.rb-go{margin-left:auto;color:var(--rb-acc);font-weight:600}
.rb-sch{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;margin:0 -16px 18px;padding:0 16px}.rb-sch::-webkit-scrollbar{display:none}
.rb-sc{flex:none;width:236px;scroll-snap-align:start;border-radius:14px;background:var(--rb-card);overflow:hidden;text-decoration:none;color:inherit;display:grid}
.rb-sc .rb-tp{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:14px 12px 12px}.rb-sc .rb-tm{display:grid;justify-items:center;gap:4px;font:600 13px var(--rb-font);color:var(--rb-mut)}.rb-sc .rb-tm img{width:40px;height:40px;object-fit:contain}.rb-sc .rb-tm b{color:var(--rb-fg);font:700 18px var(--rb-font)}
.rb-sc .rb-md{display:grid;justify-items:center;gap:2px;font:600 12px var(--rb-font);color:var(--rb-mut);text-align:center}.rb-sc .rb-md b{color:var(--rb-fg);font:700 14px var(--rb-font)}
.rb-sc .rb-bt{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--rb-card2);font:600 13px var(--rb-font);color:var(--rb-mut);min-height:36px}
.rb-sc.next{box-shadow:inset 0 0 0 1.5px var(--rb-acc)}.rb-sc.next .rb-tp{background:linear-gradient(135deg,rgba(0,191,255,.16),rgba(0,128,255,.04))}.rb-sc.next .rb-md b{color:var(--rb-acc)}
.rb-next{font:700 11px var(--rb-font);letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--rb-acc);color:#002233}.rb-sc .lv{color:#FF8A8A}
.rb-ctx{display:flex;align-items:center;gap:10px;background:var(--rb-card);border-radius:12px;padding:10px 12px;margin-bottom:12px;text-decoration:none;color:inherit}.rb-ctx i{width:10px;height:10px;border-radius:50%;flex:none}.rb-ctx span{min-width:0;flex:1}.rb-ctx b{display:block;font:600 14px var(--rb-font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb-ctx small{display:block;font-size:12px;color:var(--rb-mut)}.rb-ctx em{font:600 12px var(--rb-font);font-style:normal;color:var(--rb-acc);flex:none}
.rb-empty{background:var(--rb-card);border-radius:14px;padding:16px;color:var(--rb-mut);font-size:14px}
.rb-skel{height:76px;border-radius:14px;background:linear-gradient(90deg,var(--rb-card),var(--rb-card2),var(--rb-card));background-size:200% 100%;animation:rbs 1.2s infinite;margin-bottom:10px}
@keyframes rbs{to{background-position:-200% 0}}
.rb-err{background:rgba(217,81,81,.14);color:#FF9B9B;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
#rb-tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(255,255,255,.1);padding-bottom:env(safe-area-inset-bottom,0px)}
#rb-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font:500 10.5px var(--rb-font);color:var(--rb-dim);text-decoration:none}
#rb-tabs a svg{width:24px;height:24px}#rb-tabs a.on{color:var(--rb-acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.rb-on{display:inline-flex;align-items:center;margin-right:auto}.rb-on .rav{margin-left:-7px;box-shadow:0 0 0 2px #121A23}.rb-on .rav:first-child{margin-left:0}.rb-on em{font-style:normal;margin-left:6px;font-size:12px;font-weight:700;color:#8C9BAD}
.rb-pxs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 2px}.rb-px{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid #2A3A4A;background:#1B2531;color:#F4F7FA;font:700 14px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}.rb-px b{font-weight:800}.rb-px.picked{background:#3DB8FF;border-color:#3DB8FF;color:#06121C}
</style>
</head>
<body data-tab="board">
<div class="rb-wrap">
 <div class="rb-top"><div><h1>Board</h1><small id="rb-week">This week</small></div><span class="rb-upd" id="rb-upd"></span></div>
 <div id="rb-strip" hidden></div>
 <a class="rb-ctx" id="rb-ctx" hidden></a>
<div class="rb-seg" role="tablist" id="rb-seg"></div>
 <div id="rb-main"><div class="rb-skel"></div><div class="rb-skel"></div><div class="rb-skel"></div></div>
</div>
<nav id="rb-tabs" hidden></nav>
<script src="shared/state.js?v=f1102"></script>
<script src="week-games.js?v=f1102"></script>
<script src="shared/nav.js?v=f1102"></script>
<script src="shared/events.js?v=f1102"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lg='all';try{lg=localStorage.getItem('rb.lg')||'all'}catch(e){}
let games=RW.cached()||[],lastAt=0,err='';
const tFmt=ms=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'}).format(new Date(ms))+' ET';
const hFmt=ms=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}).format(new Date(ms))+' ET';
/* the active contest (Rush.wallet): the Board shows only the games it covers, with its own clocks */
const LGN={nfl:'NFL',nba:'NBA',nhl:'NHL'};
function ctx(){const W=window.Rush&&Rush.wallet;let cur=null;try{cur=W&&W.current?W.current():null}catch(e){}if(!cur||cur.id==='rush')return{id:'rush',cur,sports:['nfl','nba','nhl'],keep:()=>true};return{id:cur.id,cur,sports:(cur.sports||[]).filter(k=>LGN[k]),keep:g=>{try{return W.covers(cur.id,{league:g.league,start:g.date}).ok}catch(e){return true}}}}
function ctxBar(C){const el=$('rb-ctx');if(el)el.hidden=true}
function seg(sports){sports=sports||['nfl','nba','nhl'];if(lg!=='all'&&!sports.includes(lg))lg='all';$('rb-seg').hidden=sports.length<2;$('rb-seg').innerHTML=[['all','All'],['nfl','NFL'],['nba','NBA'],['nhl','NHL']].filter(([k])=>k==='all'||sports.includes(k)).map(([k,l])=>`<button role="tab" aria-selected="${lg===k}" class="${lg===k?'on':''}" data-lg="${k}">${l}</button>`).join('')}
function lineTxt(g){const L=g.state==='in'&&g.liveLine||g.line;if(!L.details&&L.ou==null)return'';return`${esc(L.details||'')}${L.ou!=null?` <i>&middot;</i> O/U ${L.ou}`:''}${g.state==='in'&&L.seen?` <i>&middot;</i> last seen${L.seen>1?' '+esc(hFmt(L.seen).replace(/\s*ET$/,'')):''}`:''}`}
let FACES={k:'',m:{}};function onGame(){const G=RW.cached()||[],k=G.length+'|'+(window.Rush&&Rush.honest&&Rush.honest())+'|'+Math.floor(Date.now()/3e4);if(FACES.k===k)return FACES.m;const m={};let f=[];try{f=RW.field(G)}catch(e){}f.forEach(r=>{let ps=[];try{ps=RW.playerPicks(r.me?'me':r.id,G)||[]}catch(e){}const seen=new Set;ps.forEach(p=>{const key=p.league+'|'+p.gameId;if(seen.has(key))return;seen.add(key);(m[key]=m[key]||[]).push(r)})});FACES={k,m};return m}
function onIt(g){const P=onGame()[g.league+'|'+g.id]||[];if(!P.length)return'';const av=n=>window.Rush&&Rush.nav&&Rush.nav.avatar?Rush.nav.avatar(n,1):'';return`<span class="rb-on" title="Players with a pick on this game">${P.slice(0,4).map(r=>av(r.me?(Rush.me().handle||'You'):r.name)).join('')}<em>${P.length} on it${g.state==='pre'?', sealed':''}</em></span>`}
/* a tap on a moneyline price adds it to the one Slip (shared/slip.js); a second tap removes it. Same key as the game page. */
function mlKey(g,side){return g.league+'|'+g.id+'|'+JSON.stringify({k:'ml',side})}
function mlChips(g){const L=g.line||{};if(L.hml==null||L.aml==null||g.date<=Date.now())return'';const sel=k=>window.Rush&&Rush.slip&&Rush.slip.has(k);const c=(side,ab,o)=>{const k=mlKey(g,side);return`<button type="button" class="rb-px${sel(k)?' picked':''}" data-ml="${esc(side)}" data-g="${esc(g.league+'|'+g.id)}" aria-pressed="${!!sel(k)}"><span>${esc(ab)}</span><b>${o>0?'+':''}${esc(o)}</b></button>`};return`<div class="rb-pxs">${c('away',g.away.abbr,L.aml)}${c('home',g.home.abbr,L.hml)}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ml]');if(!b)return;e.preventDefault();e.stopPropagation();if(!window.Rush||!Rush.slip)return;const [lg,id]=b.dataset.g.split('|');const g=(RW.cached()||[]).find(x=>x.league===lg&&String(x.id)===id);if(!g||g.date<=Date.now())return;const side=b.dataset.ml,ab=side==='home'?g.home.abbr:g.away.abbr,o=side==='home'?g.line.hml:g.line.aml;const on=Rush.slip.toggle({key:mlKey(g,side),mkt:'ml|',league:lg,gameId:String(id),game:g.away.abbr+' at '+g.home.abbr,start:g.date,spec:{k:'ml',side},label:ab+' moneyline',odds:o,market:'ml'});document.querySelectorAll('[data-g="'+b.dataset.g+'"]').forEach(x=>{const k=mlKey(g,x.dataset.ml);const p=Rush.slip.has(k);x.classList.toggle('picked',p);x.setAttribute('aria-pressed',p)})},true);
function row(g){const live=g.state==='in',fin=g.state==='post',H=g.home,A=g.away;const lose=t=>fin&&H.score!=null&&((t==='h'&&H.score<A.score)||(t==='a'&&A.score<H.score));
 const st=live?`<span class="rb-st live">${esc(g.detail)}</span>`:fin?`<span class="rb-st">${esc(g.detail||'Final')}</span>`:`<span class="rb-st">${esc(RW.etDay(g.date)===RW.etDay(Date.now())?hFmt(g.date):tFmt(g.date))}</span>`;
 const t=(x,k)=>`<div class="rb-t${lose(k)?' lose':''}"><img src="${esc(x.logo)}" alt="" width="26" height="26" loading="lazy" onerror="this.style.visibility='hidden'"><span class="ab">${esc(x.abbr)}</span><span class="nm">${esc(x.name)}${x.record?' &middot; '+esc(x.record):''}</span>${live||fin?`<span class="sc">${x.score??''}</span>`:''}</div>`;
 const ln=lineTxt(g);
 return`<a class="rb-g" href="game.html?league=${g.league}&id=${esc(g.id)}"><div class="rb-teams">${t(A,'a')}${t(H,'h')}</div><div class="rb-side">${st}${ln&&!fin&&!live?`<span class="rb-ln">${ln}</span>`:''}</div>${!live&&!fin?mlChips(g):''}<div class="rb-meta"><span class="rb-lg">${RW.LEAGUES[g.league].name}</span>${onIt(g)}<span class="rb-go">${fin?'Results':live?'Follow':'Full book'} &rsaquo;</span></div></a>`}
function schedule(list){const nfl=list.filter(g=>g.league==='nfl');if(!nfl.length)return'';const nx=nfl.find(g=>g.state==='pre');const d=ms=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',month:'short',day:'numeric'}).format(new Date(ms));const tm=ms=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}).format(new Date(ms)).replace(' ','').toLowerCase();const w=RW.week().n;
 return`<section class="rb-grp"><h2>NFL Week ${w}<span>${nfl.length} games</span></h2><div class="rb-sch">${nfl.map(g=>{const fin=g.state==='post',live=g.state==='in';const mid=live?`<span class="lv">${esc(g.detail)}</span><b>${g.away.score} - ${g.home.score}</b>`:fin?`<span>Final</span><b>${g.away.score} - ${g.home.score}</b>`:`<span>WK ${w}</span><b>${esc(d(g.date))}</b><b>${esc(tm(g.date))}</b>`;
  return`<a class="rb-sc${g===nx?' next':''}" href="game.html?league=nfl&id=${esc(g.id)}"><div class="rb-tp"><div class="rb-tm"><img src="${esc(g.away.logo)}" alt="" width="40" height="40" loading="lazy"><b>${esc(g.away.abbr)}</b><span>${esc(g.away.record)}</span></div><div class="rb-md">${mid}</div><div class="rb-tm"><img src="${esc(g.home.logo)}" alt="" width="40" height="40" loading="lazy"><b>${esc(g.home.abbr)}</b><span>${esc(g.home.record)}</span></div></div><div class="rb-bt">${g===nx?'<span class="rb-next">NEXT</span>':live?'<span class="lv">Live</span>':fin?'<span>Results</span>':'<span>Full book</span>'}<span>${esc(g.line.details||'')}${g.line.ou!=null&&!fin?' &middot; O/U '+g.line.ou:''}</span></div></a>`}).join('')}</div></section>`}
function render(){const C=ctx();ctxBar(C);seg(C.sports);const w=RW.week(),fmt=ms=>new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric'}).format(new Date(ms));$('rb-week').textContent=C.id==='rush'||!C.cur?`Week ${w.n} · ${fmt(w.start+6*36e5)} to ${fmt(w.end-12*36e5)}`:`${C.cur.name} · ${fmt(C.cur.opens)} to ${fmt(C.cur.settles-5*36e5)}`;
 const base=games.filter(C.keep),list=base.filter(g=>lg==='all'||g.league===lg),today=RW.etDay(Date.now());
 const G=[['live','Live',list.filter(g=>g.state==='in')],['today','Today',list.filter(g=>g.state==='pre'&&RW.etDay(g.date)===today)],['later','Later this week',list.filter(g=>g.state==='pre'&&RW.etDay(g.date)>today)],['final','Final',list.filter(g=>g.state==='post').reverse()]];
 let h=err?`<div class="rb-err">${esc(err)}</div>`:'';
 if(!games.length&&!err){$('rb-main').innerHTML='<div class="rb-skel"></div><div class="rb-skel"></div>';return}
 if(games.length&&!base.length)h+=`<div class="rb-empty">No games in ${esc(C.cur?C.cur.name:'this contest')} this week. Switch contests with the pill at the top.</div>`;
 if(lg==='all'||lg==='nfl')h+=schedule(base);
 for(const[k,n,arr]of G){if(k!=='live'&&!arr.length&&k!=='today')continue;h+=`<section class="rb-grp"><h2>${k==='live'&&arr.length?'<span class="dot"></span>':''}${n}<span>${arr.length} game${arr.length===1?'':'s'}</span></h2>${arr.length?`<div class="rb-list">${arr.map(row).join('')}</div>`:`<div class="rb-empty">${k==='live'?'Nothing live right now. Pregame lines are open below.':'No more games today.'}</div>`}</section>`}
 const m=$('rb-main');if(m._h!==h){m.innerHTML=h;m._h=h}}
async function refresh(force){try{games=await RW.load(force);err='';lastAt=Date.now()}catch(e){err='Scores did not load. Pull to retry or wait a moment.'}render()}
if(window.Rush&&Rush.on)Rush.on(()=>render());
document.addEventListener('click',e=>{const b=e.target.closest('[data-lg]');if(b){lg=b.dataset.lg;try{localStorage.setItem('rb.lg',lg)}catch(x){}render()}});
setInterval(()=>{if(lastAt)$('rb-upd').textContent='Updated '+Math.round((Date.now()-lastAt)/1000)+'s ago'},1000);
function loop(){refresh(true).finally(()=>setTimeout(loop,games.some(g=>g.state==='in')?15000:60000))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true)});
/* tab bar: shared/nav.js when it exists, otherwise a matching fallback */
setTimeout(()=>{if(document.querySelector('#rnav,[data-rush-nav],.rush-nav,nav.tabbar')||(window.RushNav&&window.RushNav.mounted))return;const T=[['index.html','Home','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['board.html','Board','<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/>'],['slips.html','Slips','<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'],['ranks.html','Ranks','<path d="M8 21V11M12 21V5M16 21v-7"/>'],['lounge.html','Lounge','<path d="M4 5h16v11H8l-4 4z"/>']];const here=location.pathname.split('/').pop()||'index.html';const n=$('rb-tabs');n.innerHTML=T.map(([u,l,p])=>`<a href="${u}" class="${u===here?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${l}</a>`).join('');n.hidden=false},300);
render();loop();RW.mountStrip(document.getElementById('rb-strip'),'','');
</script>
</body>
</html>
