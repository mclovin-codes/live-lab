<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush Board</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Board, after the Rush iOS app (rush-arena index.tsx, MarketGameCard, BoardMarketCard, MarketCells, boardGeometry):
   pinned league pills and one row of market tabs; Game Lines cards with Spread, Total, ML; a family tab lists its player rows across games. */
:root{--rb-bg:#0B1118;--rb-card:#121A23;--rb-cell:#1A2530;--rb-line:rgba(255,255,255,.10);--rb-rule:rgba(255,255,255,.07);--rb-fg:#F4F7FA;--rb-mut:rgba(255,255,255,.5);--rb-acc:#00BFFF;--rb-gold:#D9B15C;--rb-day:#10B981;--rb-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}html body{height:auto!important;min-height:100%;overflow:visible!important}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{background:var(--rb-bg);color:var(--rb-fg);font:15px/1.3 var(--rb-font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.rb-wrap{max-width:620px;margin:0 auto}
/* pinned: league pills, then the market tabs */
.rb-bar{position:sticky;top:var(--rb-top,53px);z-index:5;background:var(--rb-bg);padding-top:8px;border-bottom:.5px solid var(--rb-line)}
.rb-pills,.rb-tabs{display:flex;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}.rb-pills::-webkit-scrollbar,.rb-tabs::-webkit-scrollbar{display:none}
.rb-pills{gap:8px;padding:0 16px 10px}
.rb-pills button{flex:none;font:700 13px var(--rb-font);color:var(--rb-fg);background:var(--rb-cell);border:1.5px solid transparent;border-radius:20px;padding:6px 14px;cursor:pointer}
.rb-pills button.on{background:rgba(0,191,255,.15);border-color:var(--rb-acc)}
.rb-tabs{gap:20px;padding:0 16px}
.rb-tabs button{flex:none;position:relative;font:500 14px var(--rb-font);color:var(--rb-mut);background:none;border:0;padding:6px 0 10px;cursor:pointer}
.rb-tabs button.on{color:#fff;font-weight:700}.rb-tabs button.on::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--rb-acc)}
/* day header with column labels */
.rb-day{display:flex;align-items:flex-end;padding:16px 16px 6px;font:700 13px var(--rb-font);letter-spacing:1.5px;color:var(--rb-mut)}
.rb-day span{flex:1}.rb-day i{font-style:normal;width:64px;margin-left:5px;text-align:center;font:600 10px var(--rb-font);letter-spacing:.5px}
/* a game: identity column plus three 64-wide columns */
.rb-gm{content-visibility:auto;contain-intrinsic-size:auto 150px;border-top:.5px solid var(--rb-line);padding:10px 16px 10px}
.rb-tr{display:flex;align-items:center;gap:5px}
.rb-id{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.rb-id img{width:26px;height:26px;object-fit:contain;flex:none}
.rb-id b{font:800 15px var(--rb-font)}.rb-id span{font-size:13px;color:var(--rb-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb-id em{margin-left:auto;font:800 16px var(--rb-font);font-style:normal}
.rb-at{display:flex;align-items:center;gap:6px;height:18px;margin:-3px 0;padding-left:34px;font:700 9px var(--rb-font);letter-spacing:1px;color:var(--rb-mut)}.rb-at::after{content:'';flex:1;height:.5px;background:var(--rb-rule);margin-right:207px}
.rb-c{flex:none;width:64px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:var(--rb-cell);color:var(--rb-fg);font:600 12px var(--rb-font);padding:0;cursor:pointer}
.rb-c b{font:700 14.5px var(--rb-font);color:var(--rb-acc)}.rb-c.ml b{font-size:15px}
.rb-c.on{background:#fff;border-color:#fff;color:#04121C}.rb-c.on b{color:#04121C}
.rb-c.off{opacity:.45;cursor:default}
.rb-ft{display:flex;align-items:center;gap:8px;margin-top:8px;font:700 11.5px var(--rb-font);letter-spacing:.4px;color:var(--rb-mut)}
.rb-ft .td{color:var(--rb-day)}.rb-ft .lv{color:#FF6B6B}.rb-ft a{margin-left:auto;color:var(--rb-acc);text-decoration:none;font-weight:800;padding:6px 0 6px 12px}
/* a prop card */
.rb-ph{display:flex;align-items:center;gap:6px;text-decoration:none;color:inherit;font:800 14px var(--rb-font)}
.rb-ph img{width:24px;height:24px;object-fit:contain}.rb-ph i{font:700 9px var(--rb-font);letter-spacing:1px;color:var(--rb-mut);font-style:normal;margin:0 4px}.rb-ph u{text-decoration:none;color:var(--rb-acc);margin-left:auto;font-size:16px}
.rb-ph2{font:700 11.5px var(--rb-font);color:var(--rb-mut);margin:4px 0 6px;letter-spacing:.4px}.rb-ph2 .td{color:var(--rb-day)}
.rb-pr{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:.5px solid var(--rb-rule)}
.rb-pn{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.rb-jy{width:36px;height:36px;flex:none;display:grid;place-items:center}.rb-id svg,.rb-ph svg{flex:none}
.rb-pn b{display:block;font:600 14px var(--rb-font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rb-pn small{display:block;font:600 10.5px var(--rb-font);color:var(--rb-mut)}.rb-pn small em{font-style:normal;color:var(--rb-gold)}
.rb-pr .rb-c{width:62px}.rb-pn>span{min-width:0;flex:1}
.rb-gc>div{display:block!important;padding:0;margin-top:8px}.rb-gc{content-visibility:auto;contain-intrinsic-size:auto 170px;padding:0 12px}.rb-gcf{margin:0;padding:2px 12px 8px}.rb-gcf>span:first-child{display:none}
.rb-skel{height:130px;margin:10px 16px;border-radius:14px;background:linear-gradient(90deg,var(--rb-card),var(--rb-cell),var(--rb-card));background-size:200% 100%;animation:rbs 1.2s infinite}
@keyframes rbs{to{background-position:-200% 0}}
.rb-empty{margin:16px;padding:16px;border-radius:14px;background:var(--rb-card);color:var(--rb-mut);font-size:14px}
.rb-err{margin:10px 16px 0;background:rgba(217,81,81,.14);color:#FF9B9B;border-radius:12px;padding:10px 14px;font-size:14px}
#rb-tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.94);border-top:.5px solid rgba(255,255,255,.1);padding-bottom:env(safe-area-inset-bottom,0px)}
#rb-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font:500 10.5px var(--rb-font);color:#66768A;text-decoration:none}#rb-tabs a svg{width:24px;height:24px}#rb-tabs a.on{color:var(--rb-acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body data-tab="board">
<div class="rb-wrap">
 <div class="rb-bar" id="rb-bar"><div class="rb-pills" id="rb-pills" role="tablist" aria-label="League"></div><div class="rb-tabs" id="rb-fams" role="tablist" aria-label="Market"></div></div>
 <div id="rb-err"></div>
 <div id="rb-main"><div class="rb-skel"></div><div class="rb-skel"></div><div class="rb-skel"></div></div>
</div>
<nav id="rb-tabs" hidden></nav>
<script src="shared/state.js?v=f1104"></script>
<script src="team-mark.js?v=m2"></script>
<script src="week-games.js?v=f1108"></script>
<script src="faces.js?v=f1"></script>
<script src="game-card.js?v=c4"></script>
<script src="shared/nav.js?v=f1110"></script>
<script src="shared/events.js?v=f1105"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LGN={nfl:'NFL',nba:'NBA',nhl:'NHL'};
/* lands on NFL (ruling "Board lands on NFL"); a pill the player tapped is kept */
let lg='nfl',fam='lines',tapped=false;try{const s=localStorage.getItem('rb.lg2');if(s){lg=s;tapped=true}}catch(e){}
let games=RW.cached()||[],err='',ver=0,sig='';
const VIEW=new Map(),REG=new Map();
/* the active contest (Rush.wallet): only the leagues and games it covers */
function ctx(){const W=window.Rush&&Rush.wallet;let cur=null;try{cur=W&&W.current?W.current():null}catch(e){}if(!cur||cur.id==='rush')return{id:'rush',sports:['nfl','nba','nhl'],keep:()=>true};return{id:cur.id,sports:(cur.sports||[]).filter(k=>LGN[k]),keep:g=>{try{return W.covers(cur.id,{league:g.league,start:g.date}).ok}catch(e){return true}}}}
let C=ctx();
/* ---------- odds ---------- */
const fo=o=>{const n=Number(o);if(o==null||o===''||!isFinite(n))return'';return n>0?'+'+n:String(n)};
const r5=x=>Math.max(100,Math.round(x/5)*5);
function am(p){p=Math.min(.95,Math.max(.05,p*1.045));return p>=.5?-r5(100*p/(1-p)):r5(100*(1-p)/p)}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const pNorm=(t,mu,sd)=>1-.5*(1+erf((t-.5-mu)/(sd*Math.SQRT2)));
function pPois(k,l){let s=0,f=1;for(let i=0;i<k;i++){if(i)f*=i;s+=Math.exp(-l)*Math.pow(l,i)/f}return 1-s}
/* ---------- markets ---------- */
const FAMS={nfl:[['lines','Game Lines']],nba:[['lines','Game Lines'],['points','Points'],['rebounds','Rebounds'],['assists','Assists']],nhl:[['lines','Game Lines'],['goals','Goals'],['points','Points'],['assists','Assists']]};
const SHORT={points:'PTS',rebounds:'REB',assists:'AST',goals:'G'};
const ln=v=>v>0?'+'+v:v===0?'PK':String(v);
function spreadOf(g){const L=g.line||{};if(L.spread==null&&!L.details)return null;const m=String(L.details||'').match(/^([A-Z]{2,4})\s+([-+]?\d+(\.\d+)?)/);let s=Math.abs(+L.spread||(m?+m[2]:0));if(/EVEN|PK/i.test(L.details||''))s=0;const fav=m?m[1]:(+L.spread<0?g.home.abbr:g.away.abbr);const h=fav===g.home.abbr?-s:s;return{home:h,away:-h}}
const open=g=>g.state==='pre'&&g.date>Date.now();
function key(g,sp){return g.league+'|'+g.id+'|'+JSON.stringify(sp)}
function reg(g,sp,label,odds){const k=key(g,sp);REG.set(k,{key:k,mkt:JSON.stringify(Object.assign({},sp,{side:0,over:0,o:0})),league:g.league,gameId:String(g.id),game:g.away.abbr+' at '+g.home.abbr,start:g.date,spec:sp,label,odds,market:sp.k});return k}
function cell(g,sp,top,odds,label,cls){if(odds==null||odds==='')return`<span class="rb-c off${cls?' '+cls:''}">${top?esc(top):''}<b>&ndash;</b></span>`;const ok=open(g),k=reg(g,sp,label,odds);return`<button type="button" class="rb-c${cls?' '+cls:''}${ok?'':' off'}" data-k="${esc(k)}"${sp.k==='ml'?` data-ml="${esc(sp.side)}" data-g="${esc(g.league+'|'+g.id)}"`:''}${ok?'':' disabled'} aria-label="${esc(label+' '+fo(odds))}">${top?esc(top):''}<b>${esc(fo(odds))}</b></button>`}
/* day header and time line */
const DF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric'}),TF=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'2-digit'});
function dayName(ms){const d=RW.etDay(ms),t=RW.etDay(Date.now()),tm=RW.etDay(Date.now()+864e5);if(d===t)return'TODAY';if(d===tm)return'TOMORROW';const p=DF.formatToParts(new Date(ms)),v=k=>(p.find(x=>x.type===k)||{}).value||'';return(v('weekday')+' · '+v('month')+' '+v('day')).toUpperCase()}
function when(g){if(g.state==='in')return`<span class="lv">${esc(g.detail||'LIVE')}</span>`;const today=RW.etDay(g.date)===RW.etDay(Date.now());return`<span class="${today?'td':''}">${esc(TF.format(new Date(g.date)).toUpperCase())}</span>`}
const href=g=>`game.html?league=${g.league}&id=${encodeURIComponent(g.id)}`;
/* team marks (Gold's TeamMark): drawn in the team's colours, no logo image requests */
const logo=(t,sz,L)=>window.TeamMark?TeamMark.svg(L||lg,t,sz||26):`<b>${esc(t.abbr)}</b>`;
const nick=t=>{const n=String(t.name||'');return n.split(' ').pop()};
function gameCard(g){if(window.GameCard&&typeof GameCard.html==='function')return`<div class="rb-gc">${GameCard.html(g,{cell,foot:`<div class="rb-ft rb-gcf">${g.state==='in'?'':when(g)}<a href="${href(g)}">Props + More &rsaquo;</a></div>`})}</div>`;const S=spreadOf(g),L=g.line||{},live=g.state==='in',T=(t,side)=>{const sp=S?S[side]:null;return`<div class="rb-tr"><a class="rb-id" href="${href(g)}">${logo(t,26,g.league)}<b>${esc(t.abbr)}</b>${live?'':`<span>${esc(nick(t))}</span>`}${live&&t.score!=null?`<em>${esc(t.score)}</em>`:''}</a>${cell(g,{k:'spread',side,line:sp},sp==null?'':ln(sp),sp==null?null:-110,t.abbr+' '+ln(sp))}${cell(g,{k:'total',side:side==='away'?'o':'u',line:L.ou},L.ou==null?'':(side==='away'?'O ':'U ')+L.ou,L.ou==null?null:-110,(side==='away'?'Over ':'Under ')+L.ou)}${cell(g,{k:'ml',side},'',side==='home'?L.hml:L.aml,t.abbr+' moneyline','ml')}</div>`};
 return`<div class="rb-gm">${T(g.away,'away')}<div class="rb-at">AT</div>${T(g.home,'home')}<div class="rb-ft">${when(g)}<a href="${href(g)}">Props + More &rsaquo;</a></div></div>`}
/* players for a team: its latest ESPN leaders (season figures before a game, the last game's otherwise) */
let TEAMP={v:-1,m:{}};
function teamPlayers(){if(TEAMP.v===ver)return TEAMP.m;const m={};games.slice().sort((a,b)=>(a.state==='pre')-(b.state==='pre')||a.date-b.date).forEach(g=>['away','home'].forEach(s=>{const t=g[s],L=(t.leaders||[]).length?t.leaders:(g.propsFrom||[]).filter(x=>x.team===s);if(L.length)m[g.league+'|'+t.abbr]={L,pre:g.state==='pre',rec:t.record}}));TEAMP={v:ver,m};return m}
function gp(rec){const n=String(rec||'').split('-').map(Number).filter(isFinite);const s=n.reduce((a,b)=>a+b,0);return s>0?s:1}
function propRows(g,f){const P=teamPlayers(),out=[];['away','home'].forEach(s=>{const t=g[s],T=P[g.league+'|'+t.abbr];if(!T)return;T.L.filter(x=>x.cat===f).forEach(x=>{let mu,rungs,lab;
  if(g.league==='nhl'){mu=T.pre?x.value/gp(T.rec):Math.max(.3,x.value*.6);rungs=[1,2,3];lab=`${SHORT[f]}/G: <em>${mu.toFixed(2)}</em>`;const pr=rungs.map(k=>am(pPois(k,mu)));out.push({x,t,rungs,pr,lab,mu})}
  else{mu=+x.value;if(mu<(f==='points'?10:3))return;const step=f==='points'?5:2,c=Math.max(step,step*Math.round(mu/step));rungs=[c-step,c,c+step].map(v=>Math.max(1,v));if(rungs[0]===rungs[1])rungs=[rungs[1],rungs[1]+step,rungs[1]+2*step];const sd=Math.max(1.5,mu*.35);lab=`${SHORT[f]}${T.pre?'/G':''}: <em>${mu}</em>`;out.push({x,t,rungs,pr:rungs.map(k=>am(pNorm(k,mu,sd))),lab,mu})}})});
 return out.sort((a,b)=>b.mu-a.mu).slice(0,5)}
function propCard(g,f){const rows=propRows(g,f);if(!rows.length)return'';const word=f==='goals'?'goals':f;
 return`<div class="rb-gm"><a class="rb-ph" href="${href(g)}">${logo(g.away,24,g.league)}${esc(g.away.abbr)} <span style="font-weight:500;color:var(--rb-mut)">${esc(nick(g.away))}</span><i>AT</i>${logo(g.home,24,g.league)}${esc(g.home.abbr)} <span style="font-weight:500;color:var(--rb-mut)">${esc(nick(g.home))}</span><u>&rsaquo;</u></a><div class="rb-ph2">${when(g)}</div>${rows.map(r=>`<div class="rb-pr"><div class="rb-pn"><span class="rb-jy">${window.TeamMark?TeamMark.player(g.league,r.t,'',36):''}</span><span><b>${esc(r.x.name)}</b><small>${r.lab}</small></span></div>${r.rungs.map((k,i)=>cell(g,{k:'prop',aid:r.x.id,name:r.x.name,stat:f,line:k-.5,side:'o'},k+'+',r.pr[i],r.x.name+' '+k+'+ '+word)).join('')}</div>`).join('')}</div>`}
/* ---------- a view: built once per league, market and data version; a tap swaps it in from memory ---------- */
function list(){const now=Date.now();return games.filter(g=>C.keep(g)&&g.league===lg&&(g.state==='in'||(g.state==='pre'&&g.date>now-36e5))).sort((a,b)=>(b.state==='in')-(a.state==='in')||a.date-b.date)}
function build(){const L=list();if(!L.length)return`<div class="rb-empty">No ${esc(LGN[lg])} games this week.</div>`;let h='',day='';const lines=fam==='lines';
 for(const g of L){const d=g.state==='in'?'LIVE':dayName(g.date);const body=lines?gameCard(g):propCard(g,fam);if(!body)continue;if(d!==day){day=d;h+=`<div class="rb-day"><span>${esc(d)}</span>${lines&&!window.GameCard?'<i>SPREAD</i><i>TOTAL</i><i>ML</i>':''}</div>`}h+=body}
 return h||`<div class="rb-empty">No ${esc(fam)} lines yet.</div>`}
function bar(){const sp=C.sports.length?C.sports:['nfl','nba','nhl'];if(!sp.includes(lg))lg=sp.includes('nfl')?'nfl':sp[0];const F=FAMS[lg]||FAMS.nfl;if(!F.some(f=>f[0]===fam))fam='lines';
 const P=$('rb-pills'),ph=sp.map(k=>`<button role="tab" aria-selected="${k===lg}" class="${k===lg?'on':''}" data-lg="${k}">${LGN[k]}</button>`).join('');if(P._h!==ph){P.innerHTML=ph;P._h=ph}
 const T=$('rb-fams'),th=F.map(([k,l])=>`<button role="tab" aria-selected="${k===fam}" class="${k===fam?'on':''}" data-fam="${k}">${l}</button>`).join('');if(T._h!==th){T.innerHTML=th;T._h=th}}
function paintSel(root){if(!window.Rush||!Rush.slip)return;(root||$('rb-main')).querySelectorAll('[data-k]').forEach(b=>{const on=Rush.slip.has(b.dataset.k);if(b.classList.contains('on')!==on){b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}})}
function show(){bar();if(!games.length){if(!err)return;}const k=lg+'|'+fam+'|'+ver;let h=VIEW.get(k);if(h==null){h=build();VIEW.set(k,h)}const m=$('rb-main');if(m._k!==k){m.innerHTML=h;m._k=k;paintSel(m)}if(PB!==ver){PB=ver;prebuild()}}
let PB=-1;
/* every other league and tab is built while the phone is idle, so a first tap is a swap too */
function prebuild(){const v=ver,todo=[];(C.sports.length?C.sports:['nfl','nba','nhl']).forEach(l=>(FAMS[l]||[]).forEach(([f])=>todo.push([l,f])));const idle=window.requestIdleCallback||(cb=>setTimeout(()=>cb({timeRemaining:()=>8}),60));
 const step=d=>{while(todo.length&&d.timeRemaining()>4){if(v!==ver)return;const[l,f]=todo.shift(),k=l+'|'+f+'|'+v;if(VIEW.has(k))continue;const L0=lg,F0=fam;lg=l;fam=f;try{VIEW.set(k,build())}finally{lg=L0;fam=F0}}if(todo.length)idle(step)};idle(step)}
/* the pinned bar sits under the shared header */
function pin(){const t=document.getElementById('rtop');const h=t&&getComputedStyle(t).position==='sticky'?Math.round(t.getBoundingClientRect().height):0;document.documentElement.style.setProperty('--rb-top',h+'px')}
/* ---------- taps ---------- */
document.addEventListener('click',e=>{const t=e.target;
 const p=t.closest('[data-lg]');if(p){if(p.dataset.lg!==lg){lg=p.dataset.lg;fam='lines';tapped=true;try{localStorage.setItem('rb.lg2',lg)}catch(x){}show();scrollTo(0,0)}return}
 const f=t.closest('[data-fam]');if(f){if(f.dataset.fam!==fam){fam=f.dataset.fam;show();scrollTo(0,0)}return}
 const c=t.closest('.rb-c[data-k]');if(c){e.preventDefault();if(c.disabled||!window.Rush||!Rush.slip)return;const P=REG.get(c.dataset.k);if(!P||P.start<=Date.now())return;Rush.slip.toggle(P);paintSel();return}});
if(window.Rush&&Rush.slip&&Rush.slip.on)Rush.slip.on(()=>paintSel());
if(window.Rush&&Rush.on)Rush.on(()=>{const c2=ctx();if(c2.id!==C.id){C=c2;VIEW.clear();show()}});
/* ---------- data: fetch on a timer, redraw only when it changed ---------- */
function sigOf(G){let s=G.length+'';for(const g of G)s+=g.id+g.state+(g.home.score??'')+(g.away.score??'')+(g.detail||'')+JSON.stringify(g.line||{})+((g.home.leaders||[]).length+(g.away.leaders||[]).length)+(g.home.color||'')+(g.away.color||'');return s}
async function refresh(){try{const G=await RW.load(true);err='';const s=sigOf(G);games=G;if(s!==sig){sig=s;ver++;VIEW.clear();REG.clear();$('rb-main')._k=null;show()}}catch(e){err='Lines did not load. Retrying.';if(!games.length)$('rb-main').innerHTML=`<div class="rb-err">${esc(err)}</div>`}}
function loop(){refresh().finally(()=>setTimeout(loop,games.some(g=>g.state==='in')?15000:60000))}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
if(games.length){sig=sigOf(games);ver=1}
pin();show();setTimeout(pin,400);addEventListener('resize',pin);loop();
/* tab bar: shared/nav.js when it exists, otherwise a matching fallback */
setTimeout(()=>{if(document.querySelector('#rnav,[data-rush-nav],.rush-nav,nav.tabbar')||(window.RushNav&&window.RushNav.mounted))return;const T=[['index.html','Home','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['board.html','Board','<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18M9 10v10"/>'],['slips.html','Slips','<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'],['ranks.html','Ranks','<path d="M8 21V11M12 21V5M16 21v-7"/>'],['lounge.html','Lounge','<path d="M4 5h16v11H8l-4 4z"/>']];const here=location.pathname.split('/').pop()||'index.html';const n=$('rb-tabs');n.innerHTML=T.map(([u,l,p])=>`<a href="${u}" class="${u===here?'on':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${l}</a>`).join('');n.hidden=false},600);
</script>
