<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush</title><meta name="theme-color" content="#0A0F15">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap">
<link rel="stylesheet" href="shared/rush.css">
<style>
:root{--bg:#0A0F15;--card:#141C26;--card2:#1B2531;--line:rgba(255,255,255,.09);--tx:#F4F7FA;--mute:#A3AFBD;--acc:#3DB8FF;--gold:#F2C14E;--grn:#3DD68C;--red:#FF6B6B;--vio:#9B8CFF}
body{background:var(--bg);color:var(--tx)}
.h-wrap{max-width:560px;margin:0 auto;padding:0 16px 8px;font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.h-wrap a{color:inherit;text-decoration:none}
.h-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.h-lbl{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:22px 4px 0;display:flex;justify-content:space-between;align-items:center}
.h-lbl a{color:var(--acc);letter-spacing:.3px;text-transform:none;font-size:14px;font-weight:700}
.h-big{font:800 44px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.h-num{font:800 22px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.up{color:var(--grn)}.dn{color:var(--red)}
.h-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--mute)}
.h-chip.live{background:rgba(255,107,107,.16);color:var(--red)}.h-chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:hb 1.4s infinite}
@keyframes hb{50%{opacity:.25}}
.h-btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:14px;background:var(--acc);color:#04121C!important;font:800 17px/1 -apple-system,sans-serif;flex:1}
.h-btn.ghost{background:var(--card2);color:var(--tx)!important;border:1px solid var(--line)}
.hero{background:linear-gradient(160deg,#17324A 0%,#141C26 62%);border-color:rgba(61,184,255,.3)}
.hero .rk{display:flex;align-items:baseline;gap:8px;margin-top:10px}.hero .rk .h-big{font-size:68px}
.vsw{display:flex;gap:4px;margin-top:16px;padding:4px;border-radius:12px;background:rgba(10,15,21,.5)}.vsw button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--mute);font:800 14px/1 -apple-system,sans-serif;cursor:pointer}.vsw button.on{background:var(--card2);color:var(--tx)}.lad{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px -4px 0}.lad a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:14px;min-width:0}.lad a.me{background:rgba(61,184,255,.14);box-shadow:inset 0 0 0 1px rgba(61,184,255,.4)}.lad .rkn i{font-style:normal;font-size:11px}.lad .rkn{font:800 13px/1 "Barlow Condensed",sans-serif;color:var(--mute)}.lad b{font:800 14px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}.lad a.me b{color:var(--acc)}
.strip .ln{position:absolute;left:0;right:0;top:29px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FF6B6B55,#3DD68C55)}
.strip .gu-av{position:absolute;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.8,.2,1)}
.strip .gu-av.me{z-index:2}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.mu .sd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.mu .sd b{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.tug{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;background:var(--card2)}.tug i{transition:flex .8s}.tug .a{background:var(--acc)}.tug .b{background:var(--vio)}
.gm{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:10px}
.gm .g-tm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font:800 26px/1.15 "Barlow Condensed",sans-serif}
.gm .sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gm .sides>div{background:var(--card2);border-radius:12px;padding:8px 10px;min-height:58px}
.gm .sides small{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mute);margin-bottom:6px}
.faces{display:flex;flex-wrap:wrap;gap:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.row .rk{width:26px;text-align:center;font:800 18px/1 "Barlow Condensed",sans-serif;color:var(--mute)}
.mv{width:34px;text-align:right;font-weight:800;font-size:13px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ev:first-child{border-top:0}.ev p{margin:0;flex:1;min-width:0;font-size:15px}.ev time{color:var(--mute);font-size:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.strip .gu-av,.tug i{transition:none}.h-chip.live::before{animation:none}}
</style></head>
<body>
<div id="app" class="h-wrap"></div>
<script src="shared/state.js?v=f1102"></script><script src="week-games.js?v=f1102"></script><script src="honest.js?v=g617"></script><script src="shared/nav.js?v=f1102"></script><script src="shared/events.js?v=f1102"></script><script src="gold-ui.js?v=g617"></script>
<script>
const E=GU.esc,F=GU.fmt;
let VIEW=(()=>{try{return localStorage.getItem('gu-home-view')||'field'}catch(e){return'field'}})();
const REF=new URLSearchParams(location.search).get('ref');
function sideFaces(list,n){return list.length?`<div class="faces">${[...new Map(list.map(o=>[o.pl.id,o.pl])).values()].slice(0,n||5).map(p=>GU.av(p,30)).join('')}</div>`:'<span style="color:var(--mute);font-size:13px">Nobody</span>'}
function gameCard(g){
  const v=GU.gameView(g),live=g.state==='in',done=g.done,st=GU.started(g);
  let h=`<div class="gm"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h-chip ${live?'live':''}">${live?E(g.detail||'LIVE'):done?'FINAL':E(String(g.league||'').toUpperCase())+' · '+GU.when(g.date)}</span>${v.mine?`<span class="h-chip" style="background:rgba(61,184,255,.16);color:var(--acc)">YOUR PICK</span>`:''}</div>
   <a href="game.html?id=${encodeURIComponent(g.id)}&league=${encodeURIComponent(g.league||'')}" style="display:block;margin-top:10px"><div class="g-tm"><span>${E(g.away.abbr)}</span><span>${st?E(g.away.score||0):''}</span><span>${E(g.home.abbr)}</span><span>${st?E(g.home.score||0):''}</span></div></a>`;
  if(!st){h+=`<div style="display:flex;align-items:center;gap:10px;margin-top:12px">${v.players.length?`<div class="faces">${v.players.slice(0,6).map(p=>GU.av(p,30)).join('')}</div><span style="color:var(--mute);font-size:14px">${v.sealed} sealed pick${v.sealed===1?'':'s'}, seal breaks in ${GU.until(g.date)}</span>`:`<span style="color:var(--mute);font-size:14px">No picks from the Field yet. Seal breaks at kickoff in ${GU.until(g.date)}.</span>`}</div>`;}
  else if(v.ms){h+=`<div class="sides"><div><small>WITH YOU</small>${sideFaces(v.withYou)}</div><div><small>AGAINST YOU</small>${sideFaces(v.against)}</div></div>`;}
  else if(v.players.length){const by={away:[],home:[],over:[],under:[]};(v.on||[]).forEach(o=>by[GU.sideOf(o.x)].push(o));const cols=[['ON '+g.away.abbr,by.away],['ON '+g.home.abbr,by.home],['OVER',by.over],['UNDER',by.under]].filter(c=>c[1].length);h+=`<div class="sides">${cols.slice(0,4).map(c=>`<div><small>${E(c[0])}</small>${sideFaces(c[1])}</div>`).join('')}</div>`;}
  return h+`<a href="lounge.html?g=${encodeURIComponent(g.id)}" style="display:block;margin-top:12px;color:var(--acc);font-weight:700;font-size:15px">${v.mine?'Who is with you, in the Lounge ›':'Open it in the Lounge ›'}</a></div>`;
}
function render(){
  const f=GU.field(),m=GU.meRow(),wk=Rush.week(),op=GU.opponent(),mv=GU.moves(f);
  const lo=Math.min(...f.map(r=>r.stack)),hi=Math.max(...f.map(r=>r.stack)),pos=s=>hi===lo?50:4+((s-lo)/(hi-lo))*92,d=m.stack-1000;
  let h='';
  {const rp=REF?f.find(r=>!r.me&&r.name.toLowerCase()===REF.toLowerCase()):null;if(rp){const s=GU.circle.state(rp.id);h+=`<section class="h-card" style="border-color:rgba(155,140,255,.45)"><div style="display:flex;align-items:center;gap:12px">${GU.av(rp,44)}<div style="flex:1"><b>${E(rp.name)} invited you</b><div style="color:var(--mute);font-size:14px">${s==='in'?'You are in each other\'s circle':s==='asked'?'Waiting on '+E(rp.name.split(' ')[0])+' to confirm':'Confirm to join each other\'s circle'}</div></div>${s==='none'||s==='asked-you'?`<button class="h-btn" data-ref="${E(rp.id)}" style="flex:none;border:0;cursor:pointer;min-height:42px;font-size:15px">Confirm</button>`:''}</div></section>`;}}
  // 1. The weekly contest, front and centre.
  h+=`<section class="h-card hero"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h-chip" style="background:rgba(61,184,255,.16);color:var(--acc)">WEEK ${wk.n} CONTEST</span><span class="h-chip">Ends Monday night</span></div>
   <div class="rk"><span class="h-big">#${m.rank||'-'}</span><span style="color:var(--mute);font-weight:700">of ${f.length} in the Field</span></div>
   <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px"><div><div style="color:var(--mute);font-size:12px;font-weight:800;letter-spacing:1.2px">YOUR STACK</div><div class="h-big" style="font-size:40px">${F(m.stack)}</div></div><div style="text-align:right"><div class="h-num ${d>=0?'up':'dn'}">${d>=0?'+':''}${F(d)}</div><small style="color:var(--mute)">since Tuesday</small></div></div>
   <div class="vsw"><button data-v="field" class="${VIEW==='field'?'on':''}">The Field · ${f.length}</button><button data-v="circle" class="${VIEW==='circle'?'on':''}">My circle · ${GU.circle.ids().length}</button></div>
   ${VIEW==='circle'&&!GU.circle.ids().length?(()=>{const sug=GU.circle.suggest(3);return `<div style="margin-top:14px;color:var(--mute)">Your circle is empty. Add players you know, or invite a friend; they start the week with 1,000 like everyone.</div><div style="display:flex;gap:8px;margin-top:10px">${sug.map(r=>`<a href="${GU.prof(r)}#circle" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;background:rgba(10,15,21,.5)">${GU.av(r,36,1)}<b style="font-size:13px">${E(r.name.split(' ')[0])}</b><small style="color:var(--acc);font-weight:800">Add</small></a>`).join('')}</div><a class="h-btn" href="#invite" style="margin-top:10px;background:var(--vio);color:#fff!important">Invite a friend</a>`})():(()=>{const cs=GU.circle.ids();const L=VIEW==='circle'?f.filter(r=>r.me||cs.includes(String(r.id))):f;const me=L.findIndex(r=>r.me),a=Math.max(0,Math.min(me-3,L.length-7)),win=L.slice(a,a+7);return `<div class="lad">${win.map(r=>`<a href="${GU.prof(r)}" class="${r.me?'me':''}"><span class="rkn">${r.rank}${mv[r.id]>0?'<i class="up"> ▲'+mv[r.id]+'</i>':mv[r.id]<0?'<i class="dn"> ▼'+(-mv[r.id])+'</i>':''}</span>${GU.av(r,r.me?40:34,1)}<b>${F(r.stack)}</b></a>`).join('')}</div><div style="color:var(--mute);font-size:13px;text-align:center;margin-top:6px">${m.rank===1?'You lead the Field':`${F(f[0].stack-m.stack)} behind 1st (${E(f[0].name)})`}${L.length>7?` · showing #${win[0].rank} to #${win[win.length-1].rank}`:''}${VIEW==='circle'?' · ranks are the whole Field':''}</div>${VIEW==='circle'?(()=>{const ff=GU.circle.fof().slice(0,3);return ff.length?`<div style="margin-top:12px;color:var(--mute);font-size:12px;font-weight:800;letter-spacing:1.2px">IN YOUR FRIENDS' CIRCLES</div><div style="display:flex;gap:8px;margin-top:8px">${ff.map(x=>`<a href="${GU.prof(x.p)}#circle" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;background:rgba(10,15,21,.5)">${GU.av(x.p,34,1)}<b style="font-size:13px">${E(x.p.name.split(' ')[0])}</b><small style="color:var(--mute);font-size:11px">with ${E(x.via[0].name.split(' ')[0])}</small></a>`).join('')}</div>`:''})():''}`})()}
   <div style="display:flex;gap:10px;margin-top:16px"><a class="h-btn" href="board.html">Make picks</a><a class="h-btn ghost" href="ranks.html">The contest</a></div></section>`;
  // 3. Your matchup.
  if(op){const a=Math.max(1,m.stack),b=Math.max(1,op.stack),gap=m.stack-op.stack,pairT=wk.opens+2*864e5+11.5*36e5,paired=Date.now()>=pairT;
   h+=`<div class="h-lbl">Your matchup <a href="ranks.html">Open</a></div><a class="h-card" style="display:block" href="ranks.html"><div class="mu"><div class="sd">${GU.av(m,56,1)}<b>You</b><span class="h-num">${F(m.stack)}</span></div><div style="font:800 18px/1 'Barlow Condensed',sans-serif;color:var(--mute)">VS</div><div class="sd">${GU.av(op,56,1)}<b>${E(op.name)}</b><span class="h-num">${F(op.stack)}</span></div></div>
   <div class="tug"><i class="a" style="flex:${a}"></i><i class="b" style="flex:${b}"></i></div>
   <div style="text-align:center;margin-top:10px;font-weight:800;font-size:17px" class="${gap>=0?'up':'dn'}">${gap===0?'Dead even':gap>0?'You lead by '+F(gap):'You trail by '+F(-gap)}</div>
   ${paired?'':`<div style="text-align:center;color:var(--mute);font-size:13px;margin-top:4px">Pairing locks Thursday 7:00 PM, in ${GU.until(pairT)}</div>`}</a>`;}
  // For you: what other players aimed at you in the Lounge, and what came back on yours (Red's lounge keys). The honest view shows only real ones.
  {let inbox=[],sent=[];try{inbox=JSON.parse(localStorage.getItem('rush-lounge-inbox-v1')||'[]')}catch(e){}try{sent=Object.values(JSON.parse(localStorage.getItem('rush-lounge-sent-v1')||'{}'))}catch(e){}
   if(GU.honest())inbox=inbox.filter(x=>x.real);
   inbox=inbox.sort((a,b)=>b.at-a.at).slice(0,3);sent=sent.sort((a,b)=>b.at-a.at).slice(0,2);
   const face=(id,name)=>GU.av(GU.player(id)||{id:id,name:name||'?'},34);
   const rows=inbox.map(x=>`<div class="ev">${face(x.fromId,x.who)}<p><b>${E(String(x.who||'').split(' ')[0])}</b> ${E(x.text||'')}${x.about?' <span style="color:var(--mute)">· '+E(x.about)+'</span>':''}</p>${x.ans?'<span class="h-chip">ANSWERED</span>':'<a class="h-chip" style="background:rgba(61,184,255,.16);color:var(--acc)" href="lounge.html">ANSWER</a>'}</div>`)
     .concat(sent.map(x=>`<div class="ev">${face(x.toId,x.to)}<p>You to <b>${E(String(x.to||'').split(' ')[0])}</b>: ${E(x.label||'')}${x.ans&&(!GU.honest()||x.ans.real)?'<br><span class="up">'+E(String(x.ans.who||'').split(' ')[0])+': '+E(x.ans.text||'')+'</span>':'<br><span style="color:var(--mute)">Waiting on '+E(String(x.to||'them').split(' ')[0])+'</span>'}</p></div>`));
   h+=`<div class="h-lbl">For you <a href="lounge.html">Lounge</a></div><section class="h-card">${rows.length?rows.join(''):`<a href="lounge.html" style="display:flex;align-items:center;gap:10px"><span style="flex:1;color:var(--mute)">Nothing aimed at you yet. Tap someone on tonight's game.</span><span style="color:var(--acc);font-weight:800">Lounge ›</span></a>`}</section>`;}
  // 2. Tonight: the games that matter to you and the Field.
  const gs=GU.games().filter(g=>!g.done||Date.now()-g.date<4*36e5),mineIds=new Set(GU.mine().map(p=>String(p.gameId)));
  const scored=gs.map(g=>({g,v:(g.state==='in'?100:0)+(mineIds.has(String(g.id))?50:0)+(GU.gameView(g).players.length*5)-(g.date-Date.now())/36e5})).filter(x=>x.g.date-Date.now()<36*36e5).sort((a,b)=>b.v-a.v).slice(0,3);
  h+=`<div class="h-lbl">On tonight <a href="board.html">Board</a></div>`+(scored.length?scored.map(x=>gameCard(x.g)).join(''):'<div class="h-card" style="color:var(--mute)">No games in the next day. The Board has the week.</div>');
  // 4. The Field moving: the latest from the week's one event source, when the store has it.
  let evs=[];try{if(Rush.events)evs=(Rush.events()||[]).filter(e=>(e.players||[]).length).slice(0,5)}catch(e){}
  const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/6e4));return m<1?'now':m<60?m+'m':Math.round(m/60)+'h'};
  const first=n=>String(n||'').split(' ')[0];
  const say=e=>{const ps=e.players||[];if(e.type==='settled'&&ps.some(p=>p.result)){return ps.slice(0,3).map(p=>'<b>'+E(first(p.name))+'</b> '+(p.result==='won'?'<span class="up">hit</span>':p.result==='lost'?'<span class="dn">missed</span>':E(p.result||''))+(p.label?' '+E(p.label):'')).join(', ')+(e.game?' <span style="color:var(--mute)">· '+E(e.game)+'</span>':'')}if(e.type==='play'){const good=ps.filter(p=>p.team),bad=ps.filter(p=>!p.team);return E(e.text||'')+(good.length?' <span class="up">· good for '+good.slice(0,3).map(p=>E(first(p.name))).join(', ')+'</span>':'')+(bad.length?' <span class="dn">· bad for '+bad.slice(0,2).map(p=>E(first(p.name))).join(', ')+'</span>':'')}return E(e.text||'')};
  if(evs.length)h+=`<div class="h-lbl">The Field right now <a href="lounge.html">Lounge</a></div><section class="h-card">${evs.map(e=>{const ps=(e.players||[]).slice(0,3).map(p=>GU.player(p.id)||{id:p.id,name:p.name});return `<div class="ev"><span style="display:flex;flex:none">${ps.map((p,k)=>'<span style="margin-left:'+(k?-10:0)+'px">'+GU.av(p,32)+'</span>').join('')}</span><p>${say(e)}</p><time>${e.at?ago(e.at):''}</time></div>`}).join('')}</section>`;
  // 5. The Ranks.
  // The ladder already shows a Field of 7 or fewer; the list only adds the top of a bigger Field.
  const top=f.slice(0,5);if(!top.some(r=>r.me))top.push(m);
  if(f.length>7)h+=`<div class="h-lbl">The Field <a href="ranks.html">Ranks</a></div><section class="h-card">${top.map(r=>{const k=mv[r.id]||0;return `<div class="row"><span class="rk">${r.rank}</span>${GU.av(r,40)}<div class="nm">${GU.nameLink(r)}</div><span class="mv ${k>0?'up':k<0?'dn':''}">${k>0?'▲'+k:k<0?'▼'+(-k):''}</span><span class="h-num">${F(r.stack)}</span></div>`}).join('')}</section>`;
  h+=`<section class="h-card" id="invite" style="margin-top:22px"><div style="font-weight:800;font-size:18px">Bring a friend into the week</div><div style="color:var(--mute);margin-top:4px">Entry is free and they start with 1,000 Stack. The link names you, and you join each other's circle once you both confirm.</div><button class="h-btn" id="inv" style="margin-top:12px;width:100%;border:0;cursor:pointer">Send an invite</button></section>`;
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;try{localStorage.setItem('gu-home-view',VIEW)}catch(e){}render()});
  document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{const s=GU.circle.state(b.dataset.ref);if(s==='asked-you')GU.circle.confirm(b.dataset.ref);else GU.circle.ask(b.dataset.ref);render();setTimeout(render,10500)});
  const iv=document.getElementById('inv');if(iv)iv.onclick=async()=>{const u=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?ref='+encodeURIComponent(GU.meRow().name);try{if(navigator.share){await navigator.share({title:'Rush',text:'Join this week on Rush',url:u});return}await navigator.clipboard.writeText(u);iv.textContent='Link copied'}catch(e){}};
  if(location.hash==='#invite'&&!window._invScrolled){window._invScrolled=1;setTimeout(()=>{const el=document.getElementById('invite');if(el)el.scrollIntoView({block:'center'})},300)}
}
render();
if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});
if(window.Rush&&Rush.on)try{Rush.on(render)}catch(e){}
setInterval(render,30000);
</script></body></html>
