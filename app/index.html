<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush · Home</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Home: the week card with its clocks, your standing, what is live now. Rush tokens, phone first. */
:root{--bg:#0B1118;--card:#121A23;--card2:#1A2530;--line:#22303D;--fg:#fff;--mute:#8C9BAD;--acc:#00BFFF;--grad:linear-gradient(135deg,#00C0FF,#0080FF);--win:#10B981;--loss:#D95151;--warn:#F59E0B;--f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.g-wrap{padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.g-top{display:flex;align-items:center;gap:10px}
.g-top h1{font:800 26px/1 var(--f);letter-spacing:-.03em;margin:0}
.g-chip{background:rgba(0,191,255,.14);color:var(--acc);font:700 12px var(--f);border-radius:999px;padding:4px 10px}
.g-card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.g-h{display:flex;align-items:baseline;gap:8px;font:700 17px var(--f)}
.g-h small{margin-left:auto;font:500 12.5px var(--f);color:var(--mute)}
.g-clocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g-clock{background:var(--card2);border-radius:14px;padding:10px}
.g-clock span{display:block;font:600 11px var(--f);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.g-clock b{display:block;font:700 18px var(--f);margin-top:3px}
.g-clock small{color:var(--mute);font-size:11.5px}
.g-cta{display:block;width:100%;padding:16px;border-radius:14px;background:var(--grad);color:#fff;font:700 17px var(--f);text-align:center;text-decoration:none}
.g-cta.s{background:var(--card2)}
.g-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g-tile{background:var(--card2);border-radius:14px;padding:12px;text-decoration:none}
.g-tile span{display:block;color:var(--mute);font-size:12.5px}
.g-tile b{display:block;font:700 24px/1.15 var(--f);letter-spacing:-.02em}
.up{color:var(--win)}.dn{color:var(--loss)}
.g-caps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.g-caps::-webkit-scrollbar{display:none}
.g-cap{flex:none;display:flex;align-items:center;gap:10px;border:1.5px solid #2C3B4A;border-radius:999px;padding:7px 12px;text-decoration:none;min-height:48px;background:var(--card2)}
.g-cap img{width:30px;height:30px}
.g-cap b{font:700 17px var(--f)}
.g-cap .ck{display:flex;flex-direction:column;align-items:center;line-height:1.05;font:600 13px var(--f);color:var(--fg);min-width:42px}
.g-cap .ck small{color:var(--mute);font-size:11.5px}
.g-cap.live{border-color:var(--acc)}
.g-cap .at{color:var(--mute);font-weight:600}
.g-start{display:flex;flex-direction:column;gap:2px;background:var(--card2);border-radius:14px;padding:11px 12px}
.g-start b{font:700 15px var(--f)}.g-start b em{font-style:normal;color:var(--warn)}
.g-start small{color:var(--mute);font-size:12.5px}
.g-starts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g-strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;margin-inline:-2px;padding-bottom:2px}
.g-strip::-webkit-scrollbar{display:none}
.g-game{flex:0 0 72%;max-width:260px;scroll-snap-align:start;background:var(--card2);border-radius:16px;padding:12px;text-decoration:none;display:flex;flex-direction:column;gap:7px}
.g-game .lg{font:700 11px var(--f);letter-spacing:.06em;color:var(--mute);display:flex;justify-content:space-between}
.g-game .lg i{font-style:normal;color:var(--loss)}
.g-row{display:flex;align-items:center;gap:8px}
.g-row img{width:26px;height:26px}
.g-row span{flex:1;font-weight:600}
.g-row b{font:700 20px var(--f)}
.g-game .ln{font-size:12.5px;color:var(--mute)}
.g-note{font-size:12.5px;color:var(--mute)}
.g-in{width:100%;background:var(--card2);border:0;border-radius:12px;padding:13px;color:var(--fg);font:15px var(--f)}
.g-field{display:flex;flex-direction:column}
.g-fr{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.g-fr:last-child{border-bottom:0}.g-fr.me{color:var(--acc)}
.g-fr .r{color:var(--mute);font-weight:700;text-align:center}
.g-pill{display:inline-block;padding:1px 6px;border-radius:6px;font:700 10px var(--f);background:var(--card2);color:var(--mute);margin-left:4px}
#g-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid #2C3B4A;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#g-nav a{padding:9px 0 8px;text-align:center;font:600 11px var(--f);color:#5E6E80;text-decoration:none;min-height:44px}
#g-nav a.on{color:var(--acc)}
#g-nav svg{display:block;width:24px;height:24px;margin:0 auto 2px}
</style>
</head>
<body>
<div class="g-wrap" id="home"></div>
<nav id="g-nav"></nav>
<script src="shared/state.js"></script>
<script src="shared/nav.js"></script>
<script src="gold-store.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO=(lg,ab)=>`https://a.espncdn.com/i/teamlogos/${lg}/500/${String(ab).toLowerCase()}.png`;
const PATHS={nfl:'football/nfl',nba:'basketball/nba',nhl:'hockey/nhl'};
const W=GS.week();
function fmtLeft(ms){if(ms<=0)return'Closed';const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return d?`${d}d ${h}h`:h?`${h}h ${mm}m`:`${mm}m`}
function fmtDay(t){return new Date(t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}
let GAMES=[];
const etDay=off=>new Date(Date.now()+off*864e5).toLocaleDateString('en-CA',{timeZone:'America/New_York'}).replace(/-/g,'');
async function loadGames(){const days=[etDay(-1),etDay(0),etDay(1)];const urls=[['nfl',`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard`]];for(const lg of['nba','nhl'])for(const d of days)urls.push([lg,`https://site.api.espn.com/apis/site/v2/sports/${PATHS[lg]}/scoreboard?dates=${d}`]);const out=[];await Promise.all(urls.map(async([lg,u])=>{try{const d=await(await fetch(u)).json();for(const e of d.events||[]){const c=e.competitions[0],h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');out.push({lg,id:e.id,date:Date.parse(e.date),state:c.status.type.state,detail:c.status.type.shortDetail,h:{ab:h.team.abbreviation,s:h.score,logo:h.team.logo},a:{ab:a.team.abbreviation,s:a.score,logo:a.team.logo},line:(c.odds||[])[0]&&c.odds[0].details})}}catch(e){}}));const seen={};GAMES=out.filter(g=>!seen[g.lg+g.id]&&(seen[g.lg+g.id]=1)).sort((x,y)=>x.date-y.date);render()}
function capChip(g){const live=g.state==='in',pre=g.state==='pre';const det=String(g.detail||''),parts=det.split(' - ');const ck=live?`<span class="ck">${esc(parts[0]||det)}<small>${esc(parts[1]||'')}</small></span>`:pre?`<span class="ck">${esc(new Date(g.date).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}))}<small>${esc(new Date(g.date).toLocaleDateString([], {weekday:'short'}))}</small></span>`:`<span class="ck">Final<small>${g.lg.toUpperCase()}</small></span>`;return`<a class="g-cap${live?' live':''}" href="game.html?league=${g.lg}&id=${encodeURIComponent(g.id)}"><img alt="" src="${esc(g.a.logo||LOGO(g.lg,g.a.ab))}">${pre?'<span class="at">@</span>':`<b>${esc(g.a.s)}</b>`}${ck}${pre?'':`<b>${esc(g.h.s)}</b>`}<img alt="" src="${esc(g.h.logo||LOGO(g.lg,g.h.ab))}"></a>`}
function startsIn(ms){if(ms<=0)return'Closed';const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return d?`${d} Day${d>1?'s':''} ${h} Hr${h===1?'':'s'}`:h?`${h} Hr${h===1?'':'s'} ${mm} Min`:`${mm} Min`}
function gameCard(g){return`<a class="g-game" href="game.html?league=${g.lg}&id=${encodeURIComponent(g.id)}"><div class="lg">${g.lg.toUpperCase()}${g.state==='in'?'<i>LIVE · '+esc(g.detail)+'</i>':'<span>'+esc(g.state==='post'?'Final':fmtDay(g.date))+'</span>'}</div>${[g.a,g.h].map(t=>`<div class="g-row"><img alt="" src="${esc(t.logo||LOGO(g.lg,t.ab))}"><span>${esc(t.ab)}</span>${g.state==='pre'?'':`<b>${esc(t.s)}</b>`}</div>`).join('')}<div class="ln">${g.line?esc(g.line):'Open the game for the full book'}</div></a>`}
function render(){const me=GS.me(),now=Date.now(),entered=GS.entered();const live=GAMES.filter(g=>g.state==='in'),next=GAMES.filter(g=>g.state==='pre').slice(0,6);let h=`<div class="g-top"><h1>Rush</h1><span class="g-chip">Week ${W.n}</span></div>`;
  h+=`<div class="g-card"><div class="g-h">Week ${W.n}<small>Tue Nov 3 to Monday night</small></div><div class="g-starts"><div class="g-start"><b>Entry closes in: <em>${startsIn(W.entryClose-now)}</em></b><small>${esc(new Date(W.entryClose).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'}))} kickoff</small></div><div class="g-start"><b>Week settles in: <em>${startsIn(W.settle-now)}</em></b><small>${esc(new Date(W.settle).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'}))}</small></div></div><div class="g-note">Picks are open now. Each game locks at its start.</div>`;
  if(!entered){h+=now<W.entryClose?`<input class="g-in" id="g-name" maxlength="20" placeholder="Your name in the Field" value="${esc(me.name||'')}"><button class="g-cta" id="g-enter">Enter Week ${W.n} · 1,000 Stack</button><div class="g-note">Free. Every player starts the week with the same 1,000 Stack. 1 Unit is 10 Stack. The Field ranks on Units.</div>`:`<div class="g-note">Entry for Week ${W.n} closed at Monday night kickoff.</div>`}
  else{const u=GS.units(),rk=GS.rank(),rec=GS.record();h+=`<div class="g-tiles"><a class="g-tile" href="slips.html"><span>Stack</span><b>${GS.fmt(me.stack)}</b></a><a class="g-tile" href="ranks.html"><span>Units</span><b class="${u>=0?'up':'dn'}">${u>=0?'+':''}${u.toFixed(1)}</b></a><a class="g-tile" href="ranks.html"><span>This week</span><b>#${rk.rank}<small style="font:600 13px var(--f);color:var(--mute)"> of ${rk.of}</small></b></a><a class="g-tile" href="ranks.html#season"><span>Season</span><b>${rec.w}-${rec.l}</b></a></div>`;
    if(me.stack<10&&!me.reloaded)h+=`<button class="g-cta" id="g-reload">Reload: 1,000 Stack back, free once a week</button><div class="g-note">Your Units keep counting from where they are.</div>`;
    const open=GS.picks().filter(p=>p.st==='open');if(open.length)h+=`<a class="g-cta s" href="slips.html">${open.length} open pick${open.length>1?'s':''} in your Slip</a>`}
  h+=`</div>`;
  h+=`<div class="g-card"><div class="g-h">${live.length?'Live now':'Up next'}<small>${live.length?'Tap in to pick live':'Picks open now'}</small></div>${(live.length?live:next).length?`<div class="g-caps">${(live.length?live:next).map(capChip).join('')}</div>`:'<div class="g-note">Loading this week’s games.</div>'}<a class="g-cta s" href="board.html">See the full Board</a></div>`;
  const top=GS.field().slice(0,3);if(top.length)h+=`<div class="g-card"><div class="g-h">The Field<small>Top three this week</small></div><div class="g-field">${top.map(r=>`<div class="g-fr${r.you?' me':''}"><div class="r">${r.rank}</div><div>${esc(r.name)}${r.sim?'<span class="g-pill">SIM</span>':''}</div><b class="${r.units>=0?'up':'dn'}">${r.units>=0?'+':''}${r.units.toFixed(1)}</b></div>`).join('')}</div><a class="g-cta s" href="ranks.html">Ranks</a></div>`;
  $('home').innerHTML=h;const e=$('g-enter');if(e)e.onclick=()=>{GS.enter(($('g-name')||{}).value);render()};const r=$('g-reload');if(r)r.onclick=()=>{GS.reload();render()}}
GS.nav('home');render();loadGames();setInterval(loadGames,30000);setInterval(render,30000);
</script>
</body>
</html>
