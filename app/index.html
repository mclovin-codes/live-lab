<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rush</title><meta name="theme-color" content="#0A0F15">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="shared/rush.css">
<style>
:root{--bg:#0A0F15;--card:#141C26;--card2:#1B2531;--line:rgba(255,255,255,.09);--tx:#F4F7FA;--mute:#A3AFBD;--acc:#3DB8FF;--gold:#F2C14E;--grn:#3DD68C;--red:#FF6B6B;--vio:#9B8CFF}
body{background:var(--bg);color:var(--tx)}
.h-wrap{max-width:560px;margin:0 auto;padding:0 16px 8px;font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.h-wrap a{color:inherit;text-decoration:none}
.h-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.h-lbl{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:22px 4px 0;display:flex;justify-content:space-between;align-items:center}
.h-lbl a{color:var(--acc);letter-spacing:.3px;text-transform:none;font-size:14px;font-weight:700}
.h-big{font:800 44px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.h-num{font:800 22px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.up{color:var(--grn)}.dn{color:var(--red)}
.h-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:800;letter-spacing:.6px;color:var(--mute)}
.h-chip.live{background:rgba(255,107,107,.16);color:var(--red)}.h-chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:hb 1.4s infinite}
@keyframes hb{50%{opacity:.25}}
.h-btn{display:flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:14px;background:var(--acc);color:#04121C!important;font:800 17px/1 -apple-system,sans-serif;flex:1}
.h-btn.ghost{background:var(--card2);color:var(--tx)!important;border:1px solid var(--line)}
.hero{background:linear-gradient(160deg,#17324A 0%,#141C26 62%);border-color:rgba(61,184,255,.3)}
.hero .rk{display:flex;align-items:baseline;gap:8px;margin-top:10px}.hero .rk .h-big{font-size:68px}
.strip2{position:relative;margin:16px -16px 0;overflow-x:auto;overscroll-behavior-x:contain;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}.strip2::-webkit-scrollbar{display:none}.sx-row{display:flex;gap:4px;padding:0 0 2px;width:max-content;min-width:100%}.sx{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 10px;border-radius:14px;background:#121A23;scroll-snap-align:start}.sx .rkn{font:700 13px/1 "Barlow Condensed",sans-serif;color:#A3AFBD;letter-spacing:.5px}.sx .rkn i{font-style:normal;font-size:11px}.sx b{font:400 20px/1 "Bebas Neue","Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}.sx small{font-size:12px;color:#A3AFBD;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sx.me{background:#0E2A40;box-shadow:inset 0 0 0 1.5px #00BFFF}.sx.me b{color:#00BFFF}.sx.pin-l{position:sticky;left:0;z-index:2;box-shadow:6px 0 10px -4px rgba(0,0,0,.7)}.sx.pin-r{position:sticky;right:0;z-index:2;box-shadow:-6px 0 10px -4px rgba(0,0,0,.7),inset 0 0 0 1.5px #00BFFF}.sx.pin-l .rkn{color:#F2C14E}.sx-gap{text-align:center;color:#A3AFBD;font-size:14px;margin-top:8px}.sx-gap b{font:400 22px/1 "Bebas Neue","Barlow Condensed",sans-serif;color:#F4F7FA;vertical-align:-2px}.sx.hit .rf,.sx.hit .gu-av{animation:jhit 1.6s ease-out 3}.sx.miss .rf,.sx.miss .gu-av{animation:jmiss 1.6s ease-out 3}.sx.blur b{filter:blur(6px);opacity:.8}.hero.ent.entering .sx.blur b{filter:none;opacity:1;transition:filter .7s,opacity .7s}.hero.ent.entering #enterbtn{transform:scale(.97);opacity:.6}.vsw{display:flex;gap:4px;margin-top:16px;padding:4px;border-radius:12px;background:rgba(10,15,21,.5)}.vsw button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--mute);font:800 14px/1 -apple-system,sans-serif;cursor:pointer}.vsw button.on{background:var(--card2);color:var(--tx)}.lad{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:18px -4px 0}.lad a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:14px;min-width:0}.lad a.hit .gu-av{animation:jhit 1.6s ease-out 3}.lad a.miss .gu-av{animation:jmiss 1.6s ease-out 3}@keyframes jhit{0%{box-shadow:0 0 0 2px #0A0F15,0 0 0 3px #3DD68C}60%{box-shadow:0 0 0 2px #0A0F15,0 0 0 12px rgba(61,214,140,0)}}@keyframes jmiss{0%{box-shadow:0 0 0 2px #0A0F15,0 0 0 3px #FF6B6B}60%{box-shadow:0 0 0 2px #0A0F15,0 0 0 12px rgba(255,107,107,0)}}.lad a.me{background:rgba(61,184,255,.14);box-shadow:inset 0 0 0 1px rgba(61,184,255,.4)}.lad .rkn i{font-style:normal;font-size:11px}.lad .rkn{font:800 13px/1 "Barlow Condensed",sans-serif;color:var(--mute)}.lad b{font:800 14px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}.lad a.me b{color:var(--acc)}
.strip .ln{position:absolute;left:0;right:0;top:29px;height:3px;border-radius:2px;background:linear-gradient(90deg,#FF6B6B55,#3DD68C55)}
.strip .gu-av{position:absolute;transform:translateX(-50%);transition:left .8s cubic-bezier(.2,.8,.2,1)}
.strip .gu-av.me{z-index:2}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.mu .sd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}.mu .sd b{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.tug{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:14px;background:var(--card2)}.tug i{transition:flex .8s}.tug .a{background:var(--acc)}.tug .b{background:var(--vio)}
.gm{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:10px}
.gm .g-tm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font:800 26px/1.15 "Barlow Condensed",sans-serif}
.gm .sides{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.gm .sides>div{background:var(--card2);border-radius:12px;padding:8px 10px;min-height:58px}
.gm .sides small{display:block;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mute);margin-bottom:6px}
.faces{display:flex;flex-wrap:wrap;gap:4px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .nm small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.row .rk{width:26px;text-align:center;font:800 18px/1 "Barlow Condensed",sans-serif;color:var(--mute)}
.mv{width:34px;text-align:right;font-weight:800;font-size:13px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.ev:first-child{border-top:0}.ev p{margin:0;flex:1;min-width:0;font-size:15px}.ev time{color:var(--mute);font-size:12px;font-weight:700}
@media (prefers-reduced-motion:reduce){.lad a .gu-av{animation:none!important}.strip .gu-av,.tug i{transition:none}.h-chip.live::before{animation:none}}
</style></head>
<body>
<div id="app" class="h-wrap"></div>
<script src="shared/state.js?v=f1108"></script><script src="week-games.js?v=f1108"></script><script src="honest.js?v=g621"></script><script src="shared/nav.js?v=f1114"></script><script src="shared/events.js?v=f1111"></script><script src="faces.js?v=f1"></script><script src="team-mark.js?v=m6"></script><script src="game-card.js?v=c6"></script><script src="gold-ui.js?v=g624"></script>
<script>
const E=GU.esc,F=GU.fmt;
let VIEW=(()=>{try{return localStorage.getItem('gu-home-view')||'field'}catch(e){return'field'}})();
const REF=new URLSearchParams(location.search).get('ref');
function sideFaces(list,n){return list.length?`<div class="faces">${[...new Map(list.map(o=>[o.pl.id,o.pl])).values()].slice(0,n||5).map(p=>GU.av(p,30)).join('')}</div>`:'<span style="color:var(--mute);font-size:13px">Nobody</span>'}
function gameCard(g){
  // The one game card (game-card.js), the Board's card, plus the quiet line of who in the Field is on it: faces beside the side they took, a sealed count before kickoff.
  const v=GU.gameView(g),fa=list=>[...new Map(list.map(o=>[o.pl.id,o.pl])).values()].map(p=>GU.av(p,22,1));let who=null;
  if(!GU.started(g)){if(v.sealed)who={sealed:v.sealed,sealedFaces:v.players.map(p=>GU.av(p,22,1))}}
  else if(v.on&&v.on.length){const by={away:[],home:[],over:[],under:[]};v.on.forEach(o=>{const sd=GU.sideOf(o.x);if(by[sd])by[sd].push(o)});who={away:fa(by.away),home:fa(by.home),over:fa(by.over),under:fa(by.under)}}
  return GameCard.html(g,{who,foot:`<a href="lounge.html?g=${encodeURIComponent(g.id)}" style="display:block;padding:8px 12px 10px;border-top:1px solid rgba(255,255,255,.06);color:#00BFFF;font-weight:700;font-size:14px">${v.mine?'Who is with you':'Talk about it'} in the Lounge ›</a>`});
}
function justSettled(){const o={};try{(Rush.events?Rush.events():[]).filter(e=>e.type==='settled'&&Date.now()-e.at<12e4).forEach(e=>(e.players||[]).forEach(p=>{if(p.result==='won'||p.result==='lost')o[p.id]=p.result==='won'?'hit':'miss'}))}catch(e){}return o}
// Not entered this week (founder 11:35; rulings 2026-11-04 and 2026-11-05: Stacks, ranks and the kickoff reveal are for entrants).
// One screen: the week, how many are in, one big Enter. The Field shows as faces with its figures blurred, to show what entering unlocks.
function renderEnter(){
  const f=GU.field(),wk=Rush.week(),n=f.filter(r=>!r.me).length;
  let h=`<section class="h-card hero ent"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h-chip" style="background:rgba(61,184,255,.16);color:var(--acc)">WEEK ${wk.n} CONTEST</span><span class="h-chip">Ends Monday night</span></div>
   <div style="display:flex;align-items:baseline;gap:8px;margin-top:14px"><span class="h-big" style="font-size:60px">${n}</span><span style="color:var(--mute);font-weight:700">in the Field this week</span></div>
   <div style="color:var(--mute);margin-top:4px">Free to enter. Every entrant starts with <span style="white-space:nowrap">${GU.stk(1000)} Stack</span>, top finishers take the prize.</div>
   <button class="h-btn" id="enterbtn" style="width:100%;margin-top:16px;min-height:58px;font-size:20px;border:0;cursor:pointer">Enter free</button>
   <div class="strip2" style="margin-top:18px"><div class="sx-row">${f.filter(r=>!r.me).sort((x,y)=>String(x.name).localeCompare(String(y.name))).map(r=>`<span class="sx blur">${GU.av(r,36,1)}<b aria-hidden="true">0,000</b><small>${E(r.name.split(' ')[0])}</small></span>`).join('')}</div></div>
   <div class="sx-gap">Enter to see the Stacks and where you'd stand</div></section>`;
  const gs=GU.games().filter(g=>!g.done&&g.date-Date.now()<36*36e5).sort((a,b)=>(b.state==='in')-(a.state==='in')||a.date-b.date).slice(0,2);
  if(gs.length)h+=`<div class="h-lbl">On tonight <a href="board.html">Board</a></div>`+gs.map(g=>{const k=GU.gameView(g).players.length;return GameCard.html(g,{foot:`<div style="padding:8px 12px 10px;border-top:1px solid rgba(255,255,255,.06);color:#A3AFBD;font:700 13px/1 'Barlow Condensed',sans-serif;letter-spacing:.8px">${k?k+' IN THIS GAME':'NO ONE IN THIS GAME YET'}</div>`})}).join('');
  h+=`<section class="h-card" id="invite" style="margin-top:22px"><div style="font-weight:800;font-size:18px">Bring a friend into the week</div><div style="color:var(--mute);margin-top:4px">Free, and they start at 1,000 too.</div><button class="h-btn ghost" id="inv" style="margin-top:12px;width:100%;cursor:pointer">Send an invite</button></section>`;
  document.getElementById('app').innerHTML=h;
  const b=document.getElementById('enterbtn');if(b)b.onclick=()=>{const hero=document.querySelector('.hero.ent');if(hero)hero.classList.add('entering');if(window.RushTopbar&&RushTopbar.enterNow){RushTopbar.enterNow(window._rtLast&&window._rtLast[1])}else GU.enter();setTimeout(render,900)};
  const iv=document.getElementById('inv');if(iv)iv.onclick=async()=>{const u=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?ref='+encodeURIComponent(GU.meRow().name);try{if(navigator.share){await navigator.share({title:'Rush',text:'Join this week on Rush',url:u});return}await navigator.clipboard.writeText(u);iv.textContent='Link copied'}catch(e){}};
}
function render(){if(!GU.entered()){renderEnter();return}const JUST=justSettled();
  const f=GU.field(),m=GU.meRow(),wk=Rush.week(),op=GU.opponent(),mv=GU.moves(f);
  const lo=Math.min(...f.map(r=>r.stack)),hi=Math.max(...f.map(r=>r.stack)),pos=s=>hi===lo?50:4+((s-lo)/(hi-lo))*92,d=m.stack-1000;
  let h='';
  {const rp=REF?f.find(r=>!r.me&&r.name.toLowerCase()===REF.toLowerCase()):null;if(rp){const s=GU.circle.state(rp.id);h+=`<section class="h-card" style="border-color:rgba(155,140,255,.45)"><div style="display:flex;align-items:center;gap:12px">${GU.av(rp,44)}<div style="flex:1"><b>${E(rp.name)} invited you</b><div style="color:var(--mute);font-size:14px">${s==='in'?'You are in each other\'s circle':s==='asked'?'Waiting on '+E(rp.name.split(' ')[0])+' to confirm':'Confirm to join each other\'s circle'}</div></div>${s==='none'||s==='asked-you'?`<button class="h-btn" data-ref="${E(rp.id)}" style="flex:none;border:0;cursor:pointer;min-height:42px;font-size:15px">Confirm</button>`:''}</div></section>`;}}
  // 1. The weekly contest, front and centre.
  h+=`<section class="h-card hero"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h-chip" style="background:rgba(61,184,255,.16);color:var(--acc)">WEEK ${wk.n} CONTEST</span><span class="h-chip">Ends Monday night</span></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;margin-top:10px"><div><div style="color:var(--mute);font-size:13px;font-weight:800;letter-spacing:1.2px">RANK</div><div style="display:flex;align-items:baseline;gap:6px"><span class="h-big" style="font-size:60px">#${m.rank||'-'}</span><span style="color:var(--mute);font-weight:700">of ${f.length}</span></div></div><div style="text-align:right"><div style="color:var(--mute);font-size:13px;font-weight:800;letter-spacing:1.2px">STACK</div><div class="h-big" style="font-size:44px">${GU.stk(m.stack)}</div><div class="h-num ${d>=0?'up':'dn'}" style="font-size:16px">${d>=0?'+':''}${F(d)} <small style="color:var(--mute);font:600 12px -apple-system,sans-serif">since Tue</small></div></div></div>
   <div class="vsw"><button data-v="field" class="${VIEW==='field'?'on':''}">The Field · ${f.length}</button><button data-v="circle" class="${VIEW==='circle'?'on':''}">My circle · ${GU.circle.ids().length}</button></div>
   ${VIEW==='circle'&&!GU.circle.ids().length?(()=>{const sug=GU.circle.suggest(3);return `<div style="margin-top:14px;color:var(--mute)">Your circle is empty. Add players you know, or invite a friend.</div><div style="display:flex;gap:8px;margin-top:10px">${sug.map(r=>`<a href="${GU.prof(r)}#circle" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;background:rgba(10,15,21,.5)">${GU.av(r,36,1)}<b style="font-size:13px">${E(r.name.split(' ')[0])}</b><small style="color:var(--acc);font-weight:800">Add</small></a>`).join('')}</div><a class="h-btn" href="#invite" style="margin-top:10px;background:var(--vio);color:#fff!important">Invite a friend</a>`})():(()=>{
     // The rank strip: the whole Field (or your circle) in rank order, swipe sideways. 1st is pinned at the left edge. Your tile sits in its place and is sticky on the right only:
     // while your place is off to the right it waits at the right edge and others pass by; it falls back into line when your place arrives, and scrolls away to the left after it.
     const cs=GU.circle.ids();const L=VIEW==='circle'?f.filter(r=>r.me||cs.includes(String(r.id))):f;const first=f[0],gap=first.stack-m.stack;
     const cell=(r,cls)=>`<a href="${GU.prof(r)}" class="sx ${cls||''} ${r.me?'me':''} ${JUST[r.id]||''}"><span class="rkn">${r.rank===1?'1st':'#'+r.rank}${mv[r.id]>0?'<i class="up"> ▲'+mv[r.id]+'</i>':mv[r.id]<0?'<i class="dn"> ▼'+(-mv[r.id])+'</i>':''}</span>${GU.av(r,r.me?42:36,1)}<b>${F(r.stack)}</b><small>${E(r.me?'You':r.name.split(' ')[0])}</small></a>`;
     const rest=L.filter(r=>r.id!==first.id);
     return `<div class="strip2"><div class="sx-row">${cell(first,'pin-l')}${rest.map(r=>cell(r,r.me?'pin-r':'')).join('')}</div></div><div class="sx-gap">${first.me?'<b class="up">You lead the Field</b>':`<b>${F(gap)}</b> behind 1st`}${L.length>4?' · swipe for the whole '+(VIEW==='circle'?'circle':'Field'):''}</div>${VIEW==='circle'?(()=>{const ff=GU.circle.fof().slice(0,3);return ff.length?`<div style="margin-top:12px;color:var(--mute);font-size:13px;font-weight:800;letter-spacing:1.2px">IN YOUR FRIENDS' CIRCLES</div><div style="display:flex;gap:8px;margin-top:8px">${ff.map(x=>`<a href="${GU.prof(x.p)}#circle" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;background:rgba(10,15,21,.5)">${GU.av(x.p,34,1)}<b style="font-size:13px">${E(x.p.name.split(' ')[0])}</b><small style="color:var(--mute);font-size:11px">with ${E(x.via[0].name.split(' ')[0])}</small></a>`).join('')}</div>`:''})():''}`})()}
   <div style="display:flex;gap:10px;margin-top:16px"><a class="h-btn" href="board.html">Make picks</a><a class="h-btn ghost" href="ranks.html">The contest</a></div></section>`;
  // 3. Your matchup.
  const MU=(()=>{try{return Rush.matchup?Rush.matchup():null}catch(e){return null}})();if(op&&MU&&MU.opp){m.stack=MU.me.stack;op.stack=MU.opp.stack}
  if(op){const a=Math.max(1,m.stack),b=Math.max(1,op.stack),gap=MU&&MU.opp?MU.lead:m.stack-op.stack,pairT=wk.opens+2*864e5+11.5*36e5,paired=Date.now()>=pairT;
   h+=`<div class="h-lbl">Your matchup <a href="ranks.html">Open</a></div><a class="h-card" style="display:block;padding:12px 14px" href="ranks.html"><div style="display:flex;align-items:center;gap:10px">${GU.av(m,40,1)}<span class="h-num">${F(m.stack)}</span><div style="flex:1;text-align:center"><div class="h-num ${gap>=0?'up':'dn'}" style="font-size:26px">${gap===0?'EVEN':(gap>0?'+':'-')+F(Math.abs(gap))}</div><small style="color:var(--mute);font-size:12px">${gap===0?'dead even':gap>0?'you lead':'you trail'}</small></div><span class="h-num">${F(op.stack)}</span>${GU.av(op,40,1)}</div><div class="tug" style="margin-top:10px;height:10px"><i class="a" style="flex:${a}"></i><i class="b" style="flex:${b}"></i></div><div style="display:flex;justify-content:space-between;margin-top:6px;color:var(--mute);font-size:13px"><span>You</span><span>${paired?'':'Pairs Thu 7:00 PM, in '+GU.until(pairT)}</span><span>${E(op.name)}</span></div></a>`;}
  // For you: replies aimed at you, then your own tapbacks and replies with what came back (Red's Lounge keys). The honest view shows only real ones.
  {const meName=GU.meRow().name,hon=GU.honest();let taps=[],talk=[];try{taps=Object.values(JSON.parse(localStorage.getItem('rush-lounge-tap-v1')||'{}')).filter(x=>x&&x.emoji&&String(x.emoji).indexOf('&#')!==0)}catch(e){}try{talk=JSON.parse(localStorage.getItem('rush-lounge-talk-v2')||'[]')}catch(e){}
   const pl=n=>GU.field().find(r=>r.name===n)||{id:n,name:n||'?'};
   const toOf=x=>x.to!=null?x.to:(x.quote?String(x.quote).split(':')[0]:'');
   const toMe=talk.filter(x=>!x.mine&&x.quote&&String(x.quote).indexOf(meName+':')===0&&(!hon||x.real)).sort((a,b)=>b.at-a.at).slice(0,2);
   const myReplies=talk.filter(x=>x.mine&&(x.quote||x.to||x.game)).sort((a,b)=>b.at-a.at).slice(0,2);
   const myTaps=taps.sort((a,b)=>b.at-a.at).slice(0,2);
   const back=to=>{const r=talk.find(x=>!x.mine&&x.who===to&&x.quote&&String(x.quote).indexOf(meName+':')===0&&(!hon||x.real));return r?'<span class="up">'+E(String(to).split(' ')[0])+': '+E(r.text)+'</span>':'<span style="color:var(--mute)">Waiting on '+E(String(to||'them').split(' ')[0])+'</span>'};
   const gameFace='<span class="gu-av" style="width:34px;height:34px;font-size:14px;background:#1B2531;color:#A3AFBD">◎</span>';
   const rows=toMe.map(x=>`<a class="ev" href="lounge.html">${GU.av(pl(x.who),34,1)}<p><b>${E(String(x.who).split(' ')[0])}</b> replied to you: ${E(x.text)}</p><span class="h-chip" style="background:rgba(61,184,255,.16);color:var(--acc)">REPLY</span></a>`)
     .concat(myReplies.map(x=>{const to=toOf(x);return to?`<div class="ev">${GU.av(pl(to),34)}<p>You replied to <b>${E(to.split(' ')[0])}</b>: ${E(x.text)}<br>${back(to)}</p></div>`:`<a class="ev" href="lounge.html">${gameFace}<p>You replied on <b>${E(x.game||'a game')}</b>: ${E(x.text)}</p></a>`}))
     .concat(myTaps.map(x=>x.to?`<div class="ev">${GU.av(pl(x.to),34)}<p>You sent <b>${E(String(x.to).split(' ')[0])}</b> ${E(x.emoji)}<br>${back(x.to)}</p></div>`:`<a class="ev" href="lounge.html">${gameFace}<p>You reacted ${E(x.emoji)} to <b>${E(x.about||'a game')}</b></p></a>`)).slice(0,4);
   if(!rows.length){window._fyEmpty=true}else{window._fyEmpty=false}
   if(rows.length)h+=`<div class="h-lbl">For you <a href="lounge.html">Lounge</a></div><section class="h-card">${rows.join('')}</section>`;}
  // 2. Tonight: the games that matter to you and the Field.
  const gs=GU.games().filter(g=>!g.done||Date.now()-g.date<4*36e5),mineIds=new Set(GU.mine().map(p=>String(p.gameId)));
  const scored=gs.map(g=>({g,v:(g.state==='in'?100:0)+(mineIds.has(String(g.id))?50:0)+(GU.gameView(g).players.length*5)-(g.date-Date.now())/36e5})).filter(x=>x.g.date-Date.now()<36*36e5).sort((a,b)=>b.v-a.v).slice(0,2);
  h+=`<div class="h-lbl">On tonight <a href="board.html">Board</a></div>`+(scored.length?scored.map(x=>gameCard(x.g)).join(''):'<div class="h-card" style="color:var(--mute)">No games in the next day. The Board has the week.</div>');
  if(window._fyEmpty)h+=`<a class="h-card" href="lounge.html" style="display:flex;align-items:center;gap:10px;padding:12px 14px"><span style="flex:1;color:var(--mute)">Nothing aimed at you yet. React to a pick or reply in the Lounge.</span><span style="color:var(--acc);font-weight:800">Lounge ›</span></a>`;
  // 4. The Field moving: the latest from the week's one event source, when the store has it.
  let evs=[];try{if(Rush.events)evs=(Rush.events()||[]).filter(e=>(e.players||[]).length).slice(0,3)}catch(e){}
  const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/6e4));return m<1?'now':m<60?m+'m':Math.round(m/60)+'h'};
  const first=n=>String(n||'').split(' ')[0];
  const say=e=>{const ps=e.players||[];if(e.type==='settled'&&ps.some(p=>p.result)){return ps.slice(0,3).map(p=>'<b>'+E(first(p.name))+'</b> '+(p.result==='won'?'<span class="up">hit</span>':p.result==='lost'?'<span class="dn">missed</span>':E(p.result||''))+(p.label?' '+E(p.label):'')).join(', ')+(e.game?' <span style="color:var(--mute)">· '+E(e.game)+'</span>':'')}if(e.type==='play'){const good=ps.filter(p=>p.team),bad=ps.filter(p=>!p.team);return E(e.text||'')+(good.length?' <span class="up">· good for '+good.slice(0,3).map(p=>E(first(p.name))).join(', ')+'</span>':'')+(bad.length?' <span class="dn">· bad for '+bad.slice(0,2).map(p=>E(first(p.name))).join(', ')+'</span>':'')}return E(e.text||'')};
  if(evs.length)h+=`<div class="h-lbl">The Field right now <a href="lounge.html">Lounge</a></div><section class="h-card">${evs.map(e=>{const ps=(e.players||[]).slice(0,3).map(p=>GU.player(p.id)||{id:p.id,name:p.name});return `<div class="ev"><span style="display:flex;flex:none">${ps.map((p,k)=>'<span style="margin-left:'+(k?-10:0)+'px">'+GU.av(p,32)+'</span>').join('')}</span><p>${say(e)}</p><time>${e.at?ago(e.at):''}</time></div>`}).join('')}</section>`;
  // 5. The Ranks.
  // The ladder already shows a Field of 7 or fewer; the list only adds the top of a bigger Field.
  const top=f.slice(0,5);if(!top.some(r=>r.me))top.push(m);
  if(f.length>7)h+=`<div class="h-lbl">The Field <a href="ranks.html">Ranks</a></div><section class="h-card">${top.map(r=>{const k=mv[r.id]||0;return `<div class="row"><span class="rk">${r.rank}</span>${GU.av(r,40)}<div class="nm">${GU.nameLink(r)}</div><span class="mv ${k>0?'up':k<0?'dn':''}">${k>0?'▲'+k:k<0?'▼'+(-k):''}</span><span class="h-num">${F(r.stack)}</span></div>`}).join('')}</section>`;
  h+=`<section class="h-card" id="invite" style="margin-top:22px"><div style="font-weight:800;font-size:18px">Bring a friend into the week</div><div style="color:var(--mute);margin-top:4px">Entry is free and they start with 1,000 Stack. The link names you, and you join each other's circle once you both confirm.</div><button class="h-btn" id="inv" style="margin-top:12px;width:100%;border:0;cursor:pointer">Send an invite</button></section>`;
  // Keep the rank strip where the player left it: a re-render must not snap it back to 1st.
  const sx0=document.querySelector('.strip2'),keep=sx0?sx0.scrollLeft:null;
  document.getElementById('app').innerHTML=h;
  if(keep!=null){const s2=document.querySelector('.strip2');if(s2)s2.scrollLeft=keep}
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;try{localStorage.setItem('gu-home-view',VIEW)}catch(e){}render()});
  document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{const s=GU.circle.state(b.dataset.ref);if(s==='asked-you')GU.circle.confirm(b.dataset.ref);else GU.circle.ask(b.dataset.ref);render();setTimeout(render,10500)});
  const iv=document.getElementById('inv');if(iv)iv.onclick=async()=>{const u=location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html?ref='+encodeURIComponent(GU.meRow().name);try{if(navigator.share){await navigator.share({title:'Rush',text:'Join this week on Rush',url:u});return}await navigator.clipboard.writeText(u);iv.textContent='Link copied'}catch(e){}};
  if(location.hash==='#invite'&&!window._invScrolled){window._invScrolled=1;setTimeout(()=>{const el=document.getElementById('invite');if(el)el.scrollIntoView({block:'center'})},300)}
}
render();
if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});
window.addEventListener('rush:entered',()=>{const hero=document.querySelector('.hero.ent');if(hero)hero.classList.add('entering');setTimeout(render,900)});
// Price cells on Home's game cards add to the one Slip, exactly as on the Board.
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.rgc .rb-c[data-k]');if(!c)return;e.preventDefault();if(c.disabled||!window.Rush||!Rush.slip)return;const P=GameCard.REG.get(c.dataset.k);if(!P||P.start<=Date.now())return;Rush.slip.toggle(P);c.classList.toggle('rgc-sel',!!(Rush.slip.has&&Rush.slip.has(P.key)))});
if(window.Rush&&Rush.slip&&Rush.slip.on)Rush.slip.on(()=>document.querySelectorAll('.rgc .rb-c[data-k]').forEach(c=>c.classList.toggle('rgc-sel',!!Rush.slip.has(c.dataset.k))));
if(window.Rush&&Rush.on)try{Rush.on(render)}catch(e){}
setInterval(render,30000);
</script></body></html>
