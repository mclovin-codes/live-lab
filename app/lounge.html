<style>
/* Lounge (Red): the one place for the whole Field. Styles are page-local; the shell (top bar, tabs) is Blue's. */
:root{--lg-bg:#0B1118;--lg-card:#121A23;--lg-card2:#1A2530;--lg-line:rgba(255,255,255,.08);--lg-fg:#fff;--lg-mut:#A3AFBD;--lg-acc:#00BFFF;--lg-win:#22C55E;--lg-loss:#F05252;--lg-warn:#F5A524;--lg-riv:#E879F9;--lg-f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}

.lg-top{display:flex;align-items:baseline;justify-content:space-between}.lg-top h1{margin:2px 0 8px;font:900 32px/1.05 var(--lg-f)}.lg-top span{color:var(--lg-mut);font:700 13px var(--lg-f)}

.lg-game{background:linear-gradient(160deg,#16283A,#121A23 60%);border-radius:22px;padding:16px;border:1px solid rgba(0,191,255,.25)}.lg-game,.lg-sides,.lg-who,.lg-ev>div,.lg-flip span{display:block}.lg-ev{display:flex!important}.lg-flip{display:flex!important}.lg-game.lg-on{border-color:rgba(240,82,82,.55);background:linear-gradient(160deg,#2A1820,#121A23 55%)}

.lg-ev.lg-play{background:rgba(240,82,82,.08)}.lg-bolt{color:var(--lg-loss);font-size:18px;line-height:1}
.lg-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.lg-acts button{padding:9px 14px;border-radius:999px;background:var(--lg-card2);font:800 14px var(--lg-f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.lg-acts button:active{transform:scale(.95)}

.lg-empty{color:var(--lg-mut);font-size:14px;padding:10px 4px}
.lg-foot{margin-top:24px;padding:14px;border-radius:16px;background:var(--lg-card);display:flex;justify-content:space-between;align-items:center;gap:10px}.lg-foot b{display:block;font-size:14px}.lg-foot small{color:var(--lg-mut);font-size:13px}
.lg-sw{position:relative;width:52px;height:32px;border-radius:16px;background:#2A3644;flex:none}.lg-sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}.lg-sw.on{background:var(--lg-win)}.lg-sw.on i{left:23px}

.lg-mu .lg-av{flex:none}
.lg-chips em{font-style:normal;margin-left:6px;padding:1px 6px;border-radius:8px;background:#2A3644;color:#fff;font:800 12px var(--lg-f)}
.lg-minis{display:flex;flex-direction:column;gap:6px;flex:none}
.lg-more{padding:8px 6px;color:var(--lg-mut);font:700 13px var(--lg-f);border-top:1px solid var(--lg-line)}
.lg-flip .lg-av{display:inline-flex!important;flex:none}.lg-flip .lg-minis{display:flex!important;flex-direction:column;gap:6px;flex:none}.lg-flip>span:not(.lg-minis):not(.lg-av){display:block}

</style>
