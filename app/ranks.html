<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1118">
<title>Rush Ranks</title>
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Ranks: large title, This week / Season segmented control, matchup card, the Field list with your row pinned and the top-3 prize line. */
:root{--rb-bg:#0A0F15;--rb-card:#141C26;--rb-card2:#1B2531;--rb-line:rgba(255,255,255,.07);--rb-fg:#F4F7FA;--rb-mut:#A3AFBD;--rb-dim:#66768A;--rb-acc:#3DB8FF;--rb-win:#3DD68C;--rb-loss:#FF6B6B;--rb-warn:#F59E0B;--rb-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,Roboto,system-ui,sans-serif;color-scheme:dark}
html,body{margin:0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{background:var(--rb-bg);color:var(--rb-fg);font:15px/1.38 var(--rb-font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.rk-wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.rk-top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0;font:800 32px/1.1 var(--rb-font);letter-spacing:-.02em}.rk-top small{display:block;color:var(--rb-mut);font-size:13px;margin:0 0 10px}
.rk-seg{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:10px;background:var(--rb-card2);margin-bottom:14px;box-shadow:0 6px 16px rgba(11,17,24,.8)}
.rk-seg button{font:600 13px var(--rb-font);color:var(--rb-mut);background:none;border:0;padding:8px 0;border-radius:8px;cursor:pointer}.rk-seg button.on{background:#2A3644;color:var(--rb-fg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rk-card{background:var(--rb-card);border-radius:14px;padding:14px;margin-bottom:16px}
.rk-card h2{margin:0 0 8px;font:700 17px/1.2 var(--rb-font);display:flex;justify-content:space-between;align-items:baseline;gap:8px}.rk-card h2 span{font:500 13px var(--rb-font);color:var(--rb-mut)}
.rk-mu{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.rk-mu>div{min-width:0}.rk-mu b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk-mu strong{display:block;font:800 28px/1.05 var(--rb-font);letter-spacing:-.02em}.rk-mu i{font-style:normal;font-size:12px;color:var(--rb-mut)}.rk-mu em{font:600 12px var(--rb-font);font-style:normal;color:var(--rb-acc);text-align:center}.rk-mu .r{text-align:right}
.rk-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rk-stats div{background:var(--rb-card2);border-radius:11px;padding:10px}.rk-stats b{display:block;font:700 19px var(--rb-font)}.rk-stats i{font-style:normal;font-size:12px;color:var(--rb-mut)}
.rk-list{background:var(--rb-card);border-radius:14px;overflow:hidden;margin-bottom:16px}
a.rk-row{text-decoration:none;color:inherit}a.rk-row:active{background:var(--rb-card2)}.rk-row{display:grid;grid-template-columns:26px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:.5px solid var(--rb-line)}
.rk-row:first-child{border-top:0}.rk-row.cut{border-bottom:2px solid var(--rb-acc)}
.rk-row.me{background:rgba(0,191,255,.12)}
.rk-pos{font:600 14px var(--rb-font);color:var(--rb-mut);text-align:center}
.rk-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--rb-font);color:#fff}
.rk-nm{min-width:0}.rk-nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk-nm i{font-style:normal;font-size:12px;color:var(--rb-mut)}
.rk-u{font:700 16px var(--rb-font);text-align:right}.rk-u.up{color:var(--rb-win)}.rk-u.dn{color:var(--rb-loss)}.rk-u small{display:block;font:500 11.5px var(--rb-font);color:var(--rb-mut)}
.rk-tag{font:600 10px var(--rb-font);letter-spacing:.04em;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--rb-mut);margin-left:6px;vertical-align:1px}.rk-tag.you{background:var(--rb-acc);color:#002233}
.rk-cutl{font:600 11.5px var(--rb-font);color:var(--rb-acc);padding:6px 14px;background:rgba(0,191,255,.08)}
.rk-hist{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}.rk-hist i{width:7px;height:7px;border-radius:2px;background:var(--rb-dim)}.rk-hist i.w{background:var(--rb-win)}.rk-hist i.l{background:var(--rb-loss)}
/* Two equal panels, The contest and Your matchup. Tap one to open it; the other shrinks to a slim bar that brings it back. */
.cx-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.cx-p{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:196px;padding:14px;border-radius:16px;background:var(--rb-card);border:1px solid var(--rb-line);color:inherit;text-align:left;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cx-p:active{transform:scale(.985)}.cx-p.mu{border-color:rgba(255,92,168,.35)}.cx-p.ct{border-color:rgba(61,184,255,.35)}
.cx-k{font:700 11px/1 var(--rb-font);letter-spacing:.12em;text-transform:uppercase;color:var(--rb-mut)}
.cx-fig{font:800 48px/1 var(--rb-font);letter-spacing:-.03em}.cx-fig small{font:700 17px var(--rb-font);color:var(--rb-mut);letter-spacing:0;margin-left:4px}
.cx-sub{font:600 14px/1.3 var(--rb-font);color:var(--rb-mut)}.cx-sub b{color:var(--rb-fg)}
.cx-shape{margin-top:auto}
.cx-track{position:relative;height:28px}.cx-track:before{content:"";position:absolute;left:0;right:0;top:13px;height:2px;border-radius:2px;background:var(--rb-card2)}
.cx-track i{position:absolute;top:8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#46566A;box-shadow:0 0 0 2px var(--rb-card)}.cx-track i.me{top:4px;width:20px;height:20px;margin-left:-10px;background:var(--rb-acc)}.cx-track i.op{background:#FF5CA8}
.cx-ends{display:flex;justify-content:space-between;font:600 11px var(--rb-font);color:var(--rb-dim)}
.cx-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--rb-card2);gap:2px}.cx-bar b{display:block;background:var(--rb-acc)}.cx-bar u{display:block;flex:1;background:#FF5CA8}
.cx-vs{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font:700 13px var(--rb-font)}.cx-vs span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cx-vs span:last-child{text-align:right;color:#FF8CC2}
.cx-big .cx-p{width:100%;min-height:0;cursor:pointer}.cx-big .cx-fig{font-size:64px}
.cx-slim{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;margin-bottom:10px;padding:8px 14px;border-radius:14px;background:var(--rb-card);border:1px solid var(--rb-line);color:inherit;font:inherit;text-align:left;cursor:pointer}
.cx-slim .cx-k{flex:none}.cx-slim b{font:800 20px var(--rb-font)}.cx-slim span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--rb-mut);font:600 13px var(--rb-font)}.cx-slim em{font-style:normal;color:var(--rb-acc);font:700 13px var(--rb-font)}
.cx-sec{margin:18px 0 8px;font:700 11px var(--rb-font);letter-spacing:.12em;text-transform:uppercase;color:var(--rb-mut);display:flex;justify-content:space-between}
.cx-rec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.cx-rec div{background:var(--rb-card);border-radius:14px;padding:12px}.cx-rec b{display:block;font:800 28px var(--rb-font)}.cx-rec i{font-style:normal;font-size:13px;color:var(--rb-mut)}
.cx-slips{display:flex;flex-direction:column;gap:10px}.cx-none{color:var(--rb-mut);font-size:14px;padding:10px 2px}
.cx-sl{background:var(--rb-card);border-radius:14px;padding:12px}.cx-sl b{display:block}.cx-sl i{font-style:normal;color:var(--rb-mut);font-size:13px}
.rk-face{flex:none;display:grid;place-items:center}
/* A visitor who has not entered: the week, the Field size and the faces show; rank, Stack and the matchup sit blurred in place behind one Enter door. Blurred figures are placeholders, never the real numbers. */
.cx-enter{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;margin:0 0 12px;padding:14px 16px;border:0;border-radius:16px;background:linear-gradient(135deg,#3DB8FF,#0080FF);color:#04121C;font:800 20px/1.2 var(--rb-font);text-align:left;cursor:pointer}.cx-enter small{font:600 14px var(--rb-font);color:#06233A}
.bl{filter:blur(7px);opacity:.7;user-select:none;pointer-events:none}
.cx-faces{display:flex;margin-top:auto}.cx-faces>*{margin-left:-6px;box-shadow:0 0 0 2px var(--rb-card);border-radius:50%}.cx-faces>*:first-child{margin-left:0}
.cx-lift .bl{animation:cxl .7s ease-out forwards}@keyframes cxl{to{filter:blur(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.cx-lift .bl{animation:none;filter:none;opacity:1}}
.rk-cs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}.rk-cs::-webkit-scrollbar{display:none}
.rk-cs button,.rk-cs a{flex:none;display:inline-flex;align-items:center;gap:7px;font:600 13px var(--rb-font);color:var(--rb-mut);background:var(--rb-card);border:1px solid var(--rb-line);border-radius:99px;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.rk-cs button.on{color:var(--rb-fg);background:#22303D;border-color:rgba(255,255,255,.22)}.rk-cs small{font:600 11.5px var(--rb-font);color:var(--rb-mut)}.rk-cs a{background:none;border-style:dashed}
.rk-dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;margin-right:7px;vertical-align:1px}.rk-cs .rk-dot{margin:0}
.rk-open{display:block;margin-top:10px;color:var(--rb-acc);font:600 13px var(--rb-font);text-decoration:none}
.rk-note{color:var(--rb-mut);font-size:13px;padding:0 2px 16px}
.rk-skel{height:64px;border-radius:14px;background:linear-gradient(90deg,var(--rb-card),var(--rb-card2),var(--rb-card));background-size:200% 100%;animation:rks 1.2s infinite;margin-bottom:10px}@keyframes rks{to{background-position:-200% 0}}
#rb-tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,26,35,.9);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(255,255,255,.1);padding-bottom:env(safe-area-inset-bottom,0px)}
#rb-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font:500 10.5px var(--rb-font);color:var(--rb-dim);text-decoration:none}#rb-tabs a svg{width:24px;height:24px}#rb-tabs a.on{color:var(--rb-acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#rk-main{display:flex;flex-direction:column}
.rk-pl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid rgba(255,255,255,.07);color:inherit;text-decoration:none}.rk-pl:first-of-type{border-top:0}.rk-pf{display:flex}.rk-pf>*{margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px #121A23}.rk-pf>*:first-child{margin-left:0}.rk-pt{min-width:0;font-size:14px;line-height:19px}.rk-pt b{font-weight:800}.rk-pl small{color:#8C9BAD;font-size:12px;font-weight:700}
.rk-card i{font-size:13px;color:#A3AFBD}.rk-pl small{font-size:13px;color:#A3AFBD}
</style>
</head>
<body data-tab="ranks">
<div class="rk-wrap">
 <div class="rk-top"><h1>Contest</h1><small id="rk-week">This week</small></div>
 <div class="rk-cs" id="rk-cs" role="tablist" aria-label="Contest"></div>
 <div class="rk-seg" role="tablist" id="rk-seg"></div>
 <div id="rk-main"><div class="rk-skel"></div><div class="rk-skel"></div><div class="rk-skel"></div></div>
</div>
<nav id="rb-tabs" hidden></nav>
<script src="shared/state.js?v=f1106"></script>
<script src="week-games.js?v=f1109"></script>
<script src="faces.js?v=f1"></script>
<script src="shared/nav.js?v=f1113"></script>
<script src="shared/events.js?v=f1107"></script>
<script src="slip-card.js?v=s9"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=n=>Math.round(1000+(+n||0)*10).toLocaleString('en-US');
let tab='week';try{tab=localStorage.getItem('rk.tab')||'week'}catch(e){}
let games=RW.cached()||[];
const face=(r,n)=>{try{if(window.RushFace&&RushFace.html)return'<span class="rk-face">'+RushFace.html({id:r.id,name:r.name,me:!!r.me},n||32,true)+'</span>'}catch(e){}return av(r)};
const av=r=>`<span class="rk-av" style="background:${r.me?'#0080FF':`hsl(${Math.floor(RW.hash(r.id+'c')*360)} 50% 36%)`}">${esc(r.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</span>`;
function seg(){$('rk-seg').innerHTML=[['week','This week'],['season','Season']].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('')}
function wkRow(r,cut){return`<a href="player.html?u=${encodeURIComponent(r.id)}" class="rk-row${r.me?' me':''}${cut?' cut':''}"><span class="rk-pos">${r.out?'-':r.rank}</span>${face(r)}<span class="rk-nm"><b>${esc(r.name)}${r.me?'<span class="rk-tag you">YOU</span>':''}</b><i>${r.out?'Not entered':(r.w||r.l)?`${r.w}-${r.l}`:''}${r.open?`${(r.w||r.l)?' &middot; ':''}${r.open} open`:(r.w||r.l||r.out)?'':'No Slips yet'}</i></span><span class="rk-u ${r.units>0?'up':r.units<0?'dn':''}">${U(r.units)}<small>Stack</small></span></a>`}
const R=window.Rush&&typeof Rush.field==='function'?Rush:null;
function fieldRows(){if(!R)return RW.field(games);const m=R.me();let mw=0,ml=0;try{const ps=R.picks({week:R.week().id});mw=ps.filter(p=>p.status==='won').length;ml=ps.filter(p=>p.status==='lost').length}catch(e){}const rows=R.field().map(r=>({...r,w:r.me?mw:(r.w||0),l:r.me?ml:(r.l||0),open:r.me?m.open:(r.open||0),today:0}));if(!m.entered){for(let i=rows.length-1;i>=0;i--)if(rows[i].me)rows.splice(i,1)}if(!rows.some(r=>r.me))rows.push({id:'me',name:m.handle||'You',me:true,units:0,w:0,l:0,open:0,today:0,out:true});rows.sort((a,b)=>(a.out?1:0)-(b.out?1:0)||(a.rank||99)-(b.rank||99));return rows}
let CIRC=(()=>{try{return localStorage.getItem('rk.circle')==='1'}catch(e){return false}})();
function circleBar(){const n=R&&R.circle?R.circle().length:0;return`<div class="rk-seg" role="tablist" style="margin:0 0 10px"><button type="button" data-circ="0" class="${CIRC?'':'on'}">The Field</button><button type="button" data-circ="1" class="${CIRC?'on':''}">My circle${n?' · '+n:''}</button></div>`}
function circleEmpty(){const sg=R&&R.circleSuggest?R.circleSuggest(3):[];const AVf=n=>R.nav&&R.nav.avatar?R.nav.avatar(n,1):'';return`<div class="rk-card"><h2>Your circle starts with you</h2><div class="rk-note" style="padding:0 0 10px">Add friends and the Ranks show just you and them. Ranks stay Field ranks.</div><a class="rk-open" href="index.html#invite">Invite a friend</a>${sg.length?`<div class="rk-note" style="padding:12px 0 6px">In your friends' circles</div>`+sg.map(x=>`<a href="player.html?u=${encodeURIComponent(x.id)}#circle" style="display:flex;align-items:center;gap:10px;padding:8px 0;color:inherit;text-decoration:none">${AVf(x.name)}<b style="flex:1">${esc(x.name)}</b><span style="color:var(--rb-acc);font-weight:800">Add</span></a>`).join(''):''}</div>`}
let EXP=(()=>{try{return localStorage.getItem('rk.exp')||''}catch(e){return''}})();
const fmtS=n=>Math.round(n).toLocaleString('en-US');
function slipsOf(id){try{return(RW.playerPicks(id,games)||[]).slice().sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||(b.at||0)-(a.at||0))}catch(e){return[]}}
function slipCard(p,mine){if(!mine&&R&&R.sealView){try{p=R.sealView(p)}catch(e){}}if(window.SlipCard&&SlipCard.html){try{return SlipCard.html(p,{sealed:!mine})}catch(e){}}const legs=p.legs&&p.legs.length?p.legs:[p];return`<div class="cx-sl"><b>${legs.length>1?legs.length+'-leg parlay':esc(mine?p.label:(legs[0].game||'Sealed'))}</b><i>${esc(p.status||'open')}</i></div>`}
function rec(ps){return{w:ps.filter(p=>p.status==='won').length,l:ps.filter(p=>p.status==='lost').length,o:ps.filter(p=>p.status!=='won'&&p.status!=='lost').length}}
function vVisitor(rows){const live=rows.filter(r=>!r.out),N=live.length,n=RW.week().n;const faces=live.slice(0,7).map(r=>face(r,26)).join('');
 let h=`<button type="button" class="cx-enter" data-enter>Enter the week<small>Free. You get 1,000 Stack.</small></button><div class="cx-two"><div class="cx-p ct" style="cursor:default"><span class="cx-k">The contest</span><span class="cx-fig">${N}<small>in</small></span><span class="cx-sub">Week ${n}</span><span class="cx-sub bl" aria-hidden="true">#0 of ${N} &middot; 000 behind 1st</span><div class="cx-faces">${faces}</div></div><div class="cx-p mu" style="cursor:default"><span class="cx-k">Your matchup</span><span class="cx-fig bl" aria-hidden="true">+00</span><span class="cx-sub">Pairs Thursday 7:00 PM</span><div class="cx-shape bl" aria-hidden="true"><div class="cx-bar"><b style="width:50%"></b><u></u></div><div class="cx-vs"><span>You 1,000</span><span>1,000</span></div></div></div></div>`;
 h+=`<div class="cx-sec"><span>The Field</span><span>${N} in</span></div><div class="rk-list">${live.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(r=>`<a href="player.html?u=${encodeURIComponent(r.id)}" class="rk-row"><span class="rk-pos bl" aria-hidden="true">0</span>${face(r)}<span class="rk-nm"><b>${esc(r.name)}</b><i>In the week</i></span><span class="rk-u bl" aria-hidden="true">1,000<small>Stack</small></span></a>`).join('')}</div>`;return h}
function vWeek(){const rows=fieldRows(),mine=rows.find(r=>r.me);if(R&&R.entered&&!R.entered())return vVisitor(rows);let mu=null;try{mu=R&&R.matchup&&R.me().entered?R.matchup():null}catch(e){}
 const oppId=mu&&mu.opp?mu.opp.id:null,opp=oppId!=null?rows.find(r=>String(r.id)===String(oppId))||null:null;
 let h=(R&&!R.me().entered)?`<div class="rk-card"><h2>Join the Field</h2><div class="rk-note" style="padding:0">Enter Week ${RW.week().n} on Home to get 1,000 Stack and a place on this list.</div><a href="index.html" style="display:block;margin-top:10px;text-align:center;padding:13px;border-radius:12px;background:linear-gradient(135deg,#00C0FF,#0080FF);color:#fff;font-weight:700;text-decoration:none">Enter the week</a></div>`:'';
 const st=r=>1000+Math.round((+r.units||0)*10),N=rows.filter(r=>!r.out).length,first=rows[0],my=st(mine),gap1=first&&!first.me?st(first)-my:0;
 const second=rows.find(r=>!r.me&&!r.out),lead1=mine.rank===1&&second?my-st(second):0;
 const lo=Math.min(...rows.map(st)),hi=Math.max(...rows.map(st)),pos=v=>hi>lo?6+(v-lo)/(hi-lo)*88:50;
 const ctSub=mine.out?'Enter to take a place':mine.rank===1?(lead1>0?`<b>${fmtS(lead1)}</b> clear of 2nd`:'Level at the top'):`<b>${fmtS(gap1)}</b> behind 1st`;
 const ctShape=`<div class="cx-shape"><div class="cx-track" aria-hidden="true">${(()=>{const seen={};return rows.filter(r=>!r.out).map(r=>{const v=st(r),k=seen[v]=(seen[v]||0)+1;return{r,v,k,n:rows.filter(x=>!x.out&&st(x)===v).length}})})().map(({r,v,k,n})=>`<i class="${r.me?'me':opp&&String(r.id)===String(opp.id)?'op':''}" style="left:calc(${pos(v).toFixed(1)}% + ${((k-1)-(n-1)/2)*11}px)"></i>`).join('')}</div><div class="cx-ends"><span>${fmtS(lo)}</span><span>${fmtS(hi)}</span></div></div>`;
 const ct=big=>`<button type="button" class="cx-p ct" data-x="contest" aria-expanded="${EXP==='contest'}"><span class="cx-k">The contest</span><span class="cx-fig">${mine.out?'-':'#'+mine.rank}<small>of ${N}</small></span><span class="cx-sub">${ctSub}</span>${ctShape}</button>`;
 const lead=mu&&mu.opp?mu.lead:0,their=mu&&mu.opp?mu.opp.stack:0,myS=mu?mu.me.stack:my,share=their+myS>0?Math.max(4,Math.min(96,myS/(myS+their)*100)):50;
 const oName=opp?opp.name:(mu&&mu.opp?mu.opp.name:'');

 const slim=k=>k==='contest'?`<button type="button" class="cx-slim" data-x="contest"><span class="cx-k">Contest</span><b>${mine.out?'-':'#'+mine.rank}</b><span>of ${N} &middot; ${ctSub.replace(/<[^>]+>/g,'')}</span><em>Open</em></button>`:`<button type="button" class="cx-slim" data-x="matchup"><span class="cx-k">Matchup</span><b style="color:${lead>0?'var(--rb-win)':lead<0?'var(--rb-loss)':'inherit'}">${lead===0?'Level':(lead>0?'+':'\u2212')+fmtS(Math.abs(lead))}</b><span>vs ${esc(oName)}</span><em>Open</em></button>`;

 // matchup open: both Stacks, both sets of Slips (theirs sealed per leg), the record

function vSeason(){const n=RW.week().n;let rows;if(R){const se=R.season(),cur=fieldRows();rows=(se.table||[]).map((t,i)=>{const c=cur.find(x=>x.name===t.name)||{};return{id:t.me?'me':'s'+i,name:t.name,me:!!t.me,sim:!!t.sim,sw:t.w||0,sl:t.l||0,units:c.units||0,hist:t.me?(se.weeks||[]).map(w=>w.result):[]}}).sort((a,b)=>b.sw-a.sw||a.sl-b.sl||b.units-a.units);if(R.honest&&R.honest()){const by={};rows.forEach(r=>{by[r.me?'me':r.name]=r});rows=cur.filter(c=>!c.out).map(c=>{const t=by[c.me?'me':c.name];return{id:c.id,name:c.name,me:!!c.me,sw:t?t.sw:0,sl:t?t.sl:0,units:c.units||0,hist:t?t.hist:[]}}).sort((a,b)=>b.sw-a.sw||a.sl-b.sl||b.units-a.units)}}else rows=RW.season(RW.field(games));
