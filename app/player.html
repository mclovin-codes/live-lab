<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Player · Rush</title><meta name="theme-color" content="#0A0F15">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap">
<link rel="stylesheet" href="shared/rush.css">
<style>
/* Profile (owner: Gold): yours (Me, with your Slips) and every other player's. Same face, same Stack figure as everywhere else. */
:root{--bg:#0A0F15;--card:#141C26;--card2:#1B2531;--line:rgba(255,255,255,.09);--tx:#F4F7FA;--mute:#A3AFBD;--acc:#3DB8FF;--gold:#F2C14E;--grn:#3DD68C;--red:#FF6B6B;--vio:#9B8CFF}
body{background:var(--bg);color:var(--tx)}
.p-wrap{max-width:560px;margin:0 auto;padding:0 16px 8px;font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
.p-wrap a{color:inherit;text-decoration:none}
.p-back{display:inline-block;margin-top:12px;color:var(--acc)!important;font-weight:700}
.p-hero{text-align:center;padding:24px 16px 20px;border-radius:24px;margin-top:12px;border:1px solid var(--line)}
.p-hero h1{margin:12px 0 2px;font:800 32px/1.1 "Barlow Condensed",sans-serif}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.p-stats>div{background:rgba(10,15,21,.55);border-radius:14px;padding:12px 6px}
.p-stats small{display:block;color:var(--mute);font-size:12px;font-weight:800;letter-spacing:1px;margin-top:4px}
.p-num{font:800 24px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.up{color:var(--grn)}.dn{color:var(--red)}
.p-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.vb{filter:blur(7px);user-select:none;pointer-events:none}
.p-lbl{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute);margin:22px 4px 0;display:flex;justify-content:space-between;align-items:center}
.p-lbl a{color:var(--acc)!important;letter-spacing:.3px;text-transform:none;font-size:14px;font-weight:700}
.p-btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:14px;border:0;background:var(--acc);color:#04121C!important;font:800 16px/1 -apple-system,sans-serif;flex:1;cursor:pointer}
.p-btn.ghost{background:var(--card2);color:var(--tx)!important;border:1px solid var(--line)}
.tug{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--card2)}.tug .a{background:var(--acc)}.tug .b{background:var(--vio)}
.seg{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:14px;margin-top:12px}.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;color:var(--mute);font:800 15px/1 -apple-system,sans-serif;cursor:pointer}.seg button.on{background:var(--card2);color:var(--tx)}
.slip{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card2);margin-top:8px}
.slip .l{flex:1;min-width:0}.slip .l b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slip .l small{color:var(--mute);font-size:13px}
.slip .r{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.slip .r small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.seal{background:repeating-linear-gradient(135deg,#1B2531 0 10px,#18212C 10px 20px)}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.4px}
.tag.with{background:rgba(61,214,140,.16);color:var(--grn)}.tag.vs{background:rgba(255,107,107,.15);color:var(--red)}.tag.live{background:rgba(255,107,107,.16);color:var(--red)}
.wks{display:flex;gap:6px;flex-wrap:wrap}.wks span{min-width:36px;height:36px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--card2);color:var(--mute)}.wks .w{background:rgba(61,214,140,.18);color:var(--grn)}.wks .l{background:rgba(255,107,107,.14);color:var(--red)}
.empty{color:var(--mute);text-align:center;padding:16px 8px;font-size:15px}
.p-hero{position:relative}.p-edit{position:absolute;top:12px;right:12px;min-height:34px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(11,17,24,.55);color:#fff;font:800 14px -apple-system,sans-serif;cursor:pointer}.ed-s{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6)}.ed{position:fixed;left:0;right:0;bottom:0;z-index:91;max-height:88vh;max-height:88dvh;overscroll-behavior:contain;overflow-y:auto;background:#121A23;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;color:#F4F7FA}.ed h3{margin:6px 0 12px;font:400 26px/1 'Bebas Neue','Barlow Condensed',sans-serif;letter-spacing:1px}.ed .sec{font:800 12px/1 -apple-system,sans-serif;letter-spacing:1.2px;color:#A3AFBD;margin:16px 0 8px}.ed .avg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.ed .avg button,.ed .bng button{border:0;background:none;padding:4px;border-radius:14px;cursor:pointer}.ed .avg button.on,.ed .bng button.on{box-shadow:inset 0 0 0 2px #00BFFF;background:#1A2530}.ed .bng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ed .bng span{display:block;height:44px;border-radius:10px}.ed input{width:100%;min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#1A2530;color:#F4F7FA;padding:0 14px;font:16px -apple-system,sans-serif;box-sizing:border-box}
.lnk{background:none;border:0;color:var(--mute);font:700 14px -apple-system,sans-serif;cursor:pointer;padding:6px}
</style></head>
<body data-tab="me"><script>(function(){var u=new URLSearchParams(location.search).get("u");if(u&&u!=="me")document.body.dataset.tab="contest"})()</script>
<div id="app" class="p-wrap"></div>
<script src="shared/state.js?v=f1108"></script><script src="week-games.js?v=f1110"></script><script src="honest.js?v=g621"></script><script src="shared/nav.js?v=f1114"></script><script src="shared/events.js?v=f1111"></script><script src="faces.js?v=f1"></script><script src="team-mark.js?v=m6"></script><script src="gold-ui.js?v=g624"></script><script src="slip-card.js?v=s12"></script>
<script>
const E=GU.esc,F=GU.fmt,Q=new URLSearchParams(location.search),UID=Q.get('u')&&Q.get('u')!=='me'?Q.get('u'):null;
let tab=location.hash==='#settled'?'done':'open';
const BK='rush-block';
const CK='rush-circle',circ=()=>{try{return JSON.parse(localStorage.getItem(CK)||'[]')}catch(e){return[]}};
const blocked=()=>{try{return JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){return[]}};
function myLine(p){const g=p.g,live=g&&g.state==='in',st=p.status;
  const r=st==='open'?`<span>${F(p.stake)}</span><small>returns ${F(p.stake+(p.win||0))}</small>`:st==='won'?`<span class="up">+${F((p.pay||0)-p.stake)}</span><small>hit</small>`:st==='lost'?`<span class="dn">-${F(p.stake)}</span><small>missed</small>`:`<span>${F(p.pay||p.stake)}</span><small>${E(st)}</small>`;
  const sub=g?`${E(g.away.abbr)} at ${E(g.home.abbr)} · ${live?`<span class="tag live">${E(g.away.score||0)}-${E(g.home.score||0)} ${E(g.detail||'LIVE')}</span>`:g.done?'final':GU.started(g)?'kicked off':'kicks off in '+GU.until(g.date)}`:E(String(p.league||'').toUpperCase());
  return `<a class="slip" href="${g?'game.html?id='+encodeURIComponent(g.id)+'&league='+encodeURIComponent(g.league||''):'board.html'}"><div class="l"><b>${E(p.label||p.sel||'Pick')}</b><small>${sub}</small></div><div class="r">${r}</div></a>`;}
function openEdit(){
  if(!window.RushFace)return;const pr=RushFace.profile();let av=pr.avatar||RushFace.meta({id:'me',me:true}).key,bn=pr.banner||'night';
  const s=document.createElement('div');s.className='ed-s';const b=document.createElement('div');b.className='ed';
  // While the sheet is open the page behind it does not scroll; closing by Done, Save or the backdrop restores it.
  const y=window.scrollY;document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';
  const close=()=>{s.remove();b.remove();document.documentElement.style.overflow='';document.body.style.overflow='';window.scrollTo(0,y)};
  const draw=()=>{b.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between"><h3>Edit profile</h3><button id="edx" style="min-height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:none;color:#F4F7FA;font:800 14px -apple-system,sans-serif;cursor:pointer">Done</button></div><div class="sec">AVATAR</div><div class="avg">'+RushFace.AVATARS.map(a=>'<button data-a="'+a.key+'" class="'+(a.key===av?'on':'')+'" aria-label="'+a.key+'"><span class="rf" style="width:40px;height:40px;background:'+a.color+'22;border-color:'+a.color+'66"><ion-icon name="'+a.icon+'" style="font-size:22px;color:'+a.color+'"></ion-icon></span></button>').join('')+'</div><div class="sec">BANNER</div><div class="bng">'+RushFace.BANNERS.map(x=>'<button data-b="'+x.key+'" class="'+(x.key===bn?'on':'')+'" aria-label="'+x.key+'"><span style="background:'+x.css+'"></span></button>').join('')+'</div><div class="sec">DISPLAY NAME</div><input id="ednm" maxlength="18" enterkeyhint="done" value="'+E(GU.meRow().name)+'" autocomplete="off"><button class="p-btn" id="edsave" style="width:100%;margin-top:16px">Save</button>';
    b.querySelector('#edx').onclick=close;
    const nmi=b.querySelector('#ednm');nmi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();b.querySelector('#edsave').click()}});nmi.addEventListener('focus',()=>setTimeout(()=>nmi.scrollIntoView({block:'center'}),250));
    b.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{av=x.dataset.a;const v=b.querySelector('#ednm').value;draw();b.querySelector('#ednm').value=v});
    b.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{bn=x.dataset.b;const v=b.querySelector('#ednm').value;draw();b.querySelector('#ednm').value=v});
    b.querySelector('#edsave').onclick=()=>{const nm=Array.from(b.querySelector('#ednm').value.trim().replace(/[<>"`]/g,'')).slice(0,18).join('');RushFace.saveProfile({avatar:av,banner:bn});try{if(nm&&Rush.setHandle)Rush.setHandle(nm)}catch(e){}close();try{if(Rush.nav&&Rush.nav.refresh)Rush.nav.refresh()}catch(e){}render()};};
  s.onclick=close;draw();document.body.append(s,b);
}
function render(){
  const f=GU.field(),m=GU.meRow(),who=UID?GU.player(UID):m,isMe=!UID||(who&&who.me);
  let h='';
  if(!who){document.getElementById('app').innerHTML=`<a class="p-back" href="javascript:history.back()">‹ Back</a><div class="p-card empty">This player is not in the Field in this view.</div>`;return}
  const wk=Rush.week(),d=who.stack-1000,hu=GU.hue(who.name);
  let rec={w:0,l:0};try{const t=Rush.season().table.find(r=>isMe?r.me:r.name===who.name);if(t)rec={w:t.w,l:t.l}}catch(e){}
  if(!isMe)h+=`<a class="p-back" href="javascript:history.back()">‹ Back</a>`;
  const BN=window.RushFace?(isMe?RushFace.banner():RushFace.BANNERS[[...String(who.id)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0)%RushFace.BANNERS.length].css):'var(--card)';
  h+=`<section class="p-hero" style="background:${BN}">${isMe?'<button id="edit" class="p-edit" aria-label="Edit profile">Edit</button>':''}${GU.av(who,96,1)}<h1>${E(who.name)}</h1>
   <div class="p-stats"><div><div class="p-num">${isMe&&!GU.entered()?'<span style="color:var(--acc)">ENTER</span>':!GU.entered()?'<span class="vb" aria-hidden="true">0,000</span>':GU.stk(who.stack)}</div><small>STACK</small></div><div><div class="p-num">${isMe&&!GU.entered()?'-':!GU.entered()?'<span class="vb" aria-hidden="true">#0</span>':'#'+(who.rank||'-')}<span style="color:var(--mute);font-size:16px"> of ${f.length}</span></div><small>RANK</small></div><div><div class="p-num">${rec.w}-${rec.l}</div><small>SEASON</small></div></div>
   ${!GU.entered()?'':`<div style="margin-top:12px"><span class="p-num ${d>=0?'up':'dn'}" style="font-size:22px">${d>=0?'+':''}${F(d)}</span> <small style="color:var(--mute);font-weight:800;letter-spacing:1px;font-size:12px">WEEK ${wk.n}</small></div>`}</section>`;
  if(!isMe){
    const MU=(()=>{try{return Rush.matchup?Rush.matchup():null}catch(e){return null}})(),one=MU&&MU.opp&&String(MU.opp.id)===String(who.id),myS=one?MU.me.stack:m.stack,thS=one?MU.opp.stack:who.stack;const gap=one?MU.lead:myS-thS,A=Math.max(1,myS),B=Math.max(1,thS),op=GU.opponent(),isOpp=op&&op.id===who.id;
    if(!GU.entered())h+=`<div class="p-lbl">You vs ${E(who.name)}</div><section class="p-card" style="position:relative;overflow:hidden"><div class="vb" aria-hidden="true" style="display:flex;align-items:center;gap:10px">${GU.av(m,40,1)}<div style="flex:1"><div class="tug"><i class="a" style="flex:1"></i><i class="b" style="flex:1"></i></div></div>${GU.av(who,40,1)}</div><div style="text-align:center;margin-top:12px;color:var(--mute)">Enter to see the Stacks, the ranks and every side</div><button class="p-btn" data-enter="1" style="width:100%;margin-top:10px;min-height:48px;background:var(--acc);color:#0A0F15;border:0;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer">Enter free</button></section>`;
    else h+=`<div class="p-lbl">${isOpp?'Your matchup':'You vs '+E(who.name)}</div><section class="p-card"><div style="display:flex;align-items:center;gap:10px">${GU.av(m,40,1)}<div style="flex:1"><div class="tug"><i class="a" style="flex:${A}"></i><i class="b" style="flex:${B}"></i></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span class="p-num" style="font-size:18px">${F(myS)}</span><span class="p-num" style="font-size:18px">${F(thS)}</span></div></div>${GU.av(who,40,1)}</div><div style="text-align:center;margin-top:8px;font-weight:800" class="${gap>=0?'up':'dn'}">${gap===0?'Dead even':gap>0?'You are '+F(gap)+' ahead':'You are '+F(-gap)+' behind'}</div></section>`;
    // Between you: your tapbacks and replies to them, and their replies to you (Red's Lounge keys). The honest view shows only real ones from them.
    {const meName=m.name,hon=GU.honest();let taps=[],talk=[];try{taps=Object.values(JSON.parse(localStorage.getItem('rush-lounge-tap-v1')||'{}')).filter(x=>x&&x.emoji&&String(x.emoji).indexOf('&#')!==0)}catch(e){}try{talk=JSON.parse(localStorage.getItem('rush-lounge-talk-v2')||'[]')}catch(e){}
     const nm=E(who.name.split(' ')[0]),theirs=talk.filter(x=>!x.mine&&x.who===who.name&&x.quote&&String(x.quote).indexOf(meName+':')===0&&(!hon||x.real));
     const rows=taps.filter(x=>x.to===who.name).map(x=>({at:x.at,html:`<div class="slip"><div class="l"><b>You sent ${E(x.emoji)}</b><small>${theirs.length?'':'Waiting on '+nm}</small></div></div>`}))
       .concat(talk.filter(x=>x.mine&&(x.to===who.name||(x.to==null&&x.quote&&String(x.quote).indexOf(who.name+':')===0))).map(x=>({at:x.at,html:`<div class="slip"><div class="l"><b>You: ${E(x.text)}</b><small>${x.quote?'replying to '+E(String(x.quote).slice(0,60)):(x.game?'on '+E(x.game):'')}</small></div></div>`})))
       .concat(theirs.map(x=>({at:x.at,html:`<a class="slip" href="lounge.html"><div class="l"><b>${nm}: ${E(x.text)}</b><small>Reply in the Lounge</small></div></a>`}))).sort((a,b)=>b.at-a.at).slice(0,4);
     h+=`<div class="p-lbl">Between you <a href="lounge.html">Lounge</a></div>`+(rows.length?rows.map(r=>r.html).join(''):`<div class="p-card" style="color:var(--mute);font-size:15px">Nothing yet · <a href="lounge.html" style="color:var(--acc)!important;font-weight:800">React in the Lounge ›</a></div>`);}
    // Their week: sealed picks show only the game until kickoff; then the side, and whether they are with you or against you.
    const T=x=>(x.g&&x.g.date)||(x.legs&&x.legs[0]&&((x.legs[0].g&&x.legs[0].g.date)||+x.legs[0].start))||+x.start||0;const ps=GU.picksOf(who.id).sort((a,b)=>T(a)-T(b)),sealed=ps.filter(x=>!GU.started(x.g)),open=ps.filter(x=>GU.started(x.g)&&x.status==='open'),done=ps.filter(x=>x.status!=='open');
    const mineBy={};GU.mine().forEach(p=>{if(p.g)mineBy[p.gameId]=GU.mySide(p)});
    const rel=x=>{const ms=mineBy[x.gameId];if(!ms)return'';const s=GU.sideOf(x);return s===ms?'<span class="tag with">WITH YOU</span>':({away:'home',home:'away',over:'under',under:'over'})[ms]===s?'<span class="tag vs">AGAINST YOU</span>':''};
    h+=`<div class="p-lbl">Their week</div>`;
    h+=ps.slice().sort((a,b)=>(a.status==='open'?0:1)-(b.status==='open'?0:1)||T(a)-T(b)).slice(0,8).map(x=>{const r=GU.entered()&&GU.started(x.g)?rel(x):'';return (r?`<div style="margin:12px 2px -4px">${r}</div>`:'')+SlipCard.html(Rush.sealView?Rush.sealView(x):x,{sealed:true})}).join('');
    if(!ps.length)h+=`<div class="p-card empty">No Slips yet</div>`;
    const bl=blocked().includes(who.id);
    h+=`<div style="display:flex;gap:10px;margin-top:16px"><a class="p-btn" href="lounge.html">Talk in the Lounge</a>${isOpp?'':`<a class="p-btn ghost" href="ranks.html">The contest</a>`}</div>
     ${(()=>{const s=GU.circle.state(who.id),nm=E(who.name.split(' ')[0]);return s==='in'?`<div class="p-btn ghost" style="margin-top:10px">In your circle ✓</div>`:s==='asked'?`<div class="p-btn ghost" style="margin-top:10px;color:var(--mute)!important">Asked. Waiting on ${nm} to confirm</div>`:s==='asked-you'?`<button class="p-btn" id="circ" data-c="confirm" style="width:100%;margin-top:10px;background:var(--vio);color:#fff!important">${nm} asked to join your circle. Confirm</button>`:`<button class="p-btn" id="circ" data-c="ask" style="width:100%;margin-top:10px;${location.hash==='#circle'?'box-shadow:0 0 0 3px var(--vio)':''}">Add ${nm} to my circle</button>`})()}
     <div style="display:flex;gap:18px;justify-content:center;margin-top:10px"><button class="lnk" id="blk">${bl?'Unblock':'Block'}</button><button class="lnk" id="rpt">Report</button></div>`;
  }else{
    // Your Slips live here and in the Stack sheet: open first, then settled.
    if(!GU.entered()){h+=`<div class="p-lbl">Week ${wk.n}</div><section class="p-card" style="text-align:center"><div style="font:400 30px/1 'Bebas Neue','Barlow Condensed',sans-serif;letter-spacing:1px">Enter to start</div><div style="color:var(--mute);margin-top:6px">Free · ${GU.stk(1000)} Stack to start</div><button class="p-btn" id="pent" style="width:100%;margin-top:14px">Enter free</button></section>`}else{
    const all=(()=>{try{const s=window.RW&&RW.playerPicks&&RW.playerPicks('me',GU.games());if(s&&s.length)return s}catch(e){}return GU.mine()})(),open=all.filter(p=>p.status==='open'),done=all.filter(p=>p.status!=='open');
    h+=`<div class="p-lbl" id="slips">Your Slips <a href="slips.html">All Slips</a></div><div class="seg"><button data-t="open" class="${tab==='open'?'on':''}">Open · ${open.length}</button><button data-t="done" class="${tab==='done'?'on':''}">Settled · ${done.length}</button></div>`;
    h+=(tab==='open'?open:done).map(x=>SlipCard.html(x)).join('')||`<div class="empty">${tab==='open'?'No open Slips · <a href="board.html" style="color:var(--acc)!important;font-weight:800">Board ›</a>':'Nothing settled yet'}</div>`;
    }
    // My circle: who is in, who is waiting either way, friends of friends to add, and the invite door when it is small.
    {const ids=GU.circle.ids(),mem=ids.map(GU.player).filter(Boolean),pend=GU.circle.pend(),asks=Object.keys(pend).map(id=>({p:GU.player(id),d:pend[id].dir})).filter(x=>x.p),fof=GU.circle.fof().slice(0,4),sug=fof.length?[]:GU.circle.suggest(4).filter(x=>!ids.includes(String(x.id))&&!pend[x.id]);
     h+=`<div class="p-lbl">My circle <a href="lounge.html">Lounge</a></div><section class="p-card">`;
     h+=mem.length?mem.map(r=>`<div class="slip" style="background:none;padding:8px 0;margin:0">${GU.av(r,40)}<div class="l"><b>${E(r.name)}</b><small>#${r.rank} · ${F(r.stack)} Stack</small></div></div>`).join(''):`<div style="color:var(--mute)">Empty · add players below or invite a friend</div>`;
     h+=asks.map(x=>`<div class="slip" style="background:none;padding:8px 0;margin:0">${GU.av(x.p,40)}<div class="l"><b>${E(x.p.name)}</b><small>${x.d==='in'?'Asked to join your circle':'Waiting on them to confirm'}</small></div>${x.d==='in'?`<div class="r"><button class="p-btn" data-cf="${E(x.p.id)}" style="min-height:38px;font-size:14px;padding:0 12px">Confirm</button></div>`:''}</div>`).join('');
     h+=`</section>`;
     if(fof.length)h+=`<div class="p-lbl">In your friends' circles</div><section class="p-card">${fof.map(x=>`<div class="slip" style="background:none;padding:8px 0;margin:0">${GU.av(x.p,40)}<div class="l"><b>${E(x.p.name)}</b><small>with ${x.via.map(v=>E(v.name.split(' ')[0])).slice(0,2).join(' and ')}</small></div><div class="r"><button class="p-btn ghost" data-ca="${E(x.p.id)}" style="min-height:38px;font-size:14px;padding:0 12px">Add</button></div></div>`).join('')}</section>`;
     else if(sug.length&&mem.length<3)h+=`<div class="p-lbl">Players to add</div><section class="p-card">${sug.map(r=>`<div class="slip" style="background:none;padding:8px 0;margin:0">${GU.av(r,40)}<div class="l"><b>${E(r.name)}</b><small>#${r.rank} · ${F(r.stack)} Stack</small></div><div class="r"><button class="p-btn ghost" data-ca="${E(r.id)}" style="min-height:38px;font-size:14px;padding:0 12px">Add</button></div></div>`).join('')}</section>`;
     if(mem.length<3)h+=`<a class="p-btn" href="index.html#invite" style="margin-top:12px">Invite a friend</a>`;}
    const op=GU.opponent();
    if(op)h+=`<div class="p-lbl">Your matchup</div><a class="p-card" style="display:flex;align-items:center;gap:12px" href="${GU.prof(op)}">${GU.av(op,44,1)}<div style="flex:1;font-weight:700">${E(op.name)}<div style="color:var(--mute);font-weight:500;font-size:14px">${F(op.stack)} Stack · #${op.rank}</div></div><span style="color:var(--acc);font-weight:800">Profile ›</span></a>`;
    let weeks=[];try{weeks=Rush.season().weeks||[]}catch(e){}
    h+=`<div class="p-lbl">Season 1</div><section class="p-card"><div class="wks">${weeks.length?weeks.map(w=>`<span class="${w.result==='W'?'w':w.result==='L'?'l':''}">${w.n}</span>`).join(''):'<span>Week 9 settles first</span>'}</div><div style="color:var(--mute);font-size:13px;margin-top:10px"><span class="up">■</span> win (green week or matchup) · <span class="dn">■</span> loss · 3 weeks to qualify</div></section>`;
  }
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  const bk=document.getElementById('blk');if(bk)bk.onclick=()=>{let b=blocked();b=b.includes(who.id)?b.filter(x=>x!==who.id):b.concat(who.id);try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}render()};
  const cb=document.getElementById('circ');if(cb)cb.onclick=()=>{if(cb.dataset.c==='confirm')GU.circle.confirm(who.id);else GU.circle.ask(who.id);render();setTimeout(render,10500)};
  document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{GU.circle.confirm(b.dataset.cf);render()});
  document.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>{GU.circle.ask(b.dataset.ca);render();setTimeout(render,10500)});
  document.querySelectorAll('#pent,[data-enter]').forEach(pe=>pe.onclick=()=>{if(window.RushTopbar&&RushTopbar.enterNow)RushTopbar.enterNow(window._rtLast&&window._rtLast[1]);else GU.enter();setTimeout(render,700)});
  const ed=document.getElementById('edit');if(ed)ed.onclick=openEdit;
  const rp=document.getElementById('rpt');if(rp)rp.onclick=()=>{rp.textContent='Reported';rp.disabled=true};
}
render();
if(window.RW&&RW.load)RW.load().then(render).catch(()=>{});
if(window.Rush&&Rush.on)try{Rush.on(render)}catch(e){}
setInterval(render,30000);
</script></body></html>
